{{- if and .Values.enabled .Values.configMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: compliance-scan-env-cm
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  {{- /* values go through tpl, so they can use {{ .Values.global.domain }} etc. */}}
  {{- range $key, $value := .Values.configMap }}
  {{ $key }}: {{ tpl (toString $value) $ | quote }}
  {{- end }}
{{- end }}
