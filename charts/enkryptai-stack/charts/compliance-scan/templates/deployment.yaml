{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "compliance-scan.fullname" . }}
  {{- with include "enkryptai-stack.reloadAnnotations" (dict "ctx" $ "kind" "Deployment" "name" (include "compliance-scan.fullname" .) "annotations" .Values.podAnnotations) }}{{ . | nindent 2 }}{{- end }}
  labels:
    {{- include "compliance-scan.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "compliance-scan.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "enkryptai-stack.podAnnotations" (dict "ctx" $ "templates" (list "configmap.yaml" "secret.yaml") "annotations" .Values.podAnnotations) | nindent 6 }}
      labels:
        {{- include "compliance-scan.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "compliance-scan.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "enkryptai-stack.image" (dict "image" $.Values.image "global" $.Values.global "default" $.Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $proxyEnv := include "enkryptai-stack.proxy.env" $ }}
          {{- if or .Values.env $proxyEnv }}
          env:
            {{- with $proxyEnv }}{{ . | nindent 12 }}{{ end }}
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | toString | quote }}
            {{- end }}
          {{- end }}
          {{- $caEnvFrom := include "enkryptai-stack.trustedCA.envFrom" $ }}
          {{- if or .Values.secrets.name .Values.configMap $caEnvFrom }}
          envFrom:
            {{- with $caEnvFrom }}{{ . | nindent 12 }}{{ end }}
            {{- with .Values.secrets.name }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- if .Values.configMap }}
            - configMapRef:
                name: compliance-scan-env-cm
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- with .Values.startupProbe }}
          {{- if .enabled }}
          startupProbe:
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          {{- if .enabled }}
          livenessProbe:
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          {{- if .enabled }}
          readinessProbe:
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $caMount := include "enkryptai-stack.trustedCA.volumeMount" $ }}
          {{- if or .Values.volumeMounts $caMount }}
          volumeMounts:
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $caMount }}{{ . | nindent 12 }}{{ end }}
          {{- end }}
      {{- $caVolume := include "enkryptai-stack.trustedCA.volume" $ }}
      {{- if or .Values.volumes $caVolume }}
      volumes:
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $caVolume }}{{ . | nindent 8 }}{{ end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
