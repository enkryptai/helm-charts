{{- if .Values.configMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-env-cm
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-30"
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
{{- toYaml .Values.configMap | nindent 2 }}
{{- end }}
