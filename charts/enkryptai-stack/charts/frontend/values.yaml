replicaCount: 1

image:
  repository: ""
  pullPolicy: ""
  tag: "vpc"

nameOverride: ""
fullnameOverride: "frontend"
imagePullSecrets: []
serviceAccount:
  create: false

podAnnotations:
  reloader.stakater.com/auto: "true"
  instrumentation.opentelemetry.io/inject-nodejs: "true"

podLabels:
  app: frontend

env:
  NODE_TLS_REJECT_UNAUTHORIZED: "0"

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000
  name: http

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
  hosts:
    - host: example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: frontend-tls
      hosts:
        - example.com

resources:
  limits:
    cpu: 1700m
    memory: 4Gi
  requests:
    cpu: 200m
    memory: 512Mi

livenessProbe:
  enabled: false
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 120
  timeoutSeconds: 10

readinessProbe:
  enabled: true
  httpGet:
    path: /api/health
    port: 3000
    scheme: HTTP
  failureThreshold: 3
  initialDelaySeconds: 30
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 1

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

configMap:

  APIAAS_KONG_URL: http://gateway-kong
  DEFAULT_ENTERPRISE: 'true'
  FGA_API_URL: http://openfga:8080
  FGA_MODEL_ID: 01KNHHGPDT5RSKJSBQSH5PP0EV
  FGA_STORE_ID: 01KNHHGPDJCXMD6RTV06FMVB16
  NEXT_PUBLIC_API_URL: http://0.0.0.0:3000
  NEXT_PUBLIC_ENVIRONMENT: production
  NEXT_PUBLIC_LEADERBOARD_SUPABASE_URL: leaderboard
  NEXT_PUBLIC_MCP_SCANNER_SUPABASE_URL: https://nhecqixvcegdosnmprqn.supabase.co
  NEXT_PUBLIC_OKTA_DOMAIN: example.com
  NEXT_PUBLIC_OKTA_ENABLED: 'true'
  NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
  SAMPLE_REPORTS_USER_ID: 22394096-b568-432d-8133-19909ea34218
  NEXT_PUBLIC_URL: "https://app.example.com"
  NEXT_PUBLIC_APIAAS_KONG_URL: "https://api.example.com"
  NEXT_PUBLIC_SUPABASE_URL:  "https://auth.example.com"

externalSecrets:
  enabled: false
  secrets: []

secrets:
  name: frontend-env-secret
  enabled: false
