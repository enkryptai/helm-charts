_format_version: "3.0"
services:
- name: enkrypt_skill_scanner

  enabled: true
  host: skill-scanner
  connect_timeout: 60000
  port: 8000
  protocol: http
  read_timeout: 60000
  retries: 5
  write_timeout: 60000
  plugins:
  - name: rate-limiting
    # instance_name: enkrypt_logs_rate_limiting
    enabled: false
    config:
      limit_by: ip
      second: 10
      minute: 30
      hour: 150
      policy: local
      fault_tolerant: true
      # Below default config is to avoid changes in deck output for each deployment
      # As Kong adds these but Deck removes them in each deployment and shows as an update
      redis_database: 0
      redis_host: null
      redis_password: null
      redis_port: 6379
      redis_server_name: null
      redis_ssl: false
      redis_ssl_verify: false
      redis_timeout: 2000
      redis_username: null
    protocols:
    - http
    - https 
  - name: enkrypt-skill-scanner
    enabled: true
    config:
      enkrypt_environment: ${{ env "DECK_ENKRYPT_ENVIRONMENT" }}
      internal_kong_admin_email: ${{ env "DECK_INTERNAL_KONG_ADMIN_EMAIL" }}
      skill_scanner_url: ${{ env "DECK_SKILL_SCANNER_URL" }}
      keydb_domain: ${{ env "DECK_KEYDB_HOST" }}
      cache_encryption_key: "{vault://env/enkrypt-cache-encryption-key}"
      cache_encryption_enabled: "{vault://env/enkrypt-cache-encryption-enabled}"
      skill_scanner_basic_auth: ${{ env "DECK_MCP_SCANNER_BASIC_AUTH" }}
      # Entitlement enforcement is OFF: any valid API key may call the
      # gated GETs. Flip to true (all four kong.yaml copies) to require the
      # feature:skill_scanner_apis grant. Usage is metered either way.
      enforce_entitlement: false
      openfga_url: ${{ env "DECK_OPENFGA_URL" }}
      fga_store_id: ${{ env "DECK_OPENFGA_STORE_ID" }}
      fga_authorization_model_id: ${{ env "DECK_OPENFGA_AUTHORIZATION_MODEL_ID" }}
      next_js_app_url: ${{ env "DECK_APP_DASHBOARD_DOMAIN_URL" }}
      next_js_basic_auth: ${{ env "DECK_NEXT_JS_BASIC_AUTH" }}
      vercel_protection_auth: ${{ env "DECK_VERCEL_PROTECTION_AUTH" }}
    protocols:
    - http
    - https
  - name: http-log
    # instance_name: elastic_enkrypt_skill_scanner_log
    enabled: true
    config:
      content_type: application/json
      custom_fields_by_lua:
        consumer.type: return nil
        request.body.user_email: return nil
        request.body.auth_config.api_key: return nil
        request.body.auth_config.bearer_token: return nil
        request.body.auth_config.oauth_config.client_secret: return nil
        request.body.auth_config.mtls_key_path: return nil
        request.body.auth_config.custom_headers.authorization: return nil
        consumer.username_lower: return nil
        debug_info: return nil
        http_log: return nil
        plugin_info: return nil
        request.body.target_model_configuration.model_api_key: return nil
        request.body.target_model_configuration.model_jwt_config: return nil
        request.headers.api-key: return nil
        request.headers.api_key: return nil
        request.headers.apikey: return nil
        request.headers.authorization: return nil
        request.headers.x-enkrypt-extra-authorization: return nil
        request.headers.x-consumer-custom-id: return nil
        request.headers.x-consumer-id: return nil
        request.headers.x-consumer-username: return nil
        request.headers.x-credential-identifier: return nil
        request.headers.x-enkrypt-correlation-id: return nil
        request.ngx_req_id: return ngx.var.request_id
        request.tls: return nil
        response.headers.x-kong-proxy-latency: return nil
        response.headers.x-kong-response-latency: return nil
        response.headers.x-kong-upstream-latency: return nil
        route.created_at: return nil
        route.https_redirect_status_code: return nil
        route.id: return nil
        route.path_handling: return nil
        route.preserve_host: return nil
        route.protocols: return nil
        route.regex_priority: return nil
        route.request_buffering: return nil
        route.response_buffering: return nil
        route.service: return nil
        route.strip_path: return nil
        route.tags: return nil
        route.updated_at: return nil
        route.ws_id: return nil
        service: return nil
        tls: return nil
        tries: return nil
        upstream_status: return nil
        workspace: return nil
        workspace_name: return nil
      flush_timeout: null
      headers: {}
      http_endpoint: http://${{ env "DECK_FLUENT_BIT_HOST" }}:5048
      keepalive: 60000
      method: POST
      queue:
        initial_retry_delay: 0.01
        max_batch_size: 250
        max_bytes: null
        max_coalescing_delay: 5
        max_entries: 25000
        max_retry_delay: 60
        max_retry_time: 60
      queue_size: null
      retry_count: null
      timeout: 10000
    protocols:
    - http
    - https
  routes:
  - name: enkrypt_skill_scanner
    https_redirect_status_code: 426
    path_handling: v0
    paths:
    - /skill-hub
    preserve_host: false
    protocols:
    - http
    - https
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: true
    plugins:
      - name: key-auth
        # instance_name: enkrypt_skill_scanner_key_auth
        enabled: true
        config:
          anonymous: null
          hide_credentials: true
          key_in_body: false
          key_in_header: true
          key_in_query: false
          key_names:
          - apikey
          - api_key
          run_on_preflight: true
        protocols:
        - http
        - https
  - name: enkrypt_skill_scanner_dashboard
    https_redirect_status_code: 426
    path_handling: v0
    paths:
    - /dashboard/skill-hub
    preserve_host: false
    protocols:
    - http
    - https
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: true
    plugins:
    - name: basic-auth
      # instance_name: enkrypt_skill_scanner_dashboard_basic_auth
      enabled: true
      config:
        hide_credentials: true
      protocols:
      - http
      - https
