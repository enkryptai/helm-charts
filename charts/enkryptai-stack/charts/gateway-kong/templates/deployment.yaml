apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway-kong.fullname" . }}
  {{- with include "enkryptai-stack.reloadAnnotations" (dict "ctx" $ "kind" "Deployment" "name" (include "gateway-kong.fullname" .) "annotations" .Values.annotations) }}{{ . | nindent 2 }}{{- end }}
  labels:
    {{- include "gateway-kong.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gateway-kong.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "enkryptai-stack.podAnnotations" (dict "ctx" $ "templates" (list "fluent-bit-config-map.yaml" "gateway-env-cm.yaml" "gateway-migration-env-cm.yaml" "kong-config-configmap.yaml" "secret.yaml")) | nindent 6 }}
      labels:
        {{- include "gateway-kong.labels" . | nindent 8 }}
    spec:
      {{- include "gateway-kong.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: gateway-migrations
          image: {{ include "enkryptai-stack.image" (dict "image" $.Values.image.gateway "global" $.Values.global "default" $.Chart.AppVersion) | quote }}
          command:
            - kong
            - migrations
            - bootstrap
          envFrom:
            - secretRef:
                name: gateway-migration-env-secret
            - configMapRef:
                name: gateway-migration-env-cm
        - name: gateway-migrations-up
          image: {{ include "enkryptai-stack.image" (dict "image" $.Values.image.gateway "global" $.Values.global "default" $.Chart.AppVersion) | quote }}
          command:
            - /bin/sh
            - -c
            - kong migrations up && kong migrations finish
          envFrom:
            - secretRef:
                name: gateway-migration-env-secret
            - configMapRef:
                name: gateway-migration-env-cm
      containers:
        - name: gateway
          image: {{ include "enkryptai-stack.image" (dict "image" $.Values.image.gateway "global" $.Values.global "default" $.Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.gateway.pullPolicy }}
          envFrom:
            {{- with include "enkryptai-stack.trustedCA.envFrom" $ }}{{ . | nindent 12 }}{{ end }}
            - secretRef:
                name: gateway-env-secret
            - configMapRef:
                name: gateway-env-cm
          # Same database user as the migrations and db-check-and-grant; overrides the gateway-env-secret copy.
          env:
            - name: KONG_PG_USER
              valueFrom:
                secretKeyRef:
                  name: gateway-migration-env-secret
                  key: KONG_PG_USER
                  optional: true
            - name: KONG_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gateway-migration-env-secret
                  key: KONG_PG_PASSWORD
                  optional: true
          {{- with .Values.startupProbe }}
          {{- if .enabled }}
          startupProbe:
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          {{- if .enabled }}
          livenessProbe:
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          {{- if .enabled }}
          readinessProbe:
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          ports:
            - containerPort: 8000
              protocol: TCP
            - containerPort: 8443
              protocol: TCP
            - containerPort: 8001
              protocol: TCP
            - containerPort: 8002
              protocol: TCP
          resources:
            {{- toYaml .Values.resources.gateway | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: true
          volumeMounts:
            - mountPath: /var/run/kong
              name: kong-prefix-vol
            - mountPath: /tmp
              name: kong-tmp-vol
            {{- with include "enkryptai-stack.trustedCA.volumeMount" $ }}{{ . | nindent 12 }}{{ end }}
        - name: gateway-deck-sync
          image: {{ include "enkryptai-stack.image" (dict "image" $.Values.image.sync "global" $.Values.global "default" $.Chart.AppVersion) | quote }}
          envFrom:
            {{- with include "enkryptai-stack.trustedCA.envFrom" $ }}{{ . | nindent 12 }}{{ end }}
            - secretRef:
                name: gateway-env-secret
            - configMapRef:
                name: gateway-env-cm
          {{- with include "enkryptai-stack.proxy.env" $ }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
          args:
            - -c
            - |
              echo "Start Waiting for Kong Admin API to be ready.."
              until curl -s http://localhost:8001/status > /dev/null; do
                echo "Waiting for Kong Admin API to be ready..."
                sleep 5
              done

              /mnt/deck/kong-deck.sh

              # Keep the container running after sync
              while true; do
                sleep 3600  # Sleep for 1 hour
                #  we can add periodic sync here
                /mnt/deck/kong-deck.sh
              done
          {{- with .Values.sync.startupProbe }}
          {{- if .enabled }}
          startupProbe:
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.sync.livenessProbe }}
          {{- if .enabled }}
          livenessProbe:
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.sync.readinessProbe }}
          {{- if .enabled }}
          readinessProbe:
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources.sync | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: true
            runAsUser: 0
          volumeMounts:
            - mountPath: /mnt/deck
              name: gateway-kong-temp-config
            {{- with include "enkryptai-stack.trustedCA.volumeMount" $ }}{{ . | nindent 12 }}{{ end }}
        - name: fluent-bit
          image: {{ include "enkryptai-stack.image" (dict "image" $.Values.image.fluentBit "global" $.Values.global "default" "") | quote }}
          env:
            {{- with include "enkryptai-stack.proxy.env" $ }}{{ . | nindent 12 }}{{ end }}
            {{- with .Values.fluentBit.opensearchCredentials }}
            - name: ELASTIC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .secretRef | quote }}
                  key: {{ .secretRefKey.username | quote }}
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .secretRef | quote }}
                  key: {{ .secretRefKey.password | quote }}
            {{- end }}
          {{- include "gateway-kong.renderEnv" .Values.fluentBit.env | nindent 12 }}
          {{- $caEnvFrom := include "enkryptai-stack.trustedCA.envFrom" $ }}
          {{- if or .Values.image.fluentBit.envFrom $caEnvFrom }}
          envFrom:
            {{- with $caEnvFrom }}{{ . | nindent 12 }}{{ end }}
            {{- with .Values.image.fluentBit.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - containerPort: 2020
              protocol: TCP
            - containerPort: 5043
              protocol: TCP
            - containerPort: 5044
              protocol: TCP
            - containerPort: 5045
              protocol: TCP
            - containerPort: 5046
              protocol: TCP
            - containerPort: 5047
              protocol: TCP
          volumeMounts:
            - mountPath: /fluent-bit/etc/
              name: fluent-bit-config
            - mountPath: /tmp/storage
              name: fluent-bit-storage
            - mountPath: /var/log
              name: varlog
            - mountPath: /var/lib/docker/containers
              name: varlibdockercontainers
              readOnly: true
            {{- with include "enkryptai-stack.trustedCA.volumeMount" $ }}{{ . | nindent 12 }}{{ end }}
          {{- with .Values.fluentBit.startupProbe }}
          {{- if .enabled }}
          startupProbe:
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.fluentBit.livenessProbe }}
          {{- if .enabled }}
          livenessProbe:
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.fluentBit.readinessProbe }}
          {{- if .enabled }}
          readinessProbe:
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources.fluentBit | nindent 12 }}
      volumes:
        - configMap:
            defaultMode: 511
            name: {{ .Values.configMaps.kongConfig.name }}
          name: gateway-kong-temp-config
        - name: kong-prefix-vol
          emptyDir: {}
        - name: kong-tmp-vol
          emptyDir: {}
        - configMap:
            defaultMode: 420
            name: {{ .Values.configMaps.fluentBit.name }}
          name: fluent-bit-config
        - emptyDir: {}
          name: fluent-bit-storage
        - hostPath:
            path: /var/log
            type: ""
          name: varlog
        - hostPath:
            path: /var/lib/docker/containers
            type: ""
          name: varlibdockercontainers
        {{- with include "enkryptai-stack.trustedCA.volume" $ }}{{ . | nindent 8 }}{{ end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
