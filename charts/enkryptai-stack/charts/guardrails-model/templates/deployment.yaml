{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "guardrails-model.fullname" . }}
  {{- with include "enkryptai-stack.reloadAnnotations" (dict "ctx" $ "kind" "Deployment" "name" (include "guardrails-model.fullname" .)) }}{{ . | nindent 2 }}{{- end }}
  labels:
    {{- include "guardrails-model.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      {{- include "guardrails-model.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "enkryptai-stack.podAnnotations" (dict "ctx" $ "templates" (list "secret.yaml") "annotations" .Values.podAnnotations) | nindent 6 }}
      labels:
        {{- include "guardrails-model.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "guardrails.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            {{- range .Values.service.ports }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
            {{- end }}
          {{- $caEnvFrom := include "enkryptai-stack.trustedCA.envFrom" $ }}
          {{- if or (not .Values.useEnvFrom) .Values.envFrom $caEnvFrom }}
          envFrom:
            {{- with $caEnvFrom }}{{ . | nindent 12 }}{{ end }}
            {{- if .Values.useEnvFrom }}
            {{- with .Values.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- else }}
            - secretRef:
                name: {{ .Values.secrets.name }}
            {{- end }}
          {{- end }}
          {{- $proxyEnv := include "enkryptai-stack.proxy.env" $ }}
          {{- if or .Values.env $proxyEnv }}
          env:
            {{- with $proxyEnv }}{{ . | nindent 12 }}{{ end }}
            {{- with .Values.env }}{{ toYaml . | nindent 12 }}{{ end }}
          {{- end }}
          {{- with .Values.startupProbe }}
          {{- if .enabled }}
          startupProbe:
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          {{- if .enabled }}
          livenessProbe:
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          {{- if .enabled }}
          readinessProbe:
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with include "enkryptai-stack.trustedCA.volumeMount" $ }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
      {{- with include "enkryptai-stack.trustedCA.volume" $ }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
