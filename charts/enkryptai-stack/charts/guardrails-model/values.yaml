replicaCount: 1
podAnnotations:
  secret.reloader.stakater.com/reload: ""
labels:
  app: guardrails-model
image:
  repository: enkryptai-dev/guardrail-model
  pullPolicy: IfNotPresent
  tag: "main-1771906796"
strategy:
  type: Recreate
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podLabels: {}

service:
  type: ClusterIP
  ports:
    - name: nsfw
      containerPort: 8001
    - name: toxicity
      containerPort: 8002
    - name: promptinject
      containerPort: 8003
    - name: pii
      containerPort: 8004
    - name: llm
      containerPort: 8005
    - name: language
      containerPort: 8006
    - name: router
      containerPort: 8080
# Probes: each is rendered as-is when enabled (any probe type and field).
# startupProbe holds off liveness/readiness until the app is up.
# The router on 8080 starts listening only after the models are loaded, which
# can take many minutes on a fresh GPU node (image pull + model load).
startupProbe:
  enabled: false
  httpGet:
    path: /health
    port: 8080
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 120

livenessProbe:
  enabled: false
  httpGet:
    path: /health
    port: 8080
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 6

readinessProbe:
  enabled: false
  httpGet:
    path: /health
    port: 8080
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

resources:
  requests:
    cpu: "1"
    memory: "4Gi"
    nvidia.com/gpu: 1
  limits:
    cpu: "3"
    memory: "12Gi"
    nvidia.com/gpu: 1

envFrom:
  - secretRef:
      name: guardrails-model-secret

env: []
secrets:
  enabled: false
  name: guardrails-model-secret
nodeSelector: {}

tolerations: []

affinity: {}
