{{- if .Values.configMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: guardrails-env-cm
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
{{- range $key, $value := .Values.configMap }}
  {{ $key }}: {{ tpl (toString $value) $ | quote }}
{{- end }}
{{- end }}
