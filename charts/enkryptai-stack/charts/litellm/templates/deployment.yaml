{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "litellm.fullname" . }}
  {{- with include "enkryptai-stack.reloadAnnotations" (dict "ctx" $ "kind" "Deployment" "name" (include "litellm.fullname" .)) }}{{ . | nindent 2 }}{{- end }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "litellm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- include "enkryptai-stack.podAnnotations" (dict "ctx" $ "templates" (list "litellm-gateway-env-cm.yaml" "secret.yaml") "annotations" .Values.podAnnotations) | nindent 6 }}
      labels:
        {{- include "litellm.labels" . | nindent 8 }}
        {{- with .Values.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "guardrails.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "enkryptai-stack.image" (dict "image" $.Values.image "global" $.Values.global "default" $.Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: https
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            {{- with include "enkryptai-stack.trustedCA.envFrom" $ }}{{ . | nindent 12 }}{{ end }}
            - secretRef:
                name: {{ .Values.secrets.name }}
            - configMapRef:
                name: litellm-gateway-env-cm
          {{- $proxyEnv := include "enkryptai-stack.proxy.env" $ }}
          {{- if or .Values.env $proxyEnv }}
          env:
            {{- with $proxyEnv }}{{ . | nindent 12 }}{{ end }}
            {{- with .Values.env }}{{ toYaml . | nindent 12 }}{{ end }}
          {{- end }}
          {{- with .Values.startupProbe }}
          {{- if .enabled }}
          startupProbe:
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          {{- if .enabled }}
          livenessProbe:
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          {{- if .enabled }}
          readinessProbe:
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with include "enkryptai-stack.trustedCA.volumeMount" $ }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
      {{- with include "enkryptai-stack.trustedCA.volume" $ }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "litellm.serviceAccountName" .) }}
      serviceAccountName: {{ . | quote }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
