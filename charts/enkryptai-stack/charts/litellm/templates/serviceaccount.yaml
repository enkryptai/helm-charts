{{- $sa := .Values.serviceAccount | default dict }}
{{- if and .Values.enabled $sa.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "litellm.serviceAccountName" . | quote }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
  {{- with $sa.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
{{- end }}
