# Default values for litellm.
replicaCount: 1

labels:
  app: litellm-gateway

podAnnotations:
  secret.reloader.stakater.com/reload: ""

image:
  repository: enkryptai-dev/litellm-gateway
  pullPolicy: IfNotPresent
  tag: "main-1771906797"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 443
  targetPort: 443
  name: https

resources:
  requests:
    cpu: 0.5
    memory: 1Gi
  limits:
    cpu: 1
    memory: 2Gi

# Probes: each is rendered as-is when enabled (any probe type and field).
# startupProbe holds off liveness/readiness until the app is up.
startupProbe:
  enabled: false
  httpGet:
    path: /
    port: https
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: https
readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: https
autoscaling:
  enabled: false

envFrom:
  - secretRef:
      name: litellm-gateway-env-secret
  - configMapRef:
      name: litellm-gateway-env-cm
env: []


# ServiceAccount for the LiteLLM pods, for workload identity (for example an
# IRSA eks.amazonaws.com/role-arn annotation). With create: false and no name,
# the pods use the namespace's default ServiceAccount. annotations apply only
# when create is true; name and annotations go through tpl.
serviceAccount:
  create: false
  annotations: {}
  name: ""

nodeSelector: {}

tolerations: []

affinity: {}



configMap:
    BEAM_URL: https://multimodal-guardrails-adc411c.app.beam.cloud
    BENCHMARK_ANTHROPIC_MODEL: anthropic/claude-3-5-haiku-20241022
    BENCHMARK_CHAT_MODEL: openai/gpt-4.1-mini
    ENKRYPT_GATEWAY_URL: ''
    ENKRYPT_METERING_ENABLED: 'false'
    ENKRYPT_ORG_ID: org_your_org_id
    GATEWAY_HOST: 0.0.0.0
    # With 'true', gateway images built from sentry prod-v1.0.105 or later exit
    # at startup unless SENTRY_LITELLM_GATEWAY_API_KEY (litellm-gateway-env-secret)
    # is set and is not the public default. LITELLM_MASTER_KEY may be left unset
    # (it then takes the gateway key) but must not be the default. Older images
    # ignore this variable.
    GATEWAY_REFUSE_DEFAULT_KEY: 'true'
    GR_ADHERENCE_MODEL: openai/gpt-4.1-mini
    GR_BIAS_MODEL: openai/gpt-4.1-mini
    GR_EMBEDDINGS_MODEL: openai/text-embedding-ada-002
    GR_HALLUCINATION_GENERATOR_MODEL: openai/gpt-4.1
    GR_LOCAL_MODEL: /app/models/Qwen2.5-7B-Instruct
    GR_LOCAL_SERVICE_URL: http://{{ .Release.Name }}-guardrails-model:8080
    GR_MODELS_MODE: remote
    GR_MULTIMODAL_SERVICE_URL: http://{{ .Release.Name }}-guardrails-multi-modal:8000
    GR_POLICY_PARSER_FALLBACK: gemini/gemini-2.0-flash-lite
    GR_POLICY_PARSER_MODEL: openai/gpt-4.1-mini
    GR_POLICY_VIOLATION_DETECTOR_MODEL: openai/gpt-4.1-mini
    GR_POLICY_VIOLATION_MODEL: openai/gpt-4.1-mini
    GR_RELEVANCY_MODEL: openai/gpt-4.1-mini
    GR_SPONGE_MODEL: openai/gpt-4.1-mini
    GR_VERA_EVALUATOR_MODEL: openai/gpt-4.1
    LITELLM_DYNAMIC_CONFIG: 'false'
    # Use LiteLLM's bundled Anthropic beta headers instead of fetching them from GitHub on first use.
    LITELLM_LOCAL_ANTHROPIC_BETA_HEADERS: 'true'
    # Use LiteLLM's bundled model cost map instead of fetching it from GitHub at startup.
    LITELLM_LOCAL_MODEL_COST_MAP: 'true'
    # Serve LiteLLM's bundled policy templates instead of fetching them from GitHub.
    LITELLM_LOCAL_POLICY_TEMPLATES: 'true'
    LITELLM_NUM_RETRIES: '2'
    LITELLM_PROXY_CONFIG_PATH: ./config/litellm_proxy.yaml
    LITELLM_ROUTING_STRATEGY: simple-shuffle
    LITELLM_TIMEOUT: '240'
    LOCAL_MODEL_FALLBACK_TO_REMOTE: 'false'
    LOCAL_VLLM_URL: http://{{ .Release.Name }}-guardrails-model:8005/v1
    LOG_LEVEL: INFO
    RT_API_GENERATOR_MODEL: together_ai/MiniMaxAI/MiniMax-M3
    RT_ATTACKER_FALLBACK: together_ai/MiniMaxAI/MiniMax-M3
    RT_ATTACKER_MAX_TOKENS: "2048"
    RT_ATTACKER_MODEL: together_ai/google/gemma-4-31b-it
    RT_ATTACKER_TEMPERATURE: "1.0"
    RT_BENIGN_GENERATOR_MODEL: together_ai/MiniMaxAI/MiniMax-M3
    RT_BROWSER_AGENT_MODEL: gemini/gemini-3.1-flash-lite
    RT_DATA_GENERATOR_FALLBACK: together_ai/MiniMaxAI/MiniMax-M3
    RT_DATA_GENERATOR_MODEL: together_ai/google/gemma-4-31b-it
    RT_JUDGE_MODEL: together_ai/MiniMaxAI/MiniMax-M3
    RT_LOCAL_MODEL: meta-llama/Llama-3.2-3B-Instruct
    RT_MODELS_MODE: remote
    RT_STT_MODEL: groq/whisper-large-v3
    RT_TTS_MODEL: openai/tts-1
    RT_VLM_MODEL: openai/gpt-4.1
    RT_WEBPAGE_GENERATOR_MODEL: together_ai/MiniMaxAI/MiniMax-M3
    SENTRY_LITELLM_GATEWAY_LITELLM_ROUTER_LOG_LEVEL: WARNING
    SENTRY_LITELLM_GATEWAY_LOG_LLM_CALLS: 'false'
    SENTRY_LITELLM_GATEWAY_PORT: '4000'
    SENTRY_LITELLM_GATEWAY_TIMEOUT: '300'
    SENTRY_LITELLM_GATEWAY_URL: http://localhost:4000
    TOXICITY_MODEL_PATH: enkryptai/toxic-bert-onnx
    TOXICITY_PRELOAD: 'false'
    TOXICITY_TOKENIZER_PATH: enkryptai/toxic-bert-onnx
    TOXICITY_USE_ONNX: 'false'
    VLLM_BASE_URL: http://{{ .Release.Name }}-guardrails-model:8005/v1
