{{- if and .Values.enabled .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ tpl (required "redteam-model.secret.name is required" .Values.secret.name) $ }}
  labels:
    {{- include "redteam-model.labels" (dict "context" $ "labels" .Values.secret.labels) | nindent 4 }}
  {{- include "redteam-model.annotations" (dict "context" $ "annotations" .Values.secret.annotations "indent" 2) }}
{{- with .Values.secret.type }}
type: {{ . }}
{{- end }}
{{- with .Values.secret.stringData }}
stringData:
  {{- range $key, $value := . }}
  {{ $key }}: {{ tpl (toString $value) $ | quote }}
  {{- end }}
{{- end }}
{{- end }}
