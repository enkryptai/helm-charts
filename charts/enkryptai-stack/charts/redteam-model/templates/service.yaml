{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redteam-model.fullname" . }}
  labels:
    {{- include "redteam-model.labels" (dict "context" $ "labels" .Values.service.labels) | nindent 4 }}
  {{- include "redteam-model.annotations" (dict "context" $ "annotations" .Values.service.annotations "indent" 2) }}
spec:
  {{- with .Values.service.type }}
  type: {{ . }}
  {{- end }}
  ports:
    {{- range .Values.service.ports }}
    - name: {{ .name }}
      port: {{ default .containerPort .port }}
      targetPort: {{ default .containerPort .targetPort }}
      {{- with .protocol }}
      protocol: {{ . }}
      {{- end }}
    {{- end }}
  selector:
    {{- include "redteam-model.selectorLabels" . | nindent 4 }}
{{- end }}
