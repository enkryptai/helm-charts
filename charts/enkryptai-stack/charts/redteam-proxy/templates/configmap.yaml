{{- $root := . }}

{{- if $root.Values.configMap }}
{{- range $namespace := $root.Values.configMapNamespaces }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redteam-proxy-env-cm
  namespace: {{ $namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-30"
data:
{{ toYaml $root.Values.configMap | nindent 2 }}
{{- end }}
{{- end }}
