{{- $root := . }}

{{- if $root.Values.configMap }}
{{- range $namespace := $root.Values.configMapNamespaces }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redteam-proxy-env-cm
  namespace: {{ $namespace }}
data:
{{- range $key, $value := $root.Values.configMap }}
  {{ $key }}: {{ tpl (toString $value) $root | quote }}
{{- end }}
{{- end }}
{{- end }}
