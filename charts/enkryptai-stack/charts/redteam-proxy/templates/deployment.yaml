apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redteam-proxy.fullname" . }}
  {{- with include "enkryptai-stack.reloadAnnotations" (dict "ctx" $ "kind" "Deployment" "name" (include "redteam-proxy.fullname" .) "annotations" .Values.podAnnotations) }}{{ . | nindent 2 }}{{- end }}
  labels:
    {{- include "redteam-proxy.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "redteam-proxy.selectorLabels" . | nindent 6 }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "redteam-proxy.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "redteam-proxy.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - secretRef:
                {{- if .Values.useEnvFrom }}
                name: {{ .Values.externalSecret.secretName }}
                {{- else }}
                name: {{ .Values.secrets.name }}
                {{- end }}
            - configMapRef:
                name: redteam-proxy-env-cm
          {{- if or .Values.env .Values.supabaseKey.secretRef .Values.nextjsAuthToken.secretRef .Values.s3.secretRef }}
          env:
            {{- with .Values.env }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
            {{- with .Values.supabaseKey.secretRef }}
            - name: SUPABASE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.supabaseKey.secretRefKey }}
                  optional: true
            {{- end }}
            {{- with .Values.nextjsAuthToken.secretRef }}
            - name: NEXTJS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.nextjsAuthToken.secretRefKey }}
                  optional: true
            {{- end }}
            {{- with .Values.s3.secretRef }}
            - name: ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.s3.secretRefKey.keyId }}
                  optional: true
            - name: SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.s3.secretRefKey.accessKey }}
                  optional: true
            {{- end }}
          {{- end }}
          {{- with .Values.startupProbe }}
          {{- if .enabled }}
          startupProbe:
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          {{- if .enabled }}
          livenessProbe:
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          {{- if .enabled }}
          readinessProbe:
            {{- toYaml (omit . "enabled") | nindent 12 }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
