# The proxy's own identity, so the red team role is not handed to every pod on the namespace's default account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "redteam-proxy.fullname" . }}
  labels:
    {{- include "redteam-proxy.labels" . | nindent 4 }}
  {{- with ((.Values.global).redteam).awsRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . | quote }}
  {{- end }}
