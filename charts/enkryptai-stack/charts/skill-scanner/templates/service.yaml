{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skill-scanner.serviceName" . }}
  labels:
    {{- include "skill-scanner.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: {{ .Values.service.name }}
  selector:
    {{- include "skill-scanner.selectorLabels" . | nindent 4 }}
{{- end }}
