enabled: false

replicaCount: 1

image:
  repository: vpcdeployment.azurecr.io/enkryptai-prod/skill-scanner
  pullPolicy: IfNotPresent
  tag: "main"

nameOverride: ""
fullnameOverride: "skill-scanner"
imagePullSecrets: []
serviceAccountName: ""

strategy: {}

podAnnotations:
  reloader.stakater.com/auto: "true"

podLabels:
  app: skill-scanner

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

env: {}

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
  name: http

ingress:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: skill-scanner.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: skill-scanner-tls
      hosts:
        - skill-scanner.example.com

resources: {}

# Probes: each is rendered as-is when enabled (any probe type and field).
# startupProbe holds off liveness/readiness until the app is up.
startupProbe:
  enabled: false
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

livenessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 5

readinessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

volumeMounts: []

volumes: []

nodeSelector: {}

tolerations: []

affinity: {}

configMap:
  SUPABASE_URL: "https://cntaufdextzjjlwlvwws.supabase.co"
  SUPABASE_TABLE: "scans"
  OPENAI_MODEL_NAME: "gpt-5.4-mini"
  MAX_CONCURRENT_SCANS: "16"
  WORKER_POLL_INTERVAL_SECONDS: "2"
  STALE_REQUEUE_SECONDS: "0"
  SCAN_TIMEOUT_SECONDS: "300"
  CLONE_TIMEOUT_SECONDS: "120"
  MAX_REPO_SIZE_MB: "500"
  WORK_DIR: "/work"
  MOCK_SCANNER: "false"
  FALLBACK_MODELS: "together_ai/zai-org/GLM-5.3"
  PRIMARY_MODEL: "gpt-5.4-mini"

externalSecrets:
  enabled: false
  secrets: []

# Expected keys: OPENAI_API_KEY, SUPABASE_SERVICE_KEY, TOGETHER_API_KEY
secrets:
  name: skill-scanner-env-secret
  enabled: false
