{{- if .Values.analytics.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "supabase.fullname" . }}-test-analytics
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  ttlSecondsAfterFinished: 100
  template:
    spec:
      {{- include "enkryptai-stack.imagePullSecrets" (dict "global" $.Values.global) | nindent 6 }}
      containers:
        - name: test-analytics
          image: {{ include "enkryptai-stack.image" (dict "image" $.Values.testimage "global" $.Values.global "default" "") | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              curl -sfo /dev/null \
                http://{{ include "supabase.analytics.fullname" . }}:{{ .Values.analytics.service.port }}/health
              echo "Sevice {{ include "supabase.analytics.fullname" . }} is healthy."
      restartPolicy: Never
{{- end }}
