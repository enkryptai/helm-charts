externalSecret:
  databaseSecretName: onprem
  databaseSecretRepoName: enkryptaivpc/on-prem
  secretStoreRefName: enkryptai-clustersecret-store

secret:
  onprem:
    name: onprem
  jwt:
    secretRef: "onprem"
    secretRefKey:
      anonKey: anonKey
      serviceKey: serviceKey
      secret: secretjwt
  db:
    secretRef: "onprem"
    secretRefKey:
      username: dbusername
      password: dbpassword
      database: dbdatabase
  analytics:
    apiKey: ""
    secretRef: ""
    secretRefKey:
      apiKey: apiKey
  smtp:
    secretRef: "onprem"
    secretRefKey:
      username: smtpusername
      password: smtppassword
  dashboard:
    secretRef: "onprem"
    secretRefKey:
      username: dashboardusername
      password: dashboardpassword
  s3:
    secretRef: "onprem"
    secretRefKey:
      keyId: S3keyId
      accessKey: S3accessKey
# We are using cnpg
db:
  enabled: false
  image:
    repository: supabase/postgres
    pullPolicy: IfNotPresent
    tag: "latest"
  imagePullSecrets: []
  replicaCount: 1
  nameOverride: ""
  fullnameOverride: ""
  livenessProbe: {}
  readinessProbe: {}
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  podAnnotations:
    "helm.sh/hook-weight": "15"
    "helm.sh/hook": post-install, post-upgrade
  podSecurityContext: {}
  securityContext: {}
  service:
    type: ClusterIP
    port: 5432
  environment:
    POSTGRES_HOST: /var/run/postgresql
    PGPORT: "5432"
    POSTGRES_PORT: "5432"
    JWT_EXP: 3600
  resources: {}
  persistence:
    enabled: true
    storageClassName: "gp3-encrypted"
    annotations: {}
    size: 8Gi
    accessModes:
      - ReadWriteOnce
    class: ""
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  nodeSelector: {}
  tolerations: []
  affinity: {}
  config: {}

