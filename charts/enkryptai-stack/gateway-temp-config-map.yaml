      #   - https
      - name: key-auth
        # instance_name: enkrypt_guardrails_key_auth
        enabled: true
        config:
          anonymous: null
          hide_credentials: true
          key_in_body: false
          key_in_header: true
          key_in_query: false
          key_names:
          - apikey
          - api_key
          run_on_preflight: true
        protocols:
        - http
        - https
      - name: enkrypt-guardrails
        # instance_name: enkrypt_guardrails
        enabled: true
        config:
