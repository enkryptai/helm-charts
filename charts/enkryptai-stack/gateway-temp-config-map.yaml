      # /rt/runs/{id}/resume|signal; GET /rt/runs/{id}[/results|/records|/compliance]). Upstream = /v1/*.
      # Upstream reuses DECK_RED_TEAMING_* (the sentry/redteam-proxy backend that
      # feat/relay-rtv2 extends with /v1/*). Plugin rewrites client /rt/* -> canonical /v1/* (rtv2_canonical).
      # SSE GET /rt/runs/{id}/stream rides the SEPARATE plugin-free service below
      # (the enkrypt-red-teaming plugin force-buffers the response, which breaks SSE).
      enabled: true
      host: ${{ env "DECK_RED_TEAMING_HOST" }}
      connect_timeout: 60000
      port: ${{ env "DECK_RED_TEAMING_PORT" }}
      protocol: ${{ env "DECK_RED_TEAMING_SCHEME" }}
      read_timeout: 300000 # 5 min
      retries: 5
      write_timeout: 60000
      plugins:
      - name: enkrypt-red-teaming
        # instance_name: enkrypt_sentry_redteam
        enabled: true
        config:
          enkrypt_environment: ${{ env "DECK_ENKRYPT_ENVIRONMENT" }}
          internal_kong_admin_email: ${{ env "DECK_INTERNAL_KONG_ADMIN_EMAIL" }}
          red_team_url: ${{ env "DECK_RED_TEAMING_URL" }}
          openfga_url: ${{ env "DECK_OPENFGA_URL" }}
          fga_store_id: ${{ env "DECK_OPENFGA_STORE_ID" }}
          fga_authorization_model_id: ${{ env "DECK_OPENFGA_AUTHORIZATION_MODEL_ID" }}
          next_js_app_url: ${{ env "DECK_APP_DASHBOARD_DOMAIN_URL" }}
          next_js_basic_auth: ${{ env "DECK_NEXT_JS_BASIC_AUTH" }}
          vercel_protection_auth: ${{ env "DECK_VERCEL_PROTECTION_AUTH" }}
          keydb_domain: ${{ env "DECK_KEYDB_HOST" }}
          sample_model_real_apikey: ${{ env "DECK_SAMPLE_MODEL_REAL_APIKEY" }}
        protocols:
        - http
        - https
      - name: http-log
        # instance_name: elastic_enkrypt_sentry_redteam_log
        enabled: true
        config:
          content_type: application/json
          custom_fields_by_lua:
            consumer.type: return nil
            consumer.username_lower: return nil
            debug_info: return nil
            http_log: return nil
            plugin_info: return nil
            request.body.target_model_configuration.model_api_key: return nil
            request.body.target_model_configuration.model_jwt_config: return nil
            request.body.model_config.apikeys: return nil
            request.body.model_config.model_jwt_config: return nil
            request.body.endpoint_configuration.model_config.apikeys: return nil
            request.body.endpoint_configuration.model_config.model_jwt_config: return nil
            request.body.target_model_configuration.auth_data: return nil
            request.body.target_model_configuration.metadata.relay.target_headers: return nil
            request.body.model_config.auth_data: return nil
            request.body.endpoint_configuration.model_config.auth_data: return nil
            # rtv2 (/rt/* -> /v1/*): the target provider credential lives at
            # body.target.api_key, which none of the legacy
            # target_model_configuration/model_config/endpoint_configuration scrubs above
            # cover. Kong ships rtv2 request bodies to the log store, so null it here.
            request.body.target.api_key: return nil
            # A relay target's target_headers carry the customer's own LLM credential;
            # get_cleaned_body copies every key given rather than whitelisting, so
            # both spellings (metadata.relay, bare relay) must be scrubbed.
            request.body.target.metadata.relay.target_headers: return nil
            request.body.target.relay.target_headers: return nil
            # /v1/eval accepts up to 10000 samples (query+response each). Logging them
            # would produce multi-MB documents and huge fluent-bit batches, and the rows
            # are already retrievable via GET /rt/runs/{run_id}/records. Drop for SIZE,
            # not secrecy - delete this line to capture eval inputs in the log store.
            request.body.samples: return nil
            request.headers.api-key: return nil
            request.headers.api_key: return nil
            request.headers.apikey: return nil
            request.headers.authorization: return nil
            request.headers.x-consumer-custom-id: return nil
            request.headers.x-consumer-id: return nil
            request.headers.x-consumer-username: return nil
            request.headers.x-credential-identifier: return nil
            request.headers.x-enkrypt-correlation-id: return nil
            request.ngx_req_id: return ngx.var.request_id
            request.tls: return nil
            response.headers.x-kong-proxy-latency: return nil
            response.headers.x-kong-response-latency: return nil
            response.headers.x-kong-upstream-latency: return nil
            route.created_at: return nil
            route.https_redirect_status_code: return nil
            route.id: return nil
            route.path_handling: return nil
            route.preserve_host: return nil
            route.protocols: return nil
            route.regex_priority: return nil
            route.request_buffering: return nil
            route.response_buffering: return nil
            route.service: return nil
            route.strip_path: return nil
            route.tags: return nil
            route.updated_at: return nil
            route.ws_id: return nil
            service: return nil
            tls: return nil
            tries: return nil
            upstream_status: return nil
            workspace: return nil
            workspace_name: return nil
          flush_timeout: null
          headers: {}
          http_endpoint: http://${{ env "DECK_FLUENT_BIT_HOST" }}:5045
          keepalive: 60000
          method: POST
          queue:
            initial_retry_delay: 0.01
            max_batch_size: 250
            max_bytes: null
            max_coalescing_delay: 5
            max_entries: 25000
            max_retry_delay: 60
            max_retry_time: 60
          queue_size: null
          retry_count: null
          timeout: 10000
        protocols:
        - http
        - https
      routes:
      # --- Direct channel (api-key) -------------------------------------------------
      - name: enkrypt_sentry_redteam
        https_redirect_status_code: 426
        path_handling: v0
        paths:
        - /rt/redteam
        - /rt/eval
        - /rt/threat-modeling
        - /rt/threat-modeling/categories
        - /rt/threat-modeling/data
        - /rt/playground
        # Saved-model variants: the caller names a stored model in X-Enkrypt-Model /
        # X-Enkrypt-Model-Version instead of inlining the target, exactly like the
        # legacy /redteam/model/... routes. The plugin resolves the model, projects it
        # into the rtv2 ModelConfig (or the legacy target_model_configuration for
        # model-health) and rewrites /rt/model/<x> to the SAME canonical /v1/<x>.
        - /rt/model/redteam
        - /rt/model/playground
        - /rt/model/model-health
        # v4.0.0 non-run endpoints. sentry mounts health.router at both / and /v1 and
        # findings/mitigation at /v1, so these canonicalise like everything else here.
        # Deliberately NOT metered — their legacy /redteam twins are free, and the same
        # operation must not cost credits just because the caller used the /rt prefix.
        - /rt/model-health
        - /rt/findings
        - /rt/risk-mitigation/system-prompt
        - /rt/risk-mitigation/guardrails-policy
        - /rt/health
        - /rt/status-check
        - "~/rt/datasets/[^/]+$"
        - "~/rt/runs/[^/]+$"
        - "~/rt/runs/[^/]+/results$"
        - "~/rt/runs/[^/]+/records$"
        - "~/rt/runs/[^/]+/compliance/[^/]+$"
        - "~/rt/runs/[^/]+/resume$"
        - "~/rt/runs/[^/]+/signal/[^/]+$"
        preserve_host: false
        protocols:
        - http
        - https
        regex_priority: 0
        request_buffering: true
        response_buffering: true
        strip_path: false
        plugins:
        - name: key-auth
          # instance_name: enkrypt_sentry_redteam_key_auth
          enabled: true
          config:
            anonymous: null
            hide_credentials: true
            key_in_body: false
            key_in_header: true
            key_in_query: false
            key_names:
            - apikey
            - api_key
            run_on_preflight: true
          protocols:
          - http
          - https
      # --- Dashboard channel (basic-auth; internal Next.js proxy) --------------------
      # Full mirror of direct. The plugin rewrites the /dashboard prefix to the
      # canonical /v1/... upstream path (rtv2_canonical) and reconstructs the real
      # user via proxy_consumer, exactly like the legacy /dashboard/redteam routes.
      - name: enkrypt_sentry_redteam_dashboard
        https_redirect_status_code: 426
        path_handling: v0
        paths:
        - /dashboard/rt/redteam
        - /dashboard/rt/eval
        - /dashboard/rt/threat-modeling
        - /dashboard/rt/threat-modeling/categories
        - /dashboard/rt/threat-modeling/data
        - /dashboard/rt/playground
        # Saved-model variants + v4.0.0 non-run endpoints — full mirror of direct.
        - /dashboard/rt/model/redteam
        - /dashboard/rt/model/playground
        - /dashboard/rt/model/model-health
        - /dashboard/rt/model-health
        - /dashboard/rt/findings
        - /dashboard/rt/risk-mitigation/system-prompt
        - /dashboard/rt/risk-mitigation/guardrails-policy
        - /dashboard/rt/health
        - /dashboard/rt/status-check
        - "~/dashboard/rt/datasets/[^/]+$"
        - "~/dashboard/rt/runs/[^/]+$"
        - "~/dashboard/rt/runs/[^/]+/results$"
        - "~/dashboard/rt/runs/[^/]+/records$"
        - "~/dashboard/rt/runs/[^/]+/compliance/[^/]+$"
        - "~/dashboard/rt/runs/[^/]+/resume$"
        - "~/dashboard/rt/runs/[^/]+/signal/[^/]+$"
        preserve_host: false
        protocols:
        - http
        - https
        regex_priority: 0
        request_buffering: true
        response_buffering: true
        strip_path: false
        plugins:
        - name: basic-auth
          # instance_name: enkrypt_sentry_redteam_dashboard_basic_auth
          enabled: true
          config:
            hide_credentials: true
          protocols:
          - http
          - https
      # --- Public channel (IP rate-limit; create-user-first) ------------------------
      # Submission + run reads only (no eval/threat-modeling/playground/resume/signal,
      # no SSE stream). The plugin's /public/ block create-users first (free tier);
      # rtv2_canonical rewrites the /public prefix to /v1/... upstream.
      - name: enkrypt_sentry_redteam_public
        https_redirect_status_code: 426
        path_handling: v0
        paths:
        - /public/rt/redteam
        - "~/public/rt/runs/[^/]+$"
        - "~/public/rt/runs/[^/]+/results$"
        - "~/public/rt/runs/[^/]+/records$"
        - "~/public/rt/runs/[^/]+/compliance/[^/]+$"
        preserve_host: false
        protocols:
        - http
        - https
        regex_priority: 0
        request_buffering: true
        response_buffering: true
        strip_path: false
        plugins:
        - name: rate-limiting
          # instance_name: enkrypt_sentry_redteam_public_rate_limiting
          enabled: true
          config:
            limit_by: ip
            second: 1
            minute: 3
            hour: 5
            day: 5
            policy: redis
            fault_tolerant: false # To prevent abuse when redis is down
            redis_database: 0
            redis_host: ${{ env "DECK_KEYDB_HOST" }}
            redis_port: 6379
            redis_username: null
            redis_password: null
            redis_server_name: ${{ env "DECK_KEYDB_HOST" }}
            redis_ssl: false
            redis_ssl_verify: false
            redis_timeout: 2000
          protocols:
          - http
          - https
    - name: enkrypt_sentry_redteam_stream

      # rev-4 rtv2 SSE: GET /rt/runs/{id}/stream (direct + dashboard). Long read_timeout
      # (1h) like the WSS log service, and NO enkrypt-red-teaming plugin (it force-
      # buffers the response, which would break SSE streaming). response_buffering:false
      # streams upstream events through. key-auth allows key_in_query for browser
      # EventSource (which cannot set request headers), same as the WSS log routes.
      # Public gets NO stream (poll instead). The dashboard route strips its /dashboard
      # prefix via a post-function (no plugin here to do it, unlike the main service).
      enabled: true
      host: ${{ env "DECK_RED_TEAMING_HOST" }}
      connect_timeout: 60000
      port: ${{ env "DECK_RED_TEAMING_PORT" }}
      protocol: ${{ env "DECK_RED_TEAMING_SCHEME" }}
      read_timeout: 3600000 # 1 hour
      retries: 5
      write_timeout: 60000
      routes:
      # --- Direct channel (api-key) -------------------------------------------------
      - name: enkrypt_sentry_redteam_stream
        https_redirect_status_code: 426
        path_handling: v0
        paths:
        - "~/rt/runs/[^/]+/stream$"
        preserve_host: false
        protocols:
        - http
        - https
        regex_priority: 0
        request_buffering: true
        response_buffering: false
        strip_path: false
        plugins:
        # NOTE: key_in_query allowed because browser EventSource cannot set headers
        # (same limitation the WSS routes cite for websockets).
        - name: key-auth
          # instance_name: enkrypt_sentry_redteam_stream_key_auth
          enabled: true
          config:
            anonymous: null
            hide_credentials: true
            key_in_body: false
            key_in_header: true
            key_in_query: true
            key_names:
            - apikey
            - api_key
            run_on_preflight: true
          protocols:
          - http
          - https
        - name: rate-limiting
          # instance_name: enkrypt_sentry_redteam_stream_rate_limiting
          enabled: true
          config:
            limit_by: ip
            second: 5
            minute: 25
            hour: 150
            policy: local
            fault_tolerant: true
            # Defaults kept to avoid deck diff churn each deployment
            redis_database: 0
            redis_host: null
            redis_password: null
            redis_port: 6379
            redis_server_name: null
            redis_ssl: false
            redis_ssl_verify: false
            redis_timeout: 2000
            redis_username: null
          protocols:
          - http
          - https
        # rev-4: no enkrypt-red-teaming plugin on this stream service (it buffers, which
        # would break SSE), so a post-function does the security strip the plugin does.
        - name: post-function
          # SECURITY (rev-4 invariant #1): strip any client-supplied
          # X-Enkrypt-RT-Metering-Mode AND X-Enkrypt-RT-Account-Id; both are Kong-resolved
          # and never client-trusted (plugin-carried routes strip them at the top of
          # _M:access; this plugin-free SSE route does the same here). The account header
          # is inert on GETs, but the strip is the security gate, not a nicety.
          enabled: true
          protocols:
          - http
          - https
          config:
            access:
            - |
              kong.service.request.clear_header("X-Enkrypt-RT-Metering-Mode")
              kong.service.request.clear_header("X-Enkrypt-RT-Account-Id")
              -- rev-5: /rt/ is the client-facing prefix; rewrite to the canonical
              -- /v1/... path sentry serves (the plugin does this for the non-SSE routes).
              local p = kong.request.get_path()
              local c = p:gsub("^/rt/", "/v1/")
              if c ~= p then
                kong.service.request.set_path(c)
              end
      # --- Dashboard channel (basic-auth; internal Next.js proxy) --------------------
      - name: enkrypt_sentry_redteam_stream_dashboard
        https_redirect_status_code: 426
        path_handling: v0
        paths:
        - "~/dashboard/rt/runs/[^/]+/stream$"
        preserve_host: false
        protocols:
        - http
        - https
        regex_priority: 0
        request_buffering: true
        response_buffering: false
        strip_path: false
        plugins:
        - name: basic-auth
          # instance_name: enkrypt_sentry_redteam_stream_dashboard_basic_auth
          enabled: true
          config:
            hide_credentials: true
          protocols:
          - http
          - https
        - name: post-function
          # Strip the /dashboard channel prefix to the canonical /v1/... upstream path
          # (this service carries no enkrypt-red-teaming plugin to do the rewrite).
          enabled: true
          protocols:
          - http
          - https
          config:
            access:
            - |
              -- SECURITY (rev-4 invariant #1): strip BOTH client-supplied RT headers
              -- (metering-mode + account-id); no enkrypt-red-teaming plugin here to do it,
              -- and both are Kong-resolved (never client-trusted).
              kong.service.request.clear_header("X-Enkrypt-RT-Metering-Mode")
              kong.service.request.clear_header("X-Enkrypt-RT-Account-Id")
              local p = kong.request.get_path()
              local c = p
              c = c:gsub("^/dashboard/rt/", "/v1/")
              if c ~= p then
                kong.service.request.set_path(c)
              end
