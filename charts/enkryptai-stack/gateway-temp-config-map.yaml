apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-kong-temp-config
  namespace: enkryptai-stack
data:
  kong.yaml: |
    _format_version: "3.0"
    plugins:
    - name: opentelemetry

      # instance_name: opentelemetry
      config:
        traces_endpoint: http://tempo.monitoring:4318/v1/traces
    - name: prometheus

      # instance_name: prometheus
      enabled: true
      config:
        per_consumer: false
    - name: correlation-id

      # instance_name: correlation_id
      enabled: true
      config:
        echo_downstream: false
        generator: tracker
        header_name: x-enkrypt-correlation-id
      protocols:
      - http
      - https
    services:
    - name: enkrypt_db_proxy

      enabled: true
      host: ${{ env "DECK_APP_DASHBOARD_DOMAIN" }}
      connect_timeout: 60000
      port: ${{ env "DECK_APP_DASHBOARD_PORT" }}
      protocol: ${{ env "DECK_APP_DASHBOARD_SCHEME" }}
      # read_timeout: 60000
      # Assuming a worst case scenario of 0.1 MB/s download speed
      # 10 MB / 0.1 MB/s = 100 s = 1 min 40 s
      read_timeout: 180000 # 3 min
      retries: 5
      write_timeout: 60000
      plugins:
      # - name: cors
      #   # instance_name: enkrypt_guardrails_cors
      #   enabled: true
      #   config:
      #     credentials: false
      #     exposed_headers: []
      #     headers: []
      #     max_age: 86400
      #     methods:
      #     - GET
      #     - POST
      #     - OPTIONS
      #     origins:
      #     # # NOTE: This allows only one origin
      #     - https://enkryptai.com
      #     preflight_continue: false
      #     private_network: false
      #   protocols:
      #   - https
      - name: enkrypt-db-proxy
        # instance_name: enkrypt_db_proxy
        enabled: true
        config:
          enkrypt_environment: ${{ env "DECK_ENKRYPT_ENVIRONMENT" }}
          internal_kong_admin_email: ${{ env "DECK_INTERNAL_KONG_ADMIN_EMAIL" }}
          mcp_scanner_url: ${{ env "DECK_MCP_SCANNER_URL" }}
          mcp_scanner_basic_auth: ${{ env "DECK_MCP_SCANNER_BASIC_AUTH" }}
          red_team_url: ${{ env "DECK_RED_TEAMING_URL" }}
          openfga_url: ${{ env "DECK_OPENFGA_URL" }}
          fga_store_id: ${{ env "DECK_OPENFGA_STORE_ID" }}
          fga_authorization_model_id: ${{ env "DECK_OPENFGA_AUTHORIZATION_MODEL_ID" }}
          next_js_app_url: ${{ env "DECK_APP_DASHBOARD_DOMAIN_URL" }}
          next_js_basic_auth: ${{ env "DECK_NEXT_JS_BASIC_AUTH" }}
          vercel_protection_auth: ${{ env "DECK_VERCEL_PROTECTION_AUTH" }}
          keydb_domain: ${{ env "DECK_KEYDB_HOST" }}
          initial_sample_model_password: '${{ env "DECK_INITIAL_SAMPLE_MODEL_PASSWORD" }}'
        protocols:
        - http
        - https
      - name: http-log
        # instance_name: elastic_enkrypt_db_proxy_log
        enabled: true
        config:
          content_type: application/json
          custom_fields_by_lua:
            consumer.type: return nil
            consumer.username_lower: return nil
            debug_info: return nil
            http_log: return nil
            plugin_info: return nil
            request.body.password: return nil
            request.headers.api-key: return nil
            request.headers.api_key: return nil
            request.headers.apikey: return nil
            request.headers.authorization: return nil
            request.headers.x-enkrypt-initial-sample-model-password: return nil
            request.headers.x-consumer-custom-id: return nil
            request.headers.x-consumer-id: return nil
            request.headers.x-consumer-username: return nil
            request.headers.x-credential-identifier: return nil
            request.headers.x-enkrypt-correlation-id: return nil
            request.ngx_req_id: return ngx.var.request_id
            request.tls: return nil
            response.body.access_token: return nil
            response.body.id_token: return nil
            response.body.refresh_token: return nil
            response.headers.x-kong-proxy-latency: return nil
            response.headers.x-kong-response-latency: return nil
            response.headers.x-kong-upstream-latency: return nil
            route.created_at: return nil
            route.https_redirect_status_code: return nil
            route.id: return nil
            route.path_handling: return nil
            route.preserve_host: return nil
            route.protocols: return nil
            route.regex_priority: return nil
            route.request_buffering: return nil
            route.response_buffering: return nil
            route.service: return nil
            route.strip_path: return nil
            route.tags: return nil
            route.updated_at: return nil
            route.ws_id: return nil
            service: return nil
            tls: return nil
            tries: return nil
            upstream_status: return nil
            workspace: return nil
            workspace_name: return nil
          flush_timeout: null
          headers: {}
          http_endpoint: http://${{ env "DECK_FLUENT_BIT_HOST" }}:5043
          keepalive: 60000
          method: POST
          queue:
            initial_retry_delay: 0.01
            max_batch_size: 250
            max_bytes: null
            max_coalescing_delay: 5
            max_entries: 25000
            max_retry_delay: 60
            max_retry_time: 60
          queue_size: null
          retry_count: null
          timeout: 10000
        protocols:
        - http
        - https
      routes:
      - name: enkrypt_dashboard_db_proxy
        https_redirect_status_code: 426
        path_handling: v0
        paths:
        - /dashboard/guardrails/add-policy
        - /dashboard/guardrails/modify-policy
        - /dashboard/guardrails/get-policy
        - /dashboard/guardrails/delete-policy
        - /dashboard/guardrails/list-policies
        - /dashboard/guardrails/add-guardrail
        - /dashboard/guardrails/modify-guardrail
        - /dashboard/guardrails/get-guardrail
        - /dashboard/guardrails/delete-guardrail
        - /dashboard/guardrails/list-guardrails
        - /dashboard/code-of-conduct/add-policy
        - /dashboard/code-of-conduct/modify-policy
        - /dashboard/code-of-conduct/get-policy
        - /dashboard/code-of-conduct/delete-policy
        - /dashboard/code-of-conduct/list-policies
        - /dashboard/models/add-model
        - /dashboard/models/modify-model
        - /dashboard/models/get-model
        - /dashboard/models/delete-model
        - /dashboard/models/list-models
        - /dashboard/models/get-defaults
        - /dashboard/deployments/add-deployment
        - /dashboard/deployments/modify-deployment
        - /dashboard/deployments/get-deployment
        - /dashboard/deployments/delete-deployment
        - /dashboard/deployments/list-deployments
        - /dashboard/deployments/get-allowed-config
        - /dashboard/consumer-info
        - /dashboard/mcp-hub/servers-list
        - /dashboard/mcp-hub/servers/job-status
        - /dashboard/mcp-hub/servers/summary
        - /dashboard/mcp-registry/add-server
        - /dashboard/mcp-registry/modify-server
        - /dashboard/mcp-registry/get-server
        - /dashboard/mcp-registry/delete-server
        - /dashboard/mcp-registry/list-servers
        - /dashboard/mcp-registry/list-gateways-by-server
        - /dashboard/mcp-gateway/add-gateway
        - /dashboard/mcp-gateway/modify-gateway
        - /dashboard/mcp-gateway/get-gateway
        - /dashboard/mcp-gateway/get-gateway-config
        - /dashboard/mcp-gateway/delete-gateway
        - /dashboard/mcp-gateway/list-gateways
        - /dashboard/mcp-registry/add-registry
        - /dashboard/mcp-registry/modify-registry
        - /dashboard/mcp-registry/get-registry
        - /dashboard/mcp-registry/delete-registry
        - /dashboard/mcp-registry/list-registries
        - /dashboard/mcp-registry/bulk-add-servers
        preserve_host: false
        protocols:
        - http
        - https
        regex_priority: 0
        request_buffering: true
        response_buffering: true
        strip_path: true
        plugins:
        - name: basic-auth
          # instance_name: enkrypt_dashboard_db_proxy_basic_auth
          enabled: true
          config:
            hide_credentials: true
          protocols:
          - http
          - https
      - name: enkrypt_db_proxy
        https_redirect_status_code: 426
        path_handling: v0
        paths:
        - /guardrails/add-policy
        - /guardrails/modify-policy
        - /guardrails/get-policy
        - /guardrails/delete-policy
        - /guardrails/list-policies
        - /guardrails/add-guardrail
        - /guardrails/modify-guardrail
        - /guardrails/get-guardrail
        - /guardrails/delete-guardrail
        - /guardrails/list-guardrails
        - /code-of-conduct/add-policy
        - /code-of-conduct/modify-policy
        - /code-of-conduct/get-policy
        - /code-of-conduct/delete-policy
        - /code-of-conduct/list-policies
        - /models/add-model
        - /models/modify-model
        - /models/get-model
        - /models/delete-model
        - /models/list-models
        - /models/get-defaults
        - /deployments/add-deployment
        - /deployments/modify-deployment
        - /deployments/get-deployment
        - /deployments/delete-deployment
        - /deployments/list-deployments
        - /deployments/get-allowed-config
        - /consumer-info
        - /redteam/get-task
        - /redteam/task-status
        - /redteam/delete-task
        - /redteam/list-tasks
        - /redteam/download-link
        - /redteam/results/summary
        - /redteam/v2/results/summary
        - /redteam/v3/results/summary
        - /redteam/results/details
        - /redteam/v2/results/details
        - /redteam/v3/results/details
        - /datasets/get-task
        - /datasets/task-status
        - /datasets/delete-task
        - /datasets/list-tasks
        - /datasets/get-datacard
        - /datasets/get-dataset
        - /datasets/get-summary
        - /mcp-hub/servers-list
        - /mcp-hub/servers/job-status
        - /mcp-hub/servers/summary
        - /mcp-registry/add-server
        - /mcp-registry/modify-server
        - /mcp-registry/get-server
        - /mcp-registry/delete-server
        - /mcp-registry/list-servers
        - /mcp-registry/list-gateways-by-server
        - /mcp-gateway/add-gateway
        - /mcp-gateway/modify-gateway
        - /mcp-gateway/get-gateway
        - /mcp-gateway/get-gateway-config
        - /mcp-gateway/delete-gateway
        - /mcp-gateway/list-gateways
        - /mcp-registry/add-registry
        - /mcp-registry/modify-registry
        - /mcp-registry/get-registry
        - /mcp-registry/delete-registry
        - /mcp-registry/list-registries
        - /mcp-registry/bulk-add-servers
        preserve_host: false
        protocols:
        - http
        - https
        regex_priority: 0
        request_buffering: true
        response_buffering: true
        strip_path: true
        plugins:
        - name: key-auth
          # instance_name: enkrypt_db_proxy_key_auth
          enabled: true
          config:
            anonymous: null
            hide_credentials: true
            key_in_body: false
            key_in_header: true
            key_in_query: false
            key_names:
            - apikey
            - api_key
            run_on_preflight: true
          protocols:
          - http
          - https
        - name: cors
          # instance_name: enkrypt_db_proxy_cors
          enabled: true
          config:
            credentials: false
            exposed_headers: []
            headers: []
            max_age: 86400
            methods:
            - GET
            # - POST
            - OPTIONS
            origins:
            # # NOTE: This allows only one origin
            - '*'
            preflight_continue: false
            private_network: false
          protocols:
          - https
      - name: enkrypt_mcp_hub_usage
        https_redirect_status_code: 426
        path_handling: v0
        paths:
        - /mcp-hub/usage
        preserve_host: false
        protocols:
        - http
        - https
        regex_priority: 0
        request_buffering: true
        response_buffering: true
        strip_path: true
        plugins:
        - name: key-auth
          enabled: true
          config:
            anonymous: null
            hide_credentials: true
            key_in_body: false
            key_in_header: true
            key_in_query: false
            key_names:
            - apikey
            - api_key
            run_on_preflight: true
          protocols:
          - http
          - https
        - name: rate-limiting
          # Per-API-key limit on the self-service usage endpoint (KeyDB-backed so
          # it holds across Kong replicas). Combined with the 15-min cache in
          # Next.js, this keeps the endpoint from ever loading the DB.
          enabled: true
          config:
            limit_by: consumer
            second: 2
            minute: 20
            hour: 120
            day: 500
            policy: redis
            fault_tolerant: false
            redis_database: 0
            redis_host: ${{ env "DECK_KEYDB_HOST" }}
            redis_port: 6379
            redis_username: null
            redis_password: null
            redis_server_name: ${{ env "DECK_KEYDB_HOST" }}
            redis_ssl: false
            redis_ssl_verify: false
            redis_timeout: 2000
          protocols:
          - http
          - https
        - name: cors
          enabled: true
          config:
            credentials: false
            exposed_headers: []
            headers: []
            max_age: 86400
            methods:
            - GET
            - OPTIONS
            origins:
            - '*'
            preflight_continue: false
            private_network: false
          protocols:
          - https
    - name: enkrypt_admin_credits
    
      # rev-5: cross-org credit administration. Proxies the dashboard-admin
      # channel to the Next.js route (GET|PATCH /api/admin/credits) which owns
      # the Postgres subscription authority AND reseeds the KeyDB usage hash via
      # the guardrails-limit / rt-credits admin routes. Channel auth = basic-auth;
      # the post-function re-sets Authorization to the existing internal credential
      # (DECK_NEXT_JS_BASIC_AUTH) that Next.js already validates (DESIGN §5.4).
      enabled: true
      host: ${{ env "DECK_APP_DASHBOARD_DOMAIN" }}
      connect_timeout: 60000
      port: ${{ env "DECK_APP_DASHBOARD_PORT" }}
      protocol: ${{ env "DECK_APP_DASHBOARD_SCHEME" }}
      read_timeout: 60000
      retries: 5
      write_timeout: 60000
      routes:
      - name: enkrypt_admin_credits
        https_redirect_status_code: 426
        path_handling: v0
        paths:
        - /dashboard/admin/credits
        methods:
        - GET
        - PATCH
        preserve_host: false
        protocols:
        - http
        - https
        regex_priority: 0
        request_buffering: true
        response_buffering: true
        strip_path: false
        plugins:
        - name: basic-auth
          enabled: true
          config:
            hide_credentials: true
          protocols:
          - http
          - https
        - name: post-function
          # No enkrypt-db-proxy plugin here (it self-scopes to /api/users/{caller});
          # this admin route is cross-org, so we rewrite straight to /api/admin/credits.
          enabled: true
          protocols:
          - http
          - https
          config:
            access:
            - |
              -- Reuse the existing Kong->Next.js internal basic-auth: the channel basic-auth
              -- above validated + stripped the client's Authorization, so re-set it to the
              -- internal credential Next.js validates (APIAAS_KONG_BASIC_AUTH). No new var/header.
              kong.service.request.set_header('Authorization', '${{ env "DECK_NEXT_JS_BASIC_AUTH" }}')
              kong.service.request.set_path('/api/admin/credits')
    - name: enkrypt_guardrails

      enabled: true
      host: ${{ env "DECK_GUARDRAILS_HOST" }}
      connect_timeout: 60000
      port: ${{ env "DECK_GUARDRAILS_PORT" }}
      protocol: ${{ env "DECK_GUARDRAILS_SCHEME" }}
      read_timeout: 300000 # 5 min as we deal with PDF, images, audio, etc.
      retries: 5
      write_timeout: 300000 # 5 min as we deal with PDF, images, audio, etc.
      plugins:
      # - name: cors
      #   # instance_name: enkrypt_guardrails_cors
      #   enabled: true
      #   config:
      #     credentials: false
      #     exposed_headers: []
      #     headers: []
      #     max_age: 86400
      #     methods:
      #     - GET
