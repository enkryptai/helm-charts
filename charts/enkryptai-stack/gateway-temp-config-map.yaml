    - name: enkrypt_wss_red_team_relay

      # Sentry redteam relay bridge (customer WSS bridge -> POST /relay/v1/chat/completions
      # on the redteam backend). Separate service because the enkrypt-red-teaming plugin
      # force-buffers and breaks long-lived sockets, same reason enkrypt_sentry_redteam_stream
      # is split out for SSE. path /relay + strip_path on /redteam/relay lines the paths up:
      # /redteam/relay/v1/relay/bridge/{user_id} -> /relay/v1/relay/bridge/{user_id}
      enabled: true
      host: ${{ env "DECK_RED_TEAMING_HOST" }}
      connect_timeout: 60000
      port: ${{ env "DECK_RED_TEAMING_PORT" }}
      protocol: ${{ env "DECK_RED_TEAMING_SCHEME" }}
      path: /relay
      read_timeout: 3600000 # 1 hour; the bridge heartbeats every 30s
      retries: 5
      write_timeout: 60000
      routes:
      - name: enkrypt_wss_red_team_relay
        https_redirect_status_code: 426
        path_handling: v0
        paths:
        - /redteam/relay
        preserve_host: false
        protocols:
        - http
        - https
        regex_priority: 0
        request_buffering: false
        response_buffering: false
        strip_path: true
        plugins:
        - name: key-auth
          # instance_name: enkrypt_wss_red_team_relay_key_auth
          enabled: true
          config:
            anonymous: null
            # false (not true, unlike other rtv2 key-auth instances): sentry's
            # relay router wants the caller's real apikey to keep riding through
            # for future consumer-detail lookups, not be stripped here. See the
            # request-transformer plugin below for the actual auth Kong hands
            # sentry.
            hide_credentials: false
            key_in_body: false
            key_in_header: true
            key_in_query: false
            key_names:
            - apikey
            - api_key
            run_on_preflight: true
          protocols:
          - http
          - https
        - name: request-transformer
          # instance_name: enkrypt_wss_red_team_relay_gateway_token
          # Stamps proof-of-Kong onto the request: sentry's relay router
          # (api/relay/router.py _check_apikey) checks this header instead of
          # `apikey` once it's present, so the customer's real apikey (left
          # alone by hide_credentials: false above) can ride through unchanged
          # for sentry's own use instead of being consumed as the auth secret.
          # add+replace together force our value regardless of whether the
          # caller already sent this header themselves.
          #
          # "demo-token" mirrors sentry's RELAY_BRIDGE_TOKEN code default
          # (currently unset in every deployment - see router.py SHARED_TOKEN).
          # This is not a new secret, just wiring to the existing one. Before
          # relying on this past dev, provision a real value as a proper
          # env-var-backed secret on both sides instead of the compiled-in
          # default.
          enabled: true
          config:
            add:
              headers:
              - "x-enkrypt-relay-gateway-token:demo-token"
            replace:
              headers:
              - "x-enkrypt-relay-gateway-token:demo-token"
          protocols:
          - http
          - https
        - name: enkrypt-relay-identity
          # instance_name: enkrypt_wss_red_team_relay_identity
          # Stamps the authenticated caller's identity onto the websocket upgrade:
          # X-Enkrypt-User-Id (+ Org-Id / Project-Name where they apply). sentry
          # keys its bridge registry by (user_id, bridge_id) -- see
          # api/relay/broker.py bridge_key -- because bridge_id is customer-chosen
          # free text and is not unique on its own.
          #
          # The stamped user id MUST equal the user_metadata.user_id that
          # enkrypt-red-teaming stamps on a /rt/redteam submission (rtv2_owner_id),
          # since that is what the worker sends when it looks the bridge up. The
          # plugin copies that resolution step for step; a divergence would leave a
          # healthy bridge unreachable, for org and project accounts only.
          #
          # This route cannot host enkrypt-red-teaming (it buffers the body and
          # would break the long-lived socket), which is why this is a separate,
          # header-only plugin rather than a flag on that one.
          enabled: true
          config: {}
          protocols:
          - http
          - https
        - name: rate-limiting
          # instance_name: enkrypt_wss_red_team_relay_rate_limiting
          enabled: true
          config:
            limit_by: ip
            second: 5
            minute: 25
            hour: 150
            policy: local
            fault_tolerant: true
            # Below default config is to avoid changes in deck output for each deployment
            # As Kong adds these but Deck removes them in each deployment and shows as an update
            redis_database: 0
            redis_host: null
            redis_password: null
            redis_port: 6379
            redis_server_name: null
            redis_ssl: false
            redis_ssl_verify: false
            redis_timeout: 2000
            redis_username: null
          protocols:
          - http
          - https
