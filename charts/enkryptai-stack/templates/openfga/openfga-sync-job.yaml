{{- if .Release.IsInstall }}
apiVersion: batch/v1
kind: Job
metadata:
  name: openfga-sync
  {{- with .Values.openfgaSyncJob.annotations }}
  annotations:
  {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: 5
  template:
    spec:
      {{- include "enkryptai-stack.imagePullSecrets" (dict "global" $.Values.global) | nindent 6 }}
      restartPolicy: Never
      initContainers:
        - name: wait-for-openfga
          image: {{ include "enkryptai-stack.image" (dict "image" $.Values.busybox "global" $.Values.global "default" "") | quote }}
          command: ["sh", "-c", "until wget -q --spider http://openfga:8080/healthz; do echo 'Waiting for OpenFGA...'; sleep 2; done"]
      containers:
        - name: openfga-sync
          image: {{ include "enkryptai-stack.image" (dict "image" $.Values.openfgaSyncJob "global" $.Values.global "default" "") | quote }}
          env:
            - name: FGA_API_URL
              value: "http://openfga:8080"
            - name: FGA_MODEL_ID
              value: "latest"
{{- end }}
