{{- if .Release.IsInstall }}
apiVersion: batch/v1
kind: Job
metadata:
  name: openfga-sync
  {{- with .Values.openfgaSyncJob.annotations }}
  annotations:
  {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: 5
  template:
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
      {{- range . }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      restartPolicy: Never
      initContainers:
        - name: wait-for-openfga
          image: {{.Values.global.registry}}/{{.Values.busybox.repository}}:{{.Values.busybox.tag}}
          command: ["sh", "-c", "until wget -q --spider http://openfga:8080/healthz; do echo 'Waiting for OpenFGA...'; sleep 2; done"]
      containers:
        - name: openfga-sync
          image: {{.Values.global.registry}}/{{.Values.openfgaSyncJob.repository}}:{{.Values.openfgaSyncJob.tag}}
          env:
            - name: FGA_API_URL
              value: "http://openfga:8080"
            - name: FGA_MODEL_ID
              value: "latest"
{{- end }}
