  enabled: false
  # Every name, label and annotation below is rendered by the templates as-is;
  # nothing is hardcoded there. Label/annotation values, configMap.data,
  # secret.stringData, configMap.name, secret.name, env and extraEnvFrom go
  # through tpl, so they may use {{ .Release.Name }} etc.
  replicaCount: 1

  # Deployment/Service/HPA name: "<release>-<chart name>" by default.
  nameOverride: ""
  fullnameOverride: ""
  # Container name; empty means the chart name (or nameOverride).
  containerName: ""

  # Selector labels (app.kubernetes.io/name, app.kubernetes.io/instance) are fixed in
  # _helpers.tpl and added to every resource; they can't be set here.
  # Labels on every resource (Deployment, pods, Service, ConfigMap, Secret, HPA).
  labels:
    app: redteam-model
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    app.kubernetes.io/version: "{{ .Chart.AppVersion }}"
    app.kubernetes.io/managed-by: "{{ .Release.Service }}"

  deployment:
    labels: {}
    annotations: {}
  podLabels: {}
  # No Reloader annotation here. Reloader goes on the Deployment through the
  # named lists in enkryptai-stack.reloadAnnotations once #169 lands.
  podAnnotations: {}

  # vLLM image serving two models on one GPU (see the Dockerfile):
  #   judge    -> gpt-oss-20b (mxfp4)        on :8000
  #   attacker -> gpt-oss-20b-ablit (bf16)   on :8001
  image:
    # Starts with a registry host, so global.imageRegistry doesn't rewrite it: to use
    # your own registry, mirror the image and set this (docs/images-requirement.md 8.1).
    repository: 188451452903.dkr.ecr.us-east-1.amazonaws.com/enkryptai-dev/redteam-model
    pullPolicy: IfNotPresent
    tag: "fix-hf-token-build-secret-1793349589"
    # Pull Secret names, merged with global.imagePullSecrets.
    pullSecrets: []
  strategy:
    type: Recreate
  command: []
  args: []
  serviceAccountName: ""
  podSecurityContext: {}
  securityContext: {}

  service:
    type: ClusterIP
    labels: {}
    annotations: {}
    # port defaults to containerPort, targetPort to containerPort; protocol optional.
    ports:
      - name: judge
        containerPort: 8000
      - name: attacker
        containerPort: 8001

  # The model pod's own ConfigMap, off by default: everything vLLM needs is in
  # env below, and the pod doesn't depend on any other chart's ConfigMap. If the
  # settings grow, set create: true and envFrom: true and put the keys in data
  # (values go through tpl).
  configMap:
    create: false
    name: redteam-model-env-cm
    envFrom: false
    # true lets the pod start when the ConfigMap is missing.
    optional: false
    labels: {}
    annotations: {}
    data: {}

  # The model pod's own Secret. vLLM only needs HF_TOKEN (and only for private
  # Hugging Face models), read through secretKeyRef in env below, so the whole
  # Secret is not loaded through envFrom. It comes from externalSecrets below,
  # or set create: true and put HF_TOKEN in stringData.
  secret:
    create: false
    name: redteam-model-secret
    envFrom: false
    optional: true
    type: Opaque
    labels: {}
    annotations: {}
    stringData: {}

  # More envFrom sources, appended after the ConfigMap and Secret above.
  extraEnvFrom: []
  # Tuning for the two vLLM servers (the image's own defaults). env wins over
  # envFrom, so these apply even if configMap/extraEnvFrom has the same keys.
  env:
    - name: JUDGE_GPU_UTIL
      value: "0.26"
    - name: JUDGE_MAX_LEN
      value: "32768"
    - name: ATTACKER_GPU_UTIL
      value: "0.60"
    - name: ATTACKER_MAX_LEN
      value: "16384"
    # Optional: the pod starts without it (public models need no token).
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: "{{ .Values.secret.name }}"
          key: HF_TOKEN
          optional: true

  # Probes: each is rendered as-is when enabled (any probe type and field).
  # The attacker model only starts after the judge is healthy, and both models
  # are pulled from Hugging Face on start, so startup can take a long time
  # (the image HEALTHCHECK allows 3600s). startupProbe allows 10s x 360 = 1h.
  # The probes check both vLLM servers, same as the image HEALTHCHECK.
  # The entrypoint exits if either server dies, so liveness is off by default.
  startupProbe:
    enabled: true
    exec:
      command:
        - sh
        - -c
        - curl -fs -o /dev/null http://127.0.0.1:8000/health && curl -fs -o /dev/null http://127.0.0.1:8001/health
    periodSeconds: 10
    timeoutSeconds: 15
    failureThreshold: 360
  livenessProbe:
    enabled: false
    exec:
      command:
        - sh
        - -c
        - curl -fs -o /dev/null http://127.0.0.1:8000/health && curl -fs -o /dev/null http://127.0.0.1:8001/health
    periodSeconds: 30
    timeoutSeconds: 15
    failureThreshold: 3
  readinessProbe:
    enabled: true
    exec:
      command:
        - sh
        - -c
        - curl -fs -o /dev/null http://127.0.0.1:8000/health && curl -fs -o /dev/null http://127.0.0.1:8001/health
    periodSeconds: 10
    timeoutSeconds: 15
    failureThreshold: 3

  # Both models share one GPU (JUDGE_GPU_UTIL + ATTACKER_GPU_UTIL of its
  # memory). The bf16 attacker alone is ~40GB, so this needs an 80GB-class GPU
  # (A100/H100 80GB).
  resources:
    requests:
      cpu: "2"
      memory: "16Gi"
      nvidia.com/gpu: 1
    limits:
      cpu: "8"
      memory: "64Gi"
      nvidia.com/gpu: 1

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: ""
    targetMemoryUtilizationPercentage: ""
    labels: {}
    annotations: {}

  # Init containers, rendered as-is (through tpl) before the main container.
  # Example: wait for / pre-download models into a shared volume.
  # initContainers:
  #   - name: wait-for-something
  #     image: busybox:1.36
  #     command: ["sh", "-c", "echo ready"]
  initContainers: []

  # Trusted CA: set global.trustedCA.configMapName (see docs/trusted-ca.md) to
  # mount the bundle and set NODE_EXTRA_CA_CERTS, SSL_CERT_FILE,
  # REQUESTS_CA_BUNDLE and AWS_CA_BUNDLE (the Hugging Face download uses
  # REQUESTS_CA_BUNDLE). The CA mount and volume come before volumes and
  # volumeMounts below.
  # Extra volumes and mounts, after the trusted CA and the model cache.
  volumes: []
  volumeMounts: []

  # Model cache: a PVC on the Hugging Face cache, so the two models (~55GB) are
  # downloaded once, not on every restart (Recreate, node drain, upgrade, OOM).
  # Needs a StorageClass: storageClass, else global.storageClass, else the
  # cluster default; without one the PVC stays Pending and so does the pod.
  # keep: true adds helm.sh/resource-policy: keep, so helm uninstall leaves the
  # PVC (and the models) in place; delete it by hand to free the space.
  # Air-gapped installs: pre-fill a PVC with the models, set existingClaim to it
  # (no PVC is created then) and add HF_HUB_OFFLINE=1 to env.
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 100Gi
    mountPath: /root/.cache/huggingface
    keep: true
    labels: {}
    annotations: {}

  # redteam-model-secret from the secret store (needs global.externalSecrets
  # too). The store entry holds HF_TOKEN.
  externalSecrets:
    enabled: false
    secrets:
      - name: redteam-model-secret
        target:
          name: redteam-model-secret
        refreshInterval: 15m
        dataFrom:
          - extract:
              key: enkryptaivpc-redteam-model-secret

  nodeSelector: {}
  tolerations: []
  affinity: {}

guardrails-multi-modal:
  enabled: false
  replicaCount: 1
  labels:
    app: guardrails-multi-modal
  image:
    repository: vpcdeployment.azurecr.io/enkryptai-prod/guardrail-multimodal
    pullPolicy: IfNotPresent
    tag: "a5698ab"
  strategy:
