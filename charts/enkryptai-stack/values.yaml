openfga:
  replicaCount: 1
  image:
    repository: vpcdeployment.azurecr.io/onprem/openfga
    pullPolicy: Always
    tag: "v1.8.9"
  imagePullSecrets: []
  # - name: replicated-registry
  nameOverride: "openfga"
  fullnameOverride: "openfga"

  commonLabels: {}

  # Not created: the migrate Job is a pre-install hook and would run before
  # the ServiceAccount exists. Its only use was the wait-for-migration Role.
  serviceAccount:
    create: false
    annotations: {}
    name: ""

  annotations: {}
  # helm.sh/hook: "post-install, post-upgrade"
  # helm.sh/hook-weight: "26"
  podAnnotations: {}
  podExtraLabels: {}

  extraEnvVars:
    - name: OPENFGA_HTTP_TLS_ENABLED
      value: "false"
    - name: OPENFGA_REQUEST_TIMEOUT
      value: "3s"
    - name: OPENFGA_DATASTORE_METRICS_ENABLED
      value: "true"
    - name: OPENFGA_CHECK_CACHE_LIMIT
      value: "10000"
    - name: OPENFGA_CHECK_ITERATOR_CACHE_ENABLED
      value: "true"
    - name: OPENFGA_CHECK_ITERATOR_CACHE_MAX_RESULTS
      value: "10000"
    - name: OPENFGA_CHECK_ITERATOR_CACHE_TTL
      value: "1m"
    - name: OPENFGA_CACHE_CONTROLLER_ENABLED
      value: "true"
    - name: OPENFGA_CACHE_CONTROLLER_TTL
      value: "30s"
    - name: OPENFGA_CHECK_DISPATCH_THROTTLING_ENABLED
      value: "false"
    - name: OPENFGA_LIST_OBJECTS_DISPATCH_THROTTLING_ENABLED
      value: "false"
    - name: OPENFGA_LIST_USERS_DISPATCH_THROTTLING_ENABLED
      value: "false"
    - name: OPENFGA_TRACING_ENABLED
      value: "false"
    - name: OPENFGA_TRACE_SERVICE_NAME
      value: "openfga"
    - name: OPENFGA_ACCESS_CONTROL_ENABLED
      value: "false"

  extraVolumes: []
  extraVolumeMounts: []
  extraInitContainers: []

  podSecurityContext: {}

  securityContext: {}

  initContainer:
    repository: vpcdeployment.azurecr.io/onprem/k8s-wait-for
    tag: "v2.0"
    pullPolicy: IfNotPresent

  livenessProbe:
    enabled: false
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12
    successThreshold: 1

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  startupProbe:
    enabled: false
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1

  customLivenessProbe: {}
  customReadinessProbe: {}
  customStartupProbe: {}

  service:
    annotations: {}
    type: ClusterIP
    port: 8080

  telemetry:
    trace:
      enabled: false
      otlp:
        endpoint:
        tls:
          enabled: false
      sampleRatio: 0.3

    metrics:
      enabled: true

      serviceMonitor:
        enabled: false
        additionalLabels: {}
        annotations: {}
        jobLabel: "app.kubernetes.io/name"
        namespace: ""
        namespaceSelector: {}
        scrapeInterval: 30s
        scrapeTimeout: 10s
        targetLabels: []
        relabelings: []
        metricRelabelings: []

      addr: 0.0.0.0:2112
      enableRPCHistograms:
      podAnnotations:
        prometheus.io/scrape: "true"
  datastore:
    engine: postgres
    uri:
    uriSecret: openfga-env-secret
