  nodeSelector: {}
  tolerations: []

  affinity: {}


################COMPLIANCE_SCAN###########################
compliance-scan:
  enabled: false
  image:
    repository: vpcdeployment.azurecr.io/enkryptai-prod/compliance-scan
    pullPolicy: IfNotPresent
    tag: "main-1792752754"
  # Internal service: it must not share a host with supabase (auth.*). The same host and path on two
  # ingresses sends all supabase traffic to compliance-scan, which breaks its own startup.
  ingress:
    enabled: false
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "200m"
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
    hosts:
      - host: "compliance-scan.{{ .Values.global.domain }}"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - "compliance-scan.{{ .Values.global.domain }}"
        secretName: compliance-scan-tls

  configMap:
    GUARDRAILS_DETECT_URL: "http://guardrails:8000/guardrails-detect"
    POLICY_CACHE_TTL_S: "600"
    GUARDRAILS_MODE: "metered"
    KONG_GATEWAY_URL: "http://gateway-kong"
    NEXT_JS_URL: "http://frontend:3000"
    VALKEY_HOST: "valkey"
    VALKEY_PORT: "6379"
    VALKEY_SSL: "false"
    VALKEY_DB: "0"
    STORE_BACKEND: "supabase"
    SUPABASE_URL: "https://auth.{{ .Values.global.domain }}"
    SUPABASE_SCANS_TABLE: "compliance_scans"
    SUPABASE_LOG_FILES_TABLE: "log_files"
    SUPABASE_SUBSCRIPTION_SELECT: "subscription:subscription!compliance_scans_id_fkey(email,consumer_id,plan_name,is_org,org_id)"
    SINK_BACKEND: "opensearch"
    OPENSEARCH_URL: "https://enkryptai-opensearch-cluster:9200"
    OPENSEARCH_VERIFY_TLS: "/etc/opensearch-ca/ca.crt"
    OPENSEARCH_INDEX: "compliance"
    OPENSEARCH_POLICY_INDEX: "compliance_policy_configs"
    QUEUE_BACKEND: "jetstream"
    NATS_URL: "nats://nats:4222"
    KEY_RESOLVER: "http"
    KEY_DECRYPT_URL: "http://frontend:3000/api/compliance/scans"
    KEY_DECRYPT_AUTH_HEADER: "Authorization"
  externalSecrets:
    enabled: false
    secrets:
      - name: compliance-scan-env-secret
        target:
          name: compliance-scan-env-secret
          namespace: enkryptai-stack
        refreshInterval: 15m
        dataFrom:
          - extract:
              key: enkryptaivpc-compliance-scan-env-secret
  secrets:
    name: compliance-scan-env-secret
    enabled: false
    app: demo


