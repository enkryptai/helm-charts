global:
  
  storageClass: ""

  proxy:
    # Outbound proxy URLs for every pod (docs/outbound-proxy.md); both empty changes nothing.
    httpProxy: ""
    httpsProxy: ""
    # Extra comma-separated NO_PROXY entries, added to the in-cluster defaults: add the pod, Service and node CIDRs.
    noProxy: ""

  imagePullPolicy: "IfNotPresent" 
  imagePullSecrets: []

  # Ingress hosts and public URLs below derive from it (app., api., auth. and so on).
  domain: "example.com"
  
  registry: vpcdeployment.azurecr.io

  externalSecrets:
    enabled: false
    namespaceOverride: enkryptai-stack
    annotations: 
      "helm.sh/hook": pre-install,pre-upgrade
      "helm.sh/hook-weight": "-23"

    clusterSecretStore:
      enabled: false                      
      name: "cluster-secret-store"

  trustedCA:
    # ConfigMap with the full PEM bundle (public CAs plus the private CA) in this namespace; empty changes nothing. See docs/trusted-ca.md.
    configMapName: ""
    key: ca.crt

supabaseinitdb:
  repository: onprem/supabase-initdb
  tag: "latest"
nginxalpine:
  repository: onprem/nginx
  tag: "alpine"
openfgaSyncJob:
  repository: enkryptai-prod/openfga-sync
  tag: "v1.14.0"
  annotations: 
    "helm.sh/hook-weight": "-6"    
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
busybox:
  repository: onprem/busybox
  tag: "latest"

frontend:
  enabled: true
  image:
    repository: vpcdeployment.azurecr.io/enkryptai-prod/frontend
    pullPolicy: IfNotPresent
    tag: "main-1793361114"
  serviceAccount:
    create: false
  podAnnotations:
    reloader.stakater.com/auto: "true"
  podLabels: {}

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
    name: http

  ingress:
    enabled: false
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffer-size: "200m"
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
    hosts:
      - host: "app.{{ .Values.global.domain }}"
        paths:
          - path: /
            pathType: Prefix

    tls:
      - hosts:
          - "app.{{ .Values.global.domain }}"
        secretName: frontend-cert

  resources:
    limits:
      cpu: 1700m
      memory: 4Gi
    requests:
      cpu: 200m
      memory: 512Mi

  livenessProbe:
    enabled: false
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 120
    timeoutSeconds: 10

  readinessProbe:
    enabled: true
    httpGet:
      path: /api/health
      port: 3000
      scheme: HTTP
    failureThreshold: 3
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

  nodeSelector: {}

  tolerations: []

  affinity: {}

  configMap:
    NEXT_PUBLIC_URL: "https://app.{{ .Values.global.domain }}"
    NEXT_PUBLIC_APIAAS_KONG_URL: "https://api.{{ .Values.global.domain }}"
    NEXT_PUBLIC_SUPABASE_URL: "https://auth.{{ .Values.global.domain }}"

  externalSecrets:
    enabled: false
    secrets:
      - name: frontend-env-secret
        target:
          name: frontend-env-secret
          namespace: enkryptai-stack
        refreshInterval: 15m
        dataFrom:
          - extract:
              key: enkryptaivpc-frontend-env-secret

  secrets:
    enabled: false


################GATEWAY_KONG###########################
gateway-kong:
  enabled: true
  replicaCount: 2
  image:
    gateway:
      repository: vpcdeployment.azurecr.io/enkryptai-prod/gateway
      tag: "main-1793361115"
      pullPolicy: IfNotPresent
    sync:
      repository: vpcdeployment.azurecr.io/enkryptai-prod/gateway-sync
      tag: "main-1793252843"
      pullPolicy: IfNotPresent
    fluentBit:
      repository: vpcdeployment.azurecr.io/onprem/fluent-bit
      tag: "3.2.1"
      pullPolicy: IfNotPresent
      envFrom:
        - secretRef:
            name: elastic-env-secret
  nameOverride: ""
  fullnameOverride: "gateway-kong"
  annotations: {}
  service:
    type: ClusterIP
    ports:
      http:
        port: 80
        targetPort: 8000
      https:
        port: 443
        targetPort: 8443
      admin:
        port: 8001
        targetPort: 8001
      adminGui:
        port: 8002
        targetPort: 8002
      fluentBitMetrics:
        port: 2020
        targetPort: 2020
      fluentBitAdmin:
        port: 5043
        targetPort: 5043

  ingress:
    enabled: false
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "200m"
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
    hosts:
      - host: "api.{{ .Values.global.domain }}"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - "api.{{ .Values.global.domain }}"
        secretName: gateway-cert
  secrets:
    enabled: false

  resources:
    gateway:
      limits:
        cpu: "2"
        memory: "4Gi"
      requests:
        cpu: "0.5"
        memory: "1.5Gi"
    sync:
      limits:
        cpu: "0.5"
        memory: "256Mi"
      requests:
        cpu: "0.1"
        memory: "64Mi"
    fluentBit:
      limits:
        cpu: "0.5"
        memory: "256Mi"
      requests:
        cpu: "0.1"
        memory: "64Mi"

  livenessProbe:
    enabled: true
    exec:
      command:
        - kong
        - health
    failureThreshold: 10
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80

  externalSecrets:
    enabled: false
    secrets:
      - name: gateway-env-secret
        target:
          name: gateway-env-secret
          namespace: enkryptai-stack
        refreshInterval: 15m
        dataFrom:
          - extract:
              key: enkryptaivpc-gateway-env-secret
      - name: elastic-env-secret
        target:
          name: elastic-env-secret
          namespace: enkryptai-stack
        refreshInterval: 15m
        dataFrom:
          - extract:
              key: enkryptaivpc-elastic-env-secret
      - name: gateway-migration-env-secret
        target:
          name: gateway-migration-env-secret
          namespace: enkryptai-stack
        refreshInterval: 15m
        dataFrom:
          - extract:
              key: enkryptaivpc-gateway-migration-env-secret
  configMaps:
    kongConfig:
      enabled: true
      name: gateway-kong-temp-config
    fluentBit:
      enabled: true
      name: fluent-bit-config

  nodeSelector: {}

  tolerations: []

  affinity: {}

################REDTEAMING###########################
redteam-proxy:
  enabled: false
  replicaCount: 2

  image:
    repository: vpcdeployment.azurecr.io/enkryptai-prod/redteam-proxy
    pullPolicy: IfNotPresent
    tag: "prod-v1.0.106"

  nameOverride: ""
  fullnameOverride: "redteam-proxy"

  podAnnotations:
    reloader.stakater.com/auto: "true"

  podLabels: {}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 50%

  service:
    type: ClusterIP
    port: 9091
    targetPort: 9091
    name: http

  env:
    - name: NATS_URL
      value: "nats://nats:4222"
    - name: IS_PROXY_MODE
      value: "true"
    - name: SENTRY_LITELLM_GATEWAY_API_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-gateway-env-secret
          key: SENTRY_LITELLM_GATEWAY_API_KEY
          optional: true

  resources:
    requests:
      cpu: 100m
      memory: 300Mi
    limits:
      cpu: 500m
      memory: 1Gi

  livenessProbe:
    enabled: true
    httpGet:
      path: /health
      port: 9091
    initialDelaySeconds: 90
    timeoutSeconds: 10

  readinessProbe:
    enabled: true
    httpGet:
      path: /health
      port: 9091
    initialDelaySeconds: 30
    timeoutSeconds: 10

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

  externalSecrets:
    enabled: false
    secrets:
      - name: redteam-proxy-env-secret
        target:
          name: redteam-proxy-env-secret
          namespace: enkryptai-stack
        refreshInterval: 15m
        dataFrom:
          - extract:
              key: enkryptaivpc-redteam-proxy-env-secret
      - name: redteam-proxy-env-secret
        target:
          name: redteam-proxy-env-secret
          namespace: redteam-jobs
        refreshInterval: 15m
        dataFrom:
          - extract:
              key: enkryptaivpc-redteam-proxy-env-secret
  configMapNamespaces:
    - enkryptai-stack
    - redteam-jobs
  configMap:
    SUPABASE_URL: "https://auth.{{ .Values.global.domain }}"
  secrets:
    enabled: false
nodeSelector: {}

tolerations: []

affinity: {}


