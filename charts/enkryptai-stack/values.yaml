litellm:
  enabled: false
  # Default values for litellm.
  replicaCount: 1

  # This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  image:
    repository: vpcdeployment.azurecr.io/enkryptai-prod/litellm-gateway
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "main-1793357334"

  # This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  imagePullSecrets: []
  # This is to override the chart name.
  nameOverride: ""
  fullnameOverride: ""

  # This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
  service:
    type: ClusterIP
    port: 4000
    targetPort: 4000
    name: https
  autoscaling:
    enabled: false
  # resources information
  resources:
    requests:
      cpu: 0.5
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi

  # This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: https
  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: https

  useEnvFrom: true
  externalSecrets:
    enabled: false
    secrets:
      - name: litellm-gateway-env-secret
        target:
          name: litellm-gateway-env-secret
          namespace: enkryptai-stack
        refreshInterval: 15m
        dataFrom:
          - extract:
              key: enkryptaivpc-litellm-gateway-env-secret
  envFrom:
    - secretRef:
        name: litellm-gateway-env-secret
  secrets:
    enabled: false
    name: litellm-gateway-env-secret

  # ServiceAccount for the LiteLLM pods, for workload identity (for example an
  # IRSA eks.amazonaws.com/role-arn annotation). With create: false and no name,
  # the pods use the namespace's default ServiceAccount. annotations apply only
  # when create is true; name and annotations go through tpl.
  serviceAccount:
    create: false
    annotations: {}
    name: ""

  nodeSelector: {}

  tolerations: []

  affinity: {}
