    tolerations:
      - key: dedicated
        operator: Equal
        value: gpu
        effect: NoSchedule
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
valkey:
  enabled: true
  fullnameOverride: "valkey"
