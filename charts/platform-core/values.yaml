    image: onprem/dcgm
    version: 4.5.2-1-ubuntu22.04
  gfd:
    repository: vpcdeployment.azurecr.io
    image: onprem/k8s-device-plugin
    version: v0.19.0
    imagePullSecrets: []
  driver:
    repository: vpcdeployment.azurecr.io
    image: onprem/nvidia-driver
    version: 580.126.20

    manager:
      repository: vpcdeployment.azurecr.io
      image: onprem/k8s-driver-manager
      version: "v0.10.0"
    imagePullSecrets: []
  vgpuManager:
    repository: vpcdeployment.azurecr.io
    image: onprem/vgpu-manager
    driverManager:
      repository: vpcdeployment.azurecr.io
      image: onprem/k8s-driver-manager
      version: "v0.10.0"

    imagePullSecrets: []
  kataManager:
    repository: vpcdeployment.azurecr.io
    image: onprem/k8s-kata-manager
    version: "v0.2.2"
    imagePullSecrets: []
  vfioManager:
    repository: vpcdeployment.azurecr.io
    image: onprem/cuda
    version: "12.6.2-base-ubi9"

    imagePullSecrets: []
  vgpuDeviceManager:
    repository: vpcdeployment.azurecr.io
    image: onprem/vgpu-device-manager
    version: "v0.4.2"
    imagePullSecrets: []
  ccManager:
    repository: vpcdeployment.azurecr.io
    image: onprem/k8s-cc-manager
    version: "v0.3.0"
    imagePullSecrets: []
  devicePlugin:
    repository: vpcdeployment.azurecr.io
    image: onprem/k8s-device-plugin
    version: "v0.19.0"
    imagePullSecrets: []
  dcgmExporter:
    repository: vpcdeployment.azurecr.io
    image: onprem/dcgm-exporter
    version: "4.5.1-4.8.0-distroless"
  migManager:
    repository: vpcdeployment.azurecr.io
    image: onprem/k8s-mig-manager
    version: "v0.14.0"
