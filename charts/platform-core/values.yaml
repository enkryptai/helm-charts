argo-workflows:
  images:
    tag: ""
    pullPolicy: Always
    pullSecrets: []
  crds:
    install: true
    keep: true
    annotations: {}
    full: false
  createAggregateRoles: true
  nameOverride:
  fullnameOverride: "argo"
  namespaceOverride: ""
  commonLabels: {}
  kubeVersionOverride: ""
  apiVersionOverrides:
    autoscaling: "" # autoscaling/v2
    cloudgoogle: "" # cloud.google.com/v1
    monitoring: "" # monitoring.coreos.com/v1
  singleNamespace: false
  workflow:
    namespace:
    serviceAccount:
      create: false
      labels: {}
      annotations: {}
      name: "argo-workflow"
      pullSecrets: []
    rbac:
      create: true
      agentPermissions: false
      artifactGC: false
      serviceAccounts: []
      rules: []
  controller:
    image:
      registry: vpcdeployment.azurecr.io
      repository: onprem/workflow-controller
      tag: "v4.0.4"
    parallelism:
    # -- Globally limits the rate at which pods are created.
    # This is intended to mitigate flooding of the Kubernetes API server by workflows with a large amount of
    # parallel nodes.
    resourceRateLimit: {}
      # limit: 10
      # burst: 1
    rbac:
      create: true
      secretWhitelist: []
      accessAllSecrets: false
      writeConfigMaps: false
    configMap:
      create: true
      name: ""
      annotations: {}
    namespaceParallelism: '10'
    # -- Resolves ongoing, uncommon AWS EKS bug: https://github.com/argoproj/argo-workflows/pull/4224
    initialDelay:
    deploymentAnnotations: {}
    podAnnotations: {}
    podLabels: {}
    podSecurityContext: {}
    metricsConfig:
      enabled: false
      path: /metrics
      interval: 30s
      port: 9090
      metricsTTL: ""
      ignoreErrors: false
      secure: false
      portName: metrics
      servicePort: 8080
      servicePortName: metrics
      scheme: http
      headlessService: false
      honorLabels: false
      relabelings: []
      metricRelabelings: []
      targetLabels: []
