cloudnative-pg:
  enabled: true
  image:
    repository: vpcdeployment.azurecr.io/onprem/cloudnative-pg
    tag: "1.29.1"
  config:
    clusterWide: false

  imagePullSecrets: []
opensearch-operator:
  enabled: true
  # The CRDs come from templates/opensearch-operator-crds.yaml, with keep.
  installCRDs: false
  nameOverride: "opensearch"
  fullnameOverride: "opensearch"
  manager:
    image:
      repository: vpcdeployment.azurecr.io/onprem/opensearch-operator
      tag: "2.8.0"
    imagePullSecrets: []
  kubeRbacProxy:
    image:
      repository: vpcdeployment.azurecr.io/onprem/kube-rbac-proxy
      tag: "v0.21.2"

gpu-operator:
  enabled: false
  operator:
    repository: vpcdeployment.azurecr.io
    image: onprem/gpu-operator
    version: v26.3.0
    initContainer:
      repository: vpcdeployment.azurecr.io
      image: onprem/gpu-operator-init
      version: v26.3.0

    runtimeClass: nvidia-container-runtime
    imagePullSecrets: []
  node-feature-discovery:
    image:
      repository: vpcdeployment.azurecr.io/onprem/node-feature-discovery
      tag: v0.18.3

    imagePullSecrets: []
