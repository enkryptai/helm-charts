apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: redteam-eventbus
  namespace: argo-events
  annotations:
    {{- include "platform.hookAnnotations" (dict "root" $ "hook" "post-install" "weight" "1") | nindent 4 }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  jetstream:
    version: 2.12.6

    {{- with .Values.global.imagePullSecrets }}
    imagePullSecrets:
    {{ toYaml . | nindent 4 }}
    {{- end }}
