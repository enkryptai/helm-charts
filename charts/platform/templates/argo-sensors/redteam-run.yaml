apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: redteam-run-sensor
  namespace: argo-events
spec:
  
  dependencies:
  - eventName: redteam
    eventSourceName: redteam-run
    name: redteam-run
  eventBusName: redteam-eventbus
  template:
    serviceAccountName: argo-events-sa
  triggers:
  - template:
      argoWorkflow:
        operation: submit
        parameters:
        - dest: spec.arguments.parameters.0.value
          src:
            dataKey: body
            dependencyName: redteam-run
        source:
          resource:
            apiVersion: argoproj.io/v1alpha1
            kind: Workflow
            metadata:
              generateName: redteam-run-job-
              namespace: redteam-jobs
            spec:
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: dedicated
                        operator: In
                        values:
                        - redteaming
              arguments:
                parameters:
                - name: event-data
                  value: '{{"{{.Input.body}}"}}'
              entrypoint: process-order
              templates:
              - container:
                  command:
                  - python
                  - -m
                  - sentry.redteam.runner
                  env:
                  - name: PYTHONPATH
                    value: /app
                  - name: NATS_URL
                    value: nats://nats.nats:4222
                  - name: RT_NATS_PAYLOAD
                    value: '{{"{{inputs.parameters.event-data}}"}}'
                  envFrom:
                  - secretRef:
                      name: redteam-proxy-env-secret
                  - configMapRef:
                      name: redteam-proxy-env-config
                  image: {{ .Values.sensor.jobImage }}:{{ .Values.sensor.jobversion}}
                  workingDir: /app
                inputs:
                  parameters:
                  - name: event-data
                name: process-order
              tolerations:
              - effect: NoSchedule
                key: app
                operator: Equal
                value: redteaming
      name: argo-workflow-trigger
