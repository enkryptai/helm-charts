# Identity for the redteam Workflow pods (F-33). The token is not mounted in
# the job's main container; the Argo executor (init and wait) reads it from
# the <sa>.service-account-token Secret below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redteam-workflow
  namespace: redteam-jobs
automountServiceAccountToken: false
{{- with .Values.global.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}

---
apiVersion: v1
kind: Secret
metadata:
  name: redteam-workflow.service-account-token
  namespace: redteam-jobs
  annotations:
    kubernetes.io/service-account.name: redteam-workflow
type: kubernetes.io/service-account-token

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redteam-workflow
  namespace: redteam-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-events-role-workflow
subjects:
  - kind: ServiceAccount
    name: redteam-workflow
    namespace: redteam-jobs
