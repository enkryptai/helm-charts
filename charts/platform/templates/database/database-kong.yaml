apiVersion: batch/v1
kind: Job
metadata:
  name: db-check-and-grant
  annotations:  
    "helm.sh/hook-weight": "21"
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: db-check
          image: {{ .Values.global.registry }}/{{ .Values.databasekong.repository }}:{{ .Values.databasekong.tag }}
          env:
            - name: DB_NAME
              value: "postgres"
            - name: DB_HOST
              value: "supabase-cluster-rw"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: superuser-secret
                  key: DB_PASSWORD
            - name: KONG_PG_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databasekong.passwordSecret.name }}
                  key: KONG_PG_USER
                  optional: true
            - name: KONG_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databasekong.passwordSecret.name }}
                  key: {{ .Values.databasekong.passwordSecret.key }}
                  # optional: a missing Secret or key reaches the empty-password check
                  # below and fails fast, instead of hanging until the Helm timeout.
                  optional: true
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "🔍 Checking if database is up..."
              RETRIES=20

              until pg_isready -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" || [ $RETRIES -eq 0 ]; do
                echo "⏳ Waiting for DB... ($RETRIES retries left)"
                RETRIES=$((RETRIES-1))
                sleep 10
              done

              if [ $RETRIES -eq 0 ]; then
                echo "❌ Database is not reachable."
                exit 1
              fi

              if [ -z "$KONG_PG_PASSWORD" ]; then
                echo "❌ KONG_PG_PASSWORD is empty; refusing to create the kong role without a password."
                exit 1
              fi

              echo "✅ Database is up. Creating kong role and setting its password..."
              PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
                -v kong_user="${KONG_PG_USER:-kong}" -v kong_password="$KONG_PG_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN', :'kong_user')
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'kong_user')\gexec
              ALTER ROLE :"kong_user" WITH LOGIN PASSWORD :'kong_password';
              ALTER DATABASE kong OWNER TO :"kong_user";
              GRANT ALL PRIVILEGES ON DATABASE kong TO :"kong_user";
              SQL
              echo "🎯 kong role ready."

      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | nindent 8 }}
      {{- end }}
