        FOREIGN KEY (org_id) REFERENCES public.subscription(id)
        ON UPDATE CASCADE ON DELETE CASCADE;

    --
    -- Row Level Security: enabled with no policies (service role bypasses RLS, matches api_keys access model)
    --

    ALTER TABLE public.org_secrets ENABLE ROW LEVEL SECURITY;

