        invitee text,
        inviter text,
        latest_config jsonb
    );
    
    
    --
    -- Name: TABLE invitations; Type: COMMENT; Schema: public; Owner: -
    --
    
    COMMENT ON TABLE public.invitations IS 'Organization Invitations';
    
    
    --
    -- Name: COLUMN invitations.id; Type: COMMENT; Schema: public; Owner: -
    --
    
    COMMENT ON COLUMN public.invitations.id IS 'Supabase user_id or org_id if this belongs to an Org';
    
    
    --
    -- Name: COLUMN invitations.invitation_id_hash; Type: COMMENT; Schema: public; Owner: -
    --
    
    COMMENT ON COLUMN public.invitations.invitation_id_hash IS 'Hash of the ID';
    
    
    --
    -- Name: filter_invitations_by_project(text[]); Type: FUNCTION; Schema: public; Owner: -
    --
    
    CREATE OR REPLACE FUNCTION public.filter_invitations_by_project(projects text[]) RETURNS SETOF public.invitations
        LANGUAGE sql
        AS $$select *
      from invitations
      where exists (
        select 1 from jsonb_array_elements(latest_config->'roles') as elem
        where elem->>'project' = any (projects)
      );$$;
    
    
    --
    -- Name: log_test_names(); Type: FUNCTION; Schema: public; Owner: -
    --
    
    CREATE OR REPLACE FUNCTION public.log_test_names() RETURNS void
        LANGUAGE plpgsql
        AS $$
    DECLARE
        rec RECORD;
    BEGIN
        FOR rec IN
            SELECT id, test_name FROM public.red_teaming ORDER BY id
        LOOP
            RAISE NOTICE 'Row ID: %, Test Name: %', rec.id, rec.test_name;
        END LOOP;
    END;
    $$;
    
    
    --
    -- Name: rename_test_names(); Type: FUNCTION; Schema: public; Owner: -
    --
    
    CREATE OR REPLACE FUNCTION public.rename_test_names() RETURNS void
        LANGUAGE plpgsql
        AS $$
    DECLARE
        rec RECORD;
        counter INTEGER := 1;
    BEGIN
        RAISE NOTICE 'Starting to replace';
        FOR rec IN
            SELECT id FROM red_teaming ORDER BY id
        LOOP
            UPDATE red_teaming
            SET test_name = 'test-' || counter
            WHERE id = rec.id;
    
            RAISE NOTICE 'Updating test_name for id % to %', rec.id, 'test-' || counter;
            counter := counter + 1;
        END LOOP;
    
        RAISE NOTICE 'All test names updated successfully.';
    END;
    $$;
    
    
    --
    -- Name: models; Type: TABLE; Schema: public; Owner: -
    --
    
    CREATE TABLE IF NOT EXISTS public.models (
        id uuid NOT NULL,
        created_at timestamp with time zone DEFAULT now() NOT NULL,
        model_saved_name text NOT NULL,
        model_config jsonb NOT NULL,
        updated_at timestamp with time zone DEFAULT now() NOT NULL,
        testing_for public."MODEL_TESTING_FOR" DEFAULT 'foundationModels'::public."MODEL_TESTING_FOR" NOT NULL,
        model_id bigint NOT NULL,
        model_id_hash bigint,
        model_name text,
        certifications text[],
        created_by uuid,
        updated_by uuid,
        project_name text DEFAULT 'default'::text NOT NULL,
        is_sample boolean DEFAULT false,
