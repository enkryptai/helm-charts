  023-add-recent-signups-view.sql: |
    --
    -- Migration: 008_add_recent_signups_view
    -- Description: Expose auth.users to the daily-digest reporting job via a public-schema view (auth.* is locked down by Supabase and unreachable from PostgREST by default). Pulls signup metadata from raw_user_meta_data so the digest can show full_name and signup provider next to each email. The view runs as SECURITY DEFINER (Postgres default for views without WITH (security_invoker)) so service_role can read auth.users through this view even though it lacks direct grants on auth.*.
    -- psql -h localhost -U postgres -d postgres -f database/dev/public/migrations/008_add_recent_signups_view.sql
    --

    BEGIN;

    -- ============================================================================
    -- View: public.recent_signups
    -- Description: Read-only projection of auth.users for the scheduled
    --              daily digest GitHub Action (.github/workflows/svc-daily-digest.yml).
    --              Granted to service_role only; the digest workflow uses the
    --              service-role key for authentication.
    -- ============================================================================

    CREATE OR REPLACE VIEW public.recent_signups AS
    SELECT
        u.id,
        u.email,
        u.created_at,
        u.email_confirmed_at,
        u.last_sign_in_at,
        u.raw_user_meta_data->>'full_name'  AS full_name,
        u.raw_user_meta_data->>'provider'   AS signup_provider
    FROM auth.users u;

    GRANT SELECT ON public.recent_signups TO service_role;

    COMMIT;
  024-restrict-recent-signups-view.sql: |
    --
    -- Migration: 009_restrict_recent_signups_view
    -- Description: Resolve two Supabase security advisors on public.recent_signups:
    --                * 0002_auth_users_exposed  (Exposed Auth Users)
    --                * 0010_security_definer_view (Security Definer View)
    --              Both advisors fire ONLY when the `anon` or `authenticated` role
    --              holds SELECT on a view that references auth.users in a
    --              PostgREST-exposed schema (see the lint SQL: each has the gate
    --              `has_table_privilege('anon'|'authenticated', view, 'SELECT')`).
    --              Migration 008 GRANTed SELECT to service_role only, but Supabase's
    --              default privileges
    --                  ALTER DEFAULT PRIVILEGES ... IN SCHEMA public
    --                      GRANT ALL ON TABLES TO anon, authenticated, service_role
    --              silently also granted SELECT to anon + authenticated at
    --              view-creation time -- which is what tripped both advisors.
    --
    --              Fix: revoke anon/authenticated/PUBLIC, leaving service_role as
    --              the only grantee. This clears BOTH advisors (their shared gate
    --              goes false) while intentionally KEEPING the view as a security
    --              definer view: service_role has no direct grant on auth.* (it
    --              only has USAGE on schema auth), so the daily-digest job relies on
    --              the definer view -- owned by a role that can read auth.users -- to
    --              project signup data. A definer view reachable only by the trusted
    --              service_role backend role is not an exposure; the advisors agree
    --              and stop flagging it once anon/authenticated lose SELECT.
    --
    --              NOTE: if public.recent_signups is ever DROPped and recreated, the
    --              default privileges above will re-grant anon/authenticated and
    --              this migration must be re-applied.
    -- psql -h localhost -U postgres -d postgres -f database/dev/public/migrations/009_restrict_recent_signups_view.sql
    --

    BEGIN;

    -- ============================================================================
    -- Lock down public.recent_signups to service_role only.
    -- ============================================================================

    -- Remove the implicit anon/authenticated grants attached by Supabase default
    -- privileges when 008 created the view. These two roles are exactly what the
    -- 0002 / 0010 advisors check for. REVOKE is a no-op if the grant is absent.
    REVOKE ALL ON public.recent_signups FROM anon, authenticated;

    -- Defensive: ensure no PUBLIC grant lingers either.
    REVOKE ALL ON public.recent_signups FROM PUBLIC;

    -- Re-assert the single intended grant (idempotent; the daily-digest job reads
    -- the view through PostgREST using the service-role key).
    GRANT SELECT ON public.recent_signups TO service_role;

    -- ============================================================================
    -- Verify the resulting grants are exactly what we expect.
    -- ============================================================================

    DO $$
    BEGIN
      IF has_table_privilege('anon', 'public.recent_signups', 'SELECT') THEN
        RAISE EXCEPTION 'FAILED: anon still holds SELECT on public.recent_signups';
      END IF;
      IF has_table_privilege('authenticated', 'public.recent_signups', 'SELECT') THEN
        RAISE EXCEPTION 'FAILED: authenticated still holds SELECT on public.recent_signups';
      END IF;
      IF NOT has_table_privilege('service_role', 'public.recent_signups', 'SELECT') THEN
        RAISE EXCEPTION 'FAILED: service_role lost SELECT on public.recent_signups';
      END IF;
      RAISE NOTICE 'SUCCESS: public.recent_signups is readable only by service_role';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --
  025-harden-function-security.sql: |
    --
    -- Migration: 010_harden_function_security (on-prem counterpart)
    -- Description: On-prem mirror of database/{dev,prod}/public/migrations/
    --              010_harden_function_security.sql. Pins a non-mutable search_path on
    --              the public functions defined by this ConfigMap and revokes
    --              anon/authenticated/PUBLIC EXECUTE on the SECURITY DEFINER ones,
    --              clearing Supabase advisors 0011 / 0028 / 0029.
    --
    --              Scope: filter_invitations_by_project is intentionally OMITTED -- it
    --              is not defined in this on-prem bootstrap (only the Supabase cloud
    --              schema has it), so ALTERing it would error. The six functions below
    --              (004 custom_access_token_hook, 007 bulk_decrypt_keys,
    --              008 create_user_on_signup, 009 decrypt_key, 011 encrypt_key,
    --              015 search_models_by_testing_for) are all defined earlier in this
    --              ConfigMap and exist by the time this runs (lexicographic order:
    --              025 sorts after every function key). search_path = public,
    --              extensions, pg_temp keeps the unqualified pgcrypto + table
    --              references resolving. Idempotent + self-verifying.
    --

    BEGIN;

    -- 0011: pin a non-mutable search_path (ALTER touches only the attribute, not body).
    ALTER FUNCTION public.bulk_decrypt_keys(text[], text)          SET search_path = public, extensions, pg_temp;
    ALTER FUNCTION public.create_user_on_signup()                  SET search_path = public, extensions, pg_temp;
    ALTER FUNCTION public.custom_access_token_hook(jsonb)          SET search_path = public, extensions, pg_temp;
    ALTER FUNCTION public.decrypt_key(text, text)                  SET search_path = public, extensions, pg_temp;
    ALTER FUNCTION public.encrypt_key(text, text)                  SET search_path = public, extensions, pg_temp;
    ALTER FUNCTION public.search_models_by_testing_for(uuid, text) SET search_path = public, extensions, pg_temp;

    -- 0028 / 0029: lock the SECURITY DEFINER functions down to service_role.
    REVOKE EXECUTE ON FUNCTION public.bulk_decrypt_keys(text[], text) FROM PUBLIC, anon, authenticated;
    REVOKE EXECUTE ON FUNCTION public.create_user_on_signup()         FROM PUBLIC, anon, authenticated;
    REVOKE EXECUTE ON FUNCTION public.decrypt_key(text, text)         FROM PUBLIC, anon, authenticated;
    REVOKE EXECUTE ON FUNCTION public.encrypt_key(text, text)         FROM PUBLIC, anon, authenticated;

    -- Only encrypt_key + bulk_decrypt_keys have live (service_role) callers; re-assert.
    GRANT EXECUTE ON FUNCTION public.bulk_decrypt_keys(text[], text) TO service_role;
    GRANT EXECUTE ON FUNCTION public.encrypt_key(text, text)         TO service_role;

    DO $$
    DECLARE
      fn regprocedure;
      definer_fns regprocedure[] := ARRAY[
        'public.bulk_decrypt_keys(text[], text)'::regprocedure,
        'public.create_user_on_signup()'::regprocedure,
        'public.decrypt_key(text, text)'::regprocedure,
        'public.encrypt_key(text, text)'::regprocedure
      ];
      all_fns regprocedure[] := definer_fns || ARRAY[
        'public.custom_access_token_hook(jsonb)'::regprocedure,
        'public.search_models_by_testing_for(uuid, text)'::regprocedure
      ];
    BEGIN
      FOREACH fn IN ARRAY all_fns LOOP
        IF NOT EXISTS (
          SELECT 1
          FROM pg_proc p
          WHERE p.oid = fn::oid
            AND p.proconfig IS NOT NULL
            AND EXISTS (SELECT 1 FROM unnest(p.proconfig) c WHERE c LIKE 'search_path=%')
        ) THEN
          RAISE EXCEPTION 'FAILED: % has no pinned search_path', fn;
        END IF;
      END LOOP;

      FOREACH fn IN ARRAY definer_fns LOOP
        IF has_function_privilege('anon', fn::oid, 'EXECUTE') THEN
          RAISE EXCEPTION 'FAILED: anon can still execute %', fn;
        END IF;
        IF has_function_privilege('authenticated', fn::oid, 'EXECUTE') THEN
          RAISE EXCEPTION 'FAILED: authenticated can still execute %', fn;
        END IF;
      END LOOP;

      IF NOT has_function_privilege('service_role', 'public.encrypt_key(text, text)'::regprocedure::oid, 'EXECUTE') THEN
        RAISE EXCEPTION 'FAILED: service_role lost EXECUTE on encrypt_key';
      END IF;
      IF NOT has_function_privilege('service_role', 'public.bulk_decrypt_keys(text[], text)'::regprocedure::oid, 'EXECUTE') THEN
        RAISE EXCEPTION 'FAILED: service_role lost EXECUTE on bulk_decrypt_keys';
      END IF;

      RAISE NOTICE 'SUCCESS: search_path pinned on 6 functions; anon/authenticated EXECUTE revoked on 4 SECURITY DEFINER functions; service_role retains EXECUTE on encrypt_key + bulk_decrypt_keys';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --
  026-lockdown-rls-no-policy.sql: |
    --
    -- Migration: 011_lockdown_rls_no_policy (on-prem counterpart)
    -- Description: On-prem mirror of database/{dev,prod}/public/migrations/
    --              011_lockdown_rls_no_policy.sql. Adds a RESTRICTIVE deny-all policy
    --              to every public table that is RLS-enabled with no policy, clearing
    --              Supabase advisor 0008 while preserving the existing access model
    --              (service_role bypasses RLS; anon/authenticated stay denied -- the
    --              same model this ConfigMap already documents on org_secrets).
    --
    --              Written dynamically against the linter's own condition, so it locks
    --              exactly the RLS-enabled-no-policy tables present in THIS database
    --              (e.g. mcp_registry_servers, mcp_gateways, playground, org_secrets,
    --              mcp_registry -- all enabled earlier in this ConfigMap) and skips any
    --              table that already has a policy. 026 sorts after every table /
    --              RLS-enable key, so those tables exist by the time it runs.
    --              Idempotent + transactional + self-verifying.
    --
    --              NOTE: to later grant client access to one of these tables, DROP its
    --              deny_all_<table> policy first (a RESTRICTIVE USING(false) policy
    --              AND-s with any future permissive policy and would silently block it).
    --

    BEGIN;

    DO $$
    DECLARE
      r    record;
      cnt  integer := 0;
    BEGIN
      FOR r IN
        SELECT c.relname
        FROM pg_class c
        JOIN pg_namespace ns ON ns.oid = c.relnamespace
        WHERE ns.nspname = 'public'
          AND c.relkind IN ('r', 'p')
          AND c.relrowsecurity = true
          AND NOT EXISTS (SELECT 1 FROM pg_policy p WHERE p.polrelid = c.oid)
        ORDER BY c.relname
      LOOP
        EXECUTE format(
          'CREATE POLICY %I ON public.%I AS RESTRICTIVE FOR ALL TO anon, authenticated USING (false) WITH CHECK (false)',
          'deny_all_' || r.relname,
          r.relname
        );
        cnt := cnt + 1;
        RAISE NOTICE 'locked down public.% (added RESTRICTIVE policy deny_all_%)', r.relname, r.relname;
      END LOOP;
      RAISE NOTICE 'Added deny-all policy to % table(s).', cnt;
    END $$;

    DO $$
    DECLARE
      leftover text;
    BEGIN
      SELECT string_agg(c.relname, ', ' ORDER BY c.relname)
        INTO leftover
      FROM pg_class c
      JOIN pg_namespace ns ON ns.oid = c.relnamespace
      WHERE ns.nspname = 'public'
        AND c.relkind IN ('r', 'p')
        AND c.relrowsecurity = true
        AND NOT EXISTS (SELECT 1 FROM pg_policy p WHERE p.polrelid = c.oid);
      IF leftover IS NOT NULL THEN
        RAISE EXCEPTION 'FAILED: still RLS-enabled with no policy: %', leftover;
      END IF;
      RAISE NOTICE 'SUCCESS: every public table with RLS enabled now has at least one policy (advisor 0008 cleared).';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --

  027-add-mcp-hub-api-usage.sql: |
    --
    -- Migration: 012_add_mcp_hub_api_usage
    -- Description: Append-only usage log for the gated MCP Hub GET APIs (scan
    --              status/results, scans list). One row per metered API call,
    --              written best-effort by Kong (enkrypt-mcp-scanner log phase) via
    --              POST /api/mcp-hub/usage. This is the license/metering source of
    --              truth for MCP Hub API usage. RLS-locked like every other public
    --              business table (service_role backend only); see migration 011.
    --              Identical for dev and prod (only the psql host/path below differ).
    -- psql -h localhost -U postgres -d postgres -f database/dev/public/migrations/012_add_mcp_hub_api_usage.sql
    --

    BEGIN;

    -- ============================================================================
    -- Table: mcp_hub_api_usage
    -- Append-only event log; rows are never updated. Aggregated per org per period
    -- for license enforcement/reporting. No FK on org_id by design: metering must
    -- never reject a write, and org identity spans multiple Supabase projects.
    -- ============================================================================

    CREATE TABLE public.mcp_hub_api_usage (
        id bigint NOT NULL,
        org_id uuid NOT NULL,
        user_id text,
        project_name text,
        endpoint text NOT NULL,
        http_method text DEFAULT 'GET'::text NOT NULL,
        job_id text,
        response_status integer,
        request_id text,
        created_at timestamp with time zone DEFAULT now() NOT NULL
    );

    --
    -- Table / Column Comments
    --

    COMMENT ON TABLE public.mcp_hub_api_usage IS 'Append-only audit/usage-metrics log of gated MCP Hub API GET calls: scanner GETs (scan status/results, scans list) and hub-browse GETs (servers list/job-status/summary). Written best-effort by Kong (enkrypt-mcp-scanner and enkrypt-db-proxy log phases) via POST /api/mcp-hub/usage. The license itself is the time-boxed OpenFGA grant; this table is for audit/reporting only.';

    COMMENT ON COLUMN public.mcp_hub_api_usage.org_id IS 'Organization charged for this call (Kong consumer.org_id; matches org:<org_id> in OpenFGA).';

    COMMENT ON COLUMN public.mcp_hub_api_usage.user_id IS 'Acting identity that made the call (may equal org_id for owner accounts).';

    COMMENT ON COLUMN public.mcp_hub_api_usage.endpoint IS 'Which gated endpoint. Scanner GETs: scan_status | scan_results | scans_list | dashboard_stats. Hub-browse GETs (db-proxy -> Next.js): servers_list | servers_job_status | servers_summary.';

    COMMENT ON COLUMN public.mcp_hub_api_usage.job_id IS 'Scan job id for scan_status/scan_results; NULL for list/browse endpoints (scans_list, servers_*).';

    COMMENT ON COLUMN public.mcp_hub_api_usage.response_status IS 'Final HTTP status returned to the caller (lets reporting filter to successful 2xx calls).';

    COMMENT ON COLUMN public.mcp_hub_api_usage.request_id IS 'Kong request id; UNIQUE for idempotent at-least-once delivery (upsert on conflict do nothing).';

    --
    -- Surrogate primary key (auto-increment)
    --

    ALTER TABLE public.mcp_hub_api_usage ALTER COLUMN id ADD GENERATED BY DEFAULT AS IDENTITY (
        SEQUENCE NAME public.mcp_hub_api_usage_id_seq
        START WITH 1
        INCREMENT BY 1
        NO MINVALUE
        NO MAXVALUE
        CACHE 1
    );

    ALTER TABLE ONLY public.mcp_hub_api_usage
        ADD CONSTRAINT mcp_hub_api_usage_pkey PRIMARY KEY (id);

    -- Idempotency key: one row per Kong request. Postgres treats NULLs as distinct,
    -- so a rare missing request_id still inserts (never blocks metering).
    ALTER TABLE ONLY public.mcp_hub_api_usage
        ADD CONSTRAINT mcp_hub_api_usage_request_id_key UNIQUE (request_id);

    --
    -- Row Level Security: locked (service_role backend only), matching the
    -- RESTRICTIVE deny-all posture established for every public table in 011.
    --

    ALTER TABLE public.mcp_hub_api_usage ENABLE ROW LEVEL SECURITY;

    CREATE POLICY deny_all_mcp_hub_api_usage
        ON public.mcp_hub_api_usage
        AS RESTRICTIVE FOR ALL TO anon, authenticated
        USING (false) WITH CHECK (false);

    --
    -- Indexes for license aggregation (count per org over a billing period)
    --

    CREATE INDEX idx_mcp_hub_api_usage_org_created
        ON public.mcp_hub_api_usage (org_id, created_at);

    CREATE INDEX idx_mcp_hub_api_usage_created
        ON public.mcp_hub_api_usage (created_at);

    --
    -- Verify the schema changes
    --

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.tables
        WHERE table_schema = 'public' AND table_name = 'mcp_hub_api_usage'
      ) THEN
        RAISE EXCEPTION 'FAILED: mcp_hub_api_usage table was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.table_constraints
        WHERE table_schema = 'public' AND table_name = 'mcp_hub_api_usage'
          AND constraint_name = 'mcp_hub_api_usage_request_id_key'
      ) THEN
        RAISE EXCEPTION 'FAILED: unique constraint on request_id was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_policy p
        JOIN pg_class c ON c.oid = p.polrelid
        JOIN pg_namespace ns ON ns.oid = c.relnamespace
        WHERE ns.nspname = 'public' AND c.relname = 'mcp_hub_api_usage'
          AND p.polname = 'deny_all_mcp_hub_api_usage'
      ) THEN
        RAISE EXCEPTION 'FAILED: deny-all RLS policy was not created';
      END IF;

      RAISE NOTICE 'SUCCESS: mcp_hub_api_usage table created and locked down';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --

  028-add-mcp-hub-usage-summary.sql: |
    --
    -- Migration: 013_add_mcp_hub_usage_summary
    -- Description: Read-side aggregation for the self-service MCP Hub usage-insights
    --              API (GET /mcp-hub/usage). One SECURITY INVOKER SQL function that,
    --              in a single index-range scan of mcp_hub_api_usage (uses the
    --              existing (org_id, created_at) index from migration 012), returns
    --              all the summary breakdowns as jsonb: totals, per-endpoint,
    --              per-project, per-status-class, and a daily time-series. Returns
    --              ONLY aggregates (counts) — never raw rows. The Next.js route
    --              caches the result and Kong rate-limits the endpoint, so even many
    --              orgs calling repeatedly stay cheap. The table is RLS-locked
    --              (migration 011/012); this runs as the caller, so only the
    --              service_role backend (which bypasses RLS) can read through it.
    --              Identical for dev and prod (only the psql host/path below differ).
    -- psql -h localhost -U postgres -d postgres -f database/dev/public/migrations/013_add_mcp_hub_usage_summary.sql
    --

    BEGIN;

    CREATE OR REPLACE FUNCTION public.mcp_hub_usage_summary(
        p_org_id uuid,
        p_start  timestamptz,
        p_end    timestamptz
    ) RETURNS jsonb
    LANGUAGE sql
    STABLE
    SECURITY INVOKER
    SET search_path = public
    AS $$
    WITH win AS (
        -- Single scan of the (org_id, created_at) index range. Materialized once,
        -- then aggregated multiple ways below — no repeated table access.
        SELECT
            endpoint,
            COALESCE(NULLIF(project_name, ''), 'default') AS project_name,
            response_status,
            created_at,
            (response_status >= 200 AND response_status < 300) AS is_success
        FROM public.mcp_hub_api_usage
        WHERE org_id = p_org_id
          AND created_at >= p_start
          AND created_at <  p_end
    ),
    totals AS (
        SELECT
            count(*)                                   AS total_calls,
            count(*) FILTER (WHERE is_success)         AS successful_calls
        FROM win
    ),
    by_endpoint AS (
        SELECT endpoint,
               count(*)                           AS calls,
               count(*) FILTER (WHERE is_success) AS successful
        FROM win
        GROUP BY endpoint
        ORDER BY count(*) DESC, endpoint
    ),
    by_project AS (
        SELECT project_name,
               count(*) AS calls
        FROM win
        GROUP BY project_name
        ORDER BY count(*) DESC, project_name
    ),
    by_status AS (
        -- Bucket by HTTP status class (2xx/4xx/5xx...). NULL status -> 0 (unknown).
        SELECT COALESCE((response_status / 100) * 100, 0) AS status_class,
               count(*) AS calls
        FROM win
        GROUP BY COALESCE((response_status / 100) * 100, 0)
        ORDER BY 1
    ),
    by_day AS (
        SELECT to_char(date_trunc('day', created_at), 'YYYY-MM-DD') AS day,
               count(*)                           AS calls,
               count(*) FILTER (WHERE is_success) AS successful
        FROM win
        GROUP BY date_trunc('day', created_at)
        ORDER BY 1
    )
    SELECT jsonb_build_object(
        'total_calls',       (SELECT total_calls       FROM totals),
        'successful_calls',  (SELECT successful_calls   FROM totals),
        'by_endpoint', COALESCE((
            SELECT jsonb_agg(jsonb_build_object(
                       'endpoint', endpoint, 'calls', calls, 'successful', successful))
            FROM by_endpoint), '[]'::jsonb),
        'by_project', COALESCE((
            SELECT jsonb_agg(jsonb_build_object(
                       'project_name', project_name, 'calls', calls))
            FROM by_project), '[]'::jsonb),
        'by_status_class', COALESCE((
            SELECT jsonb_agg(jsonb_build_object(
                       'status_class', status_class, 'calls', calls))
            FROM by_status), '[]'::jsonb),
        'by_day', COALESCE((
            SELECT jsonb_agg(jsonb_build_object(
                       'day', day, 'calls', calls, 'successful', successful))
            FROM by_day), '[]'::jsonb)
    );
    $$;

    COMMENT ON FUNCTION public.mcp_hub_usage_summary(uuid, timestamptz, timestamptz) IS
      'Aggregate-only usage summary for one org over [p_start, p_end) from mcp_hub_api_usage. Returns jsonb {total_calls, successful_calls, by_endpoint[], by_project[], by_status_class[], by_day[]}. No raw rows. Single index-range scan; backs GET /mcp-hub/usage (cached + rate-limited).';

    -- Only the service_role backend calls this (matches the RLS-locked table).
    REVOKE ALL ON FUNCTION public.mcp_hub_usage_summary(uuid, timestamptz, timestamptz) FROM PUBLIC;
    GRANT EXECUTE ON FUNCTION public.mcp_hub_usage_summary(uuid, timestamptz, timestamptz) TO service_role;

    --
    -- Verify the function was created
    --
    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM pg_proc p
        JOIN pg_namespace n ON n.oid = p.pronamespace
        WHERE n.nspname = 'public' AND p.proname = 'mcp_hub_usage_summary'
      ) THEN
        RAISE EXCEPTION 'FAILED: mcp_hub_usage_summary function was not created';
      END IF;
      RAISE NOTICE 'SUCCESS: mcp_hub_usage_summary function created';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --

  029-rtv2-v4-substrate-and-evolutions.sql: |
    --
    -- Migration: 014_rtv2_v4_substrate_and_evolutions (on-prem counterpart)
    -- Description: V4 substrate schema for sentry-redteam (rtv2 branch).
    --              Consolidates the seven in-tree migrations (0001-0007) that
    --              previously lived under
    --                src/sentry-redteam/sentry/redteam/storage/migrations/
    --              in the sentry-redteam repo. We now track all DB schema centrally
    --              here in apiaas; the in-tree migrations folder is removed in the
    --              matching sentry-redteam PR.
    --
    --              Tables created: programs, runs, test_statuses, records,
    --                              run_coverage, redteam_datasets
    --              Plus tenant RLS policies keyed on auth.jwt() tenant_id claim.
    --
    --              NOTE on the redteam_datasets name: the apiaas dev/prod schema
    --              already has a `public.datasets` table from the legacy
    --              red-teaming flow (columns: dataset_name, system_description,
    --              policy_description, ...) with no tenant_id. We can't reuse the
    --              name, so the V4 threat-modeling-output table is prefixed
    --              `redteam_` to avoid the collision. Application code on rtv2 does
    --              not yet read or write this table directly - it's reserved for
    --              the threat-modeling output persistence work.
    --
    --              The original in-tree migrations are summarised below; this file
    --              applies their FINAL state in one pass (so there is no need to
    --              ALTER ADD then DROP CHECK constraints just to widen enum lists):
    --                0001_v4_initial                      - tables + base indices
    --                0002_failed_terminal_status          - test_statuses status / pillar CHECKs widened
    --                0003_eval_records                    - records.source widened + records.reasoning
    --                0004_v2_payload_columns              - records.test_type + records.goal + redteam_datasets table
    --                0005_tenant_rls                      - auth_tenant_id() + per-table RLS policies
    --                0006_adaptive_heartbeat_and_projections - test_statuses.heartbeat_interval_s
    --                                                       + runs.{summary, compliance_cache, finalised_at}
    --                0007_response_classification         - column comment (column itself added in 0001)
    --
    -- Requires: Postgres 15+ (NULLS NOT DISTINCT on uq_test_statuses_cell_identity).
    -- Identical for dev and prod (only the psql host/path below differ).
    --

    BEGIN;

    -- ============================================================================
    -- programs
    -- Top-level program/policy spec submitted by a tenant. The run config is a
    -- snapshot of a program (or a one-off ad-hoc spec) at submission time.
    -- ============================================================================
    CREATE TABLE IF NOT EXISTS public.programs (
        id           UUID PRIMARY KEY,
        tenant_id    UUID NOT NULL,
        spec         JSONB NOT NULL,
        created_at   TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    -- ============================================================================
    -- runs
    -- One row per submitted run (a single /v1/redteam, /v1/threat-modeling, or
    -- /v1/eval invocation). Includes the projection columns from 0006
    -- (summary, compliance_cache, finalised_at).
    -- ============================================================================
    CREATE TABLE IF NOT EXISTS public.runs (
        id                 UUID PRIMARY KEY,
        program_id         UUID REFERENCES public.programs(id),
        tenant_id          UUID NOT NULL,
        status             TEXT NOT NULL CHECK (status IN ('queued','running','paused','cancelled','completed','failed')),
        config             JSONB NOT NULL,
        config_version     TEXT NOT NULL,
        taxonomy_version   TEXT NOT NULL,
        compliance_version TEXT NOT NULL,
        budget             JSONB NOT NULL,
        started_at         TIMESTAMPTZ,
        completed_at       TIMESTAMPTZ,
        error              JSONB,
        summary            JSONB,
        compliance_cache   JSONB,
        finalised_at       TIMESTAMPTZ,
        user_metadata      JSONB
    );

    -- user_metadata: optional caller-supplied JSON object echoed on POST responses
    -- and returned by GET run endpoints. Validated at the API layer (<=16 top-level
    -- keys, key <=64 chars, nesting depth <=3, <=4KB compact-serialised). NULL when
    -- not provided. Databases whose runs table predates this column get it from
    -- key 034, which uses ALTER TABLE IF EXISTS public.runs.
    DO $$
    BEGIN
      -- Guarded so re-running 014 against a database whose runs table predates
      -- this column (it gets the column from key 034 instead) stays a no-op.
      IF EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'runs'
          AND column_name = 'user_metadata'
      ) THEN
        COMMENT ON COLUMN public.runs.user_metadata IS
          'Optional caller-supplied JSON object echoed on POST responses and returned by GET run endpoints. Validated at the API layer (<=16 top-level keys, key <=64 chars, nesting depth <=3, <=4KB compact-serialised). NULL when not provided.';
      END IF;
    END $$;

    -- Finalisation idempotency: WHERE finalised_at IS NULL RETURNING id.
    -- Partial index on the un-finalised slice keeps the lookup cheap.
    CREATE INDEX IF NOT EXISTS idx_runs_finalised_at_null
        ON public.runs (id) WHERE finalised_at IS NULL;

    -- ============================================================================
    -- test_statuses
    -- One row per cell scheduled for a run. Includes:
    --   * 0001's base columns
    --   * 0002's widened CHECK lists (status + 'failed_terminal'; pillar + 'playground')
    --   * 0006's heartbeat_interval_s
    -- ============================================================================
    CREATE TABLE IF NOT EXISTS public.test_statuses (
        cell_id              UUID PRIMARY KEY,
        run_id               UUID NOT NULL REFERENCES public.runs(id),
        pillar               TEXT NOT NULL CHECK (pillar IN ('datagen','attack','eval','playground')),
        category             TEXT NOT NULL,
        sub_category         TEXT,
        attack_method        TEXT,
        record_id            UUID,
        evaluator_id         TEXT,
        scenario_idx         INT,
        depth_idx            INT,
        flavor               TEXT,
        status               TEXT NOT NULL CHECK (status IN ('pending','running','done','failed','cancelled','failed_terminal')),
        attempts             INT NOT NULL DEFAULT 0,
        heartbeat_at         TIMESTAMPTZ,
        heartbeat_interval_s INT NOT NULL DEFAULT 30,
        started_at           TIMESTAMPTZ,
        completed_at         TIMESTAMPTZ,
        error                JSONB
    );

    -- Unique constraint with NULLS NOT DISTINCT (Postgres 15+) so two rows
    -- sharing the same (run_id, pillar, category, ...) with any nullable column
    -- set to NULL are still treated as duplicates. Correct semantics for dedup.
    CREATE UNIQUE INDEX IF NOT EXISTS uq_test_statuses_cell_identity
        ON public.test_statuses (run_id, pillar, category,
                                 sub_category, attack_method, record_id,
                                 evaluator_id, scenario_idx, depth_idx)
        NULLS NOT DISTINCT;

    -- Fast lookup by run + status (coordinator finding pending/running cells).
    CREATE INDEX IF NOT EXISTS idx_test_statuses_run_status
        ON public.test_statuses (run_id, status);

    -- Stale-heartbeat detection: only index running rows (partial, kept small).
    CREATE INDEX IF NOT EXISTS idx_test_statuses_heartbeat
        ON public.test_statuses (status, heartbeat_at)
        WHERE status = 'running';

    -- ============================================================================
    -- records
    -- Evidence store; one row per record (attack attempt or eval sample). Includes:
    --   * 0001's base columns (incl. response_classification - free-form TEXT)
    --   * 0003's widened source CHECK ('eval') + reasoning column
    --   * 0004's test_type + goal columns
    --   * 0007 only added a COMMENT on response_classification - applied below
    -- ============================================================================
    CREATE TABLE IF NOT EXISTS public.records (
        id                       UUID PRIMARY KEY,
        run_id                   UUID NOT NULL REFERENCES public.runs(id),
        cell_id                  UUID NOT NULL REFERENCES public.test_statuses(cell_id),
        category                 TEXT NOT NULL,
        sub_category             TEXT,
        prompt_hash              TEXT NOT NULL,
        jailbreak_hash           TEXT,
        response_hash            TEXT,
        prompt_preview           TEXT,
        response_preview         TEXT,
        attack_method            TEXT NOT NULL,
        source                   TEXT NOT NULL CHECK (source IN ('static','custom_generated','custom_dataset','eval')),
        success                  BOOLEAN,
        response_classification  TEXT,
        reasoning                TEXT,
        test_type                TEXT,
        goal                     TEXT,
        confidence               REAL,
        tags                     JSONB,
        blob_path                TEXT NOT NULL,
        created_at               TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    COMMENT ON COLUMN public.records.response_classification IS
        'category_judge enum: hard_refusal | hallucinated_off_topic | verbatim | instructions_with_warning | direct_violation. NULL for evaluators that do not classify.';

    CREATE INDEX IF NOT EXISTS idx_records_run_category
        ON public.records (run_id, category, sub_category);

    CREATE INDEX IF NOT EXISTS idx_records_prompt_hash
        ON public.records (prompt_hash);

    CREATE INDEX IF NOT EXISTS idx_records_test_type
        ON public.records (test_type);

    -- ============================================================================
    -- run_coverage
    -- Coverage gaps materialised for /v1/runs/{id}/results.
    -- ============================================================================
    CREATE TABLE IF NOT EXISTS public.run_coverage (
        run_id       UUID NOT NULL REFERENCES public.runs(id),
        category     TEXT NOT NULL,
        requested    INT NOT NULL,
        delivered    INT NOT NULL,
        failed_cells JSONB,
        PRIMARY KEY (run_id, category)
    );

    -- ============================================================================
    -- redteam_datasets
    -- Persisted threat-modeling artefacts (/v1/threat-modeling output).
    -- Named `redteam_datasets` (not `datasets`) because the apiaas schema already
    -- has an unrelated public.datasets table from the legacy red-teaming flow.
    -- ============================================================================
    CREATE TABLE IF NOT EXISTS public.redteam_datasets (
        id              UUID PRIMARY KEY,
        tenant_id       UUID NOT NULL,
        run_id          UUID REFERENCES public.runs(id),
        name            TEXT NOT NULL,
        prompt_count    INT NOT NULL DEFAULT 0,
        coverage        JSONB,
        blob_path       TEXT,
        created_at      TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    -- Look up by (tenant, name) - generation_config.dataset_name resolves here.
    CREATE UNIQUE INDEX IF NOT EXISTS uq_redteam_datasets_tenant_name
        ON public.redteam_datasets (tenant_id, name);

    -- Find the dataset produced by a specific run (1:1 currently, indexed in case
    -- future endpoints emit multiple datasets per run).
    CREATE INDEX IF NOT EXISTS idx_redteam_datasets_run
        ON public.redteam_datasets (run_id);

    -- ============================================================================
    -- Tenant RLS (from 0005_tenant_rls)
    -- The migration runner / service-role connections BYPASS RLS by default, so
    -- asyncpg writes from workers continue unchanged. The Supabase 'authenticated'
    -- role only sees rows where the JWT's tenant_id claim matches.
    -- Policies are DROPped before being recreated so re-running applies cleanly.
    -- ============================================================================

    -- The 'authenticated' role ships with Supabase. Create it on a standalone PG
    -- (e.g. a postgres-operator dev cluster without supabase auth installed) so
    -- this migration applies identically across environments.
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
            CREATE ROLE authenticated NOLOGIN NOINHERIT;
        END IF;
    END
    $$;

    -- Helper: extract tenant_id from the active Supabase JWT.
    -- Returns NULL for service-role / superuser connections (which bypass RLS).
    CREATE OR REPLACE FUNCTION public.auth_tenant_id() RETURNS UUID
    LANGUAGE sql STABLE AS $$
        SELECT NULLIF(
            (current_setting('request.jwt.claims', true)::jsonb)->>'tenant_id',
            ''
        )::uuid;
    $$;

    ALTER TABLE public.programs ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS programs_tenant_isolation ON public.programs;
    CREATE POLICY programs_tenant_isolation ON public.programs
        FOR ALL
        TO authenticated
        USING      (tenant_id = public.auth_tenant_id())
        WITH CHECK (tenant_id = public.auth_tenant_id());

    ALTER TABLE public.runs ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS runs_tenant_isolation ON public.runs;
    CREATE POLICY runs_tenant_isolation ON public.runs
        FOR ALL
        TO authenticated
        USING      (tenant_id = public.auth_tenant_id())
        WITH CHECK (tenant_id = public.auth_tenant_id());

    ALTER TABLE public.test_statuses ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS test_statuses_tenant_isolation ON public.test_statuses;
    CREATE POLICY test_statuses_tenant_isolation ON public.test_statuses
        FOR ALL
        TO authenticated
        USING (
            run_id IN (SELECT id FROM public.runs WHERE tenant_id = public.auth_tenant_id())
        )
        WITH CHECK (
            run_id IN (SELECT id FROM public.runs WHERE tenant_id = public.auth_tenant_id())
        );

    ALTER TABLE public.records ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS records_tenant_isolation ON public.records;
    CREATE POLICY records_tenant_isolation ON public.records
        FOR ALL
        TO authenticated
        USING (
            run_id IN (SELECT id FROM public.runs WHERE tenant_id = public.auth_tenant_id())
        )
        WITH CHECK (
            run_id IN (SELECT id FROM public.runs WHERE tenant_id = public.auth_tenant_id())
        );

    ALTER TABLE public.run_coverage ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS run_coverage_tenant_isolation ON public.run_coverage;
    CREATE POLICY run_coverage_tenant_isolation ON public.run_coverage
        FOR ALL
        TO authenticated
        USING (
            run_id IN (SELECT id FROM public.runs WHERE tenant_id = public.auth_tenant_id())
        )
        WITH CHECK (
            run_id IN (SELECT id FROM public.runs WHERE tenant_id = public.auth_tenant_id())
        );

    ALTER TABLE public.redteam_datasets ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS redteam_datasets_tenant_isolation ON public.redteam_datasets;
    CREATE POLICY redteam_datasets_tenant_isolation ON public.redteam_datasets
        FOR ALL
        TO authenticated
        USING      (tenant_id = public.auth_tenant_id())
        WITH CHECK (tenant_id = public.auth_tenant_id());

    -- ============================================================================
    -- Verify
    -- ============================================================================
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'programs') THEN
            RAISE EXCEPTION 'FAILED: programs was not created';
        END IF;
        IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'runs') THEN
            RAISE EXCEPTION 'FAILED: runs was not created';
        END IF;
        IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'test_statuses') THEN
            RAISE EXCEPTION 'FAILED: test_statuses was not created';
        END IF;
        IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'records') THEN
            RAISE EXCEPTION 'FAILED: records was not created';
        END IF;
        IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'run_coverage') THEN
            RAISE EXCEPTION 'FAILED: run_coverage was not created';
        END IF;
        IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'redteam_datasets') THEN
            RAISE EXCEPTION 'FAILED: redteam_datasets was not created';
        END IF;
        IF NOT EXISTS (
            SELECT 1 FROM pg_proc p
            JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE n.nspname = 'public' AND p.proname = 'auth_tenant_id'
        ) THEN
            RAISE EXCEPTION 'FAILED: auth_tenant_id() function was not created';
        END IF;
        RAISE NOTICE 'SUCCESS: V4 substrate + evolutions applied (programs, runs, test_statuses, records, run_coverage, redteam_datasets, tenant RLS).';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --
  030-rtv2-relay-runs-status-and-requests.sql: |
    --
    -- Migration: 015_rtv2_relay_runs_status_and_requests
    -- Description: Relay schema additions for the in-pod relay path (sentry-redteam
    --              rtv2). Consolidates the two in-tree migrations 0008 and 0009 from
    --                src/sentry-redteam/sentry/redteam/storage/migrations/
    --              into a single forward step. Two pieces:
    --
    --                1. runs.relay_status / runs.relay_status_at - surface customer-
    --                   agent connectivity per run when connect_via_relay=true. NULL
    --                   for runs that do not opt in.
    --
    --                2. relay_requests - durable per-call log keyed by a deterministic
    --                   5-tuple (tenant_id, user_id, agent_id, job_id,
    --                   client_request_id) so retries / resumes idempotently hit the
    --                   same row instead of double-billing the customer's LLM.
    --                   Lifecycle: pending -> finished | failed; 'finished' rows
    --                   short-circuit subsequent calls with the same key.
    --
    --              Both pieces are gated on the application's connect_via_relay flag
    --              - runs that do not opt in never write to these columns or this
    --              table. Forward-only and additive.
    --
    -- Requires:    Migration 014 (runs table must exist).
    -- Identical for dev and prod (only the psql host/path below differ).
    -- psql -h localhost -U postgres -d postgres -f database/dev/public/migrations/015_rtv2_relay_runs_status_and_requests.sql
    --

    BEGIN;

    -- ============================================================================
    -- runs.relay_status / runs.relay_status_at
    -- Run-level snapshot of the relay transport's view of the customer agent. The
    -- UI / API can show 'Paused' instead of looking frozen while the relay is
    -- inside its offline grace-wait.
    -- ============================================================================
    ALTER TABLE public.runs
        ADD COLUMN IF NOT EXISTS relay_status    TEXT,
        ADD COLUMN IF NOT EXISTS relay_status_at TIMESTAMPTZ;

    COMMENT ON COLUMN public.runs.relay_status IS
        'Relay transport status for runs with connect_via_relay=true: Running | Paused | AgentOffline. NULL when relay is not in use.';

    COMMENT ON COLUMN public.runs.relay_status_at IS
        'Timestamp of the last relay_status write. NULL when relay is not in use.';

    -- ============================================================================
    -- relay_requests
    -- Durable per-call log + idempotency cache for the relay transport. Workers
    -- write one row per logical LLM call routed through the relay. The 5-tuple
    -- UNIQUE makes the row deterministic across retries / restarts.
    -- ============================================================================
    CREATE TABLE IF NOT EXISTS public.relay_requests (
        id                   UUID PRIMARY KEY DEFAULT gen_random_uuid(),

        -- Durable 5-tuple key. tenant_id / user_id / job_id default to '' so
        -- single-tenant or ad-hoc-test callers don't need to coordinate these.
        tenant_id            TEXT NOT NULL DEFAULT '',
        user_id              TEXT NOT NULL DEFAULT '',
        agent_id             TEXT NOT NULL,
        job_id               TEXT NOT NULL DEFAULT '',
        client_request_id    TEXT NOT NULL,

        status               TEXT NOT NULL CHECK (status IN ('pending','finished','failed')),

        -- Request snapshot (for forensics / replay).
        method               TEXT,
        target_url           TEXT,
        request_body         TEXT,
        timeout_s            REAL,

        -- Response snapshot (populated when status='finished').
        response_status_code INT,
        response_headers     JSONB,
        response_body        TEXT,
        error                TEXT,
        request_id           TEXT,

        created_at           TIMESTAMPTZ NOT NULL DEFAULT now(),
        started_at           TIMESTAMPTZ,
        finished_at          TIMESTAMPTZ,

        CONSTRAINT relay_requests_unique_key
            UNIQUE (tenant_id, user_id, agent_id, job_id, client_request_id)
    );

    -- Read path: "show me the most recent relay calls for tenant X, agent Y".
    CREATE INDEX IF NOT EXISTS idx_relay_requests_tenant_agent
        ON public.relay_requests (tenant_id, agent_id, created_at DESC);

    -- Pause/stuck detection: "any rows stuck in pending for too long?".
    CREATE INDEX IF NOT EXISTS idx_relay_requests_pending
        ON public.relay_requests (created_at)
        WHERE status = 'pending';

    -- ============================================================================
    -- RLS
    -- relay_requests is a service-role-only table (workers + ops queries only -
    -- never exposed to authenticated tenant traffic). Deny-all policy on the
    -- 'authenticated' role; the service_role backend (which bypasses RLS) still
    -- reads and writes normally. Same pattern as migration 011_lockdown_rls_no_policy
    -- applied to other internal tables.
    -- ============================================================================
    ALTER TABLE public.relay_requests ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS deny_all_relay_requests ON public.relay_requests;
    CREATE POLICY deny_all_relay_requests ON public.relay_requests
        FOR ALL
        TO authenticated
        USING      (false)
        WITH CHECK (false);

    -- ============================================================================
    -- Verify
    -- ============================================================================
    DO $$
    BEGIN
        IF NOT EXISTS (
            SELECT 1 FROM information_schema.columns
            WHERE table_schema = 'public' AND table_name = 'runs'
              AND column_name = 'relay_status'
        ) THEN
            RAISE EXCEPTION 'FAILED: runs.relay_status column was not added';
        END IF;

        IF NOT EXISTS (
            SELECT 1 FROM information_schema.columns
            WHERE table_schema = 'public' AND table_name = 'runs'
              AND column_name = 'relay_status_at'
        ) THEN
            RAISE EXCEPTION 'FAILED: runs.relay_status_at column was not added';
        END IF;

        IF NOT EXISTS (
            SELECT 1 FROM information_schema.tables
            WHERE table_schema = 'public' AND table_name = 'relay_requests'
        ) THEN
            RAISE EXCEPTION 'FAILED: relay_requests table was not created';
        END IF;

        IF NOT EXISTS (
            SELECT 1 FROM information_schema.table_constraints
            WHERE table_schema = 'public' AND table_name = 'relay_requests'
              AND constraint_name = 'relay_requests_unique_key'
        ) THEN
            RAISE EXCEPTION 'FAILED: relay_requests 5-tuple unique constraint missing';
        END IF;

        IF NOT EXISTS (
            SELECT 1 FROM pg_policy p
            JOIN pg_class c ON c.oid = p.polrelid
            JOIN pg_namespace ns ON ns.oid = c.relnamespace
            WHERE ns.nspname = 'public' AND c.relname = 'relay_requests'
              AND p.polname = 'deny_all_relay_requests'
        ) THEN
            RAISE EXCEPTION 'FAILED: deny-all RLS policy on relay_requests was not created';
        END IF;

        RAISE NOTICE 'SUCCESS: runs.relay_status / relay_status_at added; relay_requests table + idempotency key + RLS lockdown applied.';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --

  031-rtv2-records-source-add-attack.sql: |
    --
    -- Migration: 016_rtv2_records_source_add_attack
    -- Description: Add 'attack' to the records.source CHECK constraint.
    --
    --              The rtv2 attack pillar (sentry-redteam
    --              coordinator/worker_handlers.attack_handler) persists each
    --              attack-produced trace as a records row with source='attack'.
    --              Key 029 created records_source_check without 'attack', so
    --              every attack-cell persistence failed with a check_violation
    --              and runs never reached 'completed'. Forward-only, idempotent.
    --
    -- Requires:    key 029 (records table + records_source_check must exist).
    --
    BEGIN;

    ALTER TABLE public.records DROP CONSTRAINT IF EXISTS records_source_check;
    ALTER TABLE public.records
        ADD CONSTRAINT records_source_check
        CHECK (source IN ('static', 'custom_generated', 'custom_dataset', 'eval', 'attack'));

    DO $$
    BEGIN
        IF NOT EXISTS (
            SELECT 1 FROM pg_constraint
            WHERE conname = 'records_source_check'
              AND pg_get_constraintdef(oid) LIKE '%attack%'
        ) THEN
            RAISE EXCEPTION 'FAILED: records_source_check does not allow source=attack';
        END IF;

        RAISE NOTICE 'SUCCESS: records.source CHECK now allows attack.';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --

  032-add-credit-metering.sql: |
    --
    -- Migration: 017_add_credit_metering
    -- Description: Credit-based metering for Guardrails (GR) and Red Team (RT),
    --              deployed side-by-side with the existing request-count metering.
    --              Adds per-subscription credit balances + a per-family metering
    --              mode flag (NULL = inherit credits_config.enforcement.default_mode;
    --              'requests' keeps legacy behavior, 'shadow' accounts without
    --              gating, 'credits' enforces), plus an RLS-locked GR audit ledger:
    --                * gr_credit_usage  — append-only audit for GR trueup deltas and
    --                  sampled access-mode rows (observability/dispute only).
    --              (rev-5 / M6: RT credits are metered in Kong against the KeyDB usage
    --              hash — there is NO rt_credit_usage reservation ledger; rt_credits_used
    --              is the flat balance, debited in KeyDB and flushed to Postgres.)
    --              Legacy columns (guardrails_request_limit / guardrails_requests_used
    --              / red_team_usage_remaining) are intentionally NOT touched: the
    --              legacy counters keep running in every mode, which IS the rollback
    --              story (DESIGN.md §5.0 invariant #2).
    --              Numbered 017 — 014/015/016 are claimed by the in-flight rtv2
    --              branch (apiaas feat/rtv2-schema-and-relay) so this stays
    --              collision-free regardless of merge order; gaps are harmless.
    --              RLS-locked like every other public business table (service_role
    --              backend only); see migrations 011/012.
    --              Identical for dev and prod (only the psql host/path below differ).
    -- psql -h localhost -U postgres -d postgres -f database/dev/public/migrations/017_add_credit_metering.sql
    --

    BEGIN;

    -- ============================================================================
    -- Part 1: subscription — additive credit-metering columns
    -- Every new column is nullable or defaulted so existing rows stay valid. NOTHING
    -- here alters the legacy request-metering columns (invariant #2 / rollback).
    -- ============================================================================

    ALTER TABLE public.subscription
        ADD COLUMN gr_metering_mode text,
        ADD COLUMN rt_metering_mode text,
        ADD COLUMN gr_credits_limit integer,
        ADD COLUMN gr_credits_used integer DEFAULT 0 NOT NULL,
        ADD COLUMN rt_credits_limit integer,
        ADD COLUMN rt_credits_used integer DEFAULT 0 NOT NULL,
        ADD COLUMN rt_credits_reset_at timestamp with time zone,
        ADD COLUMN old_gr_credits_limit integer,
        ADD COLUMN old_gr_credits_used integer;

    -- Per-family metering mode. NULL = inherit the global default_mode; an explicit
    -- value overrides for a single account (the per-org pilot switch). CHECK passes
    -- on NULL, so unset columns are valid.
    ALTER TABLE public.subscription
        ADD CONSTRAINT subscription_gr_metering_mode_check
            CHECK (gr_metering_mode IN ('requests', 'shadow', 'credits')),
        ADD CONSTRAINT subscription_rt_metering_mode_check
            CHECK (rt_metering_mode IN ('requests', 'shadow', 'credits'));

    COMMENT ON COLUMN public.subscription.gr_metering_mode IS 'Guardrails metering mode: requests|shadow|credits. NULL = inherit credits_config.enforcement.default_mode. Only the Kong access-phase gate branches on this; accounting is mode-independent (DESIGN.md §5.0 invariant #1).';
    COMMENT ON COLUMN public.subscription.rt_metering_mode IS 'Red Team metering mode: requests|shadow|credits. NULL = inherit default_mode. See gr_metering_mode.';
    COMMENT ON COLUMN public.subscription.gr_credits_limit IS 'GR credit allowance for the current window. -1 = gate-only (unlimited but still tracked). NULL = not yet provisioned (inherit plan grant).';
    COMMENT ON COLUMN public.subscription.gr_credits_used IS 'GR credits consumed in the current window; reconciled from KeyDB HINCRBY counters via PATCH (GREATEST-within-window). Window staleness is keyed on the EXISTING guardrails_usage_updated_at (GR requests and GR credits share one GR window and flush together) — there is no separate GR credit marker. Legacy guardrails_requests_used keeps running in parallel.';
    COMMENT ON COLUMN public.subscription.rt_credits_limit IS 'RT credit allowance for the current window. -1 = gate-only. NULL = inherit plan grant.';
    COMMENT ON COLUMN public.subscription.rt_credits_used IS 'RT credits debited in the current window. rev-5 (M6): Kong debits this in the KeyDB usage hash (the gating authority) and flushes it here on a 500-credit boundary crossing (GREATEST-within-window durability mirror). Reset to 0 on a credits flip (rt_credits_reset_at marks the window).';
    COMMENT ON COLUMN public.subscription.rt_credits_reset_at IS 'RT credit window epoch. Set to now() by the flip route on a flip to shadow/credits and by the Stripe webhook on a plan change/cancel — marks a fresh RT credit window (rt_credits_used re-seeded to 0). NULL = no explicit reset (anniversary window governs).';
    COMMENT ON COLUMN public.subscription.old_gr_credits_limit IS 'Previous-window GR credit limit, retained on downgrade so a higher old allowance can stay active until old_plan_expires_at (mirrors old_guardrails_request_limit).';
    COMMENT ON COLUMN public.subscription.old_gr_credits_used IS 'GR credits used under the previous plan window (mirrors old_guardrails_requests_used).';

    -- ============================================================================
    -- Part 2: gr_credit_usage  (audit — trueup deltas + sampled rows only)
    -- Append-only. NOT the balance authority (subscription holds the balance); this
    -- captures trueup reconciliation deltas and a sampled fraction of access-mode
    -- calls for observability/dispute resolution. Never blocks metering.
    -- ============================================================================

    CREATE TABLE public.gr_credit_usage (
        id bigint NOT NULL,
        org_id uuid NOT NULL,
        user_id text,
        project_name text,
        endpoint text,
        request_id text,
        billing_mode text,
        reserved_credits integer,
        final_credits integer,
        delta_credits integer,
        sampled boolean DEFAULT false NOT NULL,
        response_status integer,
        created_at timestamp with time zone DEFAULT now() NOT NULL
    );

    COMMENT ON TABLE public.gr_credit_usage IS 'Append-only GR credit audit log: trueup reconciliation deltas (reserved vs final, e.g. scan-url/scan-pdf) plus a sampled fraction of access-mode calls (credits_config default_sample_percentage). Audit/observability only — subscription.gr_credits_used is the balance authority. Written best-effort by Kong (enkrypt-guardrails log phase) via POST /api/credits/usage.';
    COMMENT ON COLUMN public.gr_credit_usage.request_id IS 'Kong request id; UNIQUE for idempotent at-least-once delivery (NULLs are distinct, so a rare missing id still inserts and never blocks metering).';
    COMMENT ON COLUMN public.gr_credit_usage.billing_mode IS 'Pricing pipeline that produced the charge: access | flat | trueup.';
    COMMENT ON COLUMN public.gr_credit_usage.reserved_credits IS 'Credits reserved at access time (trueup only); NULL for pure access/flat.';
    COMMENT ON COLUMN public.gr_credit_usage.final_credits IS 'Final credits charged for the call.';
    COMMENT ON COLUMN public.gr_credit_usage.delta_credits IS 'Trueup settlement delta = final - reserved (capped per credits_config); NULL for non-trueup.';
    COMMENT ON COLUMN public.gr_credit_usage.sampled IS 'TRUE if this row was written by access-mode sampling rather than a trueup reconciliation.';

    ALTER TABLE public.gr_credit_usage ALTER COLUMN id ADD GENERATED BY DEFAULT AS IDENTITY (
        SEQUENCE NAME public.gr_credit_usage_id_seq
        START WITH 1
        INCREMENT BY 1
        NO MINVALUE
        NO MAXVALUE
        CACHE 1
    );

    ALTER TABLE ONLY public.gr_credit_usage
        ADD CONSTRAINT gr_credit_usage_pkey PRIMARY KEY (id);

    -- Idempotency key: one row per Kong request. NULLs are distinct, so a rare
    -- missing request_id still inserts (never blocks metering).
    ALTER TABLE ONLY public.gr_credit_usage
        ADD CONSTRAINT gr_credit_usage_request_id_key UNIQUE (request_id);

    ALTER TABLE public.gr_credit_usage ENABLE ROW LEVEL SECURITY;

    CREATE POLICY deny_all_gr_credit_usage
        ON public.gr_credit_usage
        AS RESTRICTIVE FOR ALL TO anon, authenticated
        USING (false) WITH CHECK (false);

    CREATE INDEX idx_gr_credit_usage_org_created
        ON public.gr_credit_usage (org_id, created_at);

    CREATE INDEX idx_gr_credit_usage_created
        ON public.gr_credit_usage (created_at);

    -- ============================================================================
    -- Verify the schema changes
    -- ============================================================================

    DO $$
    BEGIN
      -- subscription columns
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'subscription'
          AND column_name = 'gr_metering_mode'
      ) THEN
        RAISE EXCEPTION 'FAILED: subscription.gr_metering_mode was not added';
      END IF;

      -- mode CHECK constraint present
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.table_constraints
        WHERE table_schema = 'public' AND table_name = 'subscription'
          AND constraint_name = 'subscription_rt_metering_mode_check'
      ) THEN
        RAISE EXCEPTION 'FAILED: subscription rt_metering_mode CHECK was not added';
      END IF;

      -- gr_credit_usage table + RLS
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.tables
        WHERE table_schema = 'public' AND table_name = 'gr_credit_usage'
      ) THEN
        RAISE EXCEPTION 'FAILED: gr_credit_usage table was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_policy p
        JOIN pg_class c ON c.oid = p.polrelid
        JOIN pg_namespace ns ON ns.oid = c.relnamespace
        WHERE ns.nspname = 'public' AND c.relname = 'gr_credit_usage'
          AND p.polname = 'deny_all_gr_credit_usage'
      ) THEN
        RAISE EXCEPTION 'FAILED: deny-all RLS policy on gr_credit_usage was not created';
      END IF;

      RAISE NOTICE 'SUCCESS: credit-metering schema (subscription columns + gr_credit_usage) created and locked down';
    END $$;

    COMMIT;

    --
    -- Rollback (manual; run inside a transaction if the feature is retired):
    --   BEGIN;
    --   DROP TABLE IF EXISTS public.gr_credit_usage;
    --   ALTER TABLE public.subscription
    --     DROP CONSTRAINT IF EXISTS subscription_gr_metering_mode_check,
    --     DROP CONSTRAINT IF EXISTS subscription_rt_metering_mode_check,
    --     DROP COLUMN IF EXISTS gr_metering_mode,
    --     DROP COLUMN IF EXISTS rt_metering_mode,
    --     DROP COLUMN IF EXISTS gr_credits_limit,
    --     DROP COLUMN IF EXISTS gr_credits_used,
    --     DROP COLUMN IF EXISTS rt_credits_limit,
    --     DROP COLUMN IF EXISTS rt_credits_used,
    --     DROP COLUMN IF EXISTS rt_credits_reset_at,
    --     DROP COLUMN IF EXISTS old_gr_credits_limit,
    --     DROP COLUMN IF EXISTS old_gr_credits_used;
    --   COMMIT;
    -- Dropping columns discards accumulated credit balances. Because the legacy
    -- request counters never stopped (invariant #2), request-mode billing is
    -- unaffected by this rollback.
    --
    -- Migration Complete
    --

  033-project-credit-limits.sql: |
    --
    -- Migration: 018_project_credit_limits
    -- Description: Per-project credit limits, layered on top of the org credit
    --              metering added in 017. Adds per-project credit balances + optional
    --              per-project limits to public.projects (keyed (id = org_id, name =
    --              project_name)):
    --                * gr_credits_used / rt_credits_used  — durability mirror of the
    --                  per-project KeyDB usage hash (guardrails_usage|org_id:<org>|
    --                  project:<name>), reconciled by Kong via the existing GR/RT
    --                  usage flushes (GREATEST-within-window). KeyDB is the authority.
    --                * gr_credits_limit / rt_credits_limit — OPTIONAL per-project
    --                  allowance. NULL = no project limit (usage still tracked). In
    --                  credits mode the limit is ENFORCED: a project over its own
    --                  limit is 402-blocked even while the org still has credits
    --                  (limits may over-allocate; the org gate still caps the total).
    --                  No -1 semantics (unlike the org columns): "no limit" is NULL.
    --              Additive only — every column is nullable or defaulted so existing
    --              rows stay valid. Legacy projects.guardrails_req_used and all 017
    --              columns are intentionally untouched (invariant #2 / rollback).
    --              Numbered 018 — the next free slot after 017 on this branch
    --              (014/015/016 are claimed by the in-flight rtv2 branch).
    --              projects has no RLS policy of its own here (it inherits the table's
    --              existing lockdown); this migration only adds columns.
    --              Identical for dev and prod (only the psql host/path below differ).
    -- psql -h localhost -U postgres -d postgres -f database/dev/public/migrations/018_project_credit_limits.sql
    --

    BEGIN;

    -- ============================================================================
    -- projects — additive per-project credit columns
    -- ============================================================================

    ALTER TABLE public.projects
        ADD COLUMN gr_credits_used  bigint  DEFAULT 0 NOT NULL,
        ADD COLUMN gr_credits_limit integer,
        ADD COLUMN rt_credits_used  bigint  DEFAULT 0 NOT NULL,
        ADD COLUMN rt_credits_limit integer;

    COMMENT ON COLUMN public.projects.gr_credits_used IS 'Per-project GR credits consumed; durability mirror of the per-project KeyDB usage hash, reconciled from Kong HINCRBY counters via PATCH /api/users/<org>/guardrails/usage (GREATEST-within-window). KeyDB is the runtime authority.';
    COMMENT ON COLUMN public.projects.gr_credits_limit IS 'Optional per-project GR credit allowance. NULL = no project limit (usage still tracked). Enforced in credits mode: a project over its own limit is 402-blocked even while the org still has credits. No -1 semantics — "no limit" is NULL.';
    COMMENT ON COLUMN public.projects.rt_credits_used IS 'Per-project RT credits consumed; durability mirror of the per-project KeyDB usage hash, reconciled via PATCH /api/users/<org>/redteam/credits (GREATEST-within-window). KeyDB is the runtime authority.';
    COMMENT ON COLUMN public.projects.rt_credits_limit IS 'Optional per-project RT credit allowance. NULL = no project limit. Enforced in credits mode — see gr_credits_limit.';

    -- ============================================================================
    -- Verify the schema changes
    -- ============================================================================

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'projects'
          AND column_name = 'gr_credits_limit'
      ) THEN
        RAISE EXCEPTION 'FAILED: projects.gr_credits_limit was not added';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'projects'
          AND column_name = 'rt_credits_used'
      ) THEN
        RAISE EXCEPTION 'FAILED: projects.rt_credits_used was not added';
      END IF;

      RAISE NOTICE 'SUCCESS: per-project credit columns added to public.projects';
    END $$;

    COMMIT;

    --
    -- Rollback (manual; run inside a transaction if the feature is retired):
    --   BEGIN;
    --   ALTER TABLE public.projects
    --     DROP COLUMN IF EXISTS gr_credits_used,
    --     DROP COLUMN IF EXISTS gr_credits_limit,
    --     DROP COLUMN IF EXISTS rt_credits_used,
    --     DROP COLUMN IF EXISTS rt_credits_limit;
    --   COMMIT;
    -- Dropping these columns discards the per-project credit mirror/limits only. Org
    -- credit balances (017) and the legacy request counters (invariant #2) are
    -- unaffected, so billing continues unchanged.
    --
    -- Migration Complete
    --

  034-user-metadata.sql: |
    --
    -- Migration: 019_user_metadata
    -- Description: Optional client-supplied user_metadata for redteam job APIs.
    --              Adds a single nullable `user_metadata jsonb` column (no default)
    --              to the three job tables that back the redteam/datasets/alignment
    --              job-detail APIs:
    --                * public.red_teaming   — redteam jobs
    --                * public.datasets      — dataset-generation jobs
    --                * public.alignment_task — alignment-task jobs
    --                * public.runs          — rtv2 jobs (only when the table exists)
    --              The runs table is created by the rtv2 substrate migration (014,
    --              tracked on the feat/rtv2-schema-and-relay branch) and may not
    --              exist on every database yet — hence ALTER TABLE IF EXISTS: a
    --              no-op where runs is absent (e.g. prod today). Fresh substrates
    --              need no re-run of this file because the feat/rtv2-schema-and-relay
    --              copy of 014 creates runs WITH user_metadata from the start.
    --              The column is an arbitrary JSON object supplied by the API caller
    --              at job-creation time and echoed back verbatim on job-detail /
    --              job-list reads. It is opaque to this schema — no shape is
    --              enforced in the database. Size/shape limits (<=16 top-level
    --              keys, key <=64 chars, depth <=3, <=4KB serialized) are enforced
    --              at the API layer, not here.
    --              Additive only — the column is nullable with no default, so every
    --              existing row remains valid and no backfill is required. No other
    --              columns on these tables are touched.
    --              Numbered 019 — the next free slot after 018 on this branch.
    --              None of the three tables have an RLS policy of their own here
    --              (they inherit the existing lockdown); this migration only adds
    --              columns.
    --              Identical for dev and prod (only the psql host/path below differ).
    -- psql -h localhost -U postgres -d postgres -f database/dev/public/migrations/019_user_metadata.sql
    --

    BEGIN;

    -- ============================================================================
    -- red_teaming — additive user_metadata column
    -- ============================================================================

    ALTER TABLE public.red_teaming
        ADD COLUMN IF NOT EXISTS user_metadata jsonb;

    COMMENT ON COLUMN public.red_teaming.user_metadata IS 'Arbitrary client-supplied metadata echoed by the API (limits enforced at API layer: <=16 top-level keys, key <=64 chars, depth <=3, <=4KB serialized).';

    -- ============================================================================
    -- datasets — additive user_metadata column
    -- ============================================================================

    ALTER TABLE public.datasets
        ADD COLUMN IF NOT EXISTS user_metadata jsonb;

    COMMENT ON COLUMN public.datasets.user_metadata IS 'Arbitrary client-supplied metadata echoed by the API (limits enforced at API layer: <=16 top-level keys, key <=64 chars, depth <=3, <=4KB serialized).';

    -- ============================================================================
    -- alignment_task — additive user_metadata column
    -- ============================================================================

    ALTER TABLE public.alignment_task
        ADD COLUMN IF NOT EXISTS user_metadata jsonb;

    COMMENT ON COLUMN public.alignment_task.user_metadata IS 'Arbitrary client-supplied metadata echoed by the API (limits enforced at API layer: <=16 top-level keys, key <=64 chars, depth <=3, <=4KB serialized).';

    -- ============================================================================
    -- runs (rtv2) — additive user_metadata column, only where the table exists
    -- ============================================================================

    ALTER TABLE IF EXISTS public.runs
        ADD COLUMN IF NOT EXISTS user_metadata jsonb;

    DO $$
    BEGIN
      IF EXISTS (
        SELECT 1 FROM information_schema.tables
        WHERE table_schema = 'public' AND table_name = 'runs'
      ) THEN
        COMMENT ON COLUMN public.runs.user_metadata IS 'Arbitrary client-supplied metadata echoed by the API (limits enforced at API layer: <=16 top-level keys, key <=64 chars, depth <=3, <=4KB serialized).';
      END IF;
    END $$;

    -- ============================================================================
    -- Verify the schema changes
    -- ============================================================================

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'red_teaming'
          AND column_name = 'user_metadata'
      ) THEN
        RAISE EXCEPTION 'FAILED: red_teaming.user_metadata was not added';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'datasets'
          AND column_name = 'user_metadata'
      ) THEN
        RAISE EXCEPTION 'FAILED: datasets.user_metadata was not added';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'alignment_task'
          AND column_name = 'user_metadata'
      ) THEN
        RAISE EXCEPTION 'FAILED: alignment_task.user_metadata was not added';
      END IF;

      -- runs is optional: only verify the column when the rtv2 substrate exists.
      IF EXISTS (
        SELECT 1 FROM information_schema.tables
        WHERE table_schema = 'public' AND table_name = 'runs'
      ) THEN
        IF NOT EXISTS (
          SELECT 1 FROM information_schema.columns
          WHERE table_schema = 'public' AND table_name = 'runs'
            AND column_name = 'user_metadata'
        ) THEN
          RAISE EXCEPTION 'FAILED: runs.user_metadata was not added';
        END IF;
        RAISE NOTICE 'SUCCESS: user_metadata added to red_teaming, datasets, alignment_task, runs';
      ELSE
        RAISE NOTICE 'SUCCESS: user_metadata added to red_teaming, datasets, alignment_task (runs absent - skipped)';
      END IF;
    END $$;

    COMMIT;

    --
    -- Rollback (manual; run inside a transaction if the feature is retired):
    --   BEGIN;
    --   ALTER TABLE public.red_teaming DROP COLUMN IF EXISTS user_metadata;
    --   ALTER TABLE public.datasets DROP COLUMN IF EXISTS user_metadata;
    --   ALTER TABLE public.alignment_task DROP COLUMN IF EXISTS user_metadata;
    --   ALTER TABLE IF EXISTS public.runs DROP COLUMN IF EXISTS user_metadata;
    --   COMMIT;
    -- Dropping these columns discards any client-supplied metadata stored against
    -- existing jobs. No other columns or tables are affected.
    --
    -- Migration Complete
    --

  035-code-of-conduct-v2.sql: |
    --
    -- Migration: 020_code_of_conduct_v2
    -- Description: Adds the v2 (Policy Wizard) storage columns to
    --              public.code_of_conduct, alongside the existing v1 (Policy
    --              Atomizer) columns (pdf_name, policy_rules, policy_text,
    --              total_rules), which are untouched and remain in use for
    --              backward compatibility.
    --
    --              * v2_questionnaire jsonb — the WizardProfile object sent as
    --                the `questionnaire` input to POST /guardrails/policy-wizard/
    --                generate-rules (purpose, prohibited_actions, user_types,
    --                data_access, actions, decision_impact).
    --              * v2_config jsonb — the full generate-rules response verbatim
    --                (status, enabled, disabled, stats, processing_time). Kept
    --                whole (not just `enabled`) so the disabled/suggested
    --                catalog rules and stats survive for later review, not just
    --                the enforced rule set.
    --              * is_v2 boolean NOT NULL DEFAULT false — set automatically by
    --                the enkrypt-db-proxy Kong plugin from the request's
    --                Content-Type (application/json => v2, multipart/form-data
    --                => legacy v1) on add-policy/modify-policy; callers never
    --                pass it themselves. false for every existing row.
    --
    --              Additive only — all three columns are nullable (is_v2 has a
    --              default), so every existing row remains valid and no backfill
    --              is required. No other columns or tables are touched.
    --              Numbered 020 — the next free slot after 019 on this branch.
    --              Identical for dev and prod (only the psql host/path below differ).
    -- psql -h localhost -U postgres -d postgres -f database/dev/public/migrations/020_code_of_conduct_v2.sql
    --

    BEGIN;

    -- ============================================================================
    -- code_of_conduct — additive v2 (Policy Wizard) columns
    -- ============================================================================

    ALTER TABLE public.code_of_conduct
        ADD COLUMN IF NOT EXISTS v2_questionnaire jsonb;

    ALTER TABLE public.code_of_conduct
        ADD COLUMN IF NOT EXISTS v2_config jsonb;

    ALTER TABLE public.code_of_conduct
        ADD COLUMN IF NOT EXISTS is_v2 boolean DEFAULT false NOT NULL;

    COMMENT ON COLUMN public.code_of_conduct.v2_questionnaire IS 'v2 (Policy Wizard) only: the WizardProfile questionnaire sent to POST /guardrails/policy-wizard/generate-rules (purpose, prohibited_actions, user_types, data_access, actions, decision_impact). NULL for v1 (Policy Atomizer) rows.';
    COMMENT ON COLUMN public.code_of_conduct.v2_config IS 'v2 (Policy Wizard) only: the full POST /guardrails/policy-wizard/generate-rules response verbatim (status, enabled, disabled, stats, processing_time). NULL for v1 (Policy Atomizer) rows.';
    COMMENT ON COLUMN public.code_of_conduct.is_v2 IS 'true = v2 (Policy Wizard: v2_questionnaire/v2_config populated, legacy columns NULL); false = v1 (Policy Atomizer: pdf_name/policy_rules/policy_text/total_rules populated). Set automatically by the enkrypt-db-proxy Kong plugin from the add-policy/modify-policy request Content-Type - callers never pass it.';

    -- ============================================================================
    -- Verify the schema changes
    -- ============================================================================

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'code_of_conduct'
          AND column_name = 'v2_questionnaire'
      ) THEN
        RAISE EXCEPTION 'FAILED: code_of_conduct.v2_questionnaire was not added';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'code_of_conduct'
          AND column_name = 'v2_config'
      ) THEN
        RAISE EXCEPTION 'FAILED: code_of_conduct.v2_config was not added';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'code_of_conduct'
          AND column_name = 'is_v2'
      ) THEN
        RAISE EXCEPTION 'FAILED: code_of_conduct.is_v2 was not added';
      END IF;

      RAISE NOTICE 'SUCCESS: v2_questionnaire, v2_config, is_v2 added to code_of_conduct';
    END $$;

    COMMIT;

    --
    -- Rollback (manual; run inside a transaction if the feature is retired):
    --   BEGIN;
    --   ALTER TABLE public.code_of_conduct DROP COLUMN IF EXISTS v2_questionnaire;
    --   ALTER TABLE public.code_of_conduct DROP COLUMN IF EXISTS v2_config;
    --   ALTER TABLE public.code_of_conduct DROP COLUMN IF EXISTS is_v2;
    --   COMMIT;
    -- Dropping these columns discards every v2 (Policy Wizard) policy's
    -- questionnaire/config content - any row with is_v2 = true loses its only
    -- copy of that data (v1 rows are unaffected: their legacy columns are
    -- untouched by this migration and this rollback).
    --
    -- Migration Complete
    --
  036-index-datasets-red-team-results.sql: |
    --
    -- Migration: 021_index_datasets_red_team_results
    -- Description: Indexes public.datasets_red_team_results for the Attacks
    --              tab on /red-teaming/[job_id]. The v2 AttackTable queries
    --              this table with WHERE test_name = ? [AND id = ?]
    --              [AND success = ?] [AND test_type IN (...)]
    --              [AND category IN (...)] [AND attack_method IN (...)]
    --              [AND response_classification IN (...)]. The table has no
    --              indexes on any of these columns (only a foreign key on
