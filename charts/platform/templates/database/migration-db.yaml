    -- ============================================================================

    CREATE TABLE IF NOT EXISTS public.org_secrets (
        org_id              uuid PRIMARY KEY,
        openai_api_key      text,
        anthropic_api_key   text,
        mistral_api_key     text,
        google_api_key      text,
