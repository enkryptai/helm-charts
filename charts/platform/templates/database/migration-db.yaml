    COMMENT ON COLUMN public.org_secrets.openai_api_key     IS 'base64(pgp_sym_encrypt(plaintext, ENCRYPTION_PASSPHRASE)); NULL when unset/cleared.';
    COMMENT ON COLUMN public.org_secrets.anthropic_api_key  IS 'base64(pgp_sym_encrypt(plaintext, ENCRYPTION_PASSPHRASE)); NULL when unset/cleared.';
    COMMENT ON COLUMN public.org_secrets.mistral_api_key    IS 'base64(pgp_sym_encrypt(plaintext, ENCRYPTION_PASSPHRASE)); NULL when unset/cleared.';
    COMMENT ON COLUMN public.org_secrets.google_api_key     IS 'base64(pgp_sym_encrypt(plaintext, ENCRYPTION_PASSPHRASE)); NULL when unset/cleared.';
    COMMENT ON COLUMN public.org_secrets.gemini_api_key     IS 'base64(pgp_sym_encrypt(plaintext, ENCRYPTION_PASSPHRASE)); NULL when unset/cleared.';
