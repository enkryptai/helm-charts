  037-rtv2-pillar-tables.sql: |
    --
    -- Migration: 022_rtv2_pillar_tables
    -- Description: The rtv2 pillar tables — one control table + one data table per
    --              pillar. Ports sentry-redteam `rtv2` branch
    --                src/sentry-redteam/sentry/redteam/storage/migrations_v2/0002_pillar_tables.sql
    --              into apiaas, which is now the canonical home for all rtv2 DDL.
    --
    --              WHY THIS EXISTS: keys 040-043 already create indexes and
    --              RPCs ON public.redteam_v2_data, but nothing in apiaas ever
    --              created that table. A database built from this folder in order
    --              died at key 040's first CREATE INDEX. The tables reached dev only by
    --              someone hand-pasting sentry's `_bootstrap_hosted.sql` into the
    --              Supabase SQL editor. This migration closes that hole so the
    --              folder is self-sufficient.
    --
    --              Tables created: threat_modeling, threat_modeling_data,
    --                              redteam_v2, redteam_v2_data, eval, eval_data
    --              Table extended: playground (see the collision note below)
    --
    --              NOT ported from sentry's 0002/_bootstrap_hosted:
    --                * `datasets` — sentry rtv2 has no code reference to a datasets
    --                  TABLE any more (only a blob container via
    --                  DEFAULT_STORAGE_CONTAINER_DATASETS); threat-modeling output
    --                  moved to threat_modeling/threat_modeling_data. Its DDL is
    --                  dead leftover from the older generation, and it collides with
    --                  the legacy public.datasets that the app actively reads from
    --                  six call sites. Deliberately omitted.
    --                * `0001_foundation` — profiles / subscription / projects /
    --                  api_keys / project_api_keys / project_consumers already exist
    --                  in apiaas with the authoritative shapes. Sentry's versions
    --                  are a fresh-standalone-DB convenience and must NOT be applied
    --                  here.
    --
    -- ============================================================================
    -- THE playground COLLISION — read before changing anything below
    -- ============================================================================
    -- public.playground is claimed twice:
    --   * key 018 — legacy playground job tracking. PK job_id,
    --     `id text` (the USER id), plus status/goal/model_name/location/
    --     started_at/ended_at/"error.json".
    --   * sentry 0002_pillar_tables.sql:207 — the rtv2 playground pillar. PK
    --     job_id (same), `id UUID REFERENCES subscription(id)`, plus project_name/
    --     config/context/attacks/results/duration_seconds/error/user_metadata/...
    --
    -- Sentry writes this table live over PostgREST — storage/pillars.py:190
    -- (.insert), pillars.py:234 (.update .eq job_id) and runner/playground.py:130.
    -- Those payloads carry project_name/config/attacks/results/user_metadata, none
    -- of which exist on the legacy table, so every rtv2 playground write currently
    -- fails with "column does not exist".
    --
    -- Note this is NOT a silent no-op: CREATE TABLE IF NOT EXISTS playground does
    -- no-op, but sentry's very next statement — CREATE INDEX ... ON playground
    -- (id, project_name) — errors on the missing column. That is why
    -- `_bootstrap_hosted.sql` cannot have run to completion against apiaas.
    --
    -- RESOLUTION (chosen deliberately): additive merge. One table serves both
    -- shapes. Sentry's missing columns are ADDed nullable, so no sentry code change
    -- is needed and no legacy row is invalidated. Specifically:
    --   * No FK on the added columns. org_id/created_by would be satisfiable (new
    --     columns are NULL on every existing row), but they are left off so the
    --     whole step stays uniformly additive and trivially reversible.
    --   * No CHECK on status. Both sides happen to use the same vocabulary
    --     (Queued -> Running -> Finished | Failed), but a CHECK on a pre-existing
    --     column can fail on rows written before this migration.
    --   * `id` keeps its legacy `text` type. Sentry inserts a UUID *string* via
    --     PostgREST, which text accepts. Retyping to UUID would require every
    --     legacy row to be castable and is not worth the risk.
    --   * `error` (sentry, jsonb) and "error.json" (legacy, jsonb) coexist as two
    --     separate columns. Each side reads its own. This is the one cosmetic cost
    --     of the merge.
    --   * config is added NULLABLE even though sentry declares it NOT NULL —
    --     NOT NULL cannot be added to a table with existing rows. Sentry always
    --     supplies it on insert.
    --
    -- Requires:    base schema (subscription, profiles) for the FKs. Independent of
    --              key 029 — these tables do not reference runs/records.
    -- Idempotent (IF NOT EXISTS throughout), transactional, self-verifying.
    --

    BEGIN;

    -- ===========================================================================
    -- THREAT MODELING  (datagen: generate a reusable adversarial-prompt dataset)
    -- ===========================================================================
    CREATE TABLE IF NOT EXISTS public.threat_modeling (
        job_id          TEXT PRIMARY KEY,
        id              UUID NOT NULL REFERENCES public.subscription(id),
        project_name    TEXT NOT NULL DEFAULT 'default',
        org_id          UUID REFERENCES public.subscription(id),
        created_by      UUID REFERENCES public.profiles(id),
        actioner_email  TEXT,
        status          TEXT NOT NULL DEFAULT 'Queued'
                            CHECK (status IN ('Queued','Running','Finished','Failed')),
        config          JSONB NOT NULL,
        context         JSONB,
        dataset_name    TEXT NOT NULL,
        prompt_count    INT NOT NULL DEFAULT 0,
        coverage        JSONB,
        categories      JSONB,
        frameworks      TEXT[] NOT NULL DEFAULT '{}',
        download_url    TEXT,
        info_pdf_url    TEXT,
        blob_path       TEXT,
        summary         JSONB,
        error           JSONB,
        location        TEXT,
        user_metadata   JSONB,
        is_deleted      BOOLEAN NOT NULL DEFAULT false,
        created_at      TIMESTAMPTZ NOT NULL DEFAULT now(),
        started_at      TIMESTAMPTZ,
        ended_at        TIMESTAMPTZ
    );

    -- redteam's generation_config.dataset_name resolves to a dataset scoped to the caller.
    CREATE UNIQUE INDEX IF NOT EXISTS uq_threat_modeling_dataset
        ON public.threat_modeling (id, project_name, dataset_name);

    CREATE TABLE IF NOT EXISTS public.threat_modeling_data (
        job_id           TEXT NOT NULL REFERENCES public.threat_modeling(job_id) ON DELETE CASCADE,
        -- records.id of the prompt this row is.
        prompt_id        TEXT NOT NULL,
        PRIMARY KEY (job_id, prompt_id),
        dataset_name     TEXT,
        prompt           TEXT NOT NULL,
        category         TEXT,
        sub_category     TEXT,
        test_type        TEXT,
        goal             TEXT,
        source           TEXT,
        modality         TEXT NOT NULL DEFAULT 'text',
        attack_metadata  JSONB,
        blob_path        TEXT,
        tags             JSONB,
        created_at       TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS idx_tm_data_job         ON public.threat_modeling_data (job_id);
    CREATE INDEX IF NOT EXISTS idx_tm_data_dataset_cat ON public.threat_modeling_data (dataset_name, category, sub_category);

    -- ===========================================================================
    -- REDTEAM  (attack a target, produce a category-level report)
    -- ===========================================================================
    CREATE TABLE IF NOT EXISTS public.redteam_v2 (
        job_id                  TEXT PRIMARY KEY,
        id                      UUID NOT NULL REFERENCES public.subscription(id),
        project_name            TEXT NOT NULL DEFAULT 'default',
        org_id                  UUID REFERENCES public.subscription(id),
        created_by              UUID REFERENCES public.profiles(id),
        actioner_email          TEXT,
        run_name                TEXT NOT NULL,
        status                  TEXT NOT NULL DEFAULT 'Queued'
                                    CHECK (status IN ('Queued','Running','Finished','Failed')),
        config                  JSONB NOT NULL,
        context                 JSONB,
        model_name              TEXT,
        model_saved_name        TEXT,
        model_version           TEXT,
        dataset_name            TEXT,
        frameworks              TEXT[] NOT NULL DEFAULT '{}',
        risk_score              REAL,            -- overall only; per-category scores live in summary
        summary                 JSONB,
        token_usages            JSONB,
        test_statuses           JSONB,           -- V1 dashboard progress keyed by risk category
        eval_cost               REAL,
        total_generation_time   REAL,
        total_evaluation_time   REAL,
        report_url              TEXT,
        report_status           TEXT,
        report_generated_at     TIMESTAMPTZ,
        error                   JSONB,
        location                TEXT,
        user_metadata           JSONB,
        is_deleted              BOOLEAN NOT NULL DEFAULT false,
        created_at              TIMESTAMPTZ NOT NULL DEFAULT now(),
        started_at              TIMESTAMPTZ,
        ended_at                TIMESTAMPTZ
    );

    CREATE INDEX IF NOT EXISTS idx_redteam_v2_owner ON public.redteam_v2 (id, project_name);

    CREATE TABLE IF NOT EXISTS public.redteam_v2_data (
        job_id                   TEXT NOT NULL REFERENCES public.redteam_v2(job_id) ON DELETE CASCADE,
        -- records.id of the seed prompt this row attacked.
        prompt_id                TEXT NOT NULL,
        attack_method            TEXT NOT NULL,
        PRIMARY KEY (job_id, prompt_id, attack_method),
        -- Denormalised from redteam_v2 so the UI can label a row without a join.
        run_name                 TEXT NOT NULL,
        category                 TEXT,
        sub_category             TEXT,
        test_type                TEXT,
        source                   TEXT,
        prompt                   TEXT,
        jailbreak_prompt         TEXT,
        response                 TEXT,
        success                  BOOLEAN,
        response_classification  TEXT,
        reasoning                TEXT,
        confidence               REAL,
        detected_language        TEXT,
        modality                 TEXT NOT NULL DEFAULT 'text',
        conversation             JSONB,           -- multi-turn trace
        attack_metadata          JSONB,           -- figstep/arta/camo/mask/hidden_fragments — all here
        tries_used               REAL,
        eval_latency             DOUBLE PRECISION,
        eval_tokens              JSONB,
        blob_path                TEXT,
        tags                     JSONB,
        created_at               TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    -- NOTE: keys 040-042 add the Attacks-tab access paths on top of these
    -- (job_id+success / +category / +attack_method / +created_at / +sub_category /
    -- +response_classification). The three below are sentry's own base set; the
    -- job_id+success pair is declared in both and IF NOT EXISTS makes the overlap
    -- a no-op whichever order they are applied in.
    CREATE INDEX IF NOT EXISTS idx_redteam_v2_data_job_cat     ON public.redteam_v2_data (job_id, category, sub_category);
    CREATE INDEX IF NOT EXISTS idx_redteam_v2_data_job_attack  ON public.redteam_v2_data (job_id, attack_method);
    CREATE INDEX IF NOT EXISTS idx_redteam_v2_data_job_success ON public.redteam_v2_data (job_id, success);

    -- ===========================================================================
    -- EVAL  (batch evaluator: rows of (query, response, test_type) in, verdicts out)
    -- ===========================================================================
    CREATE TABLE IF NOT EXISTS public.eval (
        job_id          TEXT PRIMARY KEY,
        id              UUID NOT NULL REFERENCES public.subscription(id),
        project_name    TEXT NOT NULL DEFAULT 'default',
        org_id          UUID REFERENCES public.subscription(id),
        created_by      UUID REFERENCES public.profiles(id),
        actioner_email  TEXT,
        run_name        TEXT NOT NULL,
        status          TEXT NOT NULL DEFAULT 'Queued'
                            CHECK (status IN ('Queued','Running','Finished','Failed')),
        config          JSONB NOT NULL,
        context         JSONB,
        frameworks      TEXT[] NOT NULL DEFAULT '{}',
        total           INT NOT NULL DEFAULT 0,
        done            INT NOT NULL DEFAULT 0,
        failed          INT NOT NULL DEFAULT 0,
        summary         JSONB,
        error           JSONB,
        location        TEXT,
        user_metadata   JSONB,
        is_deleted      BOOLEAN NOT NULL DEFAULT false,
        created_at      TIMESTAMPTZ NOT NULL DEFAULT now(),
        started_at      TIMESTAMPTZ,
        ended_at        TIMESTAMPTZ
    );

    CREATE INDEX IF NOT EXISTS idx_eval_owner ON public.eval (id, project_name);

    CREATE TABLE IF NOT EXISTS public.eval_data (
        job_id                   TEXT NOT NULL REFERENCES public.eval(job_id) ON DELETE CASCADE,
        -- records.id of the sample this verdict is for.
        prompt_id                TEXT NOT NULL,
        PRIMARY KEY (job_id, prompt_id),
        -- Denormalised from eval so the UI can label a row without a join.
        run_name                 TEXT NOT NULL,
        query                    TEXT,
        response                 TEXT,
        test_type                TEXT,
        category                 TEXT,
        sub_category             TEXT,
        goal                     TEXT,
        success                  BOOLEAN,
        response_classification  TEXT,
        reasoning                TEXT,
        confidence               REAL,
        blob_path                TEXT,
        tags                     JSONB,
        created_at               TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS idx_eval_data_job_cat ON public.eval_data (job_id, category, sub_category);

    -- ===========================================================================
    -- PLAYGROUND  (additive merge onto the legacy table — see the header note)
    -- ===========================================================================
    ALTER TABLE public.playground
        ADD COLUMN IF NOT EXISTS project_name     TEXT DEFAULT 'default',
        ADD COLUMN IF NOT EXISTS org_id           UUID,
        ADD COLUMN IF NOT EXISTS created_by       UUID,
        ADD COLUMN IF NOT EXISTS actioner_email   TEXT,
        ADD COLUMN IF NOT EXISTS config           JSONB,
        ADD COLUMN IF NOT EXISTS context          JSONB,
        ADD COLUMN IF NOT EXISTS attacks          JSONB,
        ADD COLUMN IF NOT EXISTS results          JSONB,
        ADD COLUMN IF NOT EXISTS duration_seconds REAL,
        ADD COLUMN IF NOT EXISTS error            JSONB,
        ADD COLUMN IF NOT EXISTS user_metadata    JSONB;

    COMMENT ON COLUMN public.playground.project_name IS
        'rtv2 pillar column. Project the playground run is scoped to. Postgres 11+ backfills the DEFAULT onto pre-existing rows, so legacy playground rows read ''default'' here rather than NULL.';
    COMMENT ON COLUMN public.playground.error IS
        'rtv2 pillar column (jsonb). Distinct from the legacy "error.json" column, which the legacy writer still uses. Each side reads its own.';
    COMMENT ON COLUMN public.playground.config IS
        'rtv2 pillar column. Raw request payload. Nullable here although sentry declares it NOT NULL — NOT NULL cannot be added to a table with existing rows.';

    CREATE INDEX IF NOT EXISTS idx_playground_owner ON public.playground (id, project_name);

    -- ===========================================================================
    -- RLS lockdown
    -- Same model as key 026: RLS enabled + a RESTRICTIVE deny-all policy for
    -- anon/authenticated. Every reader of these tables in next-js-app goes through
    -- SupabaseAdmin() (service_role), which BYPASSES RLS — verified across all
    -- redteam_v2 / redteam_v2_data / threat_modeling / threat_modeling_data call
    -- sites — so this changes no application behaviour. Without it the tables are
    -- reachable over PostgREST by any authenticated JWT, which is how they sit in
    -- dev today after the manual bootstrap.
    --
    -- playground is deliberately absent from this list: it already carries
    -- deny_all_playground from key 026, and the loop below skips any table
    -- that already has a policy.
    -- ===========================================================================

    -- anon / authenticated ship with Supabase, but not with a plain-Postgres
    -- dev/test or on-prem-operator database, where the policy below would fail with
    -- `role "anon" does not exist`. Create them idempotently — the same guard key 029
    -- uses for `authenticated` and key 039 uses for `service_role`.
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
            CREATE ROLE anon NOLOGIN NOINHERIT;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
            CREATE ROLE authenticated NOLOGIN NOINHERIT;
        END IF;
    END
    $$;

    DO $$
    DECLARE
      t    text;
      cnt  integer := 0;
    BEGIN
      FOREACH t IN ARRAY ARRAY[
          'threat_modeling', 'threat_modeling_data',
          'redteam_v2', 'redteam_v2_data',
          'eval', 'eval_data'
      ] LOOP
        EXECUTE format('ALTER TABLE public.%I ENABLE ROW LEVEL SECURITY', t);

        IF NOT EXISTS (
          SELECT 1 FROM pg_policy p
          JOIN pg_class c ON c.oid = p.polrelid
          JOIN pg_namespace ns ON ns.oid = c.relnamespace
          WHERE ns.nspname = 'public' AND c.relname = t
        ) THEN
          EXECUTE format(
            'CREATE POLICY %I ON public.%I AS RESTRICTIVE FOR ALL TO anon, authenticated USING (false) WITH CHECK (false)',
            'deny_all_' || t, t
          );
          cnt := cnt + 1;
          RAISE NOTICE 'locked down public.% (added RESTRICTIVE policy deny_all_%)', t, t;
        END IF;
      END LOOP;

      RAISE NOTICE 'Added deny-all policy to % pillar table(s).', cnt;
    END $$;

    -- ===========================================================================
    -- Verify
    -- ===========================================================================
    DO $$
    DECLARE
      t       text;
      missing text := '';
    BEGIN
      FOREACH t IN ARRAY ARRAY[
          'threat_modeling', 'threat_modeling_data',
          'redteam_v2', 'redteam_v2_data',
          'eval', 'eval_data'
      ] LOOP
        IF NOT EXISTS (
          SELECT 1 FROM information_schema.tables
          WHERE table_schema = 'public' AND table_name = t
        ) THEN
          missing := missing || t || ' ';
        END IF;
      END LOOP;

      IF missing <> '' THEN
        RAISE EXCEPTION 'FAILED: pillar tables not created: %', missing;
      END IF;

      -- The whole point of this migration: 022-025 index this table.
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'redteam_v2_data'
          AND column_name = 'response_classification'
      ) THEN
        RAISE EXCEPTION 'FAILED: redteam_v2_data.response_classification missing (023 indexes it)';
      END IF;

      -- The playground additive merge must have taken, or every rtv2 playground
      -- write still fails on the missing column.
      FOREACH t IN ARRAY ARRAY[
          'project_name', 'config', 'attacks', 'results', 'user_metadata'
      ] LOOP
        IF NOT EXISTS (
          SELECT 1 FROM information_schema.columns
          WHERE table_schema = 'public' AND table_name = 'playground' AND column_name = t
        ) THEN
          RAISE EXCEPTION 'FAILED: playground.% was not added', t;
        END IF;
      END LOOP;

      RAISE NOTICE 'SUCCESS: 6 pillar tables created, playground merged additively, RLS locked down.';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --

  038-rtv2-records-full-text.sql: |
    --
    -- Migration: 023_rtv2_records_full_text
    -- Description: records stores the full text, not 512-char previews. Ports
    --              sentry-redteam `rtv2` branch
    --                src/sentry-redteam/sentry/redteam/storage/migrations_v2/0003_full_text_records.sql
    --              into apiaas, which is now the canonical home for all rtv2 DDL.
    --
    --              The per-record trace JSON blob is retired: everything it held
    --              that anyone reads (turns, attack params) now lives in columns,
    --              and blob_path becomes the results *directory* for the record's
    --              (category, attack_method) group — where details.json,
    --              summary.json and any multimodal assets land.
    --
    --              Key 029 created public.records with prompt_preview /
    --              response_preview and blob_path NOT NULL. This is the forward
    --              step to the shape sentry actually writes today.
    --
    --              DIFFERENCE FROM SENTRY'S 0003, deliberate: sentry's file also
    --              redefines rt_persist_eval_run() at the end, to retarget it off
    --              the previews. apiaas has never declared that function at all, so
    --              defining it here and again in key 039 would be redundant. key 039 owns
    --              every rt_* function and declares rt_persist_eval_run directly in
    --              its final full-text form. Apply this key before 039.
    --
    --              On a database that was hand-bootstrapped from sentry's
    --              `_bootstrap_hosted.sql`, records already has these columns and
    --              never had the previews — every statement here is then a no-op.
    --
    -- Requires:    key 029 (public.records must exist).
    -- Idempotent (IF EXISTS / IF NOT EXISTS guards), transactional, self-verifying.
    --

    BEGIN;

    ALTER TABLE public.records ADD COLUMN IF NOT EXISTS prompt TEXT;
    ALTER TABLE public.records ADD COLUMN IF NOT EXISTS jailbreak_prompt TEXT;
    ALTER TABLE public.records ADD COLUMN IF NOT EXISTS response TEXT;

    -- The trace blob's contents, now that it is gone: turns for multi-turn attacks
    -- (goat, crescendo, …) and the attack's own params/timings/usage.
    ALTER TABLE public.records ADD COLUMN IF NOT EXISTS conversation JSONB;
    ALTER TABLE public.records ADD COLUMN IF NOT EXISTS attack_metadata JSONB;

    -- The datagen record an attack row derives from.
    ALTER TABLE public.records ADD COLUMN IF NOT EXISTS parent_record_id UUID;
    CREATE INDEX IF NOT EXISTS idx_records_parent ON public.records (parent_record_id);

    -- Same identity as threat_modeling_data.prompt_id / redteam_v2_data.prompt_id
    -- (both created in key 037). Stable across runs — records.id is not. NULL for
    -- standard-library / inline prompts.
    ALTER TABLE public.records ADD COLUMN IF NOT EXISTS prompt_id TEXT;
    CREATE INDEX IF NOT EXISTS idx_records_prompt_id ON public.records (prompt_id);

    -- ============================================================================
    -- Backfill what the previews held, for databases created before the full-text
    -- columns were declared — i.e. anything provisioned from key 029.
    --
    -- Attack rows wrote the *jailbreak* into prompt_preview and never stored the
    -- seed prompt, so for them the seed is unrecoverable — jailbreak_prompt is the
    -- honest destination. No-op on a bootstrap-provisioned database, where the
    -- preview columns never existed.
    -- ============================================================================
    DO $$
    BEGIN
        IF EXISTS (SELECT 1 FROM information_schema.columns
                   WHERE table_schema = 'public' AND table_name = 'records'
                     AND column_name = 'prompt_preview') THEN
            UPDATE public.records SET response = response_preview WHERE response IS NULL;

            UPDATE public.records
                SET jailbreak_prompt = prompt_preview
                WHERE jailbreak_prompt IS NULL
                  AND attack_method IS NOT NULL
                  AND attack_method <> 'none';

            UPDATE public.records
                SET prompt = prompt_preview
                WHERE prompt IS NULL
                  AND (attack_method IS NULL OR attack_method = 'none');

            RAISE NOTICE 'Backfilled full-text columns from the preview columns.';
        ELSE
            RAISE NOTICE 'No preview columns present — backfill skipped (fresh/bootstrapped DB).';
        END IF;
    END
    $$;

    ALTER TABLE public.records DROP COLUMN IF EXISTS prompt_preview;
    ALTER TABLE public.records DROP COLUMN IF EXISTS response_preview;

    -- Text records have no per-record asset of their own.
    ALTER TABLE public.records ALTER COLUMN blob_path DROP NOT NULL;

    -- ============================================================================
    -- Verify
    -- ============================================================================
    DO $$
    DECLARE
      c       text;
      missing text := '';
    BEGIN
        FOREACH c IN ARRAY ARRAY[
            'prompt', 'jailbreak_prompt', 'response',
            'conversation', 'attack_metadata', 'parent_record_id', 'prompt_id'
        ] LOOP
            IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_schema = 'public' AND table_name = 'records' AND column_name = c
            ) THEN
                missing := missing || c || ' ';
            END IF;
        END LOOP;

        IF missing <> '' THEN
            RAISE EXCEPTION 'FAILED: records is missing full-text column(s): %', missing;
        END IF;

        IF EXISTS (SELECT 1 FROM information_schema.columns
                   WHERE table_schema = 'public' AND table_name = 'records'
                     AND column_name IN ('prompt_preview', 'response_preview')) THEN
            RAISE EXCEPTION 'FAILED: preview column(s) still present on records';
        END IF;

        IF EXISTS (SELECT 1 FROM information_schema.columns
                   WHERE table_schema = 'public' AND table_name = 'records'
                     AND column_name = 'blob_path' AND is_nullable = 'NO') THEN
            RAISE EXCEPTION 'FAILED: records.blob_path is still NOT NULL';
        END IF;

        RAISE NOTICE 'SUCCESS: records carries full text; previews dropped; blob_path nullable.';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --

  039-rtv2-control-plane-rpcs.sql: |
    --
    -- Migration: 024_rtv2_control_plane_rpcs
    -- Description: The rtv2 control-plane RPCs (service_role only). These are the
    --              functions the coordinator and workers call over PostgREST for
    --              every operation that is not expressible as a plain REST write —
    --              row-locking claims, recovery sweeps, atomic multi-table
    --              persistence, race-safe finalisation and increment-upserts.
    --
    --              PORTED FROM sentry-redteam `rtv2`, FINAL STATE. Provenance:
    --                storage/migrations/0008_postgrest_rpc.sql        — original 11 functions
    --                storage/migrations/0009_claim_reject_live_running.sql
    --                                                                — rt_claim_cell rewrite
    --                storage/migrations_v2/0003_full_text_records.sql — rt_persist_eval_run rewrite
    --              Each function is declared ONCE here, already carrying every
    --              later revision, rather than replaying the sequence. Verified
    --              against `_bootstrap_hosted.sql` on origin/rtv2, which is the
    --              rolled-up form sentry itself installs.
    --
    --              WHY THIS EXISTS: apiaas had ZERO of these. Nothing under
    --              database/ declared rt_claim_cell, rt_persist_run,
    --              rt_persist_eval_run, rt_finalise_run, rt_resume_run,
    --              rt_reap_stale, rt_mark_cell, rt_heartbeat, rt_now,
    --              rt_mark_run_running or rt_bump_run_coverage, nor the
    --              service_role grants they depend on. They reached dev only via
    --              the hand-pasted bootstrap.
    --
    --              Key 030's header claims it "consolidates the two in-tree
    --              migrations 0008 and 0009" — that is stale and wrong. On current
    --              origin/rtv2 those slots are postgrest_rpc / user_metadata /
    --              claim_reject_live_running; none is relay. key 030 is relay-only and
    --              always was; the real 0008/0009 arrive here. (0008_user_metadata
    --              is the one exception — it was already ported, as key 034.)
    --
    -- Requires:    key 029 (runs, test_statuses, records, run_coverage) and
    --              key 038 (records full-text columns — rt_persist_eval_run writes
    --              records.prompt / records.response, which only exist after key 038).
    -- Idempotent (CREATE OR REPLACE / guarded role creation), transactional.
    --

    BEGIN;

    -- ============================================================================
    -- service_role ships with Supabase; create it idempotently so this migration
    -- also applies to a plain-Postgres dev/test database. Same pattern key
    -- 029 uses for `authenticated`.
    -- ============================================================================
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
            CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS;
        END IF;
    END
    $$;

    -- ============================================================================
    -- rt_claim_cell — claim a cell for execution.
    -- Verdicts: not_found | done | exhausted | run_not_found | already_running | claimed.
    -- Rejects reclaim of a LIVE running cell; allows reclaim once stale, where
    -- stale means COALESCE(heartbeat_at, started_at) older than 2x the cell's
    -- heartbeat_interval_s.
    -- ============================================================================
    CREATE OR REPLACE FUNCTION public.rt_claim_cell(p_cell_id uuid, p_max_attempts int)
    RETURNS jsonb LANGUAGE plpgsql AS $$
    DECLARE
        ts   test_statuses%ROWTYPE;
        run  RECORD;
        stale_after interval;
        live_at timestamptz;
    BEGIN
        SELECT * INTO ts FROM test_statuses WHERE cell_id = p_cell_id FOR UPDATE;
        IF NOT FOUND THEN
            RETURN jsonb_build_object('verdict', 'not_found');
        END IF;
        IF ts.status = 'done' THEN
            RETURN jsonb_build_object('verdict', 'done');
        END IF;
        IF ts.attempts >= p_max_attempts THEN
            UPDATE test_statuses
            SET status = 'failed_terminal',
                error  = jsonb_build_object(
                    'code', 'CELL_REDELIVERY_EXHAUSTED',
                    'message', 'Cell exceeded max attempts.')
            WHERE cell_id = p_cell_id;
            RETURN jsonb_build_object('verdict', 'exhausted');
        END IF;

        -- Live running: another owner still heartbeating / recently started.
        IF ts.status = 'running' THEN
            stale_after := (COALESCE(ts.heartbeat_interval_s, 30) * 2 || ' seconds')::interval;
            live_at := COALESCE(ts.heartbeat_at, ts.started_at);
            IF live_at IS NOT NULL AND live_at >= now() - stale_after THEN
                RETURN jsonb_build_object('verdict', 'already_running');
            END IF;
        END IF;

        SELECT tenant_id, config INTO run FROM runs WHERE id = ts.run_id;
        IF NOT FOUND THEN
            RETURN jsonb_build_object('verdict', 'run_not_found');
        END IF;

        UPDATE test_statuses
        SET status = 'running',
            attempts = attempts + 1,
            started_at = now(),
            heartbeat_at = now()
        WHERE cell_id = p_cell_id;

        RETURN jsonb_build_object(
            'verdict', 'claimed',
            'cell', to_jsonb(ts) - 'error',
            'heartbeat_interval_s', COALESCE(ts.heartbeat_interval_s, 30),
            'tenant_id', run.tenant_id,
            'config', run.config);
    END;
    $$;

    -- ============================================================================
    -- rt_reap_stale — recovery sweep. Returns one entry per swept cell with
    -- disposition killed | requeued | skipped.
    -- ============================================================================
    CREATE OR REPLACE FUNCTION public.rt_reap_stale(p_max_attempts int)
    RETURNS jsonb LANGUAGE plpgsql AS $$
    DECLARE
        r      RECORD;
        entry  jsonb;
        result jsonb := '[]'::jsonb;
    BEGIN
        FOR r IN
            SELECT ts.*,
                   EXTRACT(EPOCH FROM (now() - ts.heartbeat_at))::int AS silent_s,
                   runs.tenant_id AS run_tenant_id, runs.config AS run_config
            FROM test_statuses ts
            LEFT JOIN runs ON runs.id = ts.run_id
            WHERE ts.status = 'running'
              AND ts.heartbeat_at < now() - (ts.heartbeat_interval_s * 3 || ' seconds')::INTERVAL
            FOR UPDATE OF ts SKIP LOCKED
        LOOP
            entry := jsonb_build_object(
                'cell_id', r.cell_id, 'run_id', r.run_id, 'pillar', r.pillar,
                'category', r.category, 'sub_category', r.sub_category,
                'attack_method', r.attack_method, 'record_id', r.record_id,
                'evaluator_id', r.evaluator_id, 'scenario_idx', r.scenario_idx,
                'depth_idx', r.depth_idx,
                'silent_s', COALESCE(r.silent_s, 0),
                'attempts_after', r.attempts + 1,
                'tenant_id', r.run_tenant_id, 'config', r.run_config);

            IF r.run_tenant_id IS NULL THEN
                entry := entry || jsonb_build_object('disposition', 'skipped');
            ELSIF r.attempts + 1 >= p_max_attempts THEN
                UPDATE test_statuses
                SET status = 'failed_terminal', attempts = r.attempts + 1,
                    completed_at = now(),
                    error = jsonb_build_object(
                        'code', 'HEARTBEAT_TIMEOUT', 'category', 'INTERNAL',
                        'message', format('Cell silent for %ss after %s attempts',
                                          COALESCE(r.silent_s, 0), r.attempts + 1),
                        'retry_after_s', NULL)
                WHERE cell_id = r.cell_id;
                entry := entry || jsonb_build_object('disposition', 'killed');
            ELSE
                UPDATE test_statuses
                SET status = 'pending', attempts = r.attempts + 1, heartbeat_at = NULL
                WHERE cell_id = r.cell_id;
                entry := entry || jsonb_build_object('disposition', 'requeued');
            END IF;

            result := result || entry;
        END LOOP;
        RETURN result;
    END;
    $$;

    -- ============================================================================
    -- rt_persist_run — resolver run + cells materialisation (atomic).
    -- ============================================================================
    CREATE OR REPLACE FUNCTION public.rt_persist_run(p_run jsonb, p_cells jsonb)
    RETURNS void LANGUAGE plpgsql AS $$
    BEGIN
        INSERT INTO runs (id, tenant_id, status, config, config_version,
                          taxonomy_version, compliance_version, budget)
        VALUES ((p_run->>'id')::uuid,
                (p_run->>'tenant_id')::uuid,
                COALESCE(p_run->>'status', 'queued'),
                p_run->'config',
                p_run->>'config_version',
                p_run->>'taxonomy_version',
                p_run->>'compliance_version',
                COALESCE(p_run->'budget', '{}'::jsonb));

        INSERT INTO test_statuses (cell_id, run_id, pillar, category, sub_category,
                                   attack_method, record_id, evaluator_id,
                                   scenario_idx, depth_idx, flavor, status, attempts)
        SELECT (c->>'cell_id')::uuid, (c->>'run_id')::uuid, c->>'pillar',
               c->>'category', c->>'sub_category', c->>'attack_method',
               (c->>'record_id')::uuid, c->>'evaluator_id',
               (c->>'scenario_idx')::int, (c->>'depth_idx')::int,
               COALESCE(c->>'flavor', 'static'),
               COALESCE(c->>'status', 'pending'),
               COALESCE((c->>'attempts')::int, 0)
        FROM jsonb_array_elements(p_cells) AS c;
    END;
    $$;

    -- ============================================================================
    -- rt_persist_eval_run — /v1/eval run + cells + seed records (atomic).
    -- Cells are inserted before records: records.cell_id FKs test_statuses.
    -- Writes records.prompt / records.response directly — this is the post-key-038
    -- full-text form, NOT the original preview-based one.
    -- ============================================================================
    CREATE OR REPLACE FUNCTION public.rt_persist_eval_run(p_run jsonb, p_cells jsonb, p_records jsonb)
    RETURNS void LANGUAGE plpgsql AS $$
    BEGIN
        PERFORM rt_persist_run(p_run, p_cells);

        INSERT INTO records (id, run_id, cell_id, category, sub_category,
                             prompt_hash, response_hash, prompt,
                             response, attack_method, test_type, goal,
                             source, tags, blob_path)
        SELECT (r->>'id')::uuid, (r->>'run_id')::uuid, (r->>'cell_id')::uuid,
               r->>'category', r->>'sub_category',
               r->>'prompt_hash', r->>'response_hash', r->>'prompt',
               r->>'response', r->>'attack_method', r->>'test_type',
               r->>'goal', COALESCE(r->>'source', 'eval'),
               COALESCE(r->'tags', '[]'::jsonb), r->>'blob_path'
        FROM jsonb_array_elements(p_records) AS r;
    END;
    $$;

    -- ============================================================================
    -- rt_finalise_run — race-safe finalisation + summary + coverage write.
    -- The UPDATE ... WHERE finalised_at IS NULL RETURNING id is the race guard;
    -- exactly one caller wins. (key 029 indexes the un-finalised slice for this.)
    -- ============================================================================
    CREATE OR REPLACE FUNCTION public.rt_finalise_run(p_run_id uuid)
    RETURNS jsonb LANGUAGE plpgsql AS $$
    DECLARE
        remaining int;
        v_summary jsonb;
        v_total   int;
        v_done    int;
        v_failed  int;
        winner    uuid;
    BEGIN
        SELECT count(*) INTO remaining FROM test_statuses
        WHERE run_id = p_run_id AND status IN ('pending', 'running');
        IF remaining > 0 THEN
            RETURN jsonb_build_object('finalised', false);
        END IF;

        SELECT jsonb_build_object('groups', COALESCE(jsonb_agg(to_jsonb(g)), '[]'::jsonb))
        INTO v_summary
        FROM (
            SELECT category, sub_category, attack_method, source,
                   count(*) AS total,
                   count(*) FILTER (WHERE success IS TRUE) AS successes
            FROM records
            WHERE run_id = p_run_id
            GROUP BY category, sub_category, attack_method, source
        ) g;

        SELECT count(*),
               count(*) FILTER (WHERE status = 'done'),
               count(*) FILTER (WHERE status IN ('failed', 'failed_terminal'))
        INTO v_total, v_done, v_failed
        FROM test_statuses WHERE run_id = p_run_id;

        UPDATE runs
        SET status = 'completed', completed_at = now(), finalised_at = now(),
            summary = v_summary, compliance_cache = '{}'::jsonb
        WHERE id = p_run_id AND finalised_at IS NULL
        RETURNING id INTO winner;
        IF winner IS NULL THEN
            RETURN jsonb_build_object('finalised', false);
        END IF;

        INSERT INTO run_coverage (run_id, category, requested, delivered, failed_cells)
        SELECT run_id, category, count(*),
               count(*) FILTER (WHERE status = 'done'),
               COALESCE(jsonb_agg(cell_id) FILTER
                        (WHERE status IN ('failed', 'failed_terminal')), '[]'::jsonb)
        FROM test_statuses
        WHERE run_id = p_run_id AND pillar = 'eval'
        GROUP BY run_id, category
        ON CONFLICT (run_id, category) DO UPDATE
            SET requested = EXCLUDED.requested,
                delivered = EXCLUDED.delivered,
                failed_cells = EXCLUDED.failed_cells;

        RETURN jsonb_build_object('finalised', true, 'total', v_total,
                                  'done', v_done, 'failed', v_failed);
    END;
    $$;

    -- ============================================================================
    -- rt_resume_run — coordinator resume.
    -- ============================================================================
    CREATE OR REPLACE FUNCTION public.rt_resume_run(p_run_id uuid, p_stale_s int)
    RETURNS jsonb LANGUAGE plpgsql AS $$
    DECLARE
        run       RECORD;
        v_done    int;
        v_ft      int;
        resumed   jsonb;
    BEGIN
        SELECT tenant_id, config INTO run FROM runs WHERE id = p_run_id;
        IF NOT FOUND THEN
            RETURN jsonb_build_object('found', false);
        END IF;

        SELECT count(*) FILTER (WHERE status = 'done'),
               count(*) FILTER (WHERE status = 'failed_terminal')
        INTO v_done, v_ft
        FROM test_statuses WHERE run_id = p_run_id;

        WITH stale AS (
            SELECT cell_id FROM test_statuses
            WHERE run_id = p_run_id
              AND (status IN ('pending', 'failed')
                   OR (status = 'running'
                       AND (heartbeat_at IS NULL
                            OR heartbeat_at < now() - (p_stale_s || ' seconds')::INTERVAL)))
            FOR UPDATE
        ), upd AS (
            UPDATE test_statuses ts
            SET status = 'pending', heartbeat_at = NULL, error = NULL,
                attempts = ts.attempts + 1
            FROM stale WHERE ts.cell_id = stale.cell_id
            RETURNING ts.*
        )
        SELECT COALESCE(jsonb_agg(to_jsonb(upd) - 'error'), '[]'::jsonb)
        INTO resumed FROM upd;

        UPDATE runs SET status = 'running' WHERE id = p_run_id;

        RETURN jsonb_build_object('found', true, 'tenant_id', run.tenant_id,
                                  'config', run.config, 'skipped_done', v_done,
                                  'failed_cells', v_ft, 'cells', resumed);
    END;
    $$;

    -- ============================================================================
    -- rt_mark_cell / rt_heartbeat / rt_now / rt_mark_run_running —
    -- single-statement writers that need DB-side now() (client clocks are not
    -- trusted for staleness math).
    -- ============================================================================
    CREATE OR REPLACE FUNCTION public.rt_mark_cell(p_cell_id uuid, p_status text, p_error jsonb DEFAULT NULL)
    RETURNS void LANGUAGE sql AS $$
        UPDATE test_statuses
        SET status = p_status,
            error = COALESCE(p_error, error),
            completed_at = CASE WHEN p_status IN ('done', 'failed_terminal')
                                THEN now() ELSE completed_at END
        WHERE cell_id = p_cell_id;
    $$;

    CREATE OR REPLACE FUNCTION public.rt_heartbeat(p_cell_id uuid)
    RETURNS void LANGUAGE sql AS $$
        UPDATE test_statuses SET heartbeat_at = now() WHERE cell_id = p_cell_id;
    $$;

    CREATE OR REPLACE FUNCTION public.rt_now()
    RETURNS timestamptz LANGUAGE sql STABLE AS $$
        SELECT now();
    $$;

    CREATE OR REPLACE FUNCTION public.rt_mark_run_running(p_run_id uuid)
    RETURNS void LANGUAGE sql AS $$
        UPDATE runs SET status = 'running', started_at = now() WHERE id = p_run_id;
    $$;

    -- ============================================================================
    -- rt_bump_run_coverage — increment upsert (not expressible in PostgREST).
    -- ============================================================================
    CREATE OR REPLACE FUNCTION public.rt_bump_run_coverage(p_run_id uuid, p_category text)
    RETURNS void LANGUAGE sql AS $$
        INSERT INTO run_coverage (run_id, category, requested, delivered, failed_cells)
        VALUES (p_run_id, p_category, 0, 1, '[]'::jsonb)
        ON CONFLICT (run_id, category) DO UPDATE
            SET delivered = run_coverage.delivered + 1;
    $$;

    -- ============================================================================
    -- Grants: control-plane only. PostgREST exposes public-schema functions to
    -- whoever holds EXECUTE, so anon/authenticated must not hold it — these
    -- functions claim cells, rewrite run state and persist runs.
    --
    -- REVOKE FROM PUBLIC IS NOT ENOUGH ON SUPABASE, and this bit me on dev.
    -- Supabase ships default privileges that grant EXECUTE *directly* to anon and
    -- authenticated for every function created in `public`:
    --
    --   SELECT defaclacl FROM pg_default_acl WHERE defaclobjtype='f';
    --   -- public | {postgres=X/postgres, anon=X/postgres,
    --   --           authenticated=X/postgres, service_role=X/postgres}
    --
    -- A direct grant is not the PUBLIC pseudo-role grant, so `REVOKE ... FROM
    -- PUBLIC` leaves it completely untouched. On a plain Postgres (no default
    -- ACLs) the old code looked correct and every local test passed; on the real
    -- Supabase database all eleven functions came out executable by anon. The
    -- roles are revoked by name below, guarded because they do not exist on a
    -- bare Postgres.
    -- ============================================================================
    DO $$
    DECLARE
        fn text;
        grantee text;
    BEGIN
        FOREACH fn IN ARRAY ARRAY[
            'public.rt_claim_cell(uuid, int)',
            'public.rt_reap_stale(int)',
            'public.rt_persist_run(jsonb, jsonb)',
            'public.rt_persist_eval_run(jsonb, jsonb, jsonb)',
            'public.rt_finalise_run(uuid)',
            'public.rt_resume_run(uuid, int)',
            'public.rt_mark_cell(uuid, text, jsonb)',
            'public.rt_heartbeat(uuid)',
            'public.rt_now()',
            'public.rt_mark_run_running(uuid)',
            'public.rt_bump_run_coverage(uuid, text)'
        ] LOOP
            EXECUTE format('REVOKE ALL ON FUNCTION %s FROM PUBLIC', fn);

            -- The one that actually matters on Supabase — see the note above.
            FOREACH grantee IN ARRAY ARRAY['anon', 'authenticated'] LOOP
                IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = grantee) THEN
                    EXECUTE format('REVOKE ALL ON FUNCTION %s FROM %I', fn, grantee);
                END IF;
            END LOOP;

            EXECUTE format('GRANT EXECUTE ON FUNCTION %s TO service_role', fn);
        END LOOP;
    END
    $$;

    -- ============================================================================
    -- Verify
    -- ============================================================================
    DO $$
    DECLARE
      fn      text;
      missing text := '';
    BEGIN
        FOREACH fn IN ARRAY ARRAY[
            'rt_claim_cell', 'rt_reap_stale', 'rt_persist_run',
            'rt_persist_eval_run', 'rt_finalise_run', 'rt_resume_run',
            'rt_mark_cell', 'rt_heartbeat', 'rt_now',
            'rt_mark_run_running', 'rt_bump_run_coverage'
        ] LOOP
            IF NOT EXISTS (
                SELECT 1 FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
                WHERE n.nspname = 'public' AND p.proname = fn
            ) THEN
                missing := missing || fn || ' ';
            END IF;
        END LOOP;

        IF missing <> '' THEN
            RAISE EXCEPTION 'FAILED: control-plane function(s) not created: %', missing;
        END IF;

        -- rt_claim_cell must be the 0009 revision, not the original 0008 one.
        IF NOT EXISTS (
            SELECT 1 FROM pg_proc p
            JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE n.nspname = 'public' AND p.proname = 'rt_claim_cell'
              AND pg_get_functiondef(p.oid) LIKE '%already_running%'
        ) THEN
            RAISE EXCEPTION 'FAILED: rt_claim_cell is not the live-running-reject revision';
        END IF;

        -- The grants must have actually taken. Asserted rather than assumed because
        -- REVOKE ... FROM PUBLIC silently fails to remove Supabase's direct
        -- anon/authenticated grants, which is exactly how these functions ended up
        -- world-executable on dev the first time round.
        FOREACH fn IN ARRAY ARRAY['anon', 'authenticated'] LOOP
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = fn) THEN
                IF EXISTS (
                    SELECT 1 FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                    WHERE n.nspname = 'public'
                      AND p.proname LIKE 'rt\_%'
                      AND p.proname NOT LIKE 'rt\_v2\_data%'   -- keys 040-043 dashboard RPCs, intentionally readable
                      AND has_function_privilege(fn, p.oid, 'EXECUTE')
                ) THEN
                    RAISE EXCEPTION
                        'FAILED: role % can still EXECUTE a control-plane rt_* function', fn;
                END IF;
            END IF;
        END LOOP;

        RAISE NOTICE 'SUCCESS: 11 control-plane RPCs installed, executable by service_role only.';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --
  040-index-redteam-v2-data.sql: |
    -- Speed up the Attacks tab on /red-teaming/assessments/[job_id].
    --
    -- The v2 AttacksTab reads from `redteam_v2_data` (one row per generated
    -- prompt) scoped by `job_id`, then filters/paginates on `success`,
    -- `category`, and `attack_method`. Without indexes every filter change is
    -- a full table scan across every job's rows.
    --
    -- Companion RPC (`rt_v2_data_aggregates`) below batches the count + distinct
    -- lookups that populate the Attacks-tab header counts and filter chips into a
    -- single round-trip.

    -- Primary compound — every Attacks-tab query starts with job_id, and 99% of
    -- the time also filters on success (Blocked/Bypassed).
    CREATE INDEX IF NOT EXISTS idx_redteam_v2_data_job_success
        ON public.redteam_v2_data (job_id, success);

    -- Category / attack_method filters — these back the `.in("category", ...)`
    -- and `.in("attack_method", ...)` predicates in getAttackRows, plus the
    -- distinct-value scans in getAttackAggregates.
    CREATE INDEX IF NOT EXISTS idx_redteam_v2_data_job_category
        ON public.redteam_v2_data (job_id, category);

    CREATE INDEX IF NOT EXISTS idx_redteam_v2_data_job_attack_method
        ON public.redteam_v2_data (job_id, attack_method);

    -- The paginated fetch orders by created_at; keep it indexed under job_id so
    -- range scans over a single job stay cheap.
    CREATE INDEX IF NOT EXISTS idx_redteam_v2_data_job_created_at
        ON public.redteam_v2_data (job_id, created_at);

    -- One-shot aggregates for the Attacks-tab header counts + filter chips.
    -- Replaces three parallel queries in `getAttackAggregates` with a single
    -- round-trip. Marked STABLE so Postgres can cache within a statement.
    CREATE OR REPLACE FUNCTION public.rt_v2_data_aggregates(p_job_id text)
    RETURNS jsonb
    LANGUAGE sql
    STABLE
    AS $$
        SELECT jsonb_build_object(
            'total',    COUNT(*),
            'bypassed', COUNT(*) FILTER (WHERE success = true),
            'blocked',  COUNT(*) FILTER (WHERE success = false),
            'categories', COALESCE(
                (SELECT array_agg(DISTINCT category)
                 FROM public.redteam_v2_data
                 WHERE job_id = p_job_id AND category IS NOT NULL),
                '{}'::text[]
            ),
            'attack_methods', COALESCE(
                (SELECT array_agg(DISTINCT attack_method)
                 FROM public.redteam_v2_data
                 WHERE job_id = p_job_id AND attack_method IS NOT NULL),
                '{}'::text[]
            )
        )
        FROM public.redteam_v2_data
        WHERE job_id = p_job_id;
    $$;

  041-index-redteam-v2-data-sankey.sql: |
    -- Companion to key 040 — powers the Sankey chart on the Attacks tab of
    -- `/red-teaming/assessments/[job_id]`. The chart shows three columns:
    --   Risk Category  →  Response Classification  →  Bypass / Blocked
    -- and needs per-(category, classification) and per-(classification, success)
    -- counts. `rt_v2_data_sankey` returns both aggregations in one round-trip.

    -- Compound to accelerate the middle-column aggregate.
    CREATE INDEX IF NOT EXISTS idx_redteam_v2_data_job_classification
        ON public.redteam_v2_data (job_id, response_classification);

    CREATE OR REPLACE FUNCTION public.rt_v2_data_sankey(p_job_id text)
    RETURNS jsonb
    LANGUAGE sql
    STABLE
    AS $$
        SELECT jsonb_build_object(
            'cat_to_class', (
                SELECT COALESCE(jsonb_agg(row_to_json(t)), '[]'::jsonb)
                FROM (
                    SELECT category,
                           response_classification,
                           COUNT(*)::int AS value
                    FROM public.redteam_v2_data
                    WHERE job_id = p_job_id
                        AND category IS NOT NULL
                        AND response_classification IS NOT NULL
                    GROUP BY category, response_classification
                ) t
            ),
            'class_to_status', (
                SELECT COALESCE(jsonb_agg(row_to_json(t)), '[]'::jsonb)
                FROM (
                    SELECT response_classification,
                           COALESCE(success, false) AS bypassed,
                           COUNT(*)::int AS value
                    FROM public.redteam_v2_data
                    WHERE job_id = p_job_id
                        AND response_classification IS NOT NULL
                    GROUP BY response_classification, success
                ) t
            )
        );
    $$;

  042-redteam-v2-data-filter-options.sql: |
    -- Filter side-sheet on the Attacks tab (`/red-teaming/assessments/[job_id]`)
    -- needs the *option list* AND the bypass ratio next to each option:
    --   Risk Category
    --     ├─ total attacks, bypassed count, pct
    --     └─ Sub Category
    --          └─ total attacks, bypassed count, pct
    --   Attack Method
    --        └─ total attacks, bypassed count, pct
    --
    -- `rt_v2_data_filter_options` batches those three group-bys into a single
    -- round-trip so the sheet opens without cascading requests.
    --
    -- Companion sub_category index — categories/attack_method already have
    -- composite indexes in key 040; sub_category also filters row queries when the
    -- user drills into a specific bucket.

    CREATE INDEX IF NOT EXISTS idx_redteam_v2_data_job_sub_category
        ON public.redteam_v2_data (job_id, sub_category);

    CREATE OR REPLACE FUNCTION public.rt_v2_data_filter_options(p_job_id text)
    RETURNS jsonb
    LANGUAGE sql
    STABLE
    AS $$
        SELECT jsonb_build_object(
            'categories', COALESCE(
                (
                    SELECT jsonb_agg(row_to_json(c) ORDER BY c.category)
                    FROM (
                        SELECT
                            category,
                            COUNT(*)::int AS total,
                            COUNT(*) FILTER (WHERE success = true)::int AS bypassed,
                            COALESCE(
                                (
                                    SELECT jsonb_agg(row_to_json(s) ORDER BY s.sub_category)
                                    FROM (
                                        SELECT
                                            sub_category,
                                            COUNT(*)::int AS total,
                                            COUNT(*) FILTER (WHERE success = true)::int AS bypassed
                                        FROM public.redteam_v2_data d2
                                        WHERE d2.job_id = p_job_id
                                            AND d2.category = d1.category
                                            AND d2.sub_category IS NOT NULL
                                        GROUP BY sub_category
                                    ) s
                                ),
                                '[]'::jsonb
                            ) AS sub_categories
                        FROM public.redteam_v2_data d1
                        WHERE d1.job_id = p_job_id
                            AND d1.category IS NOT NULL
                        GROUP BY category
                    ) c
                ),
                '[]'::jsonb
            ),
            'attack_methods', COALESCE(
                (
                    SELECT jsonb_agg(row_to_json(m) ORDER BY m.attack_method)
                    FROM (
                        SELECT
                            attack_method,
                            COUNT(*)::int AS total,
                            COUNT(*) FILTER (WHERE success = true)::int AS bypassed
                        FROM public.redteam_v2_data
                        WHERE job_id = p_job_id
                            AND attack_method IS NOT NULL
                        GROUP BY attack_method
                    ) m
                ),
                '[]'::jsonb
            )
        );
    $$;

  043-rt-v2-data-dashboard-aggregates.sql: |
    -- Aggregates across a scoped set of jobs for the top-level red-teaming
    -- dashboard (`/red-teaming/dashboard`). Unlike `rt_v2_data_aggregates` (key 040) and
    -- `rt_v2_data_filter_options` (key 042) — both scoped to ONE job_id — this one takes
    -- a job_id array so the server action can compute totals, per-category /
    -- per-attack-method breakdowns, and the category × attack_method heatmap in a
    -- single round-trip after resolving the org/project-scoped job list.
    --
    -- PostgREST doesn't do GROUP BY, so fetching rows and aggregating in Node would
    -- pull every attack row across every job in scope. This RPC keeps that work in
    -- the database (indexes from key 040 cover job_id + category / attack_method) and
    -- returns a compact JSON blob shaped for direct consumption by the dashboard.

    CREATE OR REPLACE FUNCTION public.rt_v2_data_dashboard_aggregates(p_job_ids text[])
    RETURNS jsonb
    LANGUAGE sql
    STABLE
    AS $$
        WITH rows AS (
            SELECT
                category,
                attack_method,
                success
            FROM public.redteam_v2_data
            WHERE job_id = ANY(p_job_ids)
        ),
        by_cat AS (
            SELECT
                category,
                COUNT(*)::int AS total,
                COUNT(*) FILTER (WHERE success = true)::int AS success
            FROM rows
            WHERE category IS NOT NULL
            GROUP BY category
        ),
        by_am AS (
            SELECT
                attack_method,
                COUNT(*)::int AS total,
                COUNT(*) FILTER (WHERE success = true)::int AS success
            FROM rows
            WHERE attack_method IS NOT NULL
            GROUP BY attack_method
        ),
        by_cell AS (
            SELECT
                category,
                attack_method,
                COUNT(*)::int AS total,
                COUNT(*) FILTER (WHERE success = true)::int AS success
            FROM rows
            WHERE category IS NOT NULL AND attack_method IS NOT NULL
            GROUP BY category, attack_method
        )
        SELECT jsonb_build_object(
            'total', COALESCE((SELECT COUNT(*)::int FROM rows), 0),
            'successful', COALESCE((SELECT COUNT(*)::int FROM rows WHERE success = true), 0),
            'by_category', COALESCE(
                (SELECT jsonb_agg(row_to_json(by_cat) ORDER BY by_cat.total DESC) FROM by_cat),
                '[]'::jsonb
            ),
            'by_attack_method', COALESCE(
                (SELECT jsonb_agg(row_to_json(by_am) ORDER BY by_am.total DESC) FROM by_am),
                '[]'::jsonb
            ),
            'heatmap', COALESCE(
                (SELECT jsonb_agg(row_to_json(by_cell)) FROM by_cell),
                '[]'::jsonb
            )
        );
    $$;

  044-index-guardrails-and-code-of-conduct.sql: |
    --
    -- Migration: 029_index_guardrails_and_code_of_conduct
    -- Description: Speed up per-org list/count endpoints on the Guardrails and
    --              Code of Conduct pages. Every list query filters on
    --              (id, project_name) — but the PK is (id, name, project_name),
    --              so filtering without `name` skips the middle column and
    --              forces Postgres to scan every row for the caller's id and
    --              filter project_name in memory. On big orgs this stalls.
    --
    --              Affected callers (all list-per-org-project):
    --                guardrails       → /api/users/[user_id]/guardrails/list-guardrails,
    --                                   /api/users/[user_id]/guardrails/policies,
    --                                   app/(withauth)/guardrails/policies/actions
    --                code_of_conduct  → /api/users/[user_id]/code-of-conduct/policies,
    --                                   app/(withauth)/policies/actions
    --
    --              Single-row lookups (id, name, project_name) already hit the
    --              PK, so detail endpoints do not need an extra index.
    --

    BEGIN;

    -- (id, project_name) — covers every list query on either table regardless
    -- of is_guardrail. Required because
    -- /api/users/[user_id]/guardrails/policies returns BOTH legacy
    -- (is_guardrail=false) and v2 (is_guardrail=true) rows, so the partial
    -- index below cannot stand alone.
    CREATE INDEX IF NOT EXISTS idx_guardrails_id_project
        ON public.guardrails (id, project_name);

    CREATE INDEX IF NOT EXISTS idx_code_of_conduct_id_project
        ON public.code_of_conduct (id, project_name);

    -- Partial variant for the is_guardrail=true hot path — /list-guardrails
    -- and the guardrail-only reads/writes in /guardrails/guardrail. Post the
    -- v2 backfill, roughly half of every caller's rows are legacy shadows;
    -- scanning only the guardrail half keeps the working set half-size and
    -- hot in cache.
    CREATE INDEX IF NOT EXISTS idx_guardrails_id_project_where_guardrail
        ON public.guardrails (id, project_name)
        WHERE is_guardrail = true;

    --
    -- Verify all three indexes exist.
    --
    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM pg_indexes
        WHERE schemaname = 'public' AND indexname = 'idx_guardrails_id_project'
      ) THEN
        RAISE EXCEPTION 'FAILED: idx_guardrails_id_project not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_indexes
        WHERE schemaname = 'public' AND indexname = 'idx_code_of_conduct_id_project'
      ) THEN
        RAISE EXCEPTION 'FAILED: idx_code_of_conduct_id_project not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_indexes
        WHERE schemaname = 'public' AND indexname = 'idx_guardrails_id_project_where_guardrail'
      ) THEN
        RAISE EXCEPTION 'FAILED: idx_guardrails_id_project_where_guardrail not created';
      END IF;

      RAISE NOTICE 'SUCCESS: 3 indexes created (or already present) on guardrails and code_of_conduct';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --

  045-index-models-deployments-invitations.sql: |
    --
    -- Migration: 030_index_models_deployments_invitations
    -- Description: Add per-org list indexes for three tables whose list/count
    --              endpoints currently seq-scan.
    --
    --                * models       — PK is (id, model_saved_name, project_name,
    --                                 model_version); list filters on
    --                                 (id, project_name) so the middle two PK
    --                                 columns block the leftmost prefix.
    --                * deployments  — PK is (id, name, project_name); same
    --                                 skip-middle problem as models.
    --                * invitations  — PK is (invitation_id). The org-owner
    --                                 column `id` has NO index at all — every
    --                                 org-scoped invitations list is a full
    --                                 table scan today. Also add a partial for
    --                                 the "my accepted invites / org members"
    --                                 lookup on (invitee) WHERE status='Accepted'.
    --
    --              Callers (representative):
    --                models       → /api/users/[user_id]/models/list-models,
    --                               app/(withauth)/{endpoints,targets}/actions
    --                deployments  → /api/users/[user_id]/deployments/list-deployments,
    --                               app/(withauth)/deployments/actions
    --                invitations  → app/(withauth)/home/actions,
    --                               /api/orgs/[org_id]/invitations/actions/*,
    --                               /api/orgs/[org_id]/members
    --
    --              Detail lookups already hit their PKs; nothing changes there.
    --

    BEGIN;

    CREATE INDEX IF NOT EXISTS idx_models_id_project
        ON public.models (id, project_name);

    CREATE INDEX IF NOT EXISTS idx_deployments_id_project
        ON public.deployments (id, project_name);

    -- (id) alone — covers every org-scoped invitations list. There is no
    -- existing index on this column; the PK is on invitation_id, not id.
    CREATE INDEX IF NOT EXISTS idx_invitations_org
        ON public.invitations (id);

    -- Partial variant for the "my accepted invites / org members" hot path.
    -- .eq("invitee", email).eq("status", "Accepted") is called from several
    -- places (home actions, settings, org members). Scoping on
    -- status='Accepted' keeps the index small — accepted invites are a
    -- fraction of total and this predicate rarely if ever changes.
    CREATE INDEX IF NOT EXISTS idx_invitations_invitee_accepted
        ON public.invitations (invitee)
        WHERE status = 'Accepted';

    --
    -- Verify all four indexes exist.
    --
    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM pg_indexes
        WHERE schemaname = 'public' AND indexname = 'idx_models_id_project'
      ) THEN
        RAISE EXCEPTION 'FAILED: idx_models_id_project not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_indexes
        WHERE schemaname = 'public' AND indexname = 'idx_deployments_id_project'
      ) THEN
        RAISE EXCEPTION 'FAILED: idx_deployments_id_project not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_indexes
        WHERE schemaname = 'public' AND indexname = 'idx_invitations_org'
      ) THEN
        RAISE EXCEPTION 'FAILED: idx_invitations_org not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_indexes
        WHERE schemaname = 'public' AND indexname = 'idx_invitations_invitee_accepted'
      ) THEN
        RAISE EXCEPTION 'FAILED: idx_invitations_invitee_accepted not created';
      END IF;

      RAISE NOTICE 'SUCCESS: 4 indexes created (or already present) on models, deployments, invitations';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --

  046-rtv2-service-role-grants.sql: |
    --
    -- Migration: 031_rtv2_service_role_grants
    -- Description: Grant service_role the DML it needs on the rtv2 tables.
    --
    --              The rtv2 migrations create their tables and never GRANT on them.
    --              Supabase's default privileges give service_role only Dxt
    --              (TRUNCATE/REFERENCES/TRIGGER), so on a fresh project the first
    --              POST /v1/redteam dies with `permission denied for table runs`
    --              (42501). Hosted dev and prod work only because someone granted
    --              out of band; a fresh on-prem install inherits nothing.
    --
    --              Explicit table list, not ALL TABLES IN SCHEMA public: `public`
    --              also holds the apiaas application tables. ALTER DEFAULT
    --              PRIVILEGES below covers tables added later.
    --
    --              anon and authenticated get nothing: every rtv2 reader goes
    --              through service_role, and key 037 installs a RESTRICTIVE
    --              deny-all for both on the pillar tables. Key 029's
    --              `TO authenticated` policies therefore stay inert by design —
    --              a policy grants nothing on its own.
    --
    -- Requires:    Keys 018 (playground), 029 (substrate), 030
    --              (relay_requests), 037 (pillar tables).
    -- Idempotent (GRANT is), transactional, self-verifying.
    --

    BEGIN;

    -- service_role ships with Supabase; create it idempotently so this migration
    -- also applies to a plain-Postgres database. Same pattern as key 039.
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
            CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS;
        END IF;
    END
    $$;

    -- Held via PUBLIC today; granted by name so this does not depend on that.
    GRANT USAGE ON SCHEMA public TO service_role;

    -- 6 tables from key 029, relay_requests from key 030, 6 pillars from key
    -- 037, and playground — created by key 018, extended by key 037, written
    -- live by sentry rtv2.
    GRANT SELECT, INSERT, UPDATE, DELETE ON
        public.programs,
        public.runs,
        public.test_statuses,
        public.records,
        public.run_coverage,
        public.redteam_datasets,
        public.relay_requests,
        public.threat_modeling,
        public.threat_modeling_data,
        public.redteam_v2,
        public.redteam_v2_data,
        public.eval,
        public.eval_data,
        public.playground
    TO service_role;

    -- Tables created in public from here on inherit the grant. Applies only to
    -- objects created by the current role — `postgres` in all four apply paths
    -- (psql, the on-prem operator, the Supabase SQL editor).
    ALTER DEFAULT PRIVILEGES IN SCHEMA public
        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO service_role;

    -- No rtv2 table uses a sequence today. This is the same rule for the first
    -- one that does; the public/S default ACL grants service_role only `w`.
    ALTER DEFAULT PRIVILEGES IN SCHEMA public
        GRANT USAGE, SELECT ON SEQUENCES TO service_role;

    --
    -- Verify: a grant migration that grants nothing looks identical to one that
    -- works, so assert all four privileges on all 14 tables and the default rule.
    --
    DO $$
    DECLARE
        t       text;
        p       text;
        missing text := '';
    BEGIN
        FOREACH t IN ARRAY ARRAY[
            'programs', 'runs', 'test_statuses', 'records', 'run_coverage',
            'redteam_datasets', 'relay_requests', 'threat_modeling',
            'threat_modeling_data', 'redteam_v2', 'redteam_v2_data',
            'eval', 'eval_data', 'playground'
        ] LOOP
            FOREACH p IN ARRAY ARRAY['SELECT', 'INSERT', 'UPDATE', 'DELETE'] LOOP
                IF NOT has_table_privilege(
                    'service_role', format('public.%I', t), p
                ) THEN
                    missing := missing || t || '.' || p || ' ';
                END IF;
            END LOOP;
        END LOOP;

        IF missing <> '' THEN
            RAISE EXCEPTION 'FAILED: service_role lacks privilege(s): %', missing;
        END IF;

        IF NOT EXISTS (
            SELECT 1
            FROM pg_default_acl d
            JOIN pg_namespace n ON n.oid = d.defaclnamespace
            CROSS JOIN LATERAL aclexplode(d.defaclacl) a
            WHERE n.nspname = 'public'
              AND d.defaclobjtype = 'r'
              AND d.defaclrole = current_user::regrole
              AND a.grantee = 'service_role'::regrole
              AND a.privilege_type IN ('SELECT', 'INSERT', 'UPDATE', 'DELETE')
            GROUP BY d.oid
            HAVING count(DISTINCT a.privilege_type) = 4
        ) THEN
            RAISE EXCEPTION
                'FAILED: default privileges on TABLES in public not set for service_role';
        END IF;

        RAISE NOTICE 'SUCCESS: service_role has SELECT/INSERT/UPDATE/DELETE on 14 rtv2 tables and on tables created in public hereafter';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --
  047-fix-relay-status-comment.sql: |
    --
    -- Migration: 032_fix_relay_status_comment
    -- Description: Correct runs.relay_status's column comment, which names a status
    --              the code has never written.
    --
    --              015 documented the column as `Running | Paused | AgentOffline`.
    --              The transport writes `BridgeOffline` — the feature was renamed
    --              agent -> bridge before it shipped and the comment was missed. So
    --              anyone reading the schema to find out what this column can hold
    --              gets one of the three values wrong, and it is the interesting
    --              one: the value that means the customer's bridge went away.
    --
    --              A comment-only migration rather than an edit to 015, because 015
    --              is already applied everywhere. Editing it in place would leave
    --              every deployed database still describing AgentOffline while the
    --              repo claimed otherwise, which is worse than the current state.
    --
    --              Idempotent and re-runnable: COMMENT ON COLUMN is a plain
    --              overwrite. Safe to apply in any order relative to other
    --              migrations, since it only touches a comment.
    --
    -- Rollback:    restore the previous text (it is wrong, so there is no reason to)
    --                COMMENT ON COLUMN public.runs.relay_status IS
    --                  'Relay transport status for runs with connect_via_relay=true: Running | Paused | AgentOffline. NULL when relay is not in use.';
    --
    -- Apply:
    -- psql -h localhost -U postgres -d postgres -f database/dev/public/migrations/032_fix_relay_status_comment.sql
    --

    COMMENT ON COLUMN public.runs.relay_status IS
        'Relay transport status for runs with connect_via_relay=true: Running | Paused | BridgeOffline. NULL when relay is not in use.';

  048-add-skill-scanner-api-usage.sql: |
    --
    -- Migration: 033_add_skill_scanner_api_usage
    -- Description: Append-only usage log for the gated Skill Scanner GET APIs
    --              (GET /skill-hub/scans/{id}, its /report, and the scans list).
    --              One row per metered API call, written best-effort by Kong
    --              (enkrypt-skill-scanner log phase) via POST /api/skill-hub/usage.
    --              This is the license/metering source of truth for Skill Scanner
    --              API usage, and the sibling of mcp_hub_api_usage (migration 012)
    --              for the feature:skill_scanner_apis entitlement. RLS-locked like
    --              every other public business table (service_role backend only);
    --              see migration 011.
    --              Unlike mcp_hub_api_usage this also stores user_email: the
    --              upstream has no org column, so an email is the only ownership
    --              key it has. Note Kong files a scan under the ORG OWNER's email
    --              for org and project keys, so this column (the caller) and the
    --              scan's owner differ for a project member -- group by org_id.
    --              Identical for dev and prod (only the psql host/path below differ).
    -- psql -h localhost -U postgres -d postgres -f database/dev/public/migrations/033_add_skill_scanner_api_usage.sql
    --

    BEGIN;

    -- ============================================================================
    -- Table: skill_scanner_api_usage
    -- Append-only event log; rows are never updated. Aggregated per org per period
    -- for license enforcement/reporting. No FK on org_id by design: metering must
    -- never reject a write, and org identity spans multiple Supabase projects.
    -- ============================================================================

    CREATE TABLE IF NOT EXISTS public.skill_scanner_api_usage (
        id bigint GENERATED BY DEFAULT AS IDENTITY NOT NULL,
        org_id uuid NOT NULL,
        user_id text,
        user_email text,
        project_name text,
        endpoint text NOT NULL,
        http_method text DEFAULT 'GET'::text NOT NULL,
        scan_id text,
        response_status integer,
        request_id text,
        created_at timestamp with time zone DEFAULT now() NOT NULL
    );

    --
    -- Table / Column Comments
    --

    COMMENT ON TABLE public.skill_scanner_api_usage IS 'Append-only audit/usage-metrics log of gated Skill Scanner API GET calls (scan by id, scan report, scans list). Written best-effort by Kong (enkrypt-skill-scanner log phase) via POST /api/skill-hub/usage. The license itself is the time-boxed OpenFGA grant on feature:skill_scanner_apis; this table is for audit/reporting only. Sibling of mcp_hub_api_usage.';

    COMMENT ON COLUMN public.skill_scanner_api_usage.org_id IS 'Organization charged for this call (Kong consumer.org_id; matches org:<org_id> in OpenFGA).';

    COMMENT ON COLUMN public.skill_scanner_api_usage.user_id IS 'Acting identity that made the call (may equal org_id for owner accounts).';

    COMMENT ON COLUMN public.skill_scanner_api_usage.user_email IS 'Normalized (lower-cased) email of the CALLING consumer - who made this call. Not necessarily the email the scan is filed under: for an org or project API key Kong scopes scans to the org OWNER''s email so the whole org shares one view, so a project member appears here while their scans live under the owner. Use org_id to group by tenant.';

    COMMENT ON COLUMN public.skill_scanner_api_usage.endpoint IS 'Which gated endpoint: scan_get | scan_report | scans_list. Values are the path_config.kind strings from the Kong plugin.';

    COMMENT ON COLUMN public.skill_scanner_api_usage.scan_id IS 'Skill scan id for scan_get/scan_report; NULL for scans_list.';

    COMMENT ON COLUMN public.skill_scanner_api_usage.response_status IS 'Final HTTP status returned to the caller (lets reporting filter to successful 2xx calls).';

    COMMENT ON COLUMN public.skill_scanner_api_usage.request_id IS 'Kong request id; UNIQUE for idempotent at-least-once delivery (upsert on conflict do nothing).';

    --
    -- Surrogate primary key + idempotency key. Both guarded so the migration is
    -- safely re-runnable (unlike migration 012, which is not).
    --

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.table_constraints
        WHERE table_schema = 'public' AND table_name = 'skill_scanner_api_usage'
          AND constraint_name = 'skill_scanner_api_usage_pkey'
      ) THEN
        ALTER TABLE ONLY public.skill_scanner_api_usage
          ADD CONSTRAINT skill_scanner_api_usage_pkey PRIMARY KEY (id);
      END IF;

      -- One row per Kong request. Postgres treats NULLs as distinct, so a rare
      -- missing request_id still inserts (never blocks metering).
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.table_constraints
        WHERE table_schema = 'public' AND table_name = 'skill_scanner_api_usage'
          AND constraint_name = 'skill_scanner_api_usage_request_id_key'
      ) THEN
        ALTER TABLE ONLY public.skill_scanner_api_usage
          ADD CONSTRAINT skill_scanner_api_usage_request_id_key UNIQUE (request_id);
      END IF;
    END $$;

    --
    -- Row Level Security: locked (service_role backend only), matching the
    -- RESTRICTIVE deny-all posture established for every public table in 011.
    --

    -- anon / authenticated ship with Supabase, but not with a plain-Postgres
    -- dev/test or on-prem-operator database, where the policy below would fail with
    -- `role "anon" does not exist`. Create them idempotently — the same guard 014
    -- uses for `authenticated` and 022 uses for both.
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
            CREATE ROLE anon NOLOGIN NOINHERIT;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
            CREATE ROLE authenticated NOLOGIN NOINHERIT;
        END IF;
    END
    $$;

    ALTER TABLE public.skill_scanner_api_usage ENABLE ROW LEVEL SECURITY;

    DROP POLICY IF EXISTS deny_all_skill_scanner_api_usage ON public.skill_scanner_api_usage;

    CREATE POLICY deny_all_skill_scanner_api_usage
        ON public.skill_scanner_api_usage
        AS RESTRICTIVE FOR ALL TO anon, authenticated
        USING (false) WITH CHECK (false);

    --
    -- Indexes for license aggregation (count per org over a billing period)
    --

    CREATE INDEX IF NOT EXISTS idx_skill_scanner_api_usage_org_created
        ON public.skill_scanner_api_usage (org_id, created_at);

    CREATE INDEX IF NOT EXISTS idx_skill_scanner_api_usage_created
        ON public.skill_scanner_api_usage (created_at);

    --
    -- Verify the schema changes
    --

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.tables
        WHERE table_schema = 'public' AND table_name = 'skill_scanner_api_usage'
      ) THEN
        RAISE EXCEPTION 'FAILED: skill_scanner_api_usage table was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'skill_scanner_api_usage'
          AND column_name = 'user_email'
      ) THEN
        RAISE EXCEPTION 'FAILED: user_email column was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.table_constraints
        WHERE table_schema = 'public' AND table_name = 'skill_scanner_api_usage'
          AND constraint_name = 'skill_scanner_api_usage_request_id_key'
      ) THEN
        RAISE EXCEPTION 'FAILED: unique constraint on request_id was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_policy p
        JOIN pg_class c ON c.oid = p.polrelid
        JOIN pg_namespace ns ON ns.oid = c.relnamespace
        WHERE ns.nspname = 'public' AND c.relname = 'skill_scanner_api_usage'
          AND p.polname = 'deny_all_skill_scanner_api_usage'
      ) THEN
        RAISE EXCEPTION 'FAILED: deny-all RLS policy was not created';
      END IF;

      RAISE NOTICE 'SUCCESS: skill_scanner_api_usage table created and locked down';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --
kind: ConfigMap
metadata:
  name: supabase-migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,post-upgrade
    "helm.sh/hook-weight": "1"
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
