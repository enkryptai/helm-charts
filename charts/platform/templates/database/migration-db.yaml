  021-add-mcp-registry-table.sql: |
    --
    -- Migration: 006_add_mcp_registry_table
    -- Description: Introduce mcp_registry parent table; relink mcp_registry_servers to it via FK on registry_server_id_hash; add is_active toggle on mcp_registry_servers and mcp_gateways; relax mcp_registry_servers.job_id to nullable.
    --

    BEGIN;

    -- ============================================================================
    -- Table: mcp_registry
    -- Description: Registry namespace owning many mcp_registry_servers. One row per (user/org, project, registry_name).
    -- ============================================================================

    CREATE TABLE public.mcp_registry (
        id uuid NOT NULL,
        created_at timestamp with time zone DEFAULT now() NOT NULL,
        updated_at timestamp with time zone DEFAULT now() NOT NULL,
        registry_server_id bigint NOT NULL,
        registry_server_id_hash bigint,
        project_name text DEFAULT 'default'::text NOT NULL,
        registry_name text DEFAULT 'default'::text NOT NULL,
        created_by uuid,
        updated_by uuid,
        is_sample boolean DEFAULT false,
        is_deleted boolean DEFAULT false NOT NULL,
        CONSTRAINT mcp_registry_registry_name_check CHECK ((length(registry_name) < 33))
    );

    --
    -- Table Comments
    --

    COMMENT ON TABLE public.mcp_registry IS 'MCP Registry namespaces. One row per (user/org, project, registry_name); groups mcp_registry_servers.';

    COMMENT ON COLUMN public.mcp_registry.id IS 'Supabase user_id or org_id if this belongs to an Org';

    COMMENT ON COLUMN public.mcp_registry.registry_server_id IS 'Auto-increment registry ID';

    COMMENT ON COLUMN public.mcp_registry.registry_server_id_hash IS 'Hash of registry_server_id; FK target for mcp_registry_servers.registry_server_id_hash';

    COMMENT ON COLUMN public.mcp_registry.registry_name IS 'User-given name for the registry, defaults to "default"';

    --
    -- Sequence for registry_server_id
    --

    ALTER TABLE public.mcp_registry ALTER COLUMN registry_server_id ADD GENERATED BY DEFAULT AS IDENTITY (
        SEQUENCE NAME public.mcp_registry_registry_server_id_seq
        START WITH 1
        INCREMENT BY 1
        NO MINVALUE
        NO MAXVALUE
        CACHE 1
    );

    --
    -- Primary Key and Unique Constraints
    --

    ALTER TABLE ONLY public.mcp_registry
        ADD CONSTRAINT mcp_registry_pkey PRIMARY KEY (id, project_name, registry_name);

    ALTER TABLE ONLY public.mcp_registry
        ADD CONSTRAINT mcp_registry_registry_server_id_key UNIQUE (registry_server_id);

    ALTER TABLE ONLY public.mcp_registry
        ADD CONSTRAINT mcp_registry_registry_server_id_hash_key UNIQUE (registry_server_id_hash);

    --
    -- Foreign Key Constraints
    --

    ALTER TABLE ONLY public.mcp_registry
        ADD CONSTRAINT mcp_registry_id_fkey FOREIGN KEY (id) REFERENCES public.profiles(id) ON UPDATE CASCADE ON DELETE CASCADE;

    ALTER TABLE ONLY public.mcp_registry
        ADD CONSTRAINT mcp_registry_created_by_fkey FOREIGN KEY (created_by) REFERENCES public.profiles(id) ON UPDATE CASCADE;

    ALTER TABLE ONLY public.mcp_registry
        ADD CONSTRAINT mcp_registry_updated_by_fkey FOREIGN KEY (updated_by) REFERENCES public.profiles(id) ON UPDATE CASCADE;

    --
    -- Row Level Security
    --

    ALTER TABLE public.mcp_registry ENABLE ROW LEVEL SECURITY;

    --
    -- Indexes for query performance
    --

    CREATE INDEX idx_mcp_registry_user_project
        ON public.mcp_registry (id, project_name)
        WHERE is_deleted = false;

    CREATE INDEX idx_mcp_registry_is_deleted
        ON public.mcp_registry (is_deleted);


    -- ============================================================================
    -- Alter: mcp_registry_servers
    -- Description: Drop per-row registry_server_id; FK registry_server_id_hash to mcp_registry; add is_active.
    -- ============================================================================

    ALTER TABLE public.mcp_registry_servers
        DROP CONSTRAINT mcp_registry_servers_registry_server_id_key;

    ALTER TABLE public.mcp_registry_servers
        DROP COLUMN registry_server_id;

    ALTER TABLE public.mcp_registry_servers
        ALTER COLUMN registry_server_id_hash SET NOT NULL;

    ALTER TABLE ONLY public.mcp_registry_servers
        ADD CONSTRAINT mcp_registry_servers_registry_server_id_hash_fkey
        FOREIGN KEY (registry_server_id_hash)
        REFERENCES public.mcp_registry(registry_server_id_hash)
        ON UPDATE CASCADE
        ON DELETE CASCADE;

    CREATE INDEX idx_mcp_registry_servers_registry_hash
        ON public.mcp_registry_servers (registry_server_id_hash);

    ALTER TABLE public.mcp_registry_servers
        ADD COLUMN is_active boolean DEFAULT true NOT NULL;

    COMMENT ON COLUMN public.mcp_registry_servers.is_active IS 'Whether this server is currently enabled. Distinct from is_deleted: an inactive server is hidden from gateway resolution but not soft-deleted.';

    ALTER TABLE public.mcp_registry_servers
        ALTER COLUMN job_id DROP NOT NULL;


    -- ============================================================================
    -- Alter: mcp_gateways
    -- Description: Add is_active toggle, parallel to mcp_registry_servers.
    -- ============================================================================

    ALTER TABLE public.mcp_gateways
        ADD COLUMN is_active boolean DEFAULT true NOT NULL;

    COMMENT ON COLUMN public.mcp_gateways.is_active IS 'Whether this gateway is currently enabled. Distinct from is_deleted: an inactive gateway stops serving traffic but is not soft-deleted.';

    --
    -- Verify the schema changes
    --

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.tables
        WHERE table_schema = 'public' AND table_name = 'mcp_registry'
      ) THEN
        RAISE EXCEPTION 'FAILED: mcp_registry table was not created';
      END IF;

      IF EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'mcp_registry_servers' AND column_name = 'registry_server_id'
      ) THEN
        RAISE EXCEPTION 'FAILED: mcp_registry_servers.registry_server_id was not dropped';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'mcp_registry_servers' AND column_name = 'is_active'
      ) THEN
        RAISE EXCEPTION 'FAILED: mcp_registry_servers.is_active was not added';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.table_constraints
        WHERE table_schema = 'public' AND table_name = 'mcp_registry_servers' AND constraint_name = 'mcp_registry_servers_registry_server_id_hash_fkey'
      ) THEN
        RAISE EXCEPTION 'FAILED: FK mcp_registry_servers_registry_server_id_hash_fkey was not created';
      END IF;

      IF EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'mcp_registry_servers' AND column_name = 'job_id' AND is_nullable = 'NO'
      ) THEN
        RAISE EXCEPTION 'FAILED: mcp_registry_servers.job_id is still NOT NULL';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'mcp_gateways' AND column_name = 'is_active'
      ) THEN
        RAISE EXCEPTION 'FAILED: mcp_gateways.is_active was not added';
      END IF;

      RAISE NOTICE 'SUCCESS: mcp_registry table created and mcp_registry_servers relinked';
    END $$;

    COMMIT;

    --
    -- Migration Complete
