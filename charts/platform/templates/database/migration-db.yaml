  022-add-mcp-registry-servers-scan-metadata.sql: |
    --
    -- Migration: 007_add_mcp_registry_servers_scan_metadata
    -- Description: Add scan-classification columns to mcp_registry_servers — server_type (MCP_SERVER_TYPE enum: source|hosted, default 'source'), is_official (default false), is_private (default false). Populated by Kong on POST /mcp-registry/add-server from the mcp-scanner's /scan/{job_id}/status response headers (x-enkrypt-scan-type, x-enkrypt-is-official, x-enkrypt-is-private). Manually-configured servers (no job_id) fall back to the defaults.
    -- psql -h localhost -U postgres -d postgres -f database/dev/public/migrations/007_add_mcp_registry_servers_scan_metadata.sql
    --

    BEGIN;

    -- ============================================================================
    -- Enum: MCP_SERVER_TYPE
    -- Description: Classification of how an MCP server is delivered. "source" =
    --              code-based / packaged server scanned from source; "hosted" =
    --              remote endpoint scanned via its hosted URL.
    -- ============================================================================

    CREATE TYPE public."MCP_SERVER_TYPE" AS ENUM (
        'source',
        'hosted'
    );

    COMMENT ON TYPE public."MCP_SERVER_TYPE" IS 'MCP server delivery classification: source (packaged/code-based) or hosted (remote endpoint).';


    -- ============================================================================
    -- Alter: mcp_registry_servers
    -- Description: Add server_type / is_official / is_private from scanner metadata.
    -- ============================================================================

    ALTER TABLE public.mcp_registry_servers
        ADD COLUMN server_type public."MCP_SERVER_TYPE" DEFAULT 'source'::public."MCP_SERVER_TYPE" NOT NULL,
        ADD COLUMN is_official boolean DEFAULT false NOT NULL,
        ADD COLUMN is_private boolean DEFAULT false NOT NULL;

    COMMENT ON COLUMN public.mcp_registry_servers.server_type IS 'Scanner-emitted server classification — see MCP_SERVER_TYPE enum. Defaults to ''source'' for manually-configured servers with no associated scan job. Injected by Kong from the mcp-scanner /scan/{job_id}/status response header x-enkrypt-scan-type.';

    COMMENT ON COLUMN public.mcp_registry_servers.is_official IS 'Whether the upstream MCP server is recognized as an official/verified server. Injected by Kong from the mcp-scanner /scan/{job_id}/status response header x-enkrypt-is-official. Defaults to false when no scan metadata is available.';

    COMMENT ON COLUMN public.mcp_registry_servers.is_private IS 'Whether the scan was registered as private (org-scoped) versus public. Injected by Kong from the mcp-scanner /scan/{job_id}/status response header x-enkrypt-is-private. Defaults to false when no scan metadata is available.';


    --
    -- Verify the schema changes
    --

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM pg_type t
        JOIN pg_namespace n ON n.oid = t.typnamespace
        WHERE n.nspname = 'public' AND t.typname = 'MCP_SERVER_TYPE'
      ) THEN
        RAISE EXCEPTION 'FAILED: MCP_SERVER_TYPE enum was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'mcp_registry_servers' AND column_name = 'server_type'
      ) THEN
        RAISE EXCEPTION 'FAILED: mcp_registry_servers.server_type was not added';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'mcp_registry_servers' AND column_name = 'is_official'
      ) THEN
        RAISE EXCEPTION 'FAILED: mcp_registry_servers.is_official was not added';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'mcp_registry_servers' AND column_name = 'is_private'
      ) THEN
        RAISE EXCEPTION 'FAILED: mcp_registry_servers.is_private was not added';
      END IF;

      RAISE NOTICE 'SUCCESS: mcp_registry_servers scanner-metadata columns added';
    END $$;

    COMMIT;

