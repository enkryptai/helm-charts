    --
    -- Name: bulk_decrypt_keys(text[], text); Type: FUNCTION; Schema: public; Owner: -
    --
    
    CREATE OR REPLACE FUNCTION public.bulk_decrypt_keys(encrypted_data text[], encryption_key text) RETURNS text[]
        LANGUAGE plpgsql SECURITY DEFINER
        AS $$
    DECLARE
      result TEXT[];
    BEGIN
      SELECT array_agg(extensions.pgp_sym_decrypt(decode(d, 'base64'), encryption_key))
      INTO result
      FROM unnest(encrypted_data) d;
      RETURN result;
    END;
    $$;
    
    
    --
    -- Name: create_user_on_signup(); Type: FUNCTION; Schema: public; Owner: -
    --
    
    CREATE OR REPLACE FUNCTION public.create_user_on_signup() RETURNS trigger
        LANGUAGE plpgsql SECURITY DEFINER
        AS $$begin
      raise log 'Creating a profile entry for: %', email;
      insert into public.profiles (id, email)
      values(
        new.id,
        new.raw_user_meta_data ->> 'email'
      );
      raise log 'Creating a subscription entry for: %', email;
      insert into public.subscription (id, email)
      values(
        new.id,
        new.email
      );
      return new;
    end;$$;
    
    
    --
    -- Name: custom_access_token_hook(jsonb); Type: FUNCTION; Schema: public; Owner: -
    --
    
    CREATE OR REPLACE FUNCTION public.custom_access_token_hook(event jsonb) RETURNS jsonb
        LANGUAGE plpgsql STABLE
        AS $$DECLARE
          claims JSONB;
          user_id UUID;
          user_subscription JSONB;
          user_profile JSONB;
        BEGIN
          -- Extract user_id from the event
          user_id := (event ->> 'user_id')::UUID;
          
          -- Initialize claims
          claims := event -> 'claims';
    
          -- Try to get user subscription
          BEGIN
            SELECT jsonb_build_object('consumer_id', consumer_id, 'plan_name', plan_name,'org_id',org_id,'are_samples_created',are_samples_created,'red_team_usage_remaining',red_team_usage_remaining)
            INTO user_subscription
            FROM public.subscription
            WHERE id = user_id;
          EXCEPTION 
            WHEN NO_DATA_FOUND THEN
              user_subscription := NULL;
          END;
    
          -- Try to get user profile
          BEGIN
            SELECT to_jsonb(p) INTO user_profile
            FROM public.profiles p
            WHERE id = user_id;
          EXCEPTION 
            WHEN NO_DATA_FOUND THEN
              user_profile := NULL;
          END;
    
          -- Set the claims, even if they're NULL
          claims := jsonb_set(claims, '{user_subscription}', COALESCE(user_subscription, 'null'::jsonb));
          claims := jsonb_set(claims, '{user_profile}', COALESCE(user_profile, 'null'::jsonb));
    
          -- Update the 'claims' object in the original event
          event := jsonb_set(event, '{claims}', claims);
    
          -- Always return the event, even if no data was found
          RETURN event;
        END;$$;
    
    
    --
    -- Name: decrypt_key(text, text); Type: FUNCTION; Schema: public; Owner: -
    --
    
    CREATE OR REPLACE FUNCTION public.decrypt_key(encrypted_data text, key text) RETURNS text
        LANGUAGE plpgsql SECURITY DEFINER
        AS $$
    BEGIN
      RETURN extentions.pgp_sym_decrypt(decode(encrypted_data, 'base64'), key);
    END;
    $$;
    
    
    --
    -- Name: encrypt_api_key(); Type: FUNCTION; Schema: public; Owner: -
    --
    
    CREATE OR REPLACE FUNCTION public.encrypt_api_key() RETURNS trigger
        LANGUAGE plpgsql
        AS $$
    BEGIN
        -- Encrypt the api_key using pgp_sym_encrypt and the passphrase
        NEW.api_key := extensions.pgp_sym_encrypt(NEW.key, 'your-passphrase');
        RETURN NEW;
    END;
    $$;
    
    
    --
    -- Name: encrypt_key(text, text); Type: FUNCTION; Schema: public; Owner: -
    --
    
    CREATE OR REPLACE FUNCTION public.encrypt_key(data text, key text) RETURNS text
        LANGUAGE plpgsql SECURITY DEFINER
        AS $$
    BEGIN
      RETURN encode(extensions.pgp_sym_encrypt(data, key), 'base64');
    END;
    $$;
    
    
    --
    -- Name: fetch_test_names(); Type: FUNCTION; Schema: public; Owner: -
    --
    
    CREATE OR REPLACE FUNCTION public.fetch_test_names() RETURNS TABLE(id integer, test_name text)
        LANGUAGE plpgsql
        AS $$
    BEGIN
        RETURN QUERY
        SELECT id, test_name
        FROM public.red_teaming
        ORDER BY id;
    END;
    $$;
    
    
