    --
    -- Name: search_models_by_testing_for(uuid, text); Type: FUNCTION; Schema: public; Owner: -
    --
    
    CREATE OR REPLACE FUNCTION public.search_models_by_testing_for(user_id uuid, search_pattern text) RETURNS SETOF public.models
        LANGUAGE plpgsql
        AS $$
    BEGIN
      -- Fetch and return the query results, which will be an empty set if no rows match
      RETURN QUERY
      SELECT *
      FROM models
      WHERE id = user_id
      AND testing_for::text ILIKE search_pattern;
    END;
    $$;
    
    
