  004-custom-access-hook.sql: "CREATE OR REPLACE FUNCTION public.custom_access_token_hook(event
    jsonb)\n     RETURNS jsonb\n     LANGUAGE plpgsql\n     STABLE\n    AS $function$DECLARE\n
    \     claims JSONB;\n      user_id UUID;\n      user_subscription JSONB;\n      user_profile
    JSONB;\n    BEGIN\n      -- Extract user_id from the event\n      user_id := (event
    ->> 'user_id')::UUID;\n      \n      -- Initialize claims\n      claims := event
    -> 'claims';\n\n      -- Try to get user subscription\n      BEGIN\n        SELECT
    jsonb_build_object('consumer_id', consumer_id, 'plan_name', plan_name,'org_id',org_id,'are_samples_created',are_samples_created,'red_team_usage_remaining',red_team_usage_remaining)\n
    \       INTO user_subscription\n        FROM public.subscription\n        WHERE
    id = user_id;\n      EXCEPTION \n        WHEN NO_DATA_FOUND THEN\n          user_subscription
    := NULL;\n      END;\n\n      -- Try to get user profile\n      BEGIN\n        SELECT
    to_jsonb(p) INTO user_profile\n        FROM public.profiles p\n        WHERE id
    = user_id;\n      EXCEPTION \n        WHEN NO_DATA_FOUND THEN\n          user_profile
    := NULL;\n      END;\n\n      -- Set the claims, even if they're NULL\n      claims
    := jsonb_set(claims, '{user_subscription}', COALESCE(user_subscription, 'null'::jsonb));\n
    \     claims := jsonb_set(claims, '{user_profile}', COALESCE(user_profile, 'null'::jsonb));\n\n
    \     -- Update the 'claims' object in the original event\n      event := jsonb_set(event,
    '{claims}', claims);\n\n      -- Always return the event, even if no data was
    found\n      RETURN event;\n    END;$function$\n\n"
