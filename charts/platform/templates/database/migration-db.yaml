  030-rtv2-relay-runs-status-and-requests.sql: |
    --
    -- Migration: 015_rtv2_relay_runs_status_and_requests
    -- Description: Relay schema additions for the in-pod relay path (sentry-redteam
    --              rtv2). Consolidates the two in-tree migrations 0008 and 0009 from
    --                src/sentry-redteam/sentry/redteam/storage/migrations/
    --              into a single forward step. Two pieces:
    --
    --                1. runs.relay_status / runs.relay_status_at - surface customer-
    --                   agent connectivity per run when connect_via_relay=true. NULL
    --                   for runs that do not opt in.
    --
    --                2. relay_requests - durable per-call log keyed by a deterministic
    --                   5-tuple (tenant_id, user_id, agent_id, job_id,
    --                   client_request_id) so retries / resumes idempotently hit the
    --                   same row instead of double-billing the customer's LLM.
    --                   Lifecycle: pending -> finished | failed; 'finished' rows
    --                   short-circuit subsequent calls with the same key.
    --
    --              Both pieces are gated on the application's connect_via_relay flag
    --              - runs that do not opt in never write to these columns or this
    --              table. Forward-only and additive.
    --
    -- Requires:    Migration 014 (runs table must exist).
    -- Identical for dev and prod (only the psql host/path below differ).
    -- psql -h localhost -U postgres -d postgres -f database/dev/public/migrations/015_rtv2_relay_runs_status_and_requests.sql
    --

    BEGIN;

    -- ============================================================================
    -- runs.relay_status / runs.relay_status_at
    -- Run-level snapshot of the relay transport's view of the customer agent. The
    -- UI / API can show 'Paused' instead of looking frozen while the relay is
    -- inside its offline grace-wait.
    -- ============================================================================
    ALTER TABLE public.runs
        ADD COLUMN IF NOT EXISTS relay_status    TEXT,
        ADD COLUMN IF NOT EXISTS relay_status_at TIMESTAMPTZ;

    COMMENT ON COLUMN public.runs.relay_status IS
        'Relay transport status for runs with connect_via_relay=true: Running | Paused | AgentOffline. NULL when relay is not in use.';

    COMMENT ON COLUMN public.runs.relay_status_at IS
        'Timestamp of the last relay_status write. NULL when relay is not in use.';

    -- ============================================================================
    -- relay_requests
    -- Durable per-call log + idempotency cache for the relay transport. Workers
    -- write one row per logical LLM call routed through the relay. The 5-tuple
    -- UNIQUE makes the row deterministic across retries / restarts.
    -- ============================================================================
    CREATE TABLE IF NOT EXISTS public.relay_requests (
        id                   UUID PRIMARY KEY DEFAULT gen_random_uuid(),

        -- Durable 5-tuple key. tenant_id / user_id / job_id default to '' so
        -- single-tenant or ad-hoc-test callers don't need to coordinate these.
        tenant_id            TEXT NOT NULL DEFAULT '',
        user_id              TEXT NOT NULL DEFAULT '',
        agent_id             TEXT NOT NULL,
        job_id               TEXT NOT NULL DEFAULT '',
        client_request_id    TEXT NOT NULL,

        status               TEXT NOT NULL CHECK (status IN ('pending','finished','failed')),

        -- Request snapshot (for forensics / replay).
        method               TEXT,
        target_url           TEXT,
        request_body         TEXT,
        timeout_s            REAL,

        -- Response snapshot (populated when status='finished').
        response_status_code INT,
        response_headers     JSONB,
        response_body        TEXT,
        error                TEXT,
        request_id           TEXT,

        created_at           TIMESTAMPTZ NOT NULL DEFAULT now(),
        started_at           TIMESTAMPTZ,
        finished_at          TIMESTAMPTZ,

        CONSTRAINT relay_requests_unique_key
            UNIQUE (tenant_id, user_id, agent_id, job_id, client_request_id)
    );

    -- Read path: "show me the most recent relay calls for tenant X, agent Y".
    CREATE INDEX IF NOT EXISTS idx_relay_requests_tenant_agent
        ON public.relay_requests (tenant_id, agent_id, created_at DESC);

    -- Pause/stuck detection: "any rows stuck in pending for too long?".
    CREATE INDEX IF NOT EXISTS idx_relay_requests_pending
        ON public.relay_requests (created_at)
        WHERE status = 'pending';

    -- ============================================================================
    -- RLS
    -- relay_requests is a service-role-only table (workers + ops queries only -
    -- never exposed to authenticated tenant traffic). Deny-all policy on the
    -- 'authenticated' role; the service_role backend (which bypasses RLS) still
    -- reads and writes normally. Same pattern as migration 011_lockdown_rls_no_policy
    -- applied to other internal tables.
    -- ============================================================================
    ALTER TABLE public.relay_requests ENABLE ROW LEVEL SECURITY;
    DROP POLICY IF EXISTS deny_all_relay_requests ON public.relay_requests;
    CREATE POLICY deny_all_relay_requests ON public.relay_requests
        FOR ALL
        TO authenticated
        USING      (false)
        WITH CHECK (false);

    -- ============================================================================
    -- Verify
    -- ============================================================================
    DO $$
    BEGIN
        IF NOT EXISTS (
            SELECT 1 FROM information_schema.columns
            WHERE table_schema = 'public' AND table_name = 'runs'
              AND column_name = 'relay_status'
        ) THEN
            RAISE EXCEPTION 'FAILED: runs.relay_status column was not added';
        END IF;

        IF NOT EXISTS (
            SELECT 1 FROM information_schema.columns
            WHERE table_schema = 'public' AND table_name = 'runs'
              AND column_name = 'relay_status_at'
        ) THEN
            RAISE EXCEPTION 'FAILED: runs.relay_status_at column was not added';
        END IF;

        IF NOT EXISTS (
            SELECT 1 FROM information_schema.tables
            WHERE table_schema = 'public' AND table_name = 'relay_requests'
        ) THEN
            RAISE EXCEPTION 'FAILED: relay_requests table was not created';
        END IF;

        IF NOT EXISTS (
            SELECT 1 FROM information_schema.table_constraints
            WHERE table_schema = 'public' AND table_name = 'relay_requests'
              AND constraint_name = 'relay_requests_unique_key'
        ) THEN
            RAISE EXCEPTION 'FAILED: relay_requests 5-tuple unique constraint missing';
        END IF;

        IF NOT EXISTS (
            SELECT 1 FROM pg_policy p
            JOIN pg_class c ON c.oid = p.polrelid
            JOIN pg_namespace ns ON ns.oid = c.relnamespace
            WHERE ns.nspname = 'public' AND c.relname = 'relay_requests'
              AND p.polname = 'deny_all_relay_requests'
        ) THEN
            RAISE EXCEPTION 'FAILED: deny-all RLS policy on relay_requests was not created';
        END IF;

        RAISE NOTICE 'SUCCESS: runs.relay_status / relay_status_at added; relay_requests table + idempotency key + RLS lockdown applied.';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --

  031-rtv2-records-source-add-attack.sql: |
    --
    -- Migration: 016_rtv2_records_source_add_attack
    -- Description: Add 'attack' to the records.source CHECK constraint.
    --
    --              The rtv2 attack pillar (sentry-redteam
    --              coordinator/worker_handlers.attack_handler) persists each
    --              attack-produced trace as a records row with source='attack'.
    --              Key 029 created records_source_check without 'attack', so
    --              every attack-cell persistence failed with a check_violation
    --              and runs never reached 'completed'. Forward-only, idempotent.
    --
    -- Requires:    key 029 (records table + records_source_check must exist).
    --
    BEGIN;

    ALTER TABLE public.records DROP CONSTRAINT IF EXISTS records_source_check;
    ALTER TABLE public.records
        ADD CONSTRAINT records_source_check
        CHECK (source IN ('static', 'custom_generated', 'custom_dataset', 'eval', 'attack'));

    DO $$
    BEGIN
        IF NOT EXISTS (
            SELECT 1 FROM pg_constraint
            WHERE conname = 'records_source_check'
              AND pg_get_constraintdef(oid) LIKE '%attack%'
        ) THEN
            RAISE EXCEPTION 'FAILED: records_source_check does not allow source=attack';
        END IF;

        RAISE NOTICE 'SUCCESS: records.source CHECK now allows attack.';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --

  032-add-credit-metering.sql: |
    --
    -- Migration: 017_add_credit_metering
    -- Description: Credit-based metering for Guardrails (GR) and Red Team (RT),
    --              deployed side-by-side with the existing request-count metering.
    --              Adds per-subscription credit balances + a per-family metering
    --              mode flag (NULL = inherit credits_config.enforcement.default_mode;
    --              'requests' keeps legacy behavior, 'shadow' accounts without
    --              gating, 'credits' enforces), plus an RLS-locked GR audit ledger:
    --                * gr_credit_usage  — append-only audit for GR trueup deltas and
    --                  sampled access-mode rows (observability/dispute only).
    --              (rev-5 / M6: RT credits are metered in Kong against the KeyDB usage
    --              hash — there is NO rt_credit_usage reservation ledger; rt_credits_used
    --              is the flat balance, debited in KeyDB and flushed to Postgres.)
    --              Legacy columns (guardrails_request_limit / guardrails_requests_used
    --              / red_team_usage_remaining) are intentionally NOT touched: the
    --              legacy counters keep running in every mode, which IS the rollback
    --              story (DESIGN.md §5.0 invariant #2).
    --              Numbered 017 — 014/015/016 are claimed by the in-flight rtv2
    --              branch (apiaas feat/rtv2-schema-and-relay) so this stays
    --              collision-free regardless of merge order; gaps are harmless.
    --              RLS-locked like every other public business table (service_role
    --              backend only); see migrations 011/012.
    --              Identical for dev and prod (only the psql host/path below differ).
    -- psql -h localhost -U postgres -d postgres -f database/dev/public/migrations/017_add_credit_metering.sql
    --

    BEGIN;

    -- ============================================================================
    -- Part 1: subscription — additive credit-metering columns
    -- Every new column is nullable or defaulted so existing rows stay valid. NOTHING
    -- here alters the legacy request-metering columns (invariant #2 / rollback).
    -- ============================================================================

    ALTER TABLE public.subscription
        ADD COLUMN gr_metering_mode text,
        ADD COLUMN rt_metering_mode text,
        ADD COLUMN gr_credits_limit integer,
        ADD COLUMN gr_credits_used integer DEFAULT 0 NOT NULL,
        ADD COLUMN rt_credits_limit integer,
        ADD COLUMN rt_credits_used integer DEFAULT 0 NOT NULL,
        ADD COLUMN rt_credits_reset_at timestamp with time zone,
        ADD COLUMN old_gr_credits_limit integer,
        ADD COLUMN old_gr_credits_used integer;

    -- Per-family metering mode. NULL = inherit the global default_mode; an explicit
    -- value overrides for a single account (the per-org pilot switch). CHECK passes
    -- on NULL, so unset columns are valid.
    ALTER TABLE public.subscription
        ADD CONSTRAINT subscription_gr_metering_mode_check
            CHECK (gr_metering_mode IN ('requests', 'shadow', 'credits')),
        ADD CONSTRAINT subscription_rt_metering_mode_check
            CHECK (rt_metering_mode IN ('requests', 'shadow', 'credits'));

    COMMENT ON COLUMN public.subscription.gr_metering_mode IS 'Guardrails metering mode: requests|shadow|credits. NULL = inherit credits_config.enforcement.default_mode. Only the Kong access-phase gate branches on this; accounting is mode-independent (DESIGN.md §5.0 invariant #1).';
    COMMENT ON COLUMN public.subscription.rt_metering_mode IS 'Red Team metering mode: requests|shadow|credits. NULL = inherit default_mode. See gr_metering_mode.';
    COMMENT ON COLUMN public.subscription.gr_credits_limit IS 'GR credit allowance for the current window. -1 = gate-only (unlimited but still tracked). NULL = not yet provisioned (inherit plan grant).';
    COMMENT ON COLUMN public.subscription.gr_credits_used IS 'GR credits consumed in the current window; reconciled from KeyDB HINCRBY counters via PATCH (GREATEST-within-window). Window staleness is keyed on the EXISTING guardrails_usage_updated_at (GR requests and GR credits share one GR window and flush together) — there is no separate GR credit marker. Legacy guardrails_requests_used keeps running in parallel.';
    COMMENT ON COLUMN public.subscription.rt_credits_limit IS 'RT credit allowance for the current window. -1 = gate-only. NULL = inherit plan grant.';
    COMMENT ON COLUMN public.subscription.rt_credits_used IS 'RT credits debited in the current window. rev-5 (M6): Kong debits this in the KeyDB usage hash (the gating authority) and flushes it here on a 500-credit boundary crossing (GREATEST-within-window durability mirror). Reset to 0 on a credits flip (rt_credits_reset_at marks the window).';
    COMMENT ON COLUMN public.subscription.rt_credits_reset_at IS 'RT credit window epoch. Set to now() by the flip route on a flip to shadow/credits and by the Stripe webhook on a plan change/cancel — marks a fresh RT credit window (rt_credits_used re-seeded to 0). NULL = no explicit reset (anniversary window governs).';
    COMMENT ON COLUMN public.subscription.old_gr_credits_limit IS 'Previous-window GR credit limit, retained on downgrade so a higher old allowance can stay active until old_plan_expires_at (mirrors old_guardrails_request_limit).';
    COMMENT ON COLUMN public.subscription.old_gr_credits_used IS 'GR credits used under the previous plan window (mirrors old_guardrails_requests_used).';

    -- ============================================================================
    -- Part 2: gr_credit_usage  (audit — trueup deltas + sampled rows only)
    -- Append-only. NOT the balance authority (subscription holds the balance); this
    -- captures trueup reconciliation deltas and a sampled fraction of access-mode
    -- calls for observability/dispute resolution. Never blocks metering.
    -- ============================================================================

    CREATE TABLE public.gr_credit_usage (
        id bigint NOT NULL,
        org_id uuid NOT NULL,
        user_id text,
        project_name text,
        endpoint text,
        request_id text,
        billing_mode text,
        reserved_credits integer,
        final_credits integer,
        delta_credits integer,
        sampled boolean DEFAULT false NOT NULL,
        response_status integer,
        created_at timestamp with time zone DEFAULT now() NOT NULL
    );

    COMMENT ON TABLE public.gr_credit_usage IS 'Append-only GR credit audit log: trueup reconciliation deltas (reserved vs final, e.g. scan-url/scan-pdf) plus a sampled fraction of access-mode calls (credits_config default_sample_percentage). Audit/observability only — subscription.gr_credits_used is the balance authority. Written best-effort by Kong (enkrypt-guardrails log phase) via POST /api/credits/usage.';
    COMMENT ON COLUMN public.gr_credit_usage.request_id IS 'Kong request id; UNIQUE for idempotent at-least-once delivery (NULLs are distinct, so a rare missing id still inserts and never blocks metering).';
    COMMENT ON COLUMN public.gr_credit_usage.billing_mode IS 'Pricing pipeline that produced the charge: access | flat | trueup.';
    COMMENT ON COLUMN public.gr_credit_usage.reserved_credits IS 'Credits reserved at access time (trueup only); NULL for pure access/flat.';
    COMMENT ON COLUMN public.gr_credit_usage.final_credits IS 'Final credits charged for the call.';
    COMMENT ON COLUMN public.gr_credit_usage.delta_credits IS 'Trueup settlement delta = final - reserved (capped per credits_config); NULL for non-trueup.';
    COMMENT ON COLUMN public.gr_credit_usage.sampled IS 'TRUE if this row was written by access-mode sampling rather than a trueup reconciliation.';

    ALTER TABLE public.gr_credit_usage ALTER COLUMN id ADD GENERATED BY DEFAULT AS IDENTITY (
        SEQUENCE NAME public.gr_credit_usage_id_seq
        START WITH 1
        INCREMENT BY 1
        NO MINVALUE
        NO MAXVALUE
        CACHE 1
    );

    ALTER TABLE ONLY public.gr_credit_usage
        ADD CONSTRAINT gr_credit_usage_pkey PRIMARY KEY (id);

    -- Idempotency key: one row per Kong request. NULLs are distinct, so a rare
    -- missing request_id still inserts (never blocks metering).
    ALTER TABLE ONLY public.gr_credit_usage
        ADD CONSTRAINT gr_credit_usage_request_id_key UNIQUE (request_id);

    ALTER TABLE public.gr_credit_usage ENABLE ROW LEVEL SECURITY;

    CREATE POLICY deny_all_gr_credit_usage
        ON public.gr_credit_usage
        AS RESTRICTIVE FOR ALL TO anon, authenticated
        USING (false) WITH CHECK (false);

    CREATE INDEX idx_gr_credit_usage_org_created
        ON public.gr_credit_usage (org_id, created_at);

    CREATE INDEX idx_gr_credit_usage_created
        ON public.gr_credit_usage (created_at);

    -- ============================================================================
    -- Verify the schema changes
    -- ============================================================================

    DO $$
    BEGIN
      -- subscription columns
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'subscription'
          AND column_name = 'gr_metering_mode'
      ) THEN
        RAISE EXCEPTION 'FAILED: subscription.gr_metering_mode was not added';
      END IF;

      -- mode CHECK constraint present
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.table_constraints
        WHERE table_schema = 'public' AND table_name = 'subscription'
          AND constraint_name = 'subscription_rt_metering_mode_check'
      ) THEN
        RAISE EXCEPTION 'FAILED: subscription rt_metering_mode CHECK was not added';
      END IF;

      -- gr_credit_usage table + RLS
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.tables
        WHERE table_schema = 'public' AND table_name = 'gr_credit_usage'
      ) THEN
        RAISE EXCEPTION 'FAILED: gr_credit_usage table was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_policy p
        JOIN pg_class c ON c.oid = p.polrelid
        JOIN pg_namespace ns ON ns.oid = c.relnamespace
        WHERE ns.nspname = 'public' AND c.relname = 'gr_credit_usage'
          AND p.polname = 'deny_all_gr_credit_usage'
      ) THEN
        RAISE EXCEPTION 'FAILED: deny-all RLS policy on gr_credit_usage was not created';
      END IF;

      RAISE NOTICE 'SUCCESS: credit-metering schema (subscription columns + gr_credit_usage) created and locked down';
    END $$;

    COMMIT;

    --
    -- Rollback (manual; run inside a transaction if the feature is retired):
    --   BEGIN;
    --   DROP TABLE IF EXISTS public.gr_credit_usage;
    --   ALTER TABLE public.subscription
    --     DROP CONSTRAINT IF EXISTS subscription_gr_metering_mode_check,
    --     DROP CONSTRAINT IF EXISTS subscription_rt_metering_mode_check,
    --     DROP COLUMN IF EXISTS gr_metering_mode,
    --     DROP COLUMN IF EXISTS rt_metering_mode,
    --     DROP COLUMN IF EXISTS gr_credits_limit,
    --     DROP COLUMN IF EXISTS gr_credits_used,
    --     DROP COLUMN IF EXISTS rt_credits_limit,
    --     DROP COLUMN IF EXISTS rt_credits_used,
    --     DROP COLUMN IF EXISTS rt_credits_reset_at,
    --     DROP COLUMN IF EXISTS old_gr_credits_limit,
    --     DROP COLUMN IF EXISTS old_gr_credits_used;
    --   COMMIT;
    -- Dropping columns discards accumulated credit balances. Because the legacy
    -- request counters never stopped (invariant #2), request-mode billing is
    -- unaffected by this rollback.
    --
    -- Migration Complete
    --

  033-project-credit-limits.sql: |
    --
    -- Migration: 018_project_credit_limits
    -- Description: Per-project credit limits, layered on top of the org credit
    --              metering added in 017. Adds per-project credit balances + optional
    --              per-project limits to public.projects (keyed (id = org_id, name =
    --              project_name)):
    --                * gr_credits_used / rt_credits_used  — durability mirror of the
    --                  per-project KeyDB usage hash (guardrails_usage|org_id:<org>|
    --                  project:<name>), reconciled by Kong via the existing GR/RT
    --                  usage flushes (GREATEST-within-window). KeyDB is the authority.
    --                * gr_credits_limit / rt_credits_limit — OPTIONAL per-project
    --                  allowance. NULL = no project limit (usage still tracked). In
    --                  credits mode the limit is ENFORCED: a project over its own
    --                  limit is 402-blocked even while the org still has credits
    --                  (limits may over-allocate; the org gate still caps the total).
    --                  No -1 semantics (unlike the org columns): "no limit" is NULL.
    --              Additive only — every column is nullable or defaulted so existing
    --              rows stay valid. Legacy projects.guardrails_req_used and all 017
    --              columns are intentionally untouched (invariant #2 / rollback).
    --              Numbered 018 — the next free slot after 017 on this branch
    --              (014/015/016 are claimed by the in-flight rtv2 branch).
    --              projects has no RLS policy of its own here (it inherits the table's
    --              existing lockdown); this migration only adds columns.
    --              Identical for dev and prod (only the psql host/path below differ).
    -- psql -h localhost -U postgres -d postgres -f database/dev/public/migrations/018_project_credit_limits.sql
    --

    BEGIN;

    -- ============================================================================
    -- projects — additive per-project credit columns
    -- ============================================================================

    ALTER TABLE public.projects
        ADD COLUMN gr_credits_used  bigint  DEFAULT 0 NOT NULL,
        ADD COLUMN gr_credits_limit integer,
        ADD COLUMN rt_credits_used  bigint  DEFAULT 0 NOT NULL,
        ADD COLUMN rt_credits_limit integer;

    COMMENT ON COLUMN public.projects.gr_credits_used IS 'Per-project GR credits consumed; durability mirror of the per-project KeyDB usage hash, reconciled from Kong HINCRBY counters via PATCH /api/users/<org>/guardrails/usage (GREATEST-within-window). KeyDB is the runtime authority.';
    COMMENT ON COLUMN public.projects.gr_credits_limit IS 'Optional per-project GR credit allowance. NULL = no project limit (usage still tracked). Enforced in credits mode: a project over its own limit is 402-blocked even while the org still has credits. No -1 semantics — "no limit" is NULL.';
    COMMENT ON COLUMN public.projects.rt_credits_used IS 'Per-project RT credits consumed; durability mirror of the per-project KeyDB usage hash, reconciled via PATCH /api/users/<org>/redteam/credits (GREATEST-within-window). KeyDB is the runtime authority.';
    COMMENT ON COLUMN public.projects.rt_credits_limit IS 'Optional per-project RT credit allowance. NULL = no project limit. Enforced in credits mode — see gr_credits_limit.';

    -- ============================================================================
    -- Verify the schema changes
    -- ============================================================================

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'projects'
          AND column_name = 'gr_credits_limit'
      ) THEN
        RAISE EXCEPTION 'FAILED: projects.gr_credits_limit was not added';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'projects'
          AND column_name = 'rt_credits_used'
      ) THEN
        RAISE EXCEPTION 'FAILED: projects.rt_credits_used was not added';
      END IF;

      RAISE NOTICE 'SUCCESS: per-project credit columns added to public.projects';
    END $$;

    COMMIT;

    --
    -- Rollback (manual; run inside a transaction if the feature is retired):
    --   BEGIN;
    --   ALTER TABLE public.projects
    --     DROP COLUMN IF EXISTS gr_credits_used,
    --     DROP COLUMN IF EXISTS gr_credits_limit,
    --     DROP COLUMN IF EXISTS rt_credits_used,
    --     DROP COLUMN IF EXISTS rt_credits_limit;
    --   COMMIT;
    -- Dropping these columns discards the per-project credit mirror/limits only. Org
    -- credit balances (017) and the legacy request counters (invariant #2) are
    -- unaffected, so billing continues unchanged.
    --
    -- Migration Complete
    --

  034-user-metadata.sql: |
    --
    -- Migration: 019_user_metadata
    -- Description: Optional client-supplied user_metadata for redteam job APIs.
    --              Adds a single nullable `user_metadata jsonb` column (no default)
    --              to the three job tables that back the redteam/datasets/alignment
    --              job-detail APIs:
    --                * public.red_teaming   — redteam jobs
    --                * public.datasets      — dataset-generation jobs
    --                * public.alignment_task — alignment-task jobs
    --                * public.runs          — rtv2 jobs (only when the table exists)
    --              The runs table is created by the rtv2 substrate migration (014,
    --              tracked on the feat/rtv2-schema-and-relay branch) and may not
    --              exist on every database yet — hence ALTER TABLE IF EXISTS: a
    --              no-op where runs is absent (e.g. prod today). Fresh substrates
    --              need no re-run of this file because the feat/rtv2-schema-and-relay
    --              copy of 014 creates runs WITH user_metadata from the start.
    --              The column is an arbitrary JSON object supplied by the API caller
    --              at job-creation time and echoed back verbatim on job-detail /
    --              job-list reads. It is opaque to this schema — no shape is
    --              enforced in the database. Size/shape limits (<=16 top-level
    --              keys, key <=64 chars, depth <=3, <=4KB serialized) are enforced
    --              at the API layer, not here.
    --              Additive only — the column is nullable with no default, so every
    --              existing row remains valid and no backfill is required. No other
    --              columns on these tables are touched.
    --              Numbered 019 — the next free slot after 018 on this branch.
    --              None of the three tables have an RLS policy of their own here
    --              (they inherit the existing lockdown); this migration only adds
    --              columns.
    --              Identical for dev and prod (only the psql host/path below differ).
    -- psql -h localhost -U postgres -d postgres -f database/dev/public/migrations/019_user_metadata.sql
    --

    BEGIN;

    -- ============================================================================
    -- red_teaming — additive user_metadata column
    -- ============================================================================

    ALTER TABLE public.red_teaming
        ADD COLUMN IF NOT EXISTS user_metadata jsonb;

    COMMENT ON COLUMN public.red_teaming.user_metadata IS 'Arbitrary client-supplied metadata echoed by the API (limits enforced at API layer: <=16 top-level keys, key <=64 chars, depth <=3, <=4KB serialized).';

    -- ============================================================================
    -- datasets — additive user_metadata column
    -- ============================================================================

    ALTER TABLE public.datasets
        ADD COLUMN IF NOT EXISTS user_metadata jsonb;

    COMMENT ON COLUMN public.datasets.user_metadata IS 'Arbitrary client-supplied metadata echoed by the API (limits enforced at API layer: <=16 top-level keys, key <=64 chars, depth <=3, <=4KB serialized).';

    -- ============================================================================
    -- alignment_task — additive user_metadata column
    -- ============================================================================

    ALTER TABLE public.alignment_task
        ADD COLUMN IF NOT EXISTS user_metadata jsonb;

    COMMENT ON COLUMN public.alignment_task.user_metadata IS 'Arbitrary client-supplied metadata echoed by the API (limits enforced at API layer: <=16 top-level keys, key <=64 chars, depth <=3, <=4KB serialized).';

    -- ============================================================================
    -- runs (rtv2) — additive user_metadata column, only where the table exists
    -- ============================================================================

    ALTER TABLE IF EXISTS public.runs
        ADD COLUMN IF NOT EXISTS user_metadata jsonb;

    DO $$
    BEGIN
      IF EXISTS (
        SELECT 1 FROM information_schema.tables
        WHERE table_schema = 'public' AND table_name = 'runs'
      ) THEN
        COMMENT ON COLUMN public.runs.user_metadata IS 'Arbitrary client-supplied metadata echoed by the API (limits enforced at API layer: <=16 top-level keys, key <=64 chars, depth <=3, <=4KB serialized).';
      END IF;
    END $$;

    -- ============================================================================
    -- Verify the schema changes
    -- ============================================================================

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'red_teaming'
          AND column_name = 'user_metadata'
      ) THEN
        RAISE EXCEPTION 'FAILED: red_teaming.user_metadata was not added';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'datasets'
          AND column_name = 'user_metadata'
      ) THEN
        RAISE EXCEPTION 'FAILED: datasets.user_metadata was not added';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'alignment_task'
          AND column_name = 'user_metadata'
      ) THEN
        RAISE EXCEPTION 'FAILED: alignment_task.user_metadata was not added';
      END IF;

      -- runs is optional: only verify the column when the rtv2 substrate exists.
      IF EXISTS (
        SELECT 1 FROM information_schema.tables
        WHERE table_schema = 'public' AND table_name = 'runs'
      ) THEN
        IF NOT EXISTS (
          SELECT 1 FROM information_schema.columns
          WHERE table_schema = 'public' AND table_name = 'runs'
            AND column_name = 'user_metadata'
        ) THEN
          RAISE EXCEPTION 'FAILED: runs.user_metadata was not added';
        END IF;
        RAISE NOTICE 'SUCCESS: user_metadata added to red_teaming, datasets, alignment_task, runs';
      ELSE
        RAISE NOTICE 'SUCCESS: user_metadata added to red_teaming, datasets, alignment_task (runs absent - skipped)';
      END IF;
    END $$;

    COMMIT;

    --
    -- Rollback (manual; run inside a transaction if the feature is retired):
    --   BEGIN;
    --   ALTER TABLE public.red_teaming DROP COLUMN IF EXISTS user_metadata;
    --   ALTER TABLE public.datasets DROP COLUMN IF EXISTS user_metadata;
    --   ALTER TABLE public.alignment_task DROP COLUMN IF EXISTS user_metadata;
    --   ALTER TABLE IF EXISTS public.runs DROP COLUMN IF EXISTS user_metadata;
    --   COMMIT;
    -- Dropping these columns discards any client-supplied metadata stored against
    -- existing jobs. No other columns or tables are affected.
    --
    -- Migration Complete
    --

  035-code-of-conduct-v2.sql: |
    --
    -- Migration: 020_code_of_conduct_v2
    -- Description: Adds the v2 (Policy Wizard) storage columns to
    --              public.code_of_conduct, alongside the existing v1 (Policy
    --              Atomizer) columns (pdf_name, policy_rules, policy_text,
    --              total_rules), which are untouched and remain in use for
    --              backward compatibility.
    --
    --              * v2_questionnaire jsonb — the WizardProfile object sent as
    --                the `questionnaire` input to POST /guardrails/policy-wizard/
    --                generate-rules (purpose, prohibited_actions, user_types,
    --                data_access, actions, decision_impact).
    --              * v2_config jsonb — the full generate-rules response verbatim
    --                (status, enabled, disabled, stats, processing_time). Kept
    --                whole (not just `enabled`) so the disabled/suggested
    --                catalog rules and stats survive for later review, not just
    --                the enforced rule set.
    --              * is_v2 boolean NOT NULL DEFAULT false — set automatically by
    --                the enkrypt-db-proxy Kong plugin from the request's
    --                Content-Type (application/json => v2, multipart/form-data
    --                => legacy v1) on add-policy/modify-policy; callers never
    --                pass it themselves. false for every existing row.
    --
    --              Additive only — all three columns are nullable (is_v2 has a
    --              default), so every existing row remains valid and no backfill
    --              is required. No other columns or tables are touched.
    --              Numbered 020 — the next free slot after 019 on this branch.
    --              Identical for dev and prod (only the psql host/path below differ).
    -- psql -h localhost -U postgres -d postgres -f database/dev/public/migrations/020_code_of_conduct_v2.sql
    --

    BEGIN;

    -- ============================================================================
    -- code_of_conduct — additive v2 (Policy Wizard) columns
    -- ============================================================================

    ALTER TABLE public.code_of_conduct
        ADD COLUMN IF NOT EXISTS v2_questionnaire jsonb;

    ALTER TABLE public.code_of_conduct
        ADD COLUMN IF NOT EXISTS v2_config jsonb;

    ALTER TABLE public.code_of_conduct
        ADD COLUMN IF NOT EXISTS is_v2 boolean DEFAULT false NOT NULL;

    COMMENT ON COLUMN public.code_of_conduct.v2_questionnaire IS 'v2 (Policy Wizard) only: the WizardProfile questionnaire sent to POST /guardrails/policy-wizard/generate-rules (purpose, prohibited_actions, user_types, data_access, actions, decision_impact). NULL for v1 (Policy Atomizer) rows.';
    COMMENT ON COLUMN public.code_of_conduct.v2_config IS 'v2 (Policy Wizard) only: the full POST /guardrails/policy-wizard/generate-rules response verbatim (status, enabled, disabled, stats, processing_time). NULL for v1 (Policy Atomizer) rows.';
    COMMENT ON COLUMN public.code_of_conduct.is_v2 IS 'true = v2 (Policy Wizard: v2_questionnaire/v2_config populated, legacy columns NULL); false = v1 (Policy Atomizer: pdf_name/policy_rules/policy_text/total_rules populated). Set automatically by the enkrypt-db-proxy Kong plugin from the add-policy/modify-policy request Content-Type - callers never pass it.';

    -- ============================================================================
    -- Verify the schema changes
    -- ============================================================================

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'code_of_conduct'
          AND column_name = 'v2_questionnaire'
      ) THEN
        RAISE EXCEPTION 'FAILED: code_of_conduct.v2_questionnaire was not added';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'code_of_conduct'
          AND column_name = 'v2_config'
      ) THEN
        RAISE EXCEPTION 'FAILED: code_of_conduct.v2_config was not added';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'code_of_conduct'
          AND column_name = 'is_v2'
      ) THEN
        RAISE EXCEPTION 'FAILED: code_of_conduct.is_v2 was not added';
      END IF;

      RAISE NOTICE 'SUCCESS: v2_questionnaire, v2_config, is_v2 added to code_of_conduct';
    END $$;

    COMMIT;

    --
    -- Rollback (manual; run inside a transaction if the feature is retired):
    --   BEGIN;
    --   ALTER TABLE public.code_of_conduct DROP COLUMN IF EXISTS v2_questionnaire;
    --   ALTER TABLE public.code_of_conduct DROP COLUMN IF EXISTS v2_config;
    --   ALTER TABLE public.code_of_conduct DROP COLUMN IF EXISTS is_v2;
    --   COMMIT;
    -- Dropping these columns discards every v2 (Policy Wizard) policy's
    -- questionnaire/config content - any row with is_v2 = true loses its only
    -- copy of that data (v1 rows are unaffected: their legacy columns are
    -- untouched by this migration and this rollback).
    --
    -- Migration Complete
    --
  036-index-datasets-red-team-results.sql: |
    --
    -- Migration: 021_index_datasets_red_team_results
    -- Description: Indexes public.datasets_red_team_results for the Attacks
    --              tab on /red-teaming/[job_id]. The v2 AttackTable queries
    --              this table with WHERE test_name = ? [AND id = ?]
    --              [AND success = ?] [AND test_type IN (...)]
    --              [AND category IN (...)] [AND attack_method IN (...)]
    --              [AND response_classification IN (...)]. The table has no
    --              indexes on any of these columns (only a foreign key on
    --              `id` -> profiles), so every attack-table load is a seq
    --              scan. Idempotent via IF NOT EXISTS.
    --

    CREATE INDEX IF NOT EXISTS idx_drtr_id_test_name_success
        ON public.datasets_red_team_results (id, test_name, success);

    CREATE INDEX IF NOT EXISTS idx_drtr_test_type
        ON public.datasets_red_team_results (test_type);

    CREATE INDEX IF NOT EXISTS idx_drtr_attack_method
        ON public.datasets_red_team_results (attack_method);

    CREATE INDEX IF NOT EXISTS idx_drtr_response_classification
        ON public.datasets_red_team_results (response_classification);

    CREATE INDEX IF NOT EXISTS idx_drtr_category
        ON public.datasets_red_team_results (category);

    --
    -- Migration Complete
    --

  037-rtv2-pillar-tables.sql: |
    --
    -- Migration: 022_rtv2_pillar_tables
    -- Description: The rtv2 pillar tables — one control table + one data table per
    --              pillar. Ports sentry-redteam `rtv2` branch
    --                src/sentry-redteam/sentry/redteam/storage/migrations_v2/0002_pillar_tables.sql
    --              into apiaas, which is now the canonical home for all rtv2 DDL.
    --
    --              WHY THIS EXISTS: keys 040-043 already create indexes and
    --              RPCs ON public.redteam_v2_data, but nothing in apiaas ever
    --              created that table. A database built from this folder in order
    --              died at key 040's first CREATE INDEX. The tables reached dev only by
    --              someone hand-pasting sentry's `_bootstrap_hosted.sql` into the
    --              Supabase SQL editor. This migration closes that hole so the
    --              folder is self-sufficient.
    --
    --              Tables created: threat_modeling, threat_modeling_data,
    --                              redteam_v2, redteam_v2_data, eval, eval_data
    --              Table extended: playground (see the collision note below)
    --
    --              NOT ported from sentry's 0002/_bootstrap_hosted:
    --                * `datasets` — sentry rtv2 has no code reference to a datasets
    --                  TABLE any more (only a blob container via
    --                  DEFAULT_STORAGE_CONTAINER_DATASETS); threat-modeling output
    --                  moved to threat_modeling/threat_modeling_data. Its DDL is
    --                  dead leftover from the older generation, and it collides with
    --                  the legacy public.datasets that the app actively reads from
    --                  six call sites. Deliberately omitted.
    --                * `0001_foundation` — profiles / subscription / projects /
    --                  api_keys / project_api_keys / project_consumers already exist
    --                  in apiaas with the authoritative shapes. Sentry's versions
    --                  are a fresh-standalone-DB convenience and must NOT be applied
    --                  here.
    --
    -- ============================================================================
    -- THE playground COLLISION — read before changing anything below
    -- ============================================================================
    -- public.playground is claimed twice:
    --   * key 018 — legacy playground job tracking. PK job_id,
    --     `id text` (the USER id), plus status/goal/model_name/location/
    --     started_at/ended_at/"error.json".
    --   * sentry 0002_pillar_tables.sql:207 — the rtv2 playground pillar. PK
    --     job_id (same), `id UUID REFERENCES subscription(id)`, plus project_name/
    --     config/context/attacks/results/duration_seconds/error/user_metadata/...
    --
    -- Sentry writes this table live over PostgREST — storage/pillars.py:190
    -- (.insert), pillars.py:234 (.update .eq job_id) and runner/playground.py:130.
    -- Those payloads carry project_name/config/attacks/results/user_metadata, none
    -- of which exist on the legacy table, so every rtv2 playground write currently
    -- fails with "column does not exist".
    --
    -- Note this is NOT a silent no-op: CREATE TABLE IF NOT EXISTS playground does
    -- no-op, but sentry's very next statement — CREATE INDEX ... ON playground
    -- (id, project_name) — errors on the missing column. That is why
    -- `_bootstrap_hosted.sql` cannot have run to completion against apiaas.
    --
    -- RESOLUTION (chosen deliberately): additive merge. One table serves both
    -- shapes. Sentry's missing columns are ADDed nullable, so no sentry code change
    -- is needed and no legacy row is invalidated. Specifically:
    --   * No FK on the added columns. org_id/created_by would be satisfiable (new
    --     columns are NULL on every existing row), but they are left off so the
    --     whole step stays uniformly additive and trivially reversible.
    --   * No CHECK on status. Both sides happen to use the same vocabulary
    --     (Queued -> Running -> Finished | Failed), but a CHECK on a pre-existing
    --     column can fail on rows written before this migration.
    --   * `id` keeps its legacy `text` type. Sentry inserts a UUID *string* via
    --     PostgREST, which text accepts. Retyping to UUID would require every
    --     legacy row to be castable and is not worth the risk.
    --   * `error` (sentry, jsonb) and "error.json" (legacy, jsonb) coexist as two
    --     separate columns. Each side reads its own. This is the one cosmetic cost
    --     of the merge.
    --   * config is added NULLABLE even though sentry declares it NOT NULL —
    --     NOT NULL cannot be added to a table with existing rows. Sentry always
    --     supplies it on insert.
    --
    -- Requires:    base schema (subscription, profiles) for the FKs. Independent of
    --              key 029 — these tables do not reference runs/records.
    -- Idempotent (IF NOT EXISTS throughout), transactional, self-verifying.
    --

    BEGIN;

    -- ===========================================================================
    -- THREAT MODELING  (datagen: generate a reusable adversarial-prompt dataset)
    -- ===========================================================================
    CREATE TABLE IF NOT EXISTS public.threat_modeling (
        job_id          TEXT PRIMARY KEY,
        id              UUID NOT NULL REFERENCES public.subscription(id),
        project_name    TEXT NOT NULL DEFAULT 'default',
        org_id          UUID REFERENCES public.subscription(id),
        created_by      UUID REFERENCES public.profiles(id),
        actioner_email  TEXT,
        status          TEXT NOT NULL DEFAULT 'Queued'
                            CHECK (status IN ('Queued','Running','Finished','Failed')),
        config          JSONB NOT NULL,
        context         JSONB,
        dataset_name    TEXT NOT NULL,
        prompt_count    INT NOT NULL DEFAULT 0,
        coverage        JSONB,
        categories      JSONB,
        frameworks      TEXT[] NOT NULL DEFAULT '{}',
        download_url    TEXT,
        info_pdf_url    TEXT,
        blob_path       TEXT,
        summary         JSONB,
        error           JSONB,
        location        TEXT,
        user_metadata   JSONB,
        is_deleted      BOOLEAN NOT NULL DEFAULT false,
        created_at      TIMESTAMPTZ NOT NULL DEFAULT now(),
        started_at      TIMESTAMPTZ,
        ended_at        TIMESTAMPTZ
    );

    -- redteam's generation_config.dataset_name resolves to a dataset scoped to the caller.
    CREATE UNIQUE INDEX IF NOT EXISTS uq_threat_modeling_dataset
        ON public.threat_modeling (id, project_name, dataset_name);

    CREATE TABLE IF NOT EXISTS public.threat_modeling_data (
        job_id           TEXT NOT NULL REFERENCES public.threat_modeling(job_id) ON DELETE CASCADE,
        -- records.id of the prompt this row is.
        prompt_id        TEXT NOT NULL,
        PRIMARY KEY (job_id, prompt_id),
        dataset_name     TEXT,
        prompt           TEXT NOT NULL,
        category         TEXT,
        sub_category     TEXT,
        test_type        TEXT,
        goal             TEXT,
        source           TEXT,
        modality         TEXT NOT NULL DEFAULT 'text',
        attack_metadata  JSONB,
        blob_path        TEXT,
        tags             JSONB,
        created_at       TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS idx_tm_data_job         ON public.threat_modeling_data (job_id);
    CREATE INDEX IF NOT EXISTS idx_tm_data_dataset_cat ON public.threat_modeling_data (dataset_name, category, sub_category);

    -- ===========================================================================
    -- REDTEAM  (attack a target, produce a category-level report)
    -- ===========================================================================
    CREATE TABLE IF NOT EXISTS public.redteam_v2 (
        job_id                  TEXT PRIMARY KEY,
        id                      UUID NOT NULL REFERENCES public.subscription(id),
        project_name            TEXT NOT NULL DEFAULT 'default',
        org_id                  UUID REFERENCES public.subscription(id),
        created_by              UUID REFERENCES public.profiles(id),
        actioner_email          TEXT,
        run_name                TEXT NOT NULL,
        status                  TEXT NOT NULL DEFAULT 'Queued'
                                    CHECK (status IN ('Queued','Running','Finished','Failed')),
        config                  JSONB NOT NULL,
        context                 JSONB,
        model_name              TEXT,
        model_saved_name        TEXT,
        model_version           TEXT,
        dataset_name            TEXT,
        frameworks              TEXT[] NOT NULL DEFAULT '{}',
        risk_score              REAL,            -- overall only; per-category scores live in summary
        summary                 JSONB,
        token_usages            JSONB,
        test_statuses           JSONB,           -- V1 dashboard progress keyed by risk category
        eval_cost               REAL,
        total_generation_time   REAL,
        total_evaluation_time   REAL,
        report_url              TEXT,
        report_status           TEXT,
        report_generated_at     TIMESTAMPTZ,
        error                   JSONB,
        location                TEXT,
        user_metadata           JSONB,
        is_deleted              BOOLEAN NOT NULL DEFAULT false,
        created_at              TIMESTAMPTZ NOT NULL DEFAULT now(),
        started_at              TIMESTAMPTZ,
        ended_at                TIMESTAMPTZ
    );

    CREATE INDEX IF NOT EXISTS idx_redteam_v2_owner ON public.redteam_v2 (id, project_name);

    CREATE TABLE IF NOT EXISTS public.redteam_v2_data (
        job_id                   TEXT NOT NULL REFERENCES public.redteam_v2(job_id) ON DELETE CASCADE,
        -- records.id of the seed prompt this row attacked.
        prompt_id                TEXT NOT NULL,
        attack_method            TEXT NOT NULL,
        PRIMARY KEY (job_id, prompt_id, attack_method),
        -- Denormalised from redteam_v2 so the UI can label a row without a join.
        run_name                 TEXT NOT NULL,
        category                 TEXT,
        sub_category             TEXT,
        test_type                TEXT,
        source                   TEXT,
        prompt                   TEXT,
        jailbreak_prompt         TEXT,
        response                 TEXT,
        success                  BOOLEAN,
        response_classification  TEXT,
        reasoning                TEXT,
        confidence               REAL,
        detected_language        TEXT,
        modality                 TEXT NOT NULL DEFAULT 'text',
        conversation             JSONB,           -- multi-turn trace
        attack_metadata          JSONB,           -- figstep/arta/camo/mask/hidden_fragments — all here
        tries_used               REAL,
        eval_latency             DOUBLE PRECISION,
        eval_tokens              JSONB,
        blob_path                TEXT,
        tags                     JSONB,
        created_at               TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    -- NOTE: keys 040-042 add the Attacks-tab access paths on top of these
    -- (job_id+success / +category / +attack_method / +created_at / +sub_category /
    -- +response_classification). The three below are sentry's own base set; the
    -- job_id+success pair is declared in both and IF NOT EXISTS makes the overlap
    -- a no-op whichever order they are applied in.
    CREATE INDEX IF NOT EXISTS idx_redteam_v2_data_job_cat     ON public.redteam_v2_data (job_id, category, sub_category);
    CREATE INDEX IF NOT EXISTS idx_redteam_v2_data_job_attack  ON public.redteam_v2_data (job_id, attack_method);
    CREATE INDEX IF NOT EXISTS idx_redteam_v2_data_job_success ON public.redteam_v2_data (job_id, success);

    -- ===========================================================================
    -- EVAL  (batch evaluator: rows of (query, response, test_type) in, verdicts out)
    -- ===========================================================================
    CREATE TABLE IF NOT EXISTS public.eval (
        job_id          TEXT PRIMARY KEY,
        id              UUID NOT NULL REFERENCES public.subscription(id),
        project_name    TEXT NOT NULL DEFAULT 'default',
        org_id          UUID REFERENCES public.subscription(id),
        created_by      UUID REFERENCES public.profiles(id),
        actioner_email  TEXT,
        run_name        TEXT NOT NULL,
        status          TEXT NOT NULL DEFAULT 'Queued'
                            CHECK (status IN ('Queued','Running','Finished','Failed')),
        config          JSONB NOT NULL,
        context         JSONB,
        frameworks      TEXT[] NOT NULL DEFAULT '{}',
        total           INT NOT NULL DEFAULT 0,
        done            INT NOT NULL DEFAULT 0,
        failed          INT NOT NULL DEFAULT 0,
        summary         JSONB,
        error           JSONB,
        location        TEXT,
        user_metadata   JSONB,
        is_deleted      BOOLEAN NOT NULL DEFAULT false,
        created_at      TIMESTAMPTZ NOT NULL DEFAULT now(),
        started_at      TIMESTAMPTZ,
        ended_at        TIMESTAMPTZ
    );

    CREATE INDEX IF NOT EXISTS idx_eval_owner ON public.eval (id, project_name);

    CREATE TABLE IF NOT EXISTS public.eval_data (
        job_id                   TEXT NOT NULL REFERENCES public.eval(job_id) ON DELETE CASCADE,
        -- records.id of the sample this verdict is for.
        prompt_id                TEXT NOT NULL,
        PRIMARY KEY (job_id, prompt_id),
        -- Denormalised from eval so the UI can label a row without a join.
        run_name                 TEXT NOT NULL,
        query                    TEXT,
        response                 TEXT,
        test_type                TEXT,
        category                 TEXT,
        sub_category             TEXT,
        goal                     TEXT,
        success                  BOOLEAN,
        response_classification  TEXT,
        reasoning                TEXT,
        confidence               REAL,
        blob_path                TEXT,
        tags                     JSONB,
        created_at               TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS idx_eval_data_job_cat ON public.eval_data (job_id, category, sub_category);

    -- ===========================================================================
    -- PLAYGROUND  (additive merge onto the legacy table — see the header note)
    -- ===========================================================================
    ALTER TABLE public.playground
        ADD COLUMN IF NOT EXISTS project_name     TEXT DEFAULT 'default',
        ADD COLUMN IF NOT EXISTS org_id           UUID,
        ADD COLUMN IF NOT EXISTS created_by       UUID,
        ADD COLUMN IF NOT EXISTS actioner_email   TEXT,
        ADD COLUMN IF NOT EXISTS config           JSONB,
        ADD COLUMN IF NOT EXISTS context          JSONB,
        ADD COLUMN IF NOT EXISTS attacks          JSONB,
        ADD COLUMN IF NOT EXISTS results          JSONB,
        ADD COLUMN IF NOT EXISTS duration_seconds REAL,
        ADD COLUMN IF NOT EXISTS error            JSONB,
        ADD COLUMN IF NOT EXISTS user_metadata    JSONB;

    COMMENT ON COLUMN public.playground.project_name IS
        'rtv2 pillar column. Project the playground run is scoped to. Postgres 11+ backfills the DEFAULT onto pre-existing rows, so legacy playground rows read ''default'' here rather than NULL.';
    COMMENT ON COLUMN public.playground.error IS
        'rtv2 pillar column (jsonb). Distinct from the legacy "error.json" column, which the legacy writer still uses. Each side reads its own.';
    COMMENT ON COLUMN public.playground.config IS
        'rtv2 pillar column. Raw request payload. Nullable here although sentry declares it NOT NULL — NOT NULL cannot be added to a table with existing rows.';

    CREATE INDEX IF NOT EXISTS idx_playground_owner ON public.playground (id, project_name);

    -- ===========================================================================
    -- RLS lockdown
    -- Same model as key 026: RLS enabled + a RESTRICTIVE deny-all policy for
    -- anon/authenticated. Every reader of these tables in next-js-app goes through
    -- SupabaseAdmin() (service_role), which BYPASSES RLS — verified across all
    -- redteam_v2 / redteam_v2_data / threat_modeling / threat_modeling_data call
    -- sites — so this changes no application behaviour. Without it the tables are
    -- reachable over PostgREST by any authenticated JWT, which is how they sit in
    -- dev today after the manual bootstrap.
    --
    -- playground is deliberately absent from this list: it already carries
    -- deny_all_playground from key 026, and the loop below skips any table
    -- that already has a policy.
    -- ===========================================================================

    -- anon / authenticated ship with Supabase, but not with a plain-Postgres
    -- dev/test or on-prem-operator database, where the policy below would fail with
    -- `role "anon" does not exist`. Create them idempotently — the same guard key 029
    -- uses for `authenticated` and key 039 uses for `service_role`.
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
            CREATE ROLE anon NOLOGIN NOINHERIT;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
            CREATE ROLE authenticated NOLOGIN NOINHERIT;
        END IF;
    END
    $$;

    DO $$
    DECLARE
      t    text;
      cnt  integer := 0;
    BEGIN
      FOREACH t IN ARRAY ARRAY[
          'threat_modeling', 'threat_modeling_data',
          'redteam_v2', 'redteam_v2_data',
          'eval', 'eval_data'
      ] LOOP
        EXECUTE format('ALTER TABLE public.%I ENABLE ROW LEVEL SECURITY', t);

        IF NOT EXISTS (
          SELECT 1 FROM pg_policy p
          JOIN pg_class c ON c.oid = p.polrelid
          JOIN pg_namespace ns ON ns.oid = c.relnamespace
          WHERE ns.nspname = 'public' AND c.relname = t
        ) THEN
          EXECUTE format(
            'CREATE POLICY %I ON public.%I AS RESTRICTIVE FOR ALL TO anon, authenticated USING (false) WITH CHECK (false)',
            'deny_all_' || t, t
          );
          cnt := cnt + 1;
          RAISE NOTICE 'locked down public.% (added RESTRICTIVE policy deny_all_%)', t, t;
        END IF;
      END LOOP;

      RAISE NOTICE 'Added deny-all policy to % pillar table(s).', cnt;
    END $$;

    -- ===========================================================================
    -- Verify
    -- ===========================================================================
    DO $$
    DECLARE
      t       text;
      missing text := '';
    BEGIN
      FOREACH t IN ARRAY ARRAY[
          'threat_modeling', 'threat_modeling_data',
          'redteam_v2', 'redteam_v2_data',
          'eval', 'eval_data'
      ] LOOP
        IF NOT EXISTS (
          SELECT 1 FROM information_schema.tables
          WHERE table_schema = 'public' AND table_name = t
        ) THEN
          missing := missing || t || ' ';
        END IF;
      END LOOP;

      IF missing <> '' THEN
        RAISE EXCEPTION 'FAILED: pillar tables not created: %', missing;
      END IF;

      -- The whole point of this migration: 022-025 index this table.
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'redteam_v2_data'
          AND column_name = 'response_classification'
      ) THEN
        RAISE EXCEPTION 'FAILED: redteam_v2_data.response_classification missing (023 indexes it)';
      END IF;

      -- The playground additive merge must have taken, or every rtv2 playground
      -- write still fails on the missing column.
      FOREACH t IN ARRAY ARRAY[
          'project_name', 'config', 'attacks', 'results', 'user_metadata'
      ] LOOP
        IF NOT EXISTS (
          SELECT 1 FROM information_schema.columns
          WHERE table_schema = 'public' AND table_name = 'playground' AND column_name = t
        ) THEN
          RAISE EXCEPTION 'FAILED: playground.% was not added', t;
        END IF;
      END LOOP;

      RAISE NOTICE 'SUCCESS: 6 pillar tables created, playground merged additively, RLS locked down.';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --

  038-rtv2-records-full-text.sql: |
    --
    -- Migration: 023_rtv2_records_full_text
    -- Description: records stores the full text, not 512-char previews. Ports
    --              sentry-redteam `rtv2` branch
    --                src/sentry-redteam/sentry/redteam/storage/migrations_v2/0003_full_text_records.sql
    --              into apiaas, which is now the canonical home for all rtv2 DDL.
    --
    --              The per-record trace JSON blob is retired: everything it held
    --              that anyone reads (turns, attack params) now lives in columns,
    --              and blob_path becomes the results *directory* for the record's
    --              (category, attack_method) group — where details.json,
    --              summary.json and any multimodal assets land.
    --
    --              Key 029 created public.records with prompt_preview /
    --              response_preview and blob_path NOT NULL. This is the forward
    --              step to the shape sentry actually writes today.
    --
    --              DIFFERENCE FROM SENTRY'S 0003, deliberate: sentry's file also
    --              redefines rt_persist_eval_run() at the end, to retarget it off
    --              the previews. apiaas has never declared that function at all, so
    --              defining it here and again in key 039 would be redundant. key 039 owns
    --              every rt_* function and declares rt_persist_eval_run directly in
    --              its final full-text form. Apply this key before 039.
    --
    --              On a database that was hand-bootstrapped from sentry's
    --              `_bootstrap_hosted.sql`, records already has these columns and
    --              never had the previews — every statement here is then a no-op.
    --
    -- Requires:    key 029 (public.records must exist).
    -- Idempotent (IF EXISTS / IF NOT EXISTS guards), transactional, self-verifying.
    --

    BEGIN;

    ALTER TABLE public.records ADD COLUMN IF NOT EXISTS prompt TEXT;
    ALTER TABLE public.records ADD COLUMN IF NOT EXISTS jailbreak_prompt TEXT;
    ALTER TABLE public.records ADD COLUMN IF NOT EXISTS response TEXT;

    -- The trace blob's contents, now that it is gone: turns for multi-turn attacks
    -- (goat, crescendo, …) and the attack's own params/timings/usage.
    ALTER TABLE public.records ADD COLUMN IF NOT EXISTS conversation JSONB;
    ALTER TABLE public.records ADD COLUMN IF NOT EXISTS attack_metadata JSONB;

    -- The datagen record an attack row derives from.
    ALTER TABLE public.records ADD COLUMN IF NOT EXISTS parent_record_id UUID;
    CREATE INDEX IF NOT EXISTS idx_records_parent ON public.records (parent_record_id);

    -- Same identity as threat_modeling_data.prompt_id / redteam_v2_data.prompt_id
    -- (both created in key 037). Stable across runs — records.id is not. NULL for
    -- standard-library / inline prompts.
    ALTER TABLE public.records ADD COLUMN IF NOT EXISTS prompt_id TEXT;
    CREATE INDEX IF NOT EXISTS idx_records_prompt_id ON public.records (prompt_id);

    -- ============================================================================
    -- Backfill what the previews held, for databases created before the full-text
    -- columns were declared — i.e. anything provisioned from key 029.
    --
    -- Attack rows wrote the *jailbreak* into prompt_preview and never stored the
    -- seed prompt, so for them the seed is unrecoverable — jailbreak_prompt is the
    -- honest destination. No-op on a bootstrap-provisioned database, where the
    -- preview columns never existed.
    -- ============================================================================
    DO $$
    BEGIN
        IF EXISTS (SELECT 1 FROM information_schema.columns
                   WHERE table_schema = 'public' AND table_name = 'records'
                     AND column_name = 'prompt_preview') THEN
            UPDATE public.records SET response = response_preview WHERE response IS NULL;

            UPDATE public.records
                SET jailbreak_prompt = prompt_preview
                WHERE jailbreak_prompt IS NULL
                  AND attack_method IS NOT NULL
                  AND attack_method <> 'none';

            UPDATE public.records
                SET prompt = prompt_preview
                WHERE prompt IS NULL
                  AND (attack_method IS NULL OR attack_method = 'none');

            RAISE NOTICE 'Backfilled full-text columns from the preview columns.';
        ELSE
            RAISE NOTICE 'No preview columns present — backfill skipped (fresh/bootstrapped DB).';
        END IF;
    END
    $$;

    ALTER TABLE public.records DROP COLUMN IF EXISTS prompt_preview;
    ALTER TABLE public.records DROP COLUMN IF EXISTS response_preview;

    -- Text records have no per-record asset of their own.
    ALTER TABLE public.records ALTER COLUMN blob_path DROP NOT NULL;

    -- ============================================================================
    -- Verify
    -- ============================================================================
    DO $$
    DECLARE
      c       text;
      missing text := '';
    BEGIN
        FOREACH c IN ARRAY ARRAY[
            'prompt', 'jailbreak_prompt', 'response',
            'conversation', 'attack_metadata', 'parent_record_id', 'prompt_id'
        ] LOOP
            IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_schema = 'public' AND table_name = 'records' AND column_name = c
            ) THEN
                missing := missing || c || ' ';
            END IF;
        END LOOP;

        IF missing <> '' THEN
            RAISE EXCEPTION 'FAILED: records is missing full-text column(s): %', missing;
        END IF;

        IF EXISTS (SELECT 1 FROM information_schema.columns
                   WHERE table_schema = 'public' AND table_name = 'records'
                     AND column_name IN ('prompt_preview', 'response_preview')) THEN
            RAISE EXCEPTION 'FAILED: preview column(s) still present on records';
        END IF;

        IF EXISTS (SELECT 1 FROM information_schema.columns
                   WHERE table_schema = 'public' AND table_name = 'records'
                     AND column_name = 'blob_path' AND is_nullable = 'NO') THEN
            RAISE EXCEPTION 'FAILED: records.blob_path is still NOT NULL';
        END IF;

        RAISE NOTICE 'SUCCESS: records carries full text; previews dropped; blob_path nullable.';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --

  039-rtv2-control-plane-rpcs.sql: |
    --
    -- Migration: 024_rtv2_control_plane_rpcs
    -- Description: The rtv2 control-plane RPCs (service_role only). These are the
    --              functions the coordinator and workers call over PostgREST for
    --              every operation that is not expressible as a plain REST write —
    --              row-locking claims, recovery sweeps, atomic multi-table
    --              persistence, race-safe finalisation and increment-upserts.
    --
    --              PORTED FROM sentry-redteam `rtv2`, FINAL STATE. Provenance:
    --                storage/migrations/0008_postgrest_rpc.sql        — original 11 functions
    --                storage/migrations/0009_claim_reject_live_running.sql
    --                                                                — rt_claim_cell rewrite
    --                storage/migrations_v2/0003_full_text_records.sql — rt_persist_eval_run rewrite
    --              Each function is declared ONCE here, already carrying every
    --              later revision, rather than replaying the sequence. Verified
    --              against `_bootstrap_hosted.sql` on origin/rtv2, which is the
    --              rolled-up form sentry itself installs.
    --
    --              WHY THIS EXISTS: apiaas had ZERO of these. Nothing under
    --              database/ declared rt_claim_cell, rt_persist_run,
    --              rt_persist_eval_run, rt_finalise_run, rt_resume_run,
    --              rt_reap_stale, rt_mark_cell, rt_heartbeat, rt_now,
    --              rt_mark_run_running or rt_bump_run_coverage, nor the
    --              service_role grants they depend on. They reached dev only via
    --              the hand-pasted bootstrap.
    --
    --              Key 030's header claims it "consolidates the two in-tree
    --              migrations 0008 and 0009" — that is stale and wrong. On current
    --              origin/rtv2 those slots are postgrest_rpc / user_metadata /
    --              claim_reject_live_running; none is relay. key 030 is relay-only and
    --              always was; the real 0008/0009 arrive here. (0008_user_metadata
    --              is the one exception — it was already ported, as key 034.)
    --
    -- Requires:    key 029 (runs, test_statuses, records, run_coverage) and
    --              key 038 (records full-text columns — rt_persist_eval_run writes
    --              records.prompt / records.response, which only exist after key 038).
    -- Idempotent (CREATE OR REPLACE / guarded role creation), transactional.
    --

    BEGIN;

    -- ============================================================================
    -- service_role ships with Supabase; create it idempotently so this migration
    -- also applies to a plain-Postgres dev/test database. Same pattern key
    -- 029 uses for `authenticated`.
    -- ============================================================================
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
            CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS;
        END IF;
    END
    $$;

    -- ============================================================================
    -- rt_claim_cell — claim a cell for execution.
    -- Verdicts: not_found | done | exhausted | run_not_found | already_running | claimed.
    -- Rejects reclaim of a LIVE running cell; allows reclaim once stale, where
    -- stale means COALESCE(heartbeat_at, started_at) older than 2x the cell's
    -- heartbeat_interval_s.
    -- ============================================================================
    CREATE OR REPLACE FUNCTION public.rt_claim_cell(p_cell_id uuid, p_max_attempts int)
    RETURNS jsonb LANGUAGE plpgsql AS $$
    DECLARE
        ts   test_statuses%ROWTYPE;
        run  RECORD;
        stale_after interval;
        live_at timestamptz;
    BEGIN
        SELECT * INTO ts FROM test_statuses WHERE cell_id = p_cell_id FOR UPDATE;
        IF NOT FOUND THEN
            RETURN jsonb_build_object('verdict', 'not_found');
        END IF;
        IF ts.status = 'done' THEN
            RETURN jsonb_build_object('verdict', 'done');
        END IF;
        IF ts.attempts >= p_max_attempts THEN
            UPDATE test_statuses
            SET status = 'failed_terminal',
                error  = jsonb_build_object(
                    'code', 'CELL_REDELIVERY_EXHAUSTED',
                    'message', 'Cell exceeded max attempts.')
            WHERE cell_id = p_cell_id;
            RETURN jsonb_build_object('verdict', 'exhausted');
        END IF;

        -- Live running: another owner still heartbeating / recently started.
        IF ts.status = 'running' THEN
            stale_after := (COALESCE(ts.heartbeat_interval_s, 30) * 2 || ' seconds')::interval;
            live_at := COALESCE(ts.heartbeat_at, ts.started_at);
            IF live_at IS NOT NULL AND live_at >= now() - stale_after THEN
                RETURN jsonb_build_object('verdict', 'already_running');
            END IF;
        END IF;

        SELECT tenant_id, config INTO run FROM runs WHERE id = ts.run_id;
        IF NOT FOUND THEN
            RETURN jsonb_build_object('verdict', 'run_not_found');
        END IF;

        UPDATE test_statuses
        SET status = 'running',
            attempts = attempts + 1,
            started_at = now(),
            heartbeat_at = now()
        WHERE cell_id = p_cell_id;

        RETURN jsonb_build_object(
            'verdict', 'claimed',
            'cell', to_jsonb(ts) - 'error',
            'heartbeat_interval_s', COALESCE(ts.heartbeat_interval_s, 30),
            'tenant_id', run.tenant_id,
            'config', run.config);
    END;
    $$;

    -- ============================================================================
    -- rt_reap_stale — recovery sweep. Returns one entry per swept cell with
    -- disposition killed | requeued | skipped.
    -- ============================================================================
    CREATE OR REPLACE FUNCTION public.rt_reap_stale(p_max_attempts int)
    RETURNS jsonb LANGUAGE plpgsql AS $$
    DECLARE
        r      RECORD;
        entry  jsonb;
        result jsonb := '[]'::jsonb;
    BEGIN
        FOR r IN
            SELECT ts.*,
                   EXTRACT(EPOCH FROM (now() - ts.heartbeat_at))::int AS silent_s,
                   runs.tenant_id AS run_tenant_id, runs.config AS run_config
            FROM test_statuses ts
            LEFT JOIN runs ON runs.id = ts.run_id
            WHERE ts.status = 'running'
              AND ts.heartbeat_at < now() - (ts.heartbeat_interval_s * 3 || ' seconds')::INTERVAL
            FOR UPDATE OF ts SKIP LOCKED
        LOOP
            entry := jsonb_build_object(
                'cell_id', r.cell_id, 'run_id', r.run_id, 'pillar', r.pillar,
                'category', r.category, 'sub_category', r.sub_category,
                'attack_method', r.attack_method, 'record_id', r.record_id,
                'evaluator_id', r.evaluator_id, 'scenario_idx', r.scenario_idx,
                'depth_idx', r.depth_idx,
                'silent_s', COALESCE(r.silent_s, 0),
                'attempts_after', r.attempts + 1,
                'tenant_id', r.run_tenant_id, 'config', r.run_config);

            IF r.run_tenant_id IS NULL THEN
                entry := entry || jsonb_build_object('disposition', 'skipped');
            ELSIF r.attempts + 1 >= p_max_attempts THEN
                UPDATE test_statuses
                SET status = 'failed_terminal', attempts = r.attempts + 1,
                    completed_at = now(),
                    error = jsonb_build_object(
                        'code', 'HEARTBEAT_TIMEOUT', 'category', 'INTERNAL',
                        'message', format('Cell silent for %ss after %s attempts',
                                          COALESCE(r.silent_s, 0), r.attempts + 1),
                        'retry_after_s', NULL)
                WHERE cell_id = r.cell_id;
                entry := entry || jsonb_build_object('disposition', 'killed');
            ELSE
                UPDATE test_statuses
                SET status = 'pending', attempts = r.attempts + 1, heartbeat_at = NULL
                WHERE cell_id = r.cell_id;
                entry := entry || jsonb_build_object('disposition', 'requeued');
            END IF;

            result := result || entry;
        END LOOP;
        RETURN result;
    END;
    $$;

    -- ============================================================================
    -- rt_persist_run — resolver run + cells materialisation (atomic).
    -- ============================================================================
    CREATE OR REPLACE FUNCTION public.rt_persist_run(p_run jsonb, p_cells jsonb)
    RETURNS void LANGUAGE plpgsql AS $$
    BEGIN
        INSERT INTO runs (id, tenant_id, status, config, config_version,
                          taxonomy_version, compliance_version, budget)
        VALUES ((p_run->>'id')::uuid,
                (p_run->>'tenant_id')::uuid,
                COALESCE(p_run->>'status', 'queued'),
                p_run->'config',
                p_run->>'config_version',
                p_run->>'taxonomy_version',
                p_run->>'compliance_version',
                COALESCE(p_run->'budget', '{}'::jsonb));

        INSERT INTO test_statuses (cell_id, run_id, pillar, category, sub_category,
                                   attack_method, record_id, evaluator_id,
                                   scenario_idx, depth_idx, flavor, status, attempts)
        SELECT (c->>'cell_id')::uuid, (c->>'run_id')::uuid, c->>'pillar',
               c->>'category', c->>'sub_category', c->>'attack_method',
               (c->>'record_id')::uuid, c->>'evaluator_id',
               (c->>'scenario_idx')::int, (c->>'depth_idx')::int,
               COALESCE(c->>'flavor', 'static'),
               COALESCE(c->>'status', 'pending'),
               COALESCE((c->>'attempts')::int, 0)
        FROM jsonb_array_elements(p_cells) AS c;
    END;
    $$;

    -- ============================================================================
    -- rt_persist_eval_run — /v1/eval run + cells + seed records (atomic).
    -- Cells are inserted before records: records.cell_id FKs test_statuses.
    -- Writes records.prompt / records.response directly — this is the post-key-038
    -- full-text form, NOT the original preview-based one.
    -- ============================================================================
    CREATE OR REPLACE FUNCTION public.rt_persist_eval_run(p_run jsonb, p_cells jsonb, p_records jsonb)
    RETURNS void LANGUAGE plpgsql AS $$
    BEGIN
        PERFORM rt_persist_run(p_run, p_cells);

        INSERT INTO records (id, run_id, cell_id, category, sub_category,
                             prompt_hash, response_hash, prompt,
                             response, attack_method, test_type, goal,
                             source, tags, blob_path)
        SELECT (r->>'id')::uuid, (r->>'run_id')::uuid, (r->>'cell_id')::uuid,
               r->>'category', r->>'sub_category',
               r->>'prompt_hash', r->>'response_hash', r->>'prompt',
               r->>'response', r->>'attack_method', r->>'test_type',
               r->>'goal', COALESCE(r->>'source', 'eval'),
               COALESCE(r->'tags', '[]'::jsonb), r->>'blob_path'
        FROM jsonb_array_elements(p_records) AS r;
    END;
    $$;

    -- ============================================================================
    -- rt_finalise_run — race-safe finalisation + summary + coverage write.
    -- The UPDATE ... WHERE finalised_at IS NULL RETURNING id is the race guard;
    -- exactly one caller wins. (key 029 indexes the un-finalised slice for this.)
    -- ============================================================================
    CREATE OR REPLACE FUNCTION public.rt_finalise_run(p_run_id uuid)
    RETURNS jsonb LANGUAGE plpgsql AS $$
    DECLARE
        remaining int;
        v_summary jsonb;
        v_total   int;
        v_done    int;
        v_failed  int;
        winner    uuid;
    BEGIN
        SELECT count(*) INTO remaining FROM test_statuses
        WHERE run_id = p_run_id AND status IN ('pending', 'running');
        IF remaining > 0 THEN
            RETURN jsonb_build_object('finalised', false);
        END IF;

        SELECT jsonb_build_object('groups', COALESCE(jsonb_agg(to_jsonb(g)), '[]'::jsonb))
        INTO v_summary
        FROM (
            SELECT category, sub_category, attack_method, source,
                   count(*) AS total,
                   count(*) FILTER (WHERE success IS TRUE) AS successes
            FROM records
            WHERE run_id = p_run_id
            GROUP BY category, sub_category, attack_method, source
        ) g;

        SELECT count(*),
               count(*) FILTER (WHERE status = 'done'),
               count(*) FILTER (WHERE status IN ('failed', 'failed_terminal'))
        INTO v_total, v_done, v_failed
        FROM test_statuses WHERE run_id = p_run_id;

        UPDATE runs
        SET status = 'completed', completed_at = now(), finalised_at = now(),
            summary = v_summary, compliance_cache = '{}'::jsonb
        WHERE id = p_run_id AND finalised_at IS NULL
        RETURNING id INTO winner;
        IF winner IS NULL THEN
            RETURN jsonb_build_object('finalised', false);
        END IF;

        INSERT INTO run_coverage (run_id, category, requested, delivered, failed_cells)
        SELECT run_id, category, count(*),
               count(*) FILTER (WHERE status = 'done'),
               COALESCE(jsonb_agg(cell_id) FILTER
                        (WHERE status IN ('failed', 'failed_terminal')), '[]'::jsonb)
        FROM test_statuses
        WHERE run_id = p_run_id AND pillar = 'eval'
        GROUP BY run_id, category
        ON CONFLICT (run_id, category) DO UPDATE
            SET requested = EXCLUDED.requested,
                delivered = EXCLUDED.delivered,
                failed_cells = EXCLUDED.failed_cells;

        RETURN jsonb_build_object('finalised', true, 'total', v_total,
                                  'done', v_done, 'failed', v_failed);
    END;
    $$;

    -- ============================================================================
    -- rt_resume_run — coordinator resume.
    -- ============================================================================
    CREATE OR REPLACE FUNCTION public.rt_resume_run(p_run_id uuid, p_stale_s int)
    RETURNS jsonb LANGUAGE plpgsql AS $$
    DECLARE
        run       RECORD;
        v_done    int;
        v_ft      int;
        resumed   jsonb;
    BEGIN
        SELECT tenant_id, config INTO run FROM runs WHERE id = p_run_id;
        IF NOT FOUND THEN
            RETURN jsonb_build_object('found', false);
        END IF;

        SELECT count(*) FILTER (WHERE status = 'done'),
               count(*) FILTER (WHERE status = 'failed_terminal')
        INTO v_done, v_ft
        FROM test_statuses WHERE run_id = p_run_id;

        WITH stale AS (
            SELECT cell_id FROM test_statuses
            WHERE run_id = p_run_id
              AND (status IN ('pending', 'failed')
                   OR (status = 'running'
                       AND (heartbeat_at IS NULL
                            OR heartbeat_at < now() - (p_stale_s || ' seconds')::INTERVAL)))
            FOR UPDATE
        ), upd AS (
            UPDATE test_statuses ts
            SET status = 'pending', heartbeat_at = NULL, error = NULL,
                attempts = ts.attempts + 1
            FROM stale WHERE ts.cell_id = stale.cell_id
            RETURNING ts.*
        )
        SELECT COALESCE(jsonb_agg(to_jsonb(upd) - 'error'), '[]'::jsonb)
        INTO resumed FROM upd;

        UPDATE runs SET status = 'running' WHERE id = p_run_id;

        RETURN jsonb_build_object('found', true, 'tenant_id', run.tenant_id,
                                  'config', run.config, 'skipped_done', v_done,
                                  'failed_cells', v_ft, 'cells', resumed);
    END;
    $$;

    -- ============================================================================
    -- rt_mark_cell / rt_heartbeat / rt_now / rt_mark_run_running —
    -- single-statement writers that need DB-side now() (client clocks are not
    -- trusted for staleness math).
    -- ============================================================================
    CREATE OR REPLACE FUNCTION public.rt_mark_cell(p_cell_id uuid, p_status text, p_error jsonb DEFAULT NULL)
    RETURNS void LANGUAGE sql AS $$
        UPDATE test_statuses
        SET status = p_status,
            error = COALESCE(p_error, error),
            completed_at = CASE WHEN p_status IN ('done', 'failed_terminal')
                                THEN now() ELSE completed_at END
        WHERE cell_id = p_cell_id;
    $$;

    CREATE OR REPLACE FUNCTION public.rt_heartbeat(p_cell_id uuid)
    RETURNS void LANGUAGE sql AS $$
        UPDATE test_statuses SET heartbeat_at = now() WHERE cell_id = p_cell_id;
    $$;

    CREATE OR REPLACE FUNCTION public.rt_now()
    RETURNS timestamptz LANGUAGE sql STABLE AS $$
        SELECT now();
    $$;

    CREATE OR REPLACE FUNCTION public.rt_mark_run_running(p_run_id uuid)
    RETURNS void LANGUAGE sql AS $$
        UPDATE runs SET status = 'running', started_at = now() WHERE id = p_run_id;
    $$;

    -- ============================================================================
    -- rt_bump_run_coverage — increment upsert (not expressible in PostgREST).
    -- ============================================================================
    CREATE OR REPLACE FUNCTION public.rt_bump_run_coverage(p_run_id uuid, p_category text)
    RETURNS void LANGUAGE sql AS $$
        INSERT INTO run_coverage (run_id, category, requested, delivered, failed_cells)
        VALUES (p_run_id, p_category, 0, 1, '[]'::jsonb)
        ON CONFLICT (run_id, category) DO UPDATE
            SET delivered = run_coverage.delivered + 1;
    $$;

    -- ============================================================================
    -- Grants: control-plane only. PostgREST exposes public-schema functions to
    -- whoever holds EXECUTE, so anon/authenticated must not hold it — these
    -- functions claim cells, rewrite run state and persist runs.
    --
    -- REVOKE FROM PUBLIC IS NOT ENOUGH ON SUPABASE, and this bit me on dev.
    -- Supabase ships default privileges that grant EXECUTE *directly* to anon and
    -- authenticated for every function created in `public`:
    --
    --   SELECT defaclacl FROM pg_default_acl WHERE defaclobjtype='f';
    --   -- public | {postgres=X/postgres, anon=X/postgres,
    --   --           authenticated=X/postgres, service_role=X/postgres}
    --
    -- A direct grant is not the PUBLIC pseudo-role grant, so `REVOKE ... FROM
    -- PUBLIC` leaves it completely untouched. On a plain Postgres (no default
    -- ACLs) the old code looked correct and every local test passed; on the real
    -- Supabase database all eleven functions came out executable by anon. The
    -- roles are revoked by name below, guarded because they do not exist on a
    -- bare Postgres.
    -- ============================================================================
    DO $$
    DECLARE
        fn text;
        grantee text;
    BEGIN
        FOREACH fn IN ARRAY ARRAY[
            'public.rt_claim_cell(uuid, int)',
            'public.rt_reap_stale(int)',
            'public.rt_persist_run(jsonb, jsonb)',
            'public.rt_persist_eval_run(jsonb, jsonb, jsonb)',
            'public.rt_finalise_run(uuid)',
            'public.rt_resume_run(uuid, int)',
            'public.rt_mark_cell(uuid, text, jsonb)',
            'public.rt_heartbeat(uuid)',
            'public.rt_now()',
            'public.rt_mark_run_running(uuid)',
            'public.rt_bump_run_coverage(uuid, text)'
        ] LOOP
            EXECUTE format('REVOKE ALL ON FUNCTION %s FROM PUBLIC', fn);

            -- The one that actually matters on Supabase — see the note above.
            FOREACH grantee IN ARRAY ARRAY['anon', 'authenticated'] LOOP
                IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = grantee) THEN
                    EXECUTE format('REVOKE ALL ON FUNCTION %s FROM %I', fn, grantee);
                END IF;
            END LOOP;

            EXECUTE format('GRANT EXECUTE ON FUNCTION %s TO service_role', fn);
        END LOOP;
    END
    $$;

    -- ============================================================================
    -- Verify
    -- ============================================================================
    DO $$
    DECLARE
      fn      text;
      missing text := '';
    BEGIN
        FOREACH fn IN ARRAY ARRAY[
            'rt_claim_cell', 'rt_reap_stale', 'rt_persist_run',
            'rt_persist_eval_run', 'rt_finalise_run', 'rt_resume_run',
            'rt_mark_cell', 'rt_heartbeat', 'rt_now',
            'rt_mark_run_running', 'rt_bump_run_coverage'
        ] LOOP
            IF NOT EXISTS (
                SELECT 1 FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
                WHERE n.nspname = 'public' AND p.proname = fn
            ) THEN
                missing := missing || fn || ' ';
            END IF;
        END LOOP;

        IF missing <> '' THEN
            RAISE EXCEPTION 'FAILED: control-plane function(s) not created: %', missing;
        END IF;

        -- rt_claim_cell must be the 0009 revision, not the original 0008 one.
        IF NOT EXISTS (
            SELECT 1 FROM pg_proc p
            JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE n.nspname = 'public' AND p.proname = 'rt_claim_cell'
              AND pg_get_functiondef(p.oid) LIKE '%already_running%'
        ) THEN
            RAISE EXCEPTION 'FAILED: rt_claim_cell is not the live-running-reject revision';
        END IF;

        -- The grants must have actually taken. Asserted rather than assumed because
        -- REVOKE ... FROM PUBLIC silently fails to remove Supabase's direct
        -- anon/authenticated grants, which is exactly how these functions ended up
        -- world-executable on dev the first time round.
        FOREACH fn IN ARRAY ARRAY['anon', 'authenticated'] LOOP
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = fn) THEN
                IF EXISTS (
                    SELECT 1 FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                    WHERE n.nspname = 'public'
                      AND p.proname LIKE 'rt\_%'
                      AND p.proname NOT LIKE 'rt\_v2\_data%'   -- keys 040-043 dashboard RPCs, intentionally readable
                      AND has_function_privilege(fn, p.oid, 'EXECUTE')
                ) THEN
                    RAISE EXCEPTION
                        'FAILED: role % can still EXECUTE a control-plane rt_* function', fn;
                END IF;
            END IF;
        END LOOP;

        RAISE NOTICE 'SUCCESS: 11 control-plane RPCs installed, executable by service_role only.';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --
  040-index-redteam-v2-data.sql: |
    -- Speed up the Attacks tab on /red-teaming/assessments/[job_id].
    --
    -- The v2 AttacksTab reads from `redteam_v2_data` (one row per generated
    -- prompt) scoped by `job_id`, then filters/paginates on `success`,
    -- `category`, and `attack_method`. Without indexes every filter change is
    -- a full table scan across every job's rows.
    --
    -- Companion RPC (`rt_v2_data_aggregates`) below batches the count + distinct
    -- lookups that populate the Attacks-tab header counts and filter chips into a
    -- single round-trip.

    -- Primary compound — every Attacks-tab query starts with job_id, and 99% of
    -- the time also filters on success (Blocked/Bypassed).
    CREATE INDEX IF NOT EXISTS idx_redteam_v2_data_job_success
        ON public.redteam_v2_data (job_id, success);

    -- Category / attack_method filters — these back the `.in("category", ...)`
    -- and `.in("attack_method", ...)` predicates in getAttackRows, plus the
    -- distinct-value scans in getAttackAggregates.
    CREATE INDEX IF NOT EXISTS idx_redteam_v2_data_job_category
        ON public.redteam_v2_data (job_id, category);

    CREATE INDEX IF NOT EXISTS idx_redteam_v2_data_job_attack_method
        ON public.redteam_v2_data (job_id, attack_method);

    -- The paginated fetch orders by created_at; keep it indexed under job_id so
    -- range scans over a single job stay cheap.
    CREATE INDEX IF NOT EXISTS idx_redteam_v2_data_job_created_at
        ON public.redteam_v2_data (job_id, created_at);

    -- One-shot aggregates for the Attacks-tab header counts + filter chips.
    -- Replaces three parallel queries in `getAttackAggregates` with a single
    -- round-trip. Marked STABLE so Postgres can cache within a statement.
    CREATE OR REPLACE FUNCTION public.rt_v2_data_aggregates(p_job_id text)
    RETURNS jsonb
    LANGUAGE sql
    STABLE
    AS $$
        SELECT jsonb_build_object(
            'total',    COUNT(*),
            'bypassed', COUNT(*) FILTER (WHERE success = true),
            'blocked',  COUNT(*) FILTER (WHERE success = false),
            'categories', COALESCE(
                (SELECT array_agg(DISTINCT category)
                 FROM public.redteam_v2_data
                 WHERE job_id = p_job_id AND category IS NOT NULL),
                '{}'::text[]
            ),
            'attack_methods', COALESCE(
                (SELECT array_agg(DISTINCT attack_method)
                 FROM public.redteam_v2_data
                 WHERE job_id = p_job_id AND attack_method IS NOT NULL),
                '{}'::text[]
            )
        )
        FROM public.redteam_v2_data
        WHERE job_id = p_job_id;
    $$;

  041-index-redteam-v2-data-sankey.sql: |
    -- Companion to key 040 — powers the Sankey chart on the Attacks tab of
    -- `/red-teaming/assessments/[job_id]`. The chart shows three columns:
    --   Risk Category  →  Response Classification  →  Bypass / Blocked
    -- and needs per-(category, classification) and per-(classification, success)
    -- counts. `rt_v2_data_sankey` returns both aggregations in one round-trip.

    -- Compound to accelerate the middle-column aggregate.
    CREATE INDEX IF NOT EXISTS idx_redteam_v2_data_job_classification
        ON public.redteam_v2_data (job_id, response_classification);

    CREATE OR REPLACE FUNCTION public.rt_v2_data_sankey(p_job_id text)
    RETURNS jsonb
    LANGUAGE sql
    STABLE
    AS $$
        SELECT jsonb_build_object(
            'cat_to_class', (
                SELECT COALESCE(jsonb_agg(row_to_json(t)), '[]'::jsonb)
                FROM (
                    SELECT category,
                           response_classification,
                           COUNT(*)::int AS value
                    FROM public.redteam_v2_data
                    WHERE job_id = p_job_id
                        AND category IS NOT NULL
                        AND response_classification IS NOT NULL
                    GROUP BY category, response_classification
                ) t
            ),
            'class_to_status', (
                SELECT COALESCE(jsonb_agg(row_to_json(t)), '[]'::jsonb)
                FROM (
                    SELECT response_classification,
                           COALESCE(success, false) AS bypassed,
                           COUNT(*)::int AS value
                    FROM public.redteam_v2_data
                    WHERE job_id = p_job_id
                        AND response_classification IS NOT NULL
                    GROUP BY response_classification, success
                ) t
            )
        );
    $$;

  042-redteam-v2-data-filter-options.sql: |
    -- Filter side-sheet on the Attacks tab (`/red-teaming/assessments/[job_id]`)
    -- needs the *option list* AND the bypass ratio next to each option:
    --   Risk Category
    --     ├─ total attacks, bypassed count, pct
    --     └─ Sub Category
    --          └─ total attacks, bypassed count, pct
    --   Attack Method
    --        └─ total attacks, bypassed count, pct
    --
    -- `rt_v2_data_filter_options` batches those three group-bys into a single
    -- round-trip so the sheet opens without cascading requests.
    --
    -- Companion sub_category index — categories/attack_method already have
    -- composite indexes in key 040; sub_category also filters row queries when the
    -- user drills into a specific bucket.

    CREATE INDEX IF NOT EXISTS idx_redteam_v2_data_job_sub_category
        ON public.redteam_v2_data (job_id, sub_category);

    CREATE OR REPLACE FUNCTION public.rt_v2_data_filter_options(p_job_id text)
    RETURNS jsonb
    LANGUAGE sql
    STABLE
    AS $$
        SELECT jsonb_build_object(
            'categories', COALESCE(
                (
                    SELECT jsonb_agg(row_to_json(c) ORDER BY c.category)
                    FROM (
                        SELECT
                            category,
                            COUNT(*)::int AS total,
                            COUNT(*) FILTER (WHERE success = true)::int AS bypassed,
                            COALESCE(
                                (
                                    SELECT jsonb_agg(row_to_json(s) ORDER BY s.sub_category)
                                    FROM (
                                        SELECT
                                            sub_category,
                                            COUNT(*)::int AS total,
                                            COUNT(*) FILTER (WHERE success = true)::int AS bypassed
                                        FROM public.redteam_v2_data d2
                                        WHERE d2.job_id = p_job_id
                                            AND d2.category = d1.category
                                            AND d2.sub_category IS NOT NULL
                                        GROUP BY sub_category
                                    ) s
                                ),
                                '[]'::jsonb
                            ) AS sub_categories
                        FROM public.redteam_v2_data d1
                        WHERE d1.job_id = p_job_id
                            AND d1.category IS NOT NULL
                        GROUP BY category
                    ) c
                ),
                '[]'::jsonb
            ),
            'attack_methods', COALESCE(
                (
                    SELECT jsonb_agg(row_to_json(m) ORDER BY m.attack_method)
                    FROM (
                        SELECT
                            attack_method,
                            COUNT(*)::int AS total,
                            COUNT(*) FILTER (WHERE success = true)::int AS bypassed
                        FROM public.redteam_v2_data
                        WHERE job_id = p_job_id
                            AND attack_method IS NOT NULL
                        GROUP BY attack_method
                    ) m
                ),
                '[]'::jsonb
            )
        );
    $$;

  043-rt-v2-data-dashboard-aggregates.sql: |
    -- Aggregates across a scoped set of jobs for the top-level red-teaming
    -- dashboard (`/red-teaming/dashboard`). Unlike `rt_v2_data_aggregates` (key 040) and
    -- `rt_v2_data_filter_options` (key 042) — both scoped to ONE job_id — this one takes
    -- a job_id array so the server action can compute totals, per-category /
    -- per-attack-method breakdowns, and the category × attack_method heatmap in a
    -- single round-trip after resolving the org/project-scoped job list.
    --
    -- PostgREST doesn't do GROUP BY, so fetching rows and aggregating in Node would
    -- pull every attack row across every job in scope. This RPC keeps that work in
    -- the database (indexes from key 040 cover job_id + category / attack_method) and
    -- returns a compact JSON blob shaped for direct consumption by the dashboard.

    CREATE OR REPLACE FUNCTION public.rt_v2_data_dashboard_aggregates(p_job_ids text[])
    RETURNS jsonb
    LANGUAGE sql
    STABLE
    AS $$
        WITH rows AS (
            SELECT
                category,
                attack_method,
                success
            FROM public.redteam_v2_data
            WHERE job_id = ANY(p_job_ids)
        ),
        by_cat AS (
            SELECT
                category,
                COUNT(*)::int AS total,
                COUNT(*) FILTER (WHERE success = true)::int AS success
            FROM rows
            WHERE category IS NOT NULL
            GROUP BY category
        ),
        by_am AS (
            SELECT
                attack_method,
                COUNT(*)::int AS total,
                COUNT(*) FILTER (WHERE success = true)::int AS success
            FROM rows
            WHERE attack_method IS NOT NULL
            GROUP BY attack_method
        ),
        by_cell AS (
            SELECT
                category,
                attack_method,
                COUNT(*)::int AS total,
                COUNT(*) FILTER (WHERE success = true)::int AS success
            FROM rows
            WHERE category IS NOT NULL AND attack_method IS NOT NULL
            GROUP BY category, attack_method
        )
        SELECT jsonb_build_object(
            'total', COALESCE((SELECT COUNT(*)::int FROM rows), 0),
            'successful', COALESCE((SELECT COUNT(*)::int FROM rows WHERE success = true), 0),
            'by_category', COALESCE(
                (SELECT jsonb_agg(row_to_json(by_cat) ORDER BY by_cat.total DESC) FROM by_cat),
                '[]'::jsonb
            ),
            'by_attack_method', COALESCE(
                (SELECT jsonb_agg(row_to_json(by_am) ORDER BY by_am.total DESC) FROM by_am),
                '[]'::jsonb
            ),
            'heatmap', COALESCE(
                (SELECT jsonb_agg(row_to_json(by_cell)) FROM by_cell),
                '[]'::jsonb
            )
        );
    $$;

  044-index-guardrails-and-code-of-conduct.sql: |
    --
    -- Migration: 029_index_guardrails_and_code_of_conduct
    -- Description: Speed up per-org list/count endpoints on the Guardrails and
    --              Code of Conduct pages. Every list query filters on
    --              (id, project_name) — but the PK is (id, name, project_name),
    --              so filtering without `name` skips the middle column and
    --              forces Postgres to scan every row for the caller's id and
    --              filter project_name in memory. On big orgs this stalls.
    --
    --              Affected callers (all list-per-org-project):
    --                guardrails       → /api/users/[user_id]/guardrails/list-guardrails,
    --                                   /api/users/[user_id]/guardrails/policies,
    --                                   app/(withauth)/guardrails/policies/actions
    --                code_of_conduct  → /api/users/[user_id]/code-of-conduct/policies,
    --                                   app/(withauth)/policies/actions
    --
    --              Single-row lookups (id, name, project_name) already hit the
    --              PK, so detail endpoints do not need an extra index.
    --

    BEGIN;

    -- (id, project_name) — covers every list query on either table regardless
    -- of is_guardrail. Required because
    -- /api/users/[user_id]/guardrails/policies returns BOTH legacy
    -- (is_guardrail=false) and v2 (is_guardrail=true) rows, so the partial
    -- index below cannot stand alone.
    CREATE INDEX IF NOT EXISTS idx_guardrails_id_project
        ON public.guardrails (id, project_name);

    CREATE INDEX IF NOT EXISTS idx_code_of_conduct_id_project
        ON public.code_of_conduct (id, project_name);

    -- Partial variant for the is_guardrail=true hot path — /list-guardrails
    -- and the guardrail-only reads/writes in /guardrails/guardrail. Post the
    -- v2 backfill, roughly half of every caller's rows are legacy shadows;
    -- scanning only the guardrail half keeps the working set half-size and
    -- hot in cache.
    CREATE INDEX IF NOT EXISTS idx_guardrails_id_project_where_guardrail
        ON public.guardrails (id, project_name)
        WHERE is_guardrail = true;

    --
    -- Verify all three indexes exist.
    --
    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM pg_indexes
        WHERE schemaname = 'public' AND indexname = 'idx_guardrails_id_project'
      ) THEN
        RAISE EXCEPTION 'FAILED: idx_guardrails_id_project not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_indexes
        WHERE schemaname = 'public' AND indexname = 'idx_code_of_conduct_id_project'
      ) THEN
        RAISE EXCEPTION 'FAILED: idx_code_of_conduct_id_project not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_indexes
        WHERE schemaname = 'public' AND indexname = 'idx_guardrails_id_project_where_guardrail'
      ) THEN
        RAISE EXCEPTION 'FAILED: idx_guardrails_id_project_where_guardrail not created';
      END IF;

      RAISE NOTICE 'SUCCESS: 3 indexes created (or already present) on guardrails and code_of_conduct';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --

  045-index-models-deployments-invitations.sql: |
    --
    -- Migration: 030_index_models_deployments_invitations
    -- Description: Add per-org list indexes for three tables whose list/count
    --              endpoints currently seq-scan.
    --
    --                * models       — PK is (id, model_saved_name, project_name,
    --                                 model_version); list filters on
    --                                 (id, project_name) so the middle two PK
    --                                 columns block the leftmost prefix.
    --                * deployments  — PK is (id, name, project_name); same
    --                                 skip-middle problem as models.
    --                * invitations  — PK is (invitation_id). The org-owner
    --                                 column `id` has NO index at all — every
    --                                 org-scoped invitations list is a full
    --                                 table scan today. Also add a partial for
    --                                 the "my accepted invites / org members"
    --                                 lookup on (invitee) WHERE status='Accepted'.
    --
    --              Callers (representative):
    --                models       → /api/users/[user_id]/models/list-models,
    --                               app/(withauth)/{endpoints,targets}/actions
    --                deployments  → /api/users/[user_id]/deployments/list-deployments,
    --                               app/(withauth)/deployments/actions
    --                invitations  → app/(withauth)/home/actions,
    --                               /api/orgs/[org_id]/invitations/actions/*,
    --                               /api/orgs/[org_id]/members
    --
    --              Detail lookups already hit their PKs; nothing changes there.
    --

    BEGIN;

    CREATE INDEX IF NOT EXISTS idx_models_id_project
        ON public.models (id, project_name);

    CREATE INDEX IF NOT EXISTS idx_deployments_id_project
        ON public.deployments (id, project_name);

    -- (id) alone — covers every org-scoped invitations list. There is no
    -- existing index on this column; the PK is on invitation_id, not id.
    CREATE INDEX IF NOT EXISTS idx_invitations_org
        ON public.invitations (id);

    -- Partial variant for the "my accepted invites / org members" hot path.
    -- .eq("invitee", email).eq("status", "Accepted") is called from several
    -- places (home actions, settings, org members). Scoping on
    -- status='Accepted' keeps the index small — accepted invites are a
    -- fraction of total and this predicate rarely if ever changes.
    CREATE INDEX IF NOT EXISTS idx_invitations_invitee_accepted
        ON public.invitations (invitee)
        WHERE status = 'Accepted';

    --
    -- Verify all four indexes exist.
    --
    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM pg_indexes
        WHERE schemaname = 'public' AND indexname = 'idx_models_id_project'
      ) THEN
        RAISE EXCEPTION 'FAILED: idx_models_id_project not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_indexes
        WHERE schemaname = 'public' AND indexname = 'idx_deployments_id_project'
      ) THEN
        RAISE EXCEPTION 'FAILED: idx_deployments_id_project not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_indexes
        WHERE schemaname = 'public' AND indexname = 'idx_invitations_org'
      ) THEN
        RAISE EXCEPTION 'FAILED: idx_invitations_org not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_indexes
        WHERE schemaname = 'public' AND indexname = 'idx_invitations_invitee_accepted'
      ) THEN
        RAISE EXCEPTION 'FAILED: idx_invitations_invitee_accepted not created';
      END IF;

      RAISE NOTICE 'SUCCESS: 4 indexes created (or already present) on models, deployments, invitations';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --

  046-rtv2-service-role-grants.sql: |
    --
    -- Migration: 031_rtv2_service_role_grants
    -- Description: Grant service_role the DML it needs on the rtv2 tables.
    --
    --              The rtv2 migrations create their tables and never GRANT on them.
    --              Supabase's default privileges give service_role only Dxt
    --              (TRUNCATE/REFERENCES/TRIGGER), so on a fresh project the first
    --              POST /v1/redteam dies with `permission denied for table runs`
    --              (42501). Hosted dev and prod work only because someone granted
    --              out of band; a fresh on-prem install inherits nothing.
    --
    --              Explicit table list, not ALL TABLES IN SCHEMA public: `public`
    --              also holds the apiaas application tables. ALTER DEFAULT
    --              PRIVILEGES below covers tables added later.
    --
    --              anon and authenticated get nothing: every rtv2 reader goes
    --              through service_role, and key 037 installs a RESTRICTIVE
    --              deny-all for both on the pillar tables. Key 029's
    --              `TO authenticated` policies therefore stay inert by design —
    --              a policy grants nothing on its own.
    --
    -- Requires:    Keys 018 (playground), 029 (substrate), 030
    --              (relay_requests), 037 (pillar tables).
    -- Idempotent (GRANT is), transactional, self-verifying.
    --

    BEGIN;

    -- service_role ships with Supabase; create it idempotently so this migration
    -- also applies to a plain-Postgres database. Same pattern as key 039.
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
            CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS;
        END IF;
    END
    $$;

    -- Held via PUBLIC today; granted by name so this does not depend on that.
    GRANT USAGE ON SCHEMA public TO service_role;

    -- 6 tables from key 029, relay_requests from key 030, 6 pillars from key
    -- 037, and playground — created by key 018, extended by key 037, written
    -- live by sentry rtv2.
    GRANT SELECT, INSERT, UPDATE, DELETE ON
        public.programs,
        public.runs,
        public.test_statuses,
        public.records,
        public.run_coverage,
        public.redteam_datasets,
        public.relay_requests,
        public.threat_modeling,
        public.threat_modeling_data,
        public.redteam_v2,
        public.redteam_v2_data,
        public.eval,
        public.eval_data,
        public.playground
    TO service_role;

    -- Tables created in public from here on inherit the grant. Applies only to
    -- objects created by the current role — `postgres` in all four apply paths
    -- (psql, the on-prem operator, the Supabase SQL editor).
    ALTER DEFAULT PRIVILEGES IN SCHEMA public
        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO service_role;

    -- No rtv2 table uses a sequence today. This is the same rule for the first
    -- one that does; the public/S default ACL grants service_role only `w`.
    ALTER DEFAULT PRIVILEGES IN SCHEMA public
        GRANT USAGE, SELECT ON SEQUENCES TO service_role;

    --
    -- Verify: a grant migration that grants nothing looks identical to one that
    -- works, so assert all four privileges on all 14 tables and the default rule.
    --
    DO $$
    DECLARE
        t       text;
        p       text;
        missing text := '';
    BEGIN
        FOREACH t IN ARRAY ARRAY[
            'programs', 'runs', 'test_statuses', 'records', 'run_coverage',
            'redteam_datasets', 'relay_requests', 'threat_modeling',
            'threat_modeling_data', 'redteam_v2', 'redteam_v2_data',
            'eval', 'eval_data', 'playground'
        ] LOOP
            FOREACH p IN ARRAY ARRAY['SELECT', 'INSERT', 'UPDATE', 'DELETE'] LOOP
                IF NOT has_table_privilege(
                    'service_role', format('public.%I', t), p
                ) THEN
                    missing := missing || t || '.' || p || ' ';
                END IF;
            END LOOP;
        END LOOP;

        IF missing <> '' THEN
            RAISE EXCEPTION 'FAILED: service_role lacks privilege(s): %', missing;
        END IF;

        IF NOT EXISTS (
            SELECT 1
            FROM pg_default_acl d
            JOIN pg_namespace n ON n.oid = d.defaclnamespace
            CROSS JOIN LATERAL aclexplode(d.defaclacl) a
            WHERE n.nspname = 'public'
              AND d.defaclobjtype = 'r'
              AND d.defaclrole = current_user::regrole
              AND a.grantee = 'service_role'::regrole
              AND a.privilege_type IN ('SELECT', 'INSERT', 'UPDATE', 'DELETE')
            GROUP BY d.oid
            HAVING count(DISTINCT a.privilege_type) = 4
        ) THEN
            RAISE EXCEPTION
                'FAILED: default privileges on TABLES in public not set for service_role';
        END IF;

        RAISE NOTICE 'SUCCESS: service_role has SELECT/INSERT/UPDATE/DELETE on 14 rtv2 tables and on tables created in public hereafter';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --
  047-fix-relay-status-comment.sql: |
    --
    -- Migration: 032_fix_relay_status_comment
    -- Description: Correct runs.relay_status's column comment, which names a status
    --              the code has never written.
    --
    --              015 documented the column as `Running | Paused | AgentOffline`.
    --              The transport writes `BridgeOffline` — the feature was renamed
    --              agent -> bridge before it shipped and the comment was missed. So
    --              anyone reading the schema to find out what this column can hold
    --              gets one of the three values wrong, and it is the interesting
    --              one: the value that means the customer's bridge went away.
    --
    --              A comment-only migration rather than an edit to 015, because 015
    --              is already applied everywhere. Editing it in place would leave
    --              every deployed database still describing AgentOffline while the
    --              repo claimed otherwise, which is worse than the current state.
    --
    --              Idempotent and re-runnable: COMMENT ON COLUMN is a plain
    --              overwrite. Safe to apply in any order relative to other
    --              migrations, since it only touches a comment.
    --
    -- Rollback:    restore the previous text (it is wrong, so there is no reason to)
    --                COMMENT ON COLUMN public.runs.relay_status IS
    --                  'Relay transport status for runs with connect_via_relay=true: Running | Paused | AgentOffline. NULL when relay is not in use.';
    --
    -- Apply:
    -- psql -h localhost -U postgres -d postgres -f database/dev/public/migrations/032_fix_relay_status_comment.sql
    --

    COMMENT ON COLUMN public.runs.relay_status IS
        'Relay transport status for runs with connect_via_relay=true: Running | Paused | BridgeOffline. NULL when relay is not in use.';

  048-add-skill-scanner-api-usage.sql: |
    --
    -- Migration: 033_add_skill_scanner_api_usage
    -- Description: Append-only usage log for the gated Skill Scanner GET APIs
    --              (GET /skill-hub/scans/{id}, its /report, and the scans list).
    --              One row per metered API call, written best-effort by Kong
    --              (enkrypt-skill-scanner log phase) via POST /api/skill-hub/usage.
    --              This is the license/metering source of truth for Skill Scanner
    --              API usage, and the sibling of mcp_hub_api_usage (migration 012)
    --              for the feature:skill_scanner_apis entitlement. RLS-locked like
    --              every other public business table (service_role backend only);
    --              see migration 011.
    --              Unlike mcp_hub_api_usage this also stores user_email: the
    --              upstream has no org column, so an email is the only ownership
    --              key it has. Note Kong files a scan under the ORG OWNER's email
    --              for org and project keys, so this column (the caller) and the
    --              scan's owner differ for a project member -- group by org_id.
    --              Identical for dev and prod (only the psql host/path below differ).
    -- psql -h localhost -U postgres -d postgres -f database/dev/public/migrations/033_add_skill_scanner_api_usage.sql
    --

    BEGIN;

    -- ============================================================================
    -- Table: skill_scanner_api_usage
    -- Append-only event log; rows are never updated. Aggregated per org per period
    -- for license enforcement/reporting. No FK on org_id by design: metering must
    -- never reject a write, and org identity spans multiple Supabase projects.
    -- ============================================================================

    CREATE TABLE IF NOT EXISTS public.skill_scanner_api_usage (
        id bigint GENERATED BY DEFAULT AS IDENTITY NOT NULL,
        org_id uuid NOT NULL,
        user_id text,
        user_email text,
        project_name text,
        endpoint text NOT NULL,
        http_method text DEFAULT 'GET'::text NOT NULL,
        scan_id text,
        response_status integer,
        request_id text,
        created_at timestamp with time zone DEFAULT now() NOT NULL
    );

    --
    -- Table / Column Comments
    --

    COMMENT ON TABLE public.skill_scanner_api_usage IS 'Append-only audit/usage-metrics log of gated Skill Scanner API GET calls (scan by id, scan report, scans list). Written best-effort by Kong (enkrypt-skill-scanner log phase) via POST /api/skill-hub/usage. The license itself is the time-boxed OpenFGA grant on feature:skill_scanner_apis; this table is for audit/reporting only. Sibling of mcp_hub_api_usage.';

    COMMENT ON COLUMN public.skill_scanner_api_usage.org_id IS 'Organization charged for this call (Kong consumer.org_id; matches org:<org_id> in OpenFGA).';

    COMMENT ON COLUMN public.skill_scanner_api_usage.user_id IS 'Acting identity that made the call (may equal org_id for owner accounts).';

    COMMENT ON COLUMN public.skill_scanner_api_usage.user_email IS 'Normalized (lower-cased) email of the CALLING consumer - who made this call. Not necessarily the email the scan is filed under: for an org or project API key Kong scopes scans to the org OWNER''s email so the whole org shares one view, so a project member appears here while their scans live under the owner. Use org_id to group by tenant.';

    COMMENT ON COLUMN public.skill_scanner_api_usage.endpoint IS 'Which gated endpoint: scan_get | scan_report | scans_list. Values are the path_config.kind strings from the Kong plugin.';

    COMMENT ON COLUMN public.skill_scanner_api_usage.scan_id IS 'Skill scan id for scan_get/scan_report; NULL for scans_list.';

    COMMENT ON COLUMN public.skill_scanner_api_usage.response_status IS 'Final HTTP status returned to the caller (lets reporting filter to successful 2xx calls).';

    COMMENT ON COLUMN public.skill_scanner_api_usage.request_id IS 'Kong request id; UNIQUE for idempotent at-least-once delivery (upsert on conflict do nothing).';

    --
    -- Surrogate primary key + idempotency key. Both guarded so the migration is
    -- safely re-runnable (unlike migration 012, which is not).
    --

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.table_constraints
        WHERE table_schema = 'public' AND table_name = 'skill_scanner_api_usage'
          AND constraint_name = 'skill_scanner_api_usage_pkey'
      ) THEN
        ALTER TABLE ONLY public.skill_scanner_api_usage
          ADD CONSTRAINT skill_scanner_api_usage_pkey PRIMARY KEY (id);
      END IF;

      -- One row per Kong request. Postgres treats NULLs as distinct, so a rare
      -- missing request_id still inserts (never blocks metering).
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.table_constraints
        WHERE table_schema = 'public' AND table_name = 'skill_scanner_api_usage'
          AND constraint_name = 'skill_scanner_api_usage_request_id_key'
      ) THEN
        ALTER TABLE ONLY public.skill_scanner_api_usage
          ADD CONSTRAINT skill_scanner_api_usage_request_id_key UNIQUE (request_id);
      END IF;
    END $$;

    --
    -- Row Level Security: locked (service_role backend only), matching the
    -- RESTRICTIVE deny-all posture established for every public table in 011.
    --

    -- anon / authenticated ship with Supabase, but not with a plain-Postgres
    -- dev/test or on-prem-operator database, where the policy below would fail with
    -- `role "anon" does not exist`. Create them idempotently — the same guard 014
    -- uses for `authenticated` and 022 uses for both.
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
            CREATE ROLE anon NOLOGIN NOINHERIT;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
            CREATE ROLE authenticated NOLOGIN NOINHERIT;
        END IF;
    END
    $$;

    ALTER TABLE public.skill_scanner_api_usage ENABLE ROW LEVEL SECURITY;

    DROP POLICY IF EXISTS deny_all_skill_scanner_api_usage ON public.skill_scanner_api_usage;

    CREATE POLICY deny_all_skill_scanner_api_usage
        ON public.skill_scanner_api_usage
        AS RESTRICTIVE FOR ALL TO anon, authenticated
        USING (false) WITH CHECK (false);

    -- Explicit: Supabase Cloud stops default-granting new public tables on 2026-10-30; Next.js writes it as service_role.
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
            CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS;
        END IF;
    END
    $$;

    GRANT SELECT, INSERT, UPDATE, DELETE ON public.skill_scanner_api_usage TO service_role;

    --
    -- Indexes for license aggregation (count per org over a billing period)
    --

    CREATE INDEX IF NOT EXISTS idx_skill_scanner_api_usage_org_created
        ON public.skill_scanner_api_usage (org_id, created_at);

    CREATE INDEX IF NOT EXISTS idx_skill_scanner_api_usage_created
        ON public.skill_scanner_api_usage (created_at);

    --
    -- Verify the schema changes
    --

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.tables
        WHERE table_schema = 'public' AND table_name = 'skill_scanner_api_usage'
      ) THEN
        RAISE EXCEPTION 'FAILED: skill_scanner_api_usage table was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'skill_scanner_api_usage'
          AND column_name = 'user_email'
      ) THEN
        RAISE EXCEPTION 'FAILED: user_email column was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.table_constraints
        WHERE table_schema = 'public' AND table_name = 'skill_scanner_api_usage'
          AND constraint_name = 'skill_scanner_api_usage_request_id_key'
      ) THEN
        RAISE EXCEPTION 'FAILED: unique constraint on request_id was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_policy p
        JOIN pg_class c ON c.oid = p.polrelid
        JOIN pg_namespace ns ON ns.oid = c.relnamespace
        WHERE ns.nspname = 'public' AND c.relname = 'skill_scanner_api_usage'
          AND p.polname = 'deny_all_skill_scanner_api_usage'
      ) THEN
        RAISE EXCEPTION 'FAILED: deny-all RLS policy was not created';
      END IF;

      IF EXISTS (
        SELECT 1 FROM unnest(ARRAY['SELECT', 'INSERT', 'UPDATE', 'DELETE']) AS p
        WHERE NOT has_table_privilege('service_role', 'public.skill_scanner_api_usage', p)
      ) THEN
        RAISE EXCEPTION 'FAILED: service_role lacks DML on skill_scanner_api_usage';
      END IF;

      RAISE NOTICE 'SUCCESS: skill_scanner_api_usage table created and locked down';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --

  049-add-compliance-scans-table.sql: |
    --
    -- Migration: 034_add_compliance_scans_table
    -- Description: Compliance scans. One row per scan_id (platform-generated
    --              UUID; the NATS subject, log_files FK, and URL path).
    --              UNIQUE (id, scan_name, project_name) keeps one scan name per
    --              project per owner; those names stay renameable. Stores the
    --              provider workspace, encrypted compliance API key, selected
    --              EVENT_TYPE services, the shared cursor, and last_polled_at
    --              (written on every successful poll so a frozen cursor can be
    --              told from a dead pod).
    --              Also creates public.EVENT_TYPE, public.CONNECTION_STATUS,
    --              public.PROVIDER. All enum values are defined up front —
    --              ALTER TYPE ... ADD VALUE cannot run in the same transaction
    --              that creates the type.
    --              RLS-locked like every other public business table
    --              (service_role backend only); see migration 011.
    --              Identical for dev and prod (only the psql host/path below differ).
    -- psql -h localhost -U postgres -d postgres -f database/dev/public/migrations/034_add_compliance_scans_table.sql
    --


    BEGIN;

    -- ============================================================================
    -- Enums. Idempotent CREATE TYPE: 007 is not re-runnable; this one is.
    -- ============================================================================

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM pg_type t
        JOIN pg_namespace n ON n.oid = t.typnamespace
        WHERE n.nspname = 'public' AND t.typname = 'EVENT_TYPE'
      ) THEN
        CREATE TYPE public."EVENT_TYPE" AS ENUM (
          'CONVERSATION_MESSAGE',
          'CODEX_LOG',
          'APP_LOG',
          'CUSTOM_AGENTS_LOG',
          'CHATGPT_PLUGIN_SPREADSHEET'
        );
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_type t
        JOIN pg_namespace n ON n.oid = t.typnamespace
        WHERE n.nspname = 'public' AND t.typname = 'CONNECTION_STATUS'
      ) THEN
        CREATE TYPE public."CONNECTION_STATUS" AS ENUM (
          'active',
          'paused',
          'needs_reconnect',
          'disabled'
        );
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_type t
        JOIN pg_namespace n ON n.oid = t.typnamespace
        WHERE n.nspname = 'public' AND t.typname = 'PROVIDER'
      ) THEN
        CREATE TYPE public."PROVIDER" AS ENUM (
          'openai',
          'anthropic'
        );
      END IF;
    END $$;

    COMMENT ON TYPE public."EVENT_TYPE" IS 'Compliance-scan event/log services: CONVERSATION_MESSAGE, CODEX_LOG, APP_LOG, CUSTOM_AGENTS_LOG, CHATGPT_PLUGIN_SPREADSHEET.';

    COMMENT ON TYPE public."CONNECTION_STATUS" IS 'Scan lifecycle: active (pod picks this up), paused, needs_reconnect, disabled.';

    COMMENT ON TYPE public."PROVIDER" IS 'Provider the workspace lives on: openai | anthropic.';

    -- ============================================================================
    -- Table: compliance_scans
    -- PK is scan_id. id is the owning subscription and repeats across rows.
    -- ============================================================================

    CREATE TABLE IF NOT EXISTS public.compliance_scans (
        scan_id            uuid NOT NULL DEFAULT gen_random_uuid(),
        id                 uuid NOT NULL,
        project_name       text NOT NULL DEFAULT 'default',
        scan_name          text NOT NULL,
        created_by         uuid NOT NULL,
        updated_by         uuid NOT NULL,
        provider           public."PROVIDER" NOT NULL,
        workspace_id       uuid NOT NULL,
        compliance_api_key text NOT NULL,
        event_types        public."EVENT_TYPE"[] NOT NULL,
        guardrails_name    text NOT NULL,
        cursor_end_time    timestamp with time zone NOT NULL,
        cursor_file_id     text,
        last_polled_at     timestamp with time zone,
        list_interval_s    integer NOT NULL DEFAULT 60,
        pending_cap        integer NOT NULL DEFAULT 5000,
        status             public."CONNECTION_STATUS" NOT NULL,
        created_at         timestamp with time zone NOT NULL DEFAULT now(),
        updated_at         timestamp with time zone NOT NULL DEFAULT now()
    );

    --
    -- Table / Column Comments
    --

    COMMENT ON TABLE public.compliance_scans IS 'Compliance scans. PK is scan_id (platform-generated). UNIQUE (id, scan_name, project_name) is one scan name per project per owner; names may be renamed.';

    COMMENT ON COLUMN public.compliance_scans.scan_id IS 'Platform-generated scan id (DEFAULT gen_random_uuid()). Stable single-column key for the NATS subject, log_files FK, and URL paths. Not a provider-side identifier — the OpenAI Compliance API has no connection object.';

    COMMENT ON COLUMN public.compliance_scans.id IS 'Owning subscription (user_id or org_id). Repeats across rows. FK to public.subscription(id).';

    COMMENT ON COLUMN public.compliance_scans.project_name IS 'Project this scan belongs to. Display name; may be renamed.';

    COMMENT ON COLUMN public.compliance_scans.scan_name IS 'User-chosen display name for the scan. May be renamed.';

    COMMENT ON COLUMN public.compliance_scans.created_by IS 'Platform user who started the scan. FK to public.subscription(id).';

    COMMENT ON COLUMN public.compliance_scans.updated_by IS 'Platform user who last updated the scan; initially the same as created_by. FK to public.subscription(id).';

    COMMENT ON COLUMN public.compliance_scans.provider IS 'PROVIDER enum: openai | anthropic.';

    COMMENT ON COLUMN public.compliance_scans.workspace_id IS 'Provider workspace this scan polls.';

    COMMENT ON COLUMN public.compliance_scans.compliance_api_key IS 'Encrypted compliance API key.';

    COMMENT ON COLUMN public.compliance_scans.event_types IS 'Selected EVENT_TYPE services. All share one cursor.';

    COMMENT ON COLUMN public.compliance_scans.guardrails_name IS 'Guardrails policy name; the compliance pod resolves this to a detector config.';

    COMMENT ON COLUMN public.compliance_scans.cursor_end_time IS 'The provider API last_end_time cursor.';

    COMMENT ON COLUMN public.compliance_scans.cursor_file_id IS 'Cursor file id, for audit only.';

    COMMENT ON COLUMN public.compliance_scans.last_polled_at IS 'Set on every successful poll, whether or not new files came back. Distinguishes a frozen cursor on a live pod from a dead pod.';

    COMMENT ON COLUMN public.compliance_scans.list_interval_s IS 'Seconds between list polls. Default 60.';

    COMMENT ON COLUMN public.compliance_scans.pending_cap IS 'Max pending events before the poller backs off. Default 5000.';

    COMMENT ON COLUMN public.compliance_scans.status IS 'CONNECTION_STATUS enum. The pod picks up work with status = active.';

    --
    -- Primary key, unique, foreign keys. Guarded so the migration is re-runnable.
    --

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.table_constraints
        WHERE table_schema = 'public' AND table_name = 'compliance_scans'
          AND constraint_name = 'compliance_scans_pkey'
      ) THEN
        ALTER TABLE ONLY public.compliance_scans
          ADD CONSTRAINT compliance_scans_pkey PRIMARY KEY (scan_id);
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.table_constraints
        WHERE table_schema = 'public' AND table_name = 'compliance_scans'
          AND constraint_name = 'compliance_scans_id_scan_name_project_name_key'
      ) THEN
        ALTER TABLE ONLY public.compliance_scans
          ADD CONSTRAINT compliance_scans_id_scan_name_project_name_key
          UNIQUE (id, scan_name, project_name);
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.table_constraints
        WHERE table_schema = 'public' AND table_name = 'compliance_scans'
          AND constraint_name = 'compliance_scans_id_fkey'
      ) THEN
        ALTER TABLE ONLY public.compliance_scans
          ADD CONSTRAINT compliance_scans_id_fkey
          FOREIGN KEY (id) REFERENCES public.subscription(id)
          ON UPDATE CASCADE ON DELETE CASCADE;
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.table_constraints
        WHERE table_schema = 'public' AND table_name = 'compliance_scans'
          AND constraint_name = 'compliance_scans_created_by_fkey'
      ) THEN
        ALTER TABLE ONLY public.compliance_scans
          ADD CONSTRAINT compliance_scans_created_by_fkey
          FOREIGN KEY (created_by) REFERENCES public.subscription(id)
          ON UPDATE CASCADE;
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.table_constraints
        WHERE table_schema = 'public' AND table_name = 'compliance_scans'
          AND constraint_name = 'compliance_scans_updated_by_fkey'
      ) THEN
        ALTER TABLE ONLY public.compliance_scans
          ADD CONSTRAINT compliance_scans_updated_by_fkey
          FOREIGN KEY (updated_by) REFERENCES public.subscription(id)
          ON UPDATE CASCADE;
      END IF;
    END $$;

    --
    -- Row Level Security: locked (service_role backend only), matching the
    -- RESTRICTIVE deny-all posture established for every public table in 011.
    --

    -- anon / authenticated ship with Supabase, but not with a plain-Postgres
    -- dev/test or on-prem-operator database, where the policy below would fail with
    -- `role "anon" does not exist`. Create them idempotently — the same guard 014
    -- uses for `authenticated` and 022 uses for both.
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
            CREATE ROLE anon NOLOGIN NOINHERIT;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
            CREATE ROLE authenticated NOLOGIN NOINHERIT;
        END IF;
    END
    $$;

    ALTER TABLE public.compliance_scans ENABLE ROW LEVEL SECURITY;

    DROP POLICY IF EXISTS deny_all_compliance_scans ON public.compliance_scans;

    CREATE POLICY deny_all_compliance_scans
        ON public.compliance_scans
        AS RESTRICTIVE FOR ALL TO anon, authenticated
        USING (false) WITH CHECK (false);

    --
    -- Indexes for list-by-project queries. UNIQUE is (id, scan_name, project_name),
    -- so (id, project_name) is not a prefix and would otherwise seq-scan.
    -- Same shape as 029/030 on guardrails/models/deployments.
    --

    CREATE INDEX IF NOT EXISTS idx_compliance_scans_user_project
        ON public.compliance_scans (id, project_name);

    --
    -- Verify the schema changes
    --

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM pg_type t
        JOIN pg_namespace n ON n.oid = t.typnamespace
        WHERE n.nspname = 'public' AND t.typname = 'EVENT_TYPE'
      ) THEN
        RAISE EXCEPTION 'FAILED: EVENT_TYPE enum was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_type t
        JOIN pg_namespace n ON n.oid = t.typnamespace
        WHERE n.nspname = 'public' AND t.typname = 'CONNECTION_STATUS'
      ) THEN
        RAISE EXCEPTION 'FAILED: CONNECTION_STATUS enum was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_type t
        JOIN pg_namespace n ON n.oid = t.typnamespace
        WHERE n.nspname = 'public' AND t.typname = 'PROVIDER'
      ) THEN
        RAISE EXCEPTION 'FAILED: PROVIDER enum was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.tables
        WHERE table_schema = 'public' AND table_name = 'compliance_scans'
      ) THEN
        RAISE EXCEPTION 'FAILED: compliance_scans table was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'compliance_scans'
          AND column_name = 'last_polled_at'
      ) THEN
        RAISE EXCEPTION 'FAILED: compliance_scans.last_polled_at was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.table_constraints
        WHERE table_schema = 'public' AND table_name = 'compliance_scans'
          AND constraint_name = 'compliance_scans_pkey'
      ) THEN
        RAISE EXCEPTION 'FAILED: compliance_scans primary key was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.table_constraints
        WHERE table_schema = 'public' AND table_name = 'compliance_scans'
          AND constraint_name = 'compliance_scans_id_scan_name_project_name_key'
      ) THEN
        RAISE EXCEPTION 'FAILED: UNIQUE (id, scan_name, project_name) was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.table_constraints
        WHERE table_schema = 'public' AND table_name = 'compliance_scans'
          AND constraint_name = 'compliance_scans_id_fkey'
      ) THEN
        RAISE EXCEPTION 'FAILED: compliance_scans.id FK to subscription was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_policy p
        JOIN pg_class c ON c.oid = p.polrelid
        JOIN pg_namespace ns ON ns.oid = c.relnamespace
        WHERE ns.nspname = 'public' AND c.relname = 'compliance_scans'
          AND p.polname = 'deny_all_compliance_scans'
      ) THEN
        RAISE EXCEPTION 'FAILED: deny-all RLS policy was not created';
      END IF;

      RAISE NOTICE 'SUCCESS: compliance_scans table created and locked down';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --
  050-add-log-files-table.sql: |
    --
    -- Migration: 035_add_log_files_table
    -- Description: Per-scan log files opened and closed by the compliance scan
    --              loop. One row per (scan_id, log_file_id). scan_id FKs
    --              compliance_scans.scan_id (the PK from 034), so no extra UNIQUE
    --              is needed. Also creates public.LOG_FILE_STATUS (open, done,
    --              partial, skipped) — all values up front because ALTER TYPE
    --              ... ADD VALUE cannot run in the same transaction that
    --              creates the type. skipped = aged out of OpenAI's 30-day
    --              retention before download; partial is defined but not yet
    --              written by the pod.
    --              Carries four distinct clocks, which is the whole reason the
    --              column comments below are worth reading: first_event_at /
    --              last_event_at are the provider's message timestamps inside the
    --              file, started_at / ended_at are the scanner's own, and end_time
    --              is when the provider closed the file.
    --              RLS-locked like every other public business table
    --              (service_role backend only); see migration 011.
    --              Requires: migration 034 (compliance_scans, EVENT_TYPE).
    --              Identical for dev and prod (only the psql host/path below differ).
    --


    BEGIN;

    -- ============================================================================
    -- Enum: LOG_FILE_STATUS
    -- ============================================================================

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM pg_type t
        JOIN pg_namespace n ON n.oid = t.typnamespace
        WHERE n.nspname = 'public' AND t.typname = 'LOG_FILE_STATUS'
      ) THEN
        CREATE TYPE public."LOG_FILE_STATUS" AS ENUM (
          'open',
          'done',
          'partial',
          'skipped'
        );
      END IF;
    END $$;

    COMMENT ON TYPE public."LOG_FILE_STATUS" IS 'open | done | partial (defined, not yet written by the pod) | skipped (aged out of OpenAI 30-day retention before download).';

    -- ============================================================================
    -- Table: log_files
    -- Opened and closed by the scan loop. One row per log file of a scan.
    -- ============================================================================

    CREATE TABLE IF NOT EXISTS public.log_files (
        scan_id        uuid NOT NULL,
        log_file_id    text NOT NULL,
        event_type     public."EVENT_TYPE",
        end_time       timestamp with time zone,
        file_size      bigint,
        first_event_at timestamp with time zone,
        last_event_at  timestamp with time zone,
        started_at     timestamp with time zone,
        ended_at       timestamp with time zone,
        messages_count integer,
        flagged_count  integer,
        status         public."LOG_FILE_STATUS" NOT NULL,
        error          text
    );

    --
    -- Table / Column Comments
    --

    COMMENT ON TABLE public.log_files IS 'Log files opened and closed by the compliance scan loop. One row per (scan_id, log_file_id).';

    COMMENT ON COLUMN public.log_files.scan_id IS 'FK to public.compliance_scans(scan_id). Cascades on scan delete.';

    COMMENT ON COLUMN public.log_files.log_file_id IS 'Provider log-file identifier.';

    COMMENT ON COLUMN public.log_files.event_type IS 'EVENT_TYPE this file covers. NULL when not yet known.';

    COMMENT ON COLUMN public.log_files.end_time IS 'When the provider closed/wrote this log file. Provider clock. There is no matching start time - the provider does not report one, which is why first_event_at exists.';

    COMMENT ON COLUMN public.log_files.first_event_at IS 'Timestamp of the earliest message inside this file. Provider clock, not the scanner''s - use this and last_event_at to say which period the file covers.';

    COMMENT ON COLUMN public.log_files.last_event_at IS 'Timestamp of the latest message inside this file. Provider clock. Pairs with first_event_at; both are NULL until the file is parsed.';

    COMMENT ON COLUMN public.log_files.file_size IS 'File size in bytes, when reported.';

    COMMENT ON COLUMN public.log_files.started_at IS 'When the scan loop opened this file (is_first). Scanner clock - when the work happened, not when the messages did.';

    COMMENT ON COLUMN public.log_files.ended_at IS 'When the scan loop closed this file (is_last). Scanner clock.';

    COMMENT ON COLUMN public.log_files.messages_count IS 'Message count from an aggregation at close time.';

    COMMENT ON COLUMN public.log_files.flagged_count IS 'Flagged-message count from an aggregation at close time.';

    COMMENT ON COLUMN public.log_files.status IS 'LOG_FILE_STATUS: open | done | partial | skipped.';

    COMMENT ON COLUMN public.log_files.error IS 'Error text when status is partial; NULL otherwise.';

    --
    -- The two event-time columns are added separately as well as declared above:
    -- CREATE TABLE IF NOT EXISTS is a no-op against a table created by an earlier
    -- run of this file, so the columns would never appear there.
    --

    ALTER TABLE public.log_files
      ADD COLUMN IF NOT EXISTS first_event_at timestamp with time zone,
      ADD COLUMN IF NOT EXISTS last_event_at  timestamp with time zone;

    --
    -- Primary key + foreign key. Guarded so the migration is re-runnable.
    -- Composite PK (scan_id, log_file_id): scan_id alone is not unique across
    -- files of one scan. FK targets compliance_scans.scan_id (the PK).
    --

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.table_constraints
        WHERE table_schema = 'public' AND table_name = 'log_files'
          AND constraint_name = 'log_files_pkey'
      ) THEN
        ALTER TABLE ONLY public.log_files
          ADD CONSTRAINT log_files_pkey PRIMARY KEY (scan_id, log_file_id);
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.table_constraints
        WHERE table_schema = 'public' AND table_name = 'log_files'
          AND constraint_name = 'log_files_scan_id_fkey'
      ) THEN
        ALTER TABLE ONLY public.log_files
          ADD CONSTRAINT log_files_scan_id_fkey
          FOREIGN KEY (scan_id) REFERENCES public.compliance_scans(scan_id)
          ON DELETE CASCADE;
      END IF;
    END $$;

    --
    -- Row Level Security: locked (service_role backend only), matching the
    -- RESTRICTIVE deny-all posture established for every public table in 011.
    --

    -- anon / authenticated ship with Supabase, but not with a plain-Postgres
    -- dev/test or on-prem-operator database, where the policy below would fail with
    -- `role "anon" does not exist`. Create them idempotently — the same guard 014
    -- uses for `authenticated` and 022 uses for both.
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
            CREATE ROLE anon NOLOGIN NOINHERIT;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
            CREATE ROLE authenticated NOLOGIN NOINHERIT;
        END IF;
    END
    $$;

    ALTER TABLE public.log_files ENABLE ROW LEVEL SECURITY;

    DROP POLICY IF EXISTS deny_all_log_files ON public.log_files;

    CREATE POLICY deny_all_log_files
        ON public.log_files
        AS RESTRICTIVE FOR ALL TO anon, authenticated
        USING (false) WITH CHECK (false);

    --
    -- Verify the schema changes
    --

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM pg_type t
        JOIN pg_namespace n ON n.oid = t.typnamespace
        WHERE n.nspname = 'public' AND t.typname = 'LOG_FILE_STATUS'
      ) THEN
        RAISE EXCEPTION 'FAILED: LOG_FILE_STATUS enum was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.tables
        WHERE table_schema = 'public' AND table_name = 'log_files'
      ) THEN
        RAISE EXCEPTION 'FAILED: log_files table was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.table_constraints
        WHERE table_schema = 'public' AND table_name = 'log_files'
          AND constraint_name = 'log_files_pkey'
      ) THEN
        RAISE EXCEPTION 'FAILED: log_files primary key was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'log_files'
          AND column_name IN ('first_event_at', 'last_event_at')
        GROUP BY table_name HAVING count(*) = 2
      ) THEN
        RAISE EXCEPTION 'FAILED: log_files event-time columns were not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.table_constraints
        WHERE table_schema = 'public' AND table_name = 'log_files'
          AND constraint_name = 'log_files_scan_id_fkey'
      ) THEN
        RAISE EXCEPTION 'FAILED: log_files.scan_id FK was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_policy p
        JOIN pg_class c ON c.oid = p.polrelid
        JOIN pg_namespace ns ON ns.oid = c.relnamespace
        WHERE ns.nspname = 'public' AND c.relname = 'log_files'
          AND p.polname = 'deny_all_log_files'
      ) THEN
        RAISE EXCEPTION 'FAILED: deny-all RLS policy was not created';
      END IF;

      RAISE NOTICE 'SUCCESS: log_files table created and locked down';
    END $$;

    COMMIT;

    --
    -- Migration Complete
    --

  051-add-compliance-aggregate-functions.sql: |
    --
    -- Migration: 036_add_compliance_aggregate_functions
    -- Description: Two read-only aggregates over public.log_files, so the scans
    --              table and its KPI strip do not have to fold every log-file row
    --              in the application. PostgREST cannot express GROUP BY, which is
    --              the whole reason these exist.
    --              Both are SECURITY INVOKER. They read tables that carry a
    --              RESTRICTIVE deny-all policy for anon/authenticated (011, 034,
    --              035), so an invoker who is not service_role sees nothing even
    --              with the EXECUTE grant — the RLS is the boundary, not the
    --              grant. Neither function does tenancy of its own: the caller
    --              passes ids it has already scoped, exactly as the application
    --              does for every other compliance read.
    --              Requires: migration 034 (compliance_scans, CONNECTION_STATUS)
    --              and migration 035 (log_files).
    --              Identical for dev and prod (only the psql host/path below differ).
    --


    BEGIN;

    -- ============================================================================
    -- compliance_scan_totals — per-scan rollup for the scans table
    -- ============================================================================
    --
    -- Returns one row per scan that HAS log files. A scan with none is absent
    -- rather than zero, and the caller renders that difference: nothing aggregated
    -- yet is not the same answer as a scan that read nothing.
    --
    -- messages_count / flagged_count are written when a file closes, so an `open`
    -- file contributes NULL and COALESCE counts it as zero. These are therefore
    -- totals for completed work — a number that moved backwards when a file
    -- reopened would be worse than one that lags.
    --

    CREATE OR REPLACE FUNCTION public.compliance_scan_totals(p_scan_ids uuid[])
    RETURNS TABLE (
        scan_id      uuid,
        interactions bigint,
        violations   bigint,
        files        bigint,
        started_at   timestamp with time zone
    )
    LANGUAGE sql
    STABLE
    SECURITY INVOKER
    SET search_path = public, pg_temp
    AS $$
        SELECT lf.scan_id,
               COALESCE(SUM(lf.messages_count), 0)::bigint,
               COALESCE(SUM(lf.flagged_count), 0)::bigint,
               COUNT(*)::bigint,
               -- Scanner clock, not the provider's: when this scan first did work.
               MIN(lf.started_at)
        FROM public.log_files lf
        WHERE lf.scan_id = ANY(p_scan_ids)
        GROUP BY lf.scan_id;
    $$;

    COMMENT ON FUNCTION public.compliance_scan_totals(uuid[]) IS 'Per-scan log_files rollup for the compliance scans table. Scans with no log files are omitted, not returned as zero. Does no tenancy: pass scan ids already scoped by the caller.';

    -- ============================================================================
    -- compliance_project_totals — the KPI strip above that table
    -- ============================================================================
    --
    -- One row, always. p_project_name NULL means every project of that owner,
    -- which is what individual (non-org) mode asks for — it is the one account
    -- type updateQueryWithUser does not filter by project.
    --
    -- The flag rate is deliberately NOT returned: it is violations/interactions and
    -- has to be computed from the sums. Averaging the per-scan rates instead would
    -- weight a ten-message scan like a ten-million-message one.
    --

    CREATE OR REPLACE FUNCTION public.compliance_project_totals(
        p_owner_id     uuid,
        p_project_name text DEFAULT NULL
    )
    RETURNS TABLE (
        scans           bigint,
        active          bigint,
        needs_reconnect bigint,
        interactions    bigint,
        violations      bigint
    )
    LANGUAGE sql
    STABLE
    SECURITY INVOKER
    SET search_path = public, pg_temp
    AS $$
        WITH s AS (
            SELECT cs.scan_id, cs.status
            FROM public.compliance_scans cs
            WHERE cs.id = p_owner_id
              AND (p_project_name IS NULL OR cs.project_name = p_project_name)
        )
        SELECT
            (SELECT COUNT(*) FROM s)::bigint,
            (SELECT COUNT(*) FROM s WHERE s.status = 'active')::bigint,
            -- Its own number because total and active both hide it: the provider
            -- rejected the key and the scan is silently not running.
            (SELECT COUNT(*) FROM s WHERE s.status = 'needs_reconnect')::bigint,
            COALESCE(SUM(lf.messages_count), 0)::bigint,
            COALESCE(SUM(lf.flagged_count), 0)::bigint
        FROM s
        LEFT JOIN public.log_files lf ON lf.scan_id = s.scan_id;
    $$;

    COMMENT ON FUNCTION public.compliance_project_totals(uuid, text) IS 'Scan counts and log_files totals for one owner, optionally one project (NULL = all projects, which is individual account mode). Does no tenancy: pass an owner id already resolved by the caller.';

    --
    -- Grants. service_role only, matching every other compliance object.
    --
    -- anon / authenticated ship with Supabase but not with a plain-Postgres
    -- dev/test or on-prem-operator database, where the REVOKE below would fail with
    -- `role "anon" does not exist`. Create them idempotently, the same guard 035
    -- uses.
    --

    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
            CREATE ROLE anon NOLOGIN NOINHERIT;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
            CREATE ROLE authenticated NOLOGIN NOINHERIT;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
            CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS;
        END IF;
    END
    $$;

    REVOKE EXECUTE ON FUNCTION public.compliance_scan_totals(uuid[])         FROM PUBLIC, anon, authenticated;
    REVOKE EXECUTE ON FUNCTION public.compliance_project_totals(uuid, text)  FROM PUBLIC, anon, authenticated;

    GRANT EXECUTE ON FUNCTION public.compliance_scan_totals(uuid[])          TO service_role;
    GRANT EXECUTE ON FUNCTION public.compliance_project_totals(uuid, text)   TO service_role;

    --
    -- Verify the schema changes
    --

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM pg_proc p
        JOIN pg_namespace n ON n.oid = p.pronamespace
        WHERE n.nspname = 'public' AND p.proname = 'compliance_scan_totals'
      ) THEN
        RAISE EXCEPTION 'FAILED: compliance_scan_totals was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_proc p
        JOIN pg_namespace n ON n.oid = p.pronamespace
        WHERE n.nspname = 'public' AND p.proname = 'compliance_project_totals'
      ) THEN
        RAISE EXCEPTION 'FAILED: compliance_project_totals was not created';
      END IF;

      IF NOT has_function_privilege('service_role', 'public.compliance_scan_totals(uuid[])', 'EXECUTE') THEN
        RAISE EXCEPTION 'FAILED: service_role cannot execute compliance_scan_totals';
      END IF;

      IF NOT has_function_privilege('service_role', 'public.compliance_project_totals(uuid, text)', 'EXECUTE') THEN
        RAISE EXCEPTION 'FAILED: service_role cannot execute compliance_project_totals';
      END IF;

      RAISE NOTICE 'SUCCESS: compliance aggregate functions created and granted';
    END $$;

    COMMIT;

  052-add-compliance-indexes.sql: |
    --
    -- Migration: 037_add_compliance_indexes
    -- Description: Two indexes for the compliance module's read paths — the scans
    --              list and everything the scan report derives from log_files.
    --              Deliberately two, not a set per query. Both tables are written
    --              by the compliance-scan pod (log_files takes an INSERT when a
    --              file opens and an UPDATE when it closes), so every extra index
    --              is paid for on ingest, and an index on a column the pod updates
    --              also costs the HOT-update path.
    --              Requires: migration 034 (compliance_scans) and 035 (log_files).
    --              Identical for dev and prod (only the psql host/path below differ).
    --


    BEGIN;

    -- ============================================================================
    -- compliance_scans — the scans list
    -- ============================================================================
    --
    -- The list filters `id` + `project_name` and then orders by `created_at DESC`
    -- with a LIMIT. 034 already indexes (id, project_name), which serves the filter
    -- and then leaves a sort. Adding `created_at DESC` to the same index lets the
    -- ORDER BY ... LIMIT walk it instead.
    --
    -- This REPLACES the 034 index rather than sitting beside it: (id, project_name)
    -- is a strict prefix of the new one, so every lookup that used the old index
    -- uses this one, and keeping both would be a second index the pod pays to
    -- maintain for nothing.
    --
    -- Not indexed: `status`. The tab filter narrows an already small per-project
    -- result, and a fourth column would only help once a project has thousands of
    -- scans — which is not the shape of this table.
    --
    -- `scan_name` lookups are already covered: UNIQUE (id, scan_name, project_name)
    -- from 034 gives the (id, scan_name) prefix that get-scan and the miss
    -- diagnosis both use.
    --

    CREATE INDEX IF NOT EXISTS idx_compliance_scans_owner_project_created
        ON public.compliance_scans (id, project_name, created_at DESC);

    DROP INDEX IF EXISTS public.idx_compliance_scans_user_project;

    COMMENT ON INDEX public.idx_compliance_scans_owner_project_created IS 'Scans list: filter by owner + project, newest first. Supersedes idx_compliance_scans_user_project from 034, whose (id, project_name) is a prefix of this.';

    -- ============================================================================
    -- log_files — the report timeline and the log-file list
    -- ============================================================================
    --
    -- The timeline reads every log file of one scan newest-first; the log-file list
    -- pages the same order. The PK is (scan_id, log_file_id), which finds the scan's
    -- rows but then orders them by log_file_id, so the sort is done in memory over
    -- the whole scan's history.
    --
    -- NULLS LAST matches the query: `end_time` is nullable until the provider
    -- reports it, and the reads order `end_time DESC NULLS LAST`. An index with the
    -- other null ordering cannot serve that sort.
    --
    -- No INCLUDE columns. A covering index over messages_count / flagged_count
    -- would make the per-scan aggregates index-only, but those are exactly the
    -- columns the pod writes when a file closes, and including them would cost the
    -- HOT-update path on every close. The aggregates already reach their rows
    -- through the PK's scan_id prefix.
    --

    CREATE INDEX IF NOT EXISTS idx_log_files_scan_end_time
        ON public.log_files (scan_id, end_time DESC NULLS LAST);

    COMMENT ON INDEX public.idx_log_files_scan_end_time IS 'Report timeline and log-file list: one scan''s files, newest provider end_time first. The PK (scan_id, log_file_id) finds the rows but cannot serve this sort.';

    --
    -- Verify the schema changes
    --

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM pg_indexes
        WHERE schemaname = 'public' AND indexname = 'idx_compliance_scans_owner_project_created'
      ) THEN
        RAISE EXCEPTION 'FAILED: idx_compliance_scans_owner_project_created was not created';
      END IF;

      IF EXISTS (
        SELECT 1 FROM pg_indexes
        WHERE schemaname = 'public' AND indexname = 'idx_compliance_scans_user_project'
      ) THEN
        RAISE EXCEPTION 'FAILED: idx_compliance_scans_user_project was not dropped';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_indexes
        WHERE schemaname = 'public' AND indexname = 'idx_log_files_scan_end_time'
      ) THEN
        RAISE EXCEPTION 'FAILED: idx_log_files_scan_end_time was not created';
      END IF;

      RAISE NOTICE 'SUCCESS: compliance read-path indexes in place';
    END $$;

    COMMIT;

  053-add-project-credits-usage-updated-at.sql: |
    --
    -- Migration: 038_add_project_credits_usage_updated_at
    -- Description: Window marker for the per-project GR credit mirror (018), so a
    --              project's GR credit usage resets with the org's billing window
    --              instead of accumulating forever. Kong seeds the per-project
    --              usage hash from these columns when it expires; without the
    --              marker there is no way to tell this window's usage from last
    --              window's, which is the same job guardrails_usage_updated_at
    --              does for the org counters on subscription.
    --              NULL = no flush has landed yet, which reads as "not in the
    --              current window", so existing rows start the next window at 0.
    --              Requires: key 033 (projects credit columns).
    --              Identical for dev and prod (only the psql host/path below differ).
    --

    BEGIN;

    ALTER TABLE public.projects
        ADD COLUMN IF NOT EXISTS credits_usage_updated_at timestamptz;

    COMMENT ON COLUMN public.projects.credits_usage_updated_at IS 'When the per-project GR credit mirror was last flushed. Compared with the org billing window: a marker outside it means gr_credits_used belongs to a previous window and reads as 0. rt_credits_used is an ad-hoc lifetime balance and ignores it.';

    --
    -- Verify the schema changes
    --

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'projects'
          AND column_name = 'credits_usage_updated_at'
          AND data_type = 'timestamp with time zone'
      ) THEN
        RAISE EXCEPTION 'FAILED: projects.credits_usage_updated_at was not added';
      END IF;

      RAISE NOTICE 'SUCCESS: projects.credits_usage_updated_at in place';
    END $$;

    COMMIT;

    --
    -- Rollback (manual):
    --   ALTER TABLE public.projects DROP COLUMN IF EXISTS credits_usage_updated_at;
    -- The Next.js routes select this column, so roll the code back first.
    --

  054-add-anthropic-compliance-support.sql: |
    --
    -- Migration: 039_add_anthropic_compliance_support
    -- Description: Anthropic (Claude Enterprise) support for compliance scans.
    --              Mirrors compliance-scanner deploy/migrations/036_anthropic_support.sql
    --              (the pod's numbering), with the same object names, made
    --              re-runnable. Adds the six CLAUDE_* EVENT_TYPE values; makes
    --              compliance_scans.workspace_id nullable (an Anthropic scan
    --              covers everything its key can read) while a CHECK keeps it
    --              required for OpenAI; adds compliance_scans.cursors, the pod's
    --              per-endpoint-family cursor (chats, local); and creates
    --              anthropic_scan_windows, the log_files counterpart for Anthropic
    --              (one row per scan, product and cursor window).
    --              Two transactions: an enum value cannot be used in the
    --              transaction that adds it.
    --              Order: after the OpenSearch scan.window_id mapping and before
    --              the Anthropic pod image; safe with the older pod running.
    --              Requires: keys 049 (compliance_scans, EVENT_TYPE,
    --              PROVIDER) and 050 (LOG_FILE_STATUS).
    --              Identical for dev and prod (only the psql host/path below differ).
    --

    -- ============================================================================
    -- 1. Event types (own transaction)
    -- ============================================================================

    BEGIN;

    ALTER TYPE public."EVENT_TYPE" ADD VALUE IF NOT EXISTS 'CLAUDE_CHAT';
    ALTER TYPE public."EVENT_TYPE" ADD VALUE IF NOT EXISTS 'CLAUDE_CODE';
    ALTER TYPE public."EVENT_TYPE" ADD VALUE IF NOT EXISTS 'CLAUDE_COWORK';
    ALTER TYPE public."EVENT_TYPE" ADD VALUE IF NOT EXISTS 'CLAUDE_OFFICE';
    ALTER TYPE public."EVENT_TYPE" ADD VALUE IF NOT EXISTS 'CLAUDE_SCIENCE';
    ALTER TYPE public."EVENT_TYPE" ADD VALUE IF NOT EXISTS 'CLAUDE_IN_CHROME';

    COMMIT;

    -- ============================================================================
    -- 2. compliance_scans and anthropic_scan_windows
    -- ============================================================================

    BEGIN;

    COMMENT ON TYPE public."EVENT_TYPE" IS 'Compliance-scan event types. OpenAI: CONVERSATION_MESSAGE, CODEX_LOG, APP_LOG, CUSTOM_AGENTS_LOG, CHATGPT_PLUGIN_SPREADSHEET. Anthropic: CLAUDE_CHAT, CLAUDE_CODE, CLAUDE_COWORK, CLAUDE_OFFICE, CLAUDE_SCIENCE, CLAUDE_IN_CHROME.';

    ALTER TABLE public.compliance_scans
        ALTER COLUMN workspace_id DROP NOT NULL;

    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM pg_constraint
        WHERE conname = 'compliance_scans_workspace_required_for_openai'
          AND conrelid = 'public.compliance_scans'::regclass
      ) THEN
        ALTER TABLE public.compliance_scans
          ADD CONSTRAINT compliance_scans_workspace_required_for_openai
          CHECK (provider <> 'openai' OR workspace_id IS NOT NULL);
      END IF;
    END $$;

    COMMENT ON COLUMN public.compliance_scans.workspace_id IS 'OpenAI: the ChatGPT workspace this scan polls (required, by CHECK). Anthropic: NULL; the scan covers everything its key can read.';

    ALTER TABLE public.compliance_scans
        ADD COLUMN IF NOT EXISTS cursors jsonb NOT NULL DEFAULT '{}'::jsonb;

    COMMENT ON COLUMN public.compliance_scans.cursors IS 'Anthropic only: per endpoint family (chats, local) cursor written by the pod.';

    CREATE TABLE IF NOT EXISTS public.anthropic_scan_windows (
        scan_id             uuid NOT NULL REFERENCES public.compliance_scans(scan_id) ON DELETE CASCADE,
        window_id           text NOT NULL,
        surface             text NOT NULL,
        event_type          public."EVENT_TYPE" NOT NULL,
        window_start        timestamptz,
        window_end          timestamptz,
        read_from           timestamptz,
        conversations_count integer,
        published_count     integer,
        messages_count      integer,
        flagged_count       integer,
        first_event_at      timestamptz,
        last_event_at       timestamptz,
        started_at          timestamptz,
        ended_at            timestamptz,
        status              public."LOG_FILE_STATUS" NOT NULL,
        error               text,
        PRIMARY KEY (scan_id, window_id)
    );

    COMMENT ON TABLE public.anthropic_scan_windows IS 'Anthropic counterpart of log_files: one row per (scan, product, cursor window), written by the pod only for windows that published at least one new message.';
    COMMENT ON COLUMN public.anthropic_scan_windows.window_id IS '<EVENT_TYPE>:<window end>, e.g. CLAUDE_CODE:2026-10-07T18:50:59.147161Z. Matches scan.window_id on the OpenSearch records.';
    COMMENT ON COLUMN public.anthropic_scan_windows.surface IS 'Endpoint family: chats or local.';
    COMMENT ON COLUMN public.anthropic_scan_windows.window_start IS 'lo: the family cursor before this window.';
    COMMENT ON COLUMN public.anthropic_scan_windows.window_end IS 'hi: the family cursor after this window.';
    COMMENT ON COLUMN public.anthropic_scan_windows.read_from IS 'lo minus the replay tail, clamped to the scan''s start.';
    COMMENT ON COLUMN public.anthropic_scan_windows.published_count IS 'Messages the producer published as new.';
    COMMENT ON COLUMN public.anthropic_scan_windows.messages_count IS 'Records that landed in OpenSearch, counted at close.';
    COMMENT ON COLUMN public.anthropic_scan_windows.status IS 'open, then done; partial if records are missing or a conversation was unreadable; skipped if the window''s only content was unreadable.';

    CREATE INDEX IF NOT EXISTS anthropic_scan_windows_scan_type_end
        ON public.anthropic_scan_windows (scan_id, event_type, window_end);

    CREATE INDEX IF NOT EXISTS anthropic_scan_windows_open
        ON public.anthropic_scan_windows (status, started_at)
        WHERE status IN ('open', 'partial');

    -- anon / authenticated do not exist on a plain-Postgres or on-prem database.
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
            CREATE ROLE anon NOLOGIN NOINHERIT;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
            CREATE ROLE authenticated NOLOGIN NOINHERIT;
        END IF;
    END
    $$;

    ALTER TABLE public.anthropic_scan_windows ENABLE ROW LEVEL SECURITY;

    DROP POLICY IF EXISTS anthropic_scan_windows_deny_anon ON public.anthropic_scan_windows;
    CREATE POLICY anthropic_scan_windows_deny_anon
        ON public.anthropic_scan_windows
        AS RESTRICTIVE FOR ALL TO anon
        USING (false) WITH CHECK (false);

    DROP POLICY IF EXISTS anthropic_scan_windows_deny_authenticated ON public.anthropic_scan_windows;
    CREATE POLICY anthropic_scan_windows_deny_authenticated
        ON public.anthropic_scan_windows
        AS RESTRICTIVE FOR ALL TO authenticated
        USING (false) WITH CHECK (false);

    -- Explicit: Supabase Cloud stops default-granting new public tables on 2026-10-30; Next.js and the compliance pod use service_role.
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
            CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS;
        END IF;
    END
    $$;

    GRANT SELECT, INSERT, UPDATE, DELETE ON public.anthropic_scan_windows TO service_role;

    --
    -- Verify the schema changes
    --

    DO $$
    DECLARE
      missing text;
    BEGIN
      SELECT string_agg(v, ', ') INTO missing
      FROM unnest(ARRAY['CLAUDE_CHAT', 'CLAUDE_CODE', 'CLAUDE_COWORK',
                        'CLAUDE_OFFICE', 'CLAUDE_SCIENCE', 'CLAUDE_IN_CHROME']) AS v
      WHERE NOT EXISTS (
        SELECT 1 FROM pg_enum e
        JOIN pg_type t ON t.oid = e.enumtypid
        JOIN pg_namespace n ON n.oid = t.typnamespace
        WHERE n.nspname = 'public' AND t.typname = 'EVENT_TYPE' AND e.enumlabel = v
      );
      IF missing IS NOT NULL THEN
        RAISE EXCEPTION 'FAILED: EVENT_TYPE is missing %', missing;
      END IF;

      IF EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'compliance_scans'
          AND column_name = 'workspace_id' AND is_nullable = 'NO'
      ) THEN
        RAISE EXCEPTION 'FAILED: compliance_scans.workspace_id is still NOT NULL';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_constraint
        WHERE conname = 'compliance_scans_workspace_required_for_openai'
          AND conrelid = 'public.compliance_scans'::regclass
      ) THEN
        RAISE EXCEPTION 'FAILED: compliance_scans_workspace_required_for_openai was not created';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM information_schema.columns
        WHERE table_schema = 'public' AND table_name = 'compliance_scans'
          AND column_name = 'cursors' AND data_type = 'jsonb' AND is_nullable = 'NO'
      ) THEN
        RAISE EXCEPTION 'FAILED: compliance_scans.cursors was not added';
      END IF;

      IF NOT EXISTS (
        SELECT 1 FROM pg_class c
        JOIN pg_namespace n ON n.oid = c.relnamespace
        WHERE n.nspname = 'public' AND c.relname = 'anthropic_scan_windows'
          AND c.relrowsecurity
      ) THEN
        RAISE EXCEPTION 'FAILED: anthropic_scan_windows missing or RLS not enabled';
      END IF;

      IF (SELECT count(*) FROM pg_policies
          WHERE schemaname = 'public' AND tablename = 'anthropic_scan_windows'
            AND permissive = 'RESTRICTIVE') <> 2 THEN
        RAISE EXCEPTION 'FAILED: anthropic_scan_windows deny policies not in place';
      END IF;

      IF EXISTS (
        SELECT 1 FROM unnest(ARRAY['SELECT', 'INSERT', 'UPDATE', 'DELETE']) AS p
        WHERE NOT has_table_privilege('service_role', 'public.anthropic_scan_windows', p)
      ) THEN
        RAISE EXCEPTION 'FAILED: service_role lacks DML on anthropic_scan_windows';
      END IF;

      RAISE NOTICE 'SUCCESS: Anthropic compliance support in place';
    END $$;

    COMMIT;

    --
    -- Rollback (manual). Deletes every Anthropic scan row; stop those scans through
    -- the pod first. Enum values cannot be dropped, so the CLAUDE_* values stay.
    --   BEGIN;
    --   DROP TABLE IF EXISTS public.anthropic_scan_windows;
    --   ALTER TABLE public.compliance_scans DROP COLUMN IF EXISTS cursors;
    --   ALTER TABLE public.compliance_scans
    --     DROP CONSTRAINT IF EXISTS compliance_scans_workspace_required_for_openai;
    --   DELETE FROM public.compliance_scans WHERE provider = 'anthropic';
    --   ALTER TABLE public.compliance_scans ALTER COLUMN workspace_id SET NOT NULL;
    --   COMMIT;
    --

  055-compliance-totals-include-anthropic-windows.sql: |
    --
    -- Migration: 040_compliance_totals_include_anthropic_windows
    -- Description: compliance_scan_totals and compliance_project_totals (036) read
    --              only public.log_files, which Anthropic scans never write: their
    --              progress lands in public.anthropic_scan_windows (039). So every
    --              Anthropic scan reported 0 messages, 0 violations and a 0% flag
    --              rate while its findings were indexed. Both functions now sum
    --              the two tables. Same signatures, same semantics: messages_count
    --              and flagged_count are written at close in both, so an open row
    --              still counts as zero, and `files` counts log files plus windows.
    --              Requires: keys 051 (the functions) and 054
    --              (anthropic_scan_windows). SQL function bodies are validated at
    --              creation, so this cannot run before 039.
    --              Identical for dev and prod (only the psql host/path below differ).
    --

    BEGIN;

    CREATE OR REPLACE FUNCTION public.compliance_scan_totals(p_scan_ids uuid[])
    RETURNS TABLE (
        scan_id      uuid,
        interactions bigint,
        violations   bigint,
        files        bigint,
        started_at   timestamp with time zone
    )
    LANGUAGE sql
    STABLE
    SECURITY INVOKER
    SET search_path = public, pg_temp
    AS $$
        WITH u AS (
            SELECT lf.scan_id, lf.messages_count, lf.flagged_count, lf.started_at
            FROM public.log_files lf
            WHERE lf.scan_id = ANY(p_scan_ids)
            UNION ALL
            SELECT w.scan_id, w.messages_count, w.flagged_count, w.started_at
            FROM public.anthropic_scan_windows w
            WHERE w.scan_id = ANY(p_scan_ids)
        )
        SELECT u.scan_id,
               COALESCE(SUM(u.messages_count), 0)::bigint,
               COALESCE(SUM(u.flagged_count), 0)::bigint,
               COUNT(*)::bigint,
               -- Scanner clock, not the provider's: when this scan first did work.
               MIN(u.started_at)
        FROM u
        GROUP BY u.scan_id;
    $$;

    COMMENT ON FUNCTION public.compliance_scan_totals(uuid[]) IS 'Per-scan rollup of log_files (OpenAI) and anthropic_scan_windows (Anthropic) for the compliance scans table. Scans with neither are omitted, not returned as zero. Does no tenancy: pass scan ids already scoped by the caller.';

    CREATE OR REPLACE FUNCTION public.compliance_project_totals(
        p_owner_id     uuid,
        p_project_name text DEFAULT NULL
    )
    RETURNS TABLE (
        scans           bigint,
        active          bigint,
        needs_reconnect bigint,
        interactions    bigint,
        violations      bigint
    )
    LANGUAGE sql
    STABLE
    SECURITY INVOKER
    SET search_path = public, pg_temp
    AS $$
        WITH s AS (
            SELECT cs.scan_id, cs.status
            FROM public.compliance_scans cs
            WHERE cs.id = p_owner_id
              AND (p_project_name IS NULL OR cs.project_name = p_project_name)
        ),
        u AS (
            SELECT lf.messages_count, lf.flagged_count
            FROM public.log_files lf JOIN s ON s.scan_id = lf.scan_id
            UNION ALL
            SELECT w.messages_count, w.flagged_count
            FROM public.anthropic_scan_windows w JOIN s ON s.scan_id = w.scan_id
        )
        SELECT
            (SELECT COUNT(*) FROM s)::bigint,
            (SELECT COUNT(*) FROM s WHERE s.status = 'active')::bigint,
            (SELECT COUNT(*) FROM s WHERE s.status = 'needs_reconnect')::bigint,
            (SELECT COALESCE(SUM(u.messages_count), 0) FROM u)::bigint,
            (SELECT COALESCE(SUM(u.flagged_count), 0) FROM u)::bigint;
    $$;

    COMMENT ON FUNCTION public.compliance_project_totals(uuid, text) IS 'Scan counts and log_files + anthropic_scan_windows totals for one owner, optionally one project (NULL = all projects, which is individual account mode). Does no tenancy: pass an owner id already resolved by the caller.';

    -- CREATE OR REPLACE keeps 036's grants; re-asserted so this file stands alone.
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
            CREATE ROLE anon NOLOGIN NOINHERIT;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
            CREATE ROLE authenticated NOLOGIN NOINHERIT;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
            CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS;
        END IF;
    END
    $$;

    REVOKE EXECUTE ON FUNCTION public.compliance_scan_totals(uuid[])         FROM PUBLIC, anon, authenticated;
    REVOKE EXECUTE ON FUNCTION public.compliance_project_totals(uuid, text)  FROM PUBLIC, anon, authenticated;

    GRANT EXECUTE ON FUNCTION public.compliance_scan_totals(uuid[])          TO service_role;
    GRANT EXECUTE ON FUNCTION public.compliance_project_totals(uuid, text)   TO service_role;

    --
    -- Verify the schema changes
    --

    DO $$
    BEGIN
      IF position('anthropic_scan_windows' IN pg_get_functiondef('public.compliance_scan_totals(uuid[])'::regprocedure)) = 0 THEN
        RAISE EXCEPTION 'FAILED: compliance_scan_totals does not read anthropic_scan_windows';
      END IF;

      IF position('anthropic_scan_windows' IN pg_get_functiondef('public.compliance_project_totals(uuid, text)'::regprocedure)) = 0 THEN
        RAISE EXCEPTION 'FAILED: compliance_project_totals does not read anthropic_scan_windows';
      END IF;

      IF NOT has_function_privilege('service_role', 'public.compliance_scan_totals(uuid[])', 'EXECUTE')
         OR NOT has_function_privilege('service_role', 'public.compliance_project_totals(uuid, text)', 'EXECUTE') THEN
        RAISE EXCEPTION 'FAILED: service_role lost EXECUTE on the compliance totals';
      END IF;

      IF has_function_privilege('anon', 'public.compliance_scan_totals(uuid[])', 'EXECUTE')
         OR has_function_privilege('authenticated', 'public.compliance_project_totals(uuid, text)', 'EXECUTE') THEN
        RAISE EXCEPTION 'FAILED: anon/authenticated can execute the compliance totals';
      END IF;

      RAISE NOTICE 'SUCCESS: compliance totals include anthropic_scan_windows';
    END $$;

    COMMIT;

    --
    -- Rollback (manual): re-run 036_add_compliance_aggregate_functions.sql, which
    -- restores the log_files-only bodies.
    --

  056-add-audit-export.sql: |
    --
    -- Migration: 041_add_audit_export
    -- Description: Customer audit-log export to each client's SIEM (Splunk HEC) plus a
    --              Supabase Storage archive. Design, decisions and verified Supabase facts:
    --              docs/claude/audit-log-export.md and code/audit-exporter/STATE.md.
    --                * audit_outbox / audit_outbox_dead: changes captured by fail-open
    --                  triggers on auth.audit_log_entries (exported actions only),
    --                  audit_logs and redteam_v2 (status / is_deleted changes only).
    --                * audit_export_logs: normalized exported events; monthly partitions
    --                  plus a DEFAULT partition; a ~45-day send buffer, not the archive.
    --                * audit_export_routes: which client each event went to and the exact
    --                  line sent, so a retry resends identical bytes.
    --                * audit_export_batches: per-client HEC deliveries + archive bookkeeping.
    --                * audit_export_checkpoints: OpenSearch / failed-login / backfill cursors.
    --                * role audit_exporter: least-privilege LOGIN role, no password here. It
    --                  reads auth.* only through the audit_export_auth_* definer functions:
    --                  Supabase gives postgres no GRANT OPTION on auth tables.
    --              Test harness: scripts/manage/test-audit-export-041/run.sh (PG16, the
    --              supabase/postgres image, and a bare Postgres).
    --              Triggers FAIL OPEN: any error inside them becomes a WARNING, so an
    --              outbox problem never blocks a sign-in, a role change or a run update.
    --              Triggers are (re)installed by audit_export_install_triggers(), which
    --              the exporter calls every run: a table that appears after this
    --              migration (e.g. audit_logs on a fresh on-prem install) gets its
    --              trigger on the next run instead of never.
    --              audit_export_logs uses a sequence, not an identity column: identity
    --              columns on partitioned tables need Postgres 17, prod is 15.
    --              Every partition gets its own RLS lockdown and REVOKE, because a
    --              partition can be queried by name and Supabase default privileges
    --              grant anon/authenticated on every new table.
    --              lock_timeout is 5s so a long reader on a hot table fails this
    --              migration instead of queueing sign-ins behind it: on a lock
    --              timeout, just re-run it (it is re-runnable).
    --              Requires: key 037 (redteam_v2).
    --              Identical for dev and prod (only the psql host/path below differ).
    --

    BEGIN;

    SET LOCAL lock_timeout = '5s';

    -- anon / authenticated ship with Supabase but not with plain Postgres or the
    -- on-prem operator; the policies below need them (same guard as 022 / 033).
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
            CREATE ROLE anon NOLOGIN NOINHERIT;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
            CREATE ROLE authenticated NOLOGIN NOINHERIT;
        END IF;
        -- Password set out-of-band, never in git: ALTER ROLE audit_exporter WITH PASSWORD '<from the secret store>';
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'audit_exporter') THEN
            CREATE ROLE audit_exporter LOGIN NOINHERIT CONNECTION LIMIT 5;
        END IF;
    END
    $$;

    -- ============================================================================
    -- Outbox
    -- ============================================================================

    CREATE TABLE IF NOT EXISTS public.audit_outbox (
        id          bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        source      text NOT NULL,        -- auth.audit_log_entries | public.audit_logs | public.redteam_v2
        op          text NOT NULL,        -- INSERT | UPDATE
        payload     jsonb NOT NULL,       -- allowlisted fields only
        occurred_at timestamptz NOT NULL DEFAULT clock_timestamp(),
        attempts    integer NOT NULL DEFAULT 0
    );

    COMMENT ON TABLE public.audit_outbox IS 'Audit export: changes captured by triggers, waiting for the exporter. Rows are deleted once exported.';

    CREATE TABLE IF NOT EXISTS public.audit_outbox_dead (
        id          bigint PRIMARY KEY,   -- the original audit_outbox.id
        source      text NOT NULL,
        op          text NOT NULL,
        payload     jsonb NOT NULL,
        occurred_at timestamptz NOT NULL,
        attempts    integer NOT NULL,
        last_error  text,
        dead_at     timestamptz NOT NULL DEFAULT now()
    );

    COMMENT ON TABLE public.audit_outbox_dead IS 'Audit export: outbox rows the exporter failed on repeatedly. Alerted on; replayed by hand after a fix.';

    -- ============================================================================
    -- Reader checkpoints
    -- ============================================================================

    CREATE TABLE IF NOT EXISTS public.audit_export_checkpoints (
        reader        text NOT NULL,                       -- os:admin | os:red_teaming | failed_logins | backfill:<source>
        client_id     text NOT NULL DEFAULT '',            -- '' = shared live reader; a client id = that client's backfill
        cursor_ts     timestamptz,
        cursor        jsonb NOT NULL DEFAULT '{}'::jsonb,  -- reader-specific position (search_after, last id, ...)
        recent_ids    jsonb NOT NULL DEFAULT '{}'::jsonb,  -- ids already handled inside the overlap window
        state         text NOT NULL DEFAULT 'active' CHECK (state IN ('active', 'paused', 'done')),
        backfill_from timestamptz,                         -- backfill: the configured start it was begun with
        target_ts     timestamptz,                         -- backfill: stop here (where the live reader began)
        started_at    timestamptz NOT NULL DEFAULT now(),
        completed_at  timestamptz,
        updated_at    timestamptz NOT NULL DEFAULT now(),
        PRIMARY KEY (reader, client_id)
    );

    -- Earlier applies created the default as '[]'; the exporter reads an object.
    DO $$
    BEGIN
        IF (SELECT column_default FROM information_schema.columns
             WHERE table_schema = 'public' AND table_name = 'audit_export_checkpoints'
               AND column_name = 'recent_ids') IS DISTINCT FROM '''{}''::jsonb' THEN
            ALTER TABLE public.audit_export_checkpoints ALTER COLUMN recent_ids SET DEFAULT '{}'::jsonb;
        END IF;
    END
    $$;

    COMMENT ON TABLE public.audit_export_checkpoints IS 'Audit export: one cursor per reader (and per client for backfill).';

    -- ============================================================================
    -- Event store (send buffer), partitioned by month
    -- ============================================================================

    CREATE SEQUENCE IF NOT EXISTS public.audit_export_logs_id_seq;

    CREATE TABLE IF NOT EXISTS public.audit_export_logs (
        id              bigint NOT NULL DEFAULT nextval('public.audit_export_logs_id_seq'),
        event_id        text NOT NULL,             -- stable across re-reads; CEF externalId
        org_id          uuid,                      -- NULL for personal-account events
        owner_user_id   uuid,                      -- tenant when org_id is NULL, e.g. redteam_v2.id of a personal run
        project_name    text,
        signature_id    text NOT NULL,
        category        text NOT NULL,
        action          text NOT NULL,
        outcome         text NOT NULL CHECK (outcome IN ('success', 'failure')),
        reason          text,
        severity        smallint NOT NULL CHECK (severity BETWEEN 0 AND 10),
        occurred_at     timestamptz NOT NULL,
        started_at      timestamptz,
        ended_at        timestamptz,
        duration_ms     bigint,
        actor_user_id   uuid,
        actor_email     text,
        employee_id     text,
        idp_subject     text,
        session_id      text,
        client_ip       text,                      -- text, not inet: one malformed value must not fail a run
        user_agent      text,
        end_user_ip     text,                      -- caller-asserted (user_metadata), never replaces client_ip
        end_user_agent  text,
        access_method   text,
        auth_type       text,
        object_type     text,
        object_id       text,
        correlation_id  text,
        source          text NOT NULL,
        service         text NOT NULL,
        environment     text NOT NULL,
        attributes      jsonb NOT NULL DEFAULT '{}'::jsonb,
        created_at      timestamptz NOT NULL DEFAULT now(),
        PRIMARY KEY (id, occurred_at),
        CONSTRAINT audit_export_logs_routable
            CHECK (org_id IS NOT NULL OR owner_user_id IS NOT NULL OR actor_user_id IS NOT NULL OR actor_email IS NOT NULL)
    ) PARTITION BY RANGE (occurred_at);

    ALTER SEQUENCE public.audit_export_logs_id_seq OWNED BY public.audit_export_logs.id;

    COMMENT ON TABLE public.audit_export_logs IS 'Audit export: normalized exported events (send buffer, ~45 days). Monthly partitions via audit_export_maintain_partitions(); out-of-range rows land in audit_export_logs_default.';

    -- A unique index on a partitioned table must include the partition key.
    CREATE UNIQUE INDEX IF NOT EXISTS audit_export_logs_event_id_key
        ON public.audit_export_logs (event_id, occurred_at);
    CREATE INDEX IF NOT EXISTS idx_audit_export_logs_org_time
        ON public.audit_export_logs (org_id, occurred_at DESC);
    CREATE INDEX IF NOT EXISTS idx_audit_export_logs_owner_time
        ON public.audit_export_logs (owner_user_id, occurred_at DESC) WHERE owner_user_id IS NOT NULL;
    CREATE INDEX IF NOT EXISTS idx_audit_export_logs_actor_time
        ON public.audit_export_logs (actor_user_id, occurred_at DESC);

    -- Catches any timestamp without a monthly partition, so one bad row never fails a run.
    CREATE TABLE IF NOT EXISTS public.audit_export_logs_default
        PARTITION OF public.audit_export_logs DEFAULT;

    -- ============================================================================
    -- Batches and per-client routes
    -- ============================================================================

    CREATE TABLE IF NOT EXISTS public.audit_export_batches (
        id                   bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        client_id            text NOT NULL,             -- clients[].id in the exporter YAML
        sequence             bigint NOT NULL,           -- per client, gapless; assigned under the exporter's advisory lock
        format               text NOT NULL CHECK (format IN ('cef', 'json')),
        parent_batch_id      bigint REFERENCES public.audit_export_batches (id),  -- set on the 1-event quarantine children of a refused batch
        event_count          integer NOT NULL CHECK (event_count > 0),
        first_log_id         bigint NOT NULL,           -- informational; membership is audit_export_routes.batch_id
        last_log_id          bigint NOT NULL,
        window_start         timestamptz NOT NULL,      -- min / max occurred_at of the member events
        window_end           timestamptz NOT NULL,
        body_sha256          text NOT NULL,             -- of the uncompressed HEC body; a retry must reproduce it
        body_bytes           integer NOT NULL,
        status               text NOT NULL DEFAULT 'pending' CHECK (status IN ('pending', 'delivered', 'failed', 'split')),  -- 'split' is never set
        attempts             integer NOT NULL DEFAULT 0,
        next_attempt_at      timestamptz NOT NULL DEFAULT now(),
        last_attempt_at      timestamptz,
        last_status          integer,                   -- last HTTP status from the endpoint
        last_response        text,
        delivered_at         timestamptz,
        archived_at          timestamptz,               -- every archive object for this batch written
        archive_object_keys  text[] NOT NULL DEFAULT '{}',  -- one per org / 5-minute bucket the batch spans
        created_at           timestamptz NOT NULL DEFAULT now(),
        UNIQUE (client_id, sequence),
        CHECK (first_log_id <= last_log_id),
        CHECK (window_start <= window_end)
    );

    CREATE INDEX IF NOT EXISTS idx_audit_export_batches_pending
        ON public.audit_export_batches (client_id, sequence) WHERE status = 'pending';
    CREATE INDEX IF NOT EXISTS idx_audit_export_batches_unarchived
        ON public.audit_export_batches (client_id, sequence) WHERE archived_at IS NULL;

    COMMENT ON TABLE public.audit_export_batches IS 'Audit export: one HEC request per row, per client. Members are the audit_export_routes rows with this batch_id.';

    CREATE TABLE IF NOT EXISTS public.audit_export_routes (
        client_id    text NOT NULL,
        log_id       bigint NOT NULL,                   -- audit_export_logs.id; no FK, retention drops partitions
        occurred_at  timestamptz NOT NULL,              -- the event's partition key, for joins and retention
        event_id     text NOT NULL,
        format       text NOT NULL CHECK (format IN ('cef', 'json')),
        line         text NOT NULL,                     -- the exact formatted line sent as the HEC event
        batch_id     bigint REFERENCES public.audit_export_batches (id),  -- NULL until batched
        created_at   timestamptz NOT NULL DEFAULT now(),
        PRIMARY KEY (client_id, log_id)
    );

    CREATE INDEX IF NOT EXISTS idx_audit_export_routes_batch
        ON public.audit_export_routes (batch_id);
    CREATE INDEX IF NOT EXISTS idx_audit_export_routes_unbatched
        ON public.audit_export_routes (client_id, log_id) WHERE batch_id IS NULL;
    CREATE INDEX IF NOT EXISTS idx_audit_export_routes_time
        ON public.audit_export_routes (occurred_at);

    COMMENT ON TABLE public.audit_export_routes IS 'Audit export: the clients each event was routed to, with the exact line, so routing and bytes are frozen once decided.';

    -- ============================================================================
    -- Partitions and retention
    -- ============================================================================

    CREATE OR REPLACE FUNCTION public.audit_export_ensure_partition(p_month date)
    RETURNS text
    LANGUAGE plpgsql
    SECURITY DEFINER  -- attaching a partition needs ownership of the parent; the exporter is not the owner
    SET search_path = ''
    AS $$
    DECLARE
        v_start  date := date_trunc('month', p_month)::date;
        -- Bounds in UTC explicitly, so they don't depend on the session TimeZone.
        v_from   timestamptz := v_start::timestamp AT TIME ZONE 'UTC';
        v_to     timestamptz := (v_start + interval '1 month')::timestamp AT TIME ZONE 'UTC';
        v_name   text := 'audit_export_logs_' || to_char(v_start, 'YYYYMM');
        v_oid    oid;
        v_role   text;
    BEGIN
        IF to_regclass('public.' || v_name) IS NULL THEN
            -- Rows parked in DEFAULT for this month must move first, or ATTACH rejects the bound.
            EXECUTE format('CREATE TABLE public.%I (LIKE public.audit_export_logs INCLUDING DEFAULTS INCLUDING CONSTRAINTS)', v_name);
            EXECUTE format(
                'WITH moved AS (DELETE FROM public.audit_export_logs_default WHERE occurred_at >= %L AND occurred_at < %L RETURNING *) '
                'INSERT INTO public.%I SELECT * FROM moved', v_from, v_to, v_name);
            EXECUTE format('ALTER TABLE public.audit_export_logs ATTACH PARTITION public.%I FOR VALUES FROM (%L) TO (%L)',
                           v_name, v_from, v_to);
        END IF;
        -- Lock down only what is missing: ENABLE RLS / CREATE POLICY take ACCESS EXCLUSIVE, and this runs every 5 minutes.
        v_oid := to_regclass('public.' || v_name);
        IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid = v_oid) THEN
            EXECUTE format('ALTER TABLE public.%I ENABLE ROW LEVEL SECURITY', v_name);
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_policy WHERE polrelid = v_oid AND polname = 'deny_all_' || v_name) THEN
            EXECUTE format(
                'CREATE POLICY %I ON public.%I AS RESTRICTIVE FOR ALL TO anon, authenticated USING (false) WITH CHECK (false)',
                'deny_all_' || v_name, v_name);
        END IF;
        -- Supabase default privileges grant every new table to these roles directly; the exporter reads via the parent.
        IF EXISTS (SELECT 1 FROM pg_class c, aclexplode(c.relacl) a WHERE c.oid = v_oid AND a.grantee = 0) THEN
            EXECUTE format('REVOKE ALL ON TABLE public.%I FROM PUBLIC', v_name);
        END IF;
        FOREACH v_role IN ARRAY ARRAY['anon', 'authenticated', 'service_role'] LOOP
            IF EXISTS (SELECT 1 FROM pg_class c, aclexplode(c.relacl) a, pg_roles r
                        WHERE c.oid = v_oid AND r.rolname = v_role AND a.grantee = r.oid) THEN
                EXECUTE format('REVOKE ALL ON TABLE public.%I FROM %I', v_name, v_role);
            END IF;
        END LOOP;
        RETURN v_name;
    END;
    $$;

    COMMENT ON FUNCTION public.audit_export_ensure_partition(date) IS 'Creates (if missing), fills from DEFAULT and locks down the audit_export_logs partition for the month containing p_month. Call it before a backfill into an old month.';

    CREATE OR REPLACE FUNCTION public.audit_export_maintain_partitions(p_months_ahead integer DEFAULT 2, p_keep_days integer DEFAULT 45)
    RETURNS text[]
    LANGUAGE plpgsql
    SECURITY DEFINER
    SET search_path = ''
    AS $$
    DECLARE
        v_this  date := date_trunc('month', now() AT TIME ZONE 'UTC')::date;
        v_month date;
        v_out   text[] := '{}';
    BEGIN
        FOR v_month IN
            SELECT (v_this + make_interval(months => m))::date FROM generate_series(0, greatest(p_months_ahead, 0)) AS m
        LOOP
            v_out := v_out || public.audit_export_ensure_partition(v_month);
        END LOOP;
        -- Late rows parked in DEFAULT inside the buffer window get their real partition; far-off garbage stays parked.
        FOR v_month IN
            SELECT DISTINCT date_trunc('month', occurred_at AT TIME ZONE 'UTC')::date
              FROM public.audit_export_logs_default
             WHERE occurred_at >= now() - make_interval(days => p_keep_days)
               AND occurred_at < v_this::timestamp AT TIME ZONE 'UTC'
        LOOP
            v_out := v_out || public.audit_export_ensure_partition(v_month);
        END LOOP;
        RETURN v_out;
    END;
    $$;

    COMMENT ON FUNCTION public.audit_export_maintain_partitions(integer, integer) IS 'Partition upkeep, called by the exporter each run: this month plus p_months_ahead, and rehoming late DEFAULT rows.';

    CREATE OR REPLACE FUNCTION public.audit_export_apply_retention(p_keep_days integer DEFAULT 45, p_force boolean DEFAULT false)
    RETURNS text[]
    LANGUAGE plpgsql
    SECURITY DEFINER  -- dropping a partition needs ownership; the exporter is not the owner
    SET search_path = ''
    AS $$
    DECLARE
        v_cutoff  timestamptz;
        v_from    timestamptz;
        v_to      timestamptz;
        v_count   bigint;
        v_total   bigint := 0;
        v_out     text[] := '{}';
        r         record;
    BEGIN
        IF p_keep_days IS NULL OR p_keep_days < 1 THEN
            RAISE EXCEPTION 'audit_export_apply_retention: p_keep_days must be >= 1, got %', p_keep_days;
        END IF;
        v_cutoff := now() - make_interval(days => p_keep_days);

        FOR r IN
            SELECT c.relname
              FROM pg_inherits i
              JOIN pg_class c ON c.oid = i.inhrelid
             WHERE i.inhparent = 'public.audit_export_logs'::regclass
               AND c.relname ~ '^audit_export_logs_[0-9]{6}$'
             ORDER BY c.relname
        LOOP
            v_from := to_date(right(r.relname, 6), 'YYYYMM')::timestamp AT TIME ZONE 'UTC';
            v_to   := (to_date(right(r.relname, 6), 'YYYYMM') + interval '1 month')::timestamp AT TIME ZONE 'UTC';
            CONTINUE WHEN v_to > v_cutoff;
            -- Never drop an event a client has not received and archived, unless forced.
            IF NOT p_force AND EXISTS (
                SELECT 1
                  FROM public.audit_export_routes ro
                  LEFT JOIN public.audit_export_batches b ON b.id = ro.batch_id
                 WHERE ro.occurred_at >= v_from AND ro.occurred_at < v_to
                   AND (b.id IS NULL OR b.status = 'pending' OR b.archived_at IS NULL)) THEN
                RAISE WARNING 'audit_export_apply_retention: kept % (undelivered or unarchived events)', r.relname;
                v_out := v_out || ('kept:' || r.relname);
                CONTINUE;
            END IF;
            DELETE FROM public.audit_export_routes WHERE occurred_at >= v_from AND occurred_at < v_to;
            EXECUTE format('DROP TABLE public.%I', r.relname);
            v_out := v_out || ('dropped:' || r.relname);
        END LOOP;

        DELETE FROM public.audit_export_logs_default l
         WHERE l.occurred_at < v_cutoff
           AND (p_force OR NOT EXISTS (
                SELECT 1
                  FROM public.audit_export_routes ro
                  LEFT JOIN public.audit_export_batches b ON b.id = ro.batch_id
                 WHERE ro.log_id = l.id
                   AND (b.id IS NULL OR b.status = 'pending' OR b.archived_at IS NULL)));
        GET DIAGNOSTICS v_count = ROW_COUNT;
        v_out := v_out || ('default_deleted:' || v_count);

        DELETE FROM public.audit_export_routes ro
         WHERE ro.occurred_at < v_cutoff
           AND NOT EXISTS (SELECT 1 FROM public.audit_export_logs l WHERE l.id = ro.log_id AND l.occurred_at = ro.occurred_at);

        -- Finished batches whose events are gone: never pending/unarchived, never a client's highest sequence
        -- (max+1 would restart and reuse archive object names). Parents go once their quarantine children are gone.
        LOOP
            DELETE FROM public.audit_export_batches b
             WHERE b.created_at < v_cutoff
               AND ((b.status IN ('delivered', 'failed') AND b.archived_at IS NOT NULL) OR b.status = 'split')
               AND b.sequence < (SELECT max(b2.sequence) FROM public.audit_export_batches b2 WHERE b2.client_id = b.client_id)
               AND NOT EXISTS (SELECT 1 FROM public.audit_export_routes ro WHERE ro.batch_id = b.id)
               AND NOT EXISTS (SELECT 1 FROM public.audit_export_batches ch WHERE ch.parent_batch_id = b.id);
            GET DIAGNOSTICS v_count = ROW_COUNT;
            EXIT WHEN v_count = 0;
            v_total := v_total + v_count;
        END LOOP;
        v_out := v_out || ('batches_deleted:' || v_total);
        RETURN v_out;
    END;
    $$;

    COMMENT ON FUNCTION public.audit_export_apply_retention(integer, boolean) IS 'Send-buffer retention: drops audit_export_logs partitions (and DEFAULT rows) older than p_keep_days, keeping any with undelivered or unarchived events unless p_force; then prunes finished batches whose events are gone.';

    -- ============================================================================
    -- Capture trigger
    -- ============================================================================

    CREATE OR REPLACE FUNCTION public.audit_outbox_enqueue()
    RETURNS trigger
    LANGUAGE plpgsql
    SECURITY DEFINER
    SET search_path = ''
    AS $$
    DECLARE
        v_payload  jsonb;
        v_session  jsonb;
        v_sid      text;
        v_actor    text;
        v_claims   jsonb;
        v_deleter  text;
        v_row      jsonb := to_jsonb(NEW);   -- column-agnostic reads: on-prem tables lack some Cloud columns
    BEGIN
        BEGIN
            IF TG_TABLE_NAME = 'redteam_v2' THEN
                IF TG_OP = 'UPDATE'
                   AND OLD.status IS NOT DISTINCT FROM NEW.status
                   AND OLD.is_deleted IS NOT DISTINCT FROM NEW.is_deleted THEN
                    RETURN NULL;
                END IF;
                -- Deleter from PostgREST's per-request GUCs: trusted header only on service_role, else the user JWT's sub.
                IF TG_OP = 'UPDATE' AND NEW.is_deleted IS TRUE AND OLD.is_deleted IS NOT TRUE THEN
                    BEGIN
                        v_claims := nullif(current_setting('request.jwt.claims', true), '')::jsonb;
                        v_deleter := lower(CASE v_claims ->> 'role'
                            WHEN 'service_role' THEN
                                nullif(current_setting('request.headers', true), '')::jsonb ->> 'x-enkrypt-audit-actor-id'
                            WHEN 'authenticated' THEN v_claims ->> 'sub' END);
                        IF v_deleter !~ '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' THEN
                            v_deleter := NULL;
                        END IF;
                    EXCEPTION WHEN OTHERS THEN
                        v_deleter := NULL;  -- malformed GUC: still record the delete, just without a deleter
                    END;
                END IF;
                v_payload := jsonb_build_object(
                    'job_id',          v_row -> 'job_id',
                    'owner_id',        v_row -> 'id',          -- run owner; the tenant when org_id is NULL
                    'org_id',          v_row -> 'org_id',
                    'project_name',    v_row -> 'project_name',
                    'run_name',        v_row -> 'run_name',
                    'created_by',      v_row -> 'created_by',
                    'actioner_email',  v_row -> 'actioner_email',
                    'old_status',      CASE WHEN TG_OP = 'UPDATE' THEN to_jsonb(OLD) -> 'status' END,
                    'new_status',      v_row -> 'status',
                    'old_is_deleted',  CASE WHEN TG_OP = 'UPDATE' THEN to_jsonb(OLD) -> 'is_deleted' END,
                    'is_deleted',      v_row -> 'is_deleted',
                    'deleted_by',      v_deleter,
                    'created_at',      v_row -> 'created_at',
                    'started_at',      v_row -> 'started_at',
                    'ended_at',        v_row -> 'ended_at',
                    'user_metadata',   jsonb_strip_nulls(jsonb_build_object(
                        'user_id',           v_row #> '{user_metadata,user_id}',
                        'organization_id',   v_row #> '{user_metadata,organization_id}',
                        'project_id',        v_row #> '{user_metadata,project_id}',
                        'email',             v_row #> '{user_metadata,email}',
                        'client_ip',         v_row #> '{user_metadata,client_ip}',
                        'client_user_agent', v_row #> '{user_metadata,client_user_agent}',
                        'end_user_ip',       v_row #> '{user_metadata,end_user_ip}',
                        'end_user_agent',    v_row #> '{user_metadata,end_user_agent}')));

            ELSIF TG_TABLE_NAME = 'audit_logs' THEN
                -- log carries the change detail (e.g. the role tuple); the exporter, not this trigger, allowlists it.
                v_payload := jsonb_build_object(
                    'audit_log_id',    v_row -> 'audit_log_id',
                    'actioner',        v_row -> 'actioner',
                    'org_or_user_id',  v_row -> 'org_or_user_id',
                    'type',            v_row -> 'type',
                    'action',          v_row -> 'action',
                    'log',             v_row -> 'log',
                    'created_at',      v_row -> 'created_at');

            ELSE  -- auth.audit_log_entries; the WHEN clause already filtered the action
                v_payload := jsonb_build_object(
                    'id',              v_row -> 'id',
                    'created_at',      v_row -> 'created_at',
                    'ip_address',      v_row ->> 'ip_address',   -- empty on Supabase Cloud; sessions has it
                    'action',          v_row #>> '{payload,action}',
                    'actor_id',        v_row #>> '{payload,actor_id}',
                    'actor_username',  v_row #>> '{payload,actor_username}',
                    'actor_via_sso',   v_row #> '{payload,actor_via_sso}',
                    'log_type',        v_row #>> '{payload,log_type}',
                    'traits',          v_row #> '{payload,traits}');
                -- Logout deletes the session in the same transaction; snapshot it now or it is gone.
                IF v_row #>> '{payload,action}' = 'logout' THEN
                    BEGIN
                        v_sid := coalesce(v_row #>> '{payload,traits,session_id}', v_row #>> '{payload,session_id}');
                        v_actor := v_row #>> '{payload,actor_id}';
                        -- Native uuid compares so the sessions indexes are used: this runs inside GoTrue's logout.
                        IF v_sid ~* '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' THEN
                            SELECT jsonb_build_object('id', s ->> 'id', 'ip', s ->> 'ip', 'user_agent', s ->> 'user_agent',
                                                      'aal', s ->> 'aal', 'created_at', s ->> 'created_at',
                                                      'match', 'payload_session_id', 'candidates', 1)
                              INTO v_session
                              FROM (SELECT to_jsonb(ss) AS s FROM auth.sessions ss WHERE ss.id = v_sid::uuid) one;
                        END IF;
                        IF v_session IS NULL AND v_actor ~* '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' THEN
                            -- No session id in the payload: most recently active session; candidates > 1 means ambiguous.
                            SELECT jsonb_build_object('id', s ->> 'id', 'ip', s ->> 'ip', 'user_agent', s ->> 'user_agent',
                                                      'aal', s ->> 'aal', 'created_at', s ->> 'created_at',
                                                      'match', 'most_recent_session', 'candidates', n)
                              INTO v_session
                              FROM (SELECT to_jsonb(ss) AS s, count(*) OVER () AS n
                                      FROM auth.sessions ss
                                     WHERE ss.user_id = v_actor::uuid
                                     ORDER BY coalesce(to_jsonb(ss) ->> 'updated_at', to_jsonb(ss) ->> 'created_at')::timestamptz DESC
                                     LIMIT 1) latest;
                        END IF;
                        v_payload := v_payload || jsonb_build_object(
                            'session', coalesce(v_session, jsonb_build_object('match', 'none', 'candidates', 0)));
                    EXCEPTION WHEN OTHERS THEN
                        v_payload := v_payload || jsonb_build_object('session', jsonb_build_object('match', 'error', 'error', SQLERRM));
                    END;
                END IF;
            END IF;

            INSERT INTO public.audit_outbox (source, op, payload)
            VALUES (TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME, TG_OP, v_payload);
        EXCEPTION WHEN OTHERS THEN
            RAISE WARNING 'audit_outbox_enqueue failed on %.% (%): %',
                TG_TABLE_SCHEMA, TG_TABLE_NAME, TG_OP, SQLERRM;
        END;
        RETURN NULL;
    END;
    $$;

    COMMENT ON FUNCTION public.audit_outbox_enqueue() IS 'Audit export capture trigger. Fail-open: errors become WARNINGs and never block the triggering write.';

    CREATE OR REPLACE FUNCTION public.audit_export_install_triggers(p_replace boolean DEFAULT false)
    RETURNS text[]
    LANGUAGE plpgsql
    SECURITY DEFINER  -- CREATE TRIGGER needs the owner's TRIGGER privilege; the exporter calls this every run
    SET search_path = ''
    SET lock_timeout = '5s'  -- DROP TRIGGER queued behind a long reader would stall sign-ins
    AS $$
    DECLARE
        v_out text[] := '{}';
    BEGIN
        IF to_regclass('public.redteam_v2') IS NULL THEN
            v_out := v_out || 'public.redteam_v2:absent'::text;
        ELSIF p_replace OR NOT EXISTS (SELECT 1 FROM pg_trigger
                                        WHERE tgrelid = to_regclass('public.redteam_v2') AND tgname = 'audit_outbox_redteam_v2'
                                          AND tgenabled <> 'D') THEN
            DROP TRIGGER IF EXISTS audit_outbox_redteam_v2 ON public.redteam_v2;
            CREATE TRIGGER audit_outbox_redteam_v2
                AFTER INSERT OR UPDATE OF status, is_deleted ON public.redteam_v2
                FOR EACH ROW EXECUTE FUNCTION public.audit_outbox_enqueue();
            v_out := v_out || 'public.redteam_v2:installed'::text;
        ELSE
            v_out := v_out || 'public.redteam_v2:present'::text;
        END IF;

        IF to_regclass('public.audit_logs') IS NULL THEN
            v_out := v_out || 'public.audit_logs:absent'::text;
        ELSIF p_replace OR NOT EXISTS (SELECT 1 FROM pg_trigger
                                        WHERE tgrelid = to_regclass('public.audit_logs') AND tgname = 'audit_outbox_audit_logs'
                                          AND tgenabled <> 'D') THEN
            DROP TRIGGER IF EXISTS audit_outbox_audit_logs ON public.audit_logs;
            CREATE TRIGGER audit_outbox_audit_logs
                AFTER INSERT ON public.audit_logs
                FOR EACH ROW EXECUTE FUNCTION public.audit_outbox_enqueue();
            v_out := v_out || 'public.audit_logs:installed'::text;
        ELSE
            v_out := v_out || 'public.audit_logs:present'::text;
        END IF;

        IF to_regclass('auth.audit_log_entries') IS NULL THEN
            v_out := v_out || 'auth.audit_log_entries:absent'::text;
        ELSIF p_replace OR NOT EXISTS (SELECT 1 FROM pg_trigger
                                        WHERE tgrelid = to_regclass('auth.audit_log_entries') AND tgname = 'audit_outbox_auth_audit_log_entries'
                                          AND tgenabled <> 'D') THEN
            DROP TRIGGER IF EXISTS audit_outbox_auth_audit_log_entries ON auth.audit_log_entries;
            -- Not exported: token_refreshed / token_revoked (high volume) and user_confirmation_requested (an email send).
            CREATE TRIGGER audit_outbox_auth_audit_log_entries
                AFTER INSERT ON auth.audit_log_entries
                FOR EACH ROW
                WHEN ((NEW.payload ->> 'action') IN ('login', 'logout', 'user_signedup', 'user_invited',
                                                     'user_deleted', 'user_modified', 'user_updated_password',
                                                     'user_recovery_requested'))
                EXECUTE FUNCTION public.audit_outbox_enqueue();
            v_out := v_out || 'auth.audit_log_entries:installed'::text;
        ELSE
            v_out := v_out || 'auth.audit_log_entries:present'::text;
        END IF;
        RETURN v_out;
    END;
    $$;

    COMMENT ON FUNCTION public.audit_export_install_triggers(boolean) IS 'Installs any missing or disabled capture trigger and reports each as installed / present / absent. p_replace recreates them (migration only: it locks the tables briefly).';

    -- ============================================================================
    -- auth.* lookups for the exporter
    -- ============================================================================
    -- Supabase gives postgres no GRANT OPTION on auth.* (a GRANT there is a silent WARNING no-op),
    -- so the exporter reads allowlisted auth columns through these definer functions instead.

    CREATE OR REPLACE FUNCTION public.audit_export_auth_users(p_user_ids uuid[])
    RETURNS SETOF jsonb
    LANGUAGE plpgsql
    STABLE
    SECURITY DEFINER
    SET search_path = ''
    AS $$
    BEGIN
        IF to_regclass('auth.users') IS NULL THEN
            RETURN;
        END IF;
        RETURN QUERY
            SELECT jsonb_build_object('id', u.id, 'email', u.email)
              FROM auth.users u
             WHERE u.id = ANY (p_user_ids);
    END;
    $$;

    CREATE OR REPLACE FUNCTION public.audit_export_auth_sessions(p_user_ids uuid[])
    RETURNS SETOF jsonb
    LANGUAGE plpgsql
    STABLE
    SECURITY DEFINER
    SET search_path = ''
    AS $$
    BEGIN
        IF to_regclass('auth.sessions') IS NULL THEN
            RETURN;
        END IF;
        RETURN QUERY
            SELECT jsonb_build_object('id', s -> 'id', 'user_id', s -> 'user_id', 'created_at', s -> 'created_at',
                                      'updated_at', s -> 'updated_at', 'ip', s -> 'ip', 'user_agent', s -> 'user_agent',
                                      'aal', s -> 'aal')
              FROM (SELECT to_jsonb(ss) AS s FROM auth.sessions ss WHERE ss.user_id = ANY (p_user_ids)) x;
    END;
    $$;

    CREATE OR REPLACE FUNCTION public.audit_export_auth_identities(p_user_ids uuid[])
    RETURNS SETOF jsonb
    LANGUAGE plpgsql
    STABLE
    SECURITY DEFINER
    SET search_path = ''
    AS $$
    BEGIN
        IF to_regclass('auth.identities') IS NULL THEN
            RETURN;
        END IF;
        RETURN QUERY
            -- identity_data narrowed to the subject and the employee-id keys pgstore reads (_EMPLOYEE_KEYS).
            SELECT jsonb_build_object('id', i -> 'id', 'user_id', i -> 'user_id', 'provider', i -> 'provider',
                                      'provider_id', i -> 'provider_id',
                                      'identity_data', jsonb_strip_nulls(jsonb_build_object(
                                          'sub',             d -> 'sub',
                                          'employee_id',     d -> 'employee_id',
                                          'employeeId',      d -> 'employeeId',
                                          'employeeID',      d -> 'employeeID',
                                          'employee_number', d -> 'employee_number',
                                          'employeeNumber',  d -> 'employeeNumber',
                                          'custom_claims',   nullif(jsonb_strip_nulls(jsonb_build_object(
                                              'employee_id',     d #> '{custom_claims,employee_id}',
                                              'employeeId',      d #> '{custom_claims,employeeId}',
                                              'employeeID',      d #> '{custom_claims,employeeID}',
                                              'employee_number', d #> '{custom_claims,employee_number}',
                                              'employeeNumber',  d #> '{custom_claims,employeeNumber}')), '{}'::jsonb))),
                                      'created_at', i -> 'created_at', 'last_sign_in_at', i -> 'last_sign_in_at')
              FROM (SELECT to_jsonb(ii) AS i,
                           CASE WHEN jsonb_typeof(to_jsonb(ii) -> 'identity_data') = 'object'
                                THEN to_jsonb(ii) -> 'identity_data' END AS d
                      FROM auth.identities ii WHERE ii.user_id = ANY (p_user_ids)) x;
    END;
    $$;

    -- Backfill page: exported actions only, keyset on (created_at, id). Full scan per page: we cannot index this table.
    CREATE OR REPLACE FUNCTION public.audit_export_auth_audit_log(p_after timestamptz, p_after_id uuid, p_until timestamptz,
                                                                 p_limit integer DEFAULT 1000)
    RETURNS SETOF jsonb
    LANGUAGE plpgsql
    STABLE
    SECURITY DEFINER
    SET search_path = ''
    AS $$
    BEGIN
        IF to_regclass('auth.audit_log_entries') IS NULL THEN
            RETURN;
        END IF;
        RETURN QUERY
            SELECT jsonb_build_object('id', e.id, 'created_at', e.created_at, 'ip_address', to_jsonb(e) ->> 'ip_address',
                                      'payload', e.payload)
              FROM auth.audit_log_entries e
             WHERE (e.created_at, e.id) > (coalesce(p_after, '-infinity'::timestamptz),
                                           coalesce(p_after_id, '00000000-0000-0000-0000-000000000000'::uuid))
               AND e.created_at < p_until
               AND (e.payload ->> 'action') IN ('login', 'logout', 'user_signedup', 'user_invited',
                                                'user_deleted', 'user_modified', 'user_updated_password',
                                                'user_recovery_requested')
             ORDER BY e.created_at, e.id
             LIMIT least(greatest(coalesce(p_limit, 1000), 1), 10000);
    END;
    $$;

    SELECT public.audit_export_install_triggers(true);

    -- Last month (late events), this month and the next two.
    SELECT public.audit_export_ensure_partition((date_trunc('month', now() AT TIME ZONE 'UTC') - interval '1 month')::date);
    SELECT public.audit_export_maintain_partitions(2, 45);

    -- ============================================================================
    -- Lockdown: RLS deny-all (011 model), REVOKE from anon / authenticated by name
    -- ============================================================================

    DO $$
    DECLARE
        t      text;
        v_seq  text;
    BEGIN
        FOREACH t IN ARRAY ARRAY['audit_outbox', 'audit_outbox_dead', 'audit_export_checkpoints', 'audit_export_logs',
                                 'audit_export_logs_default', 'audit_export_batches', 'audit_export_routes']
        LOOP
            EXECUTE format('ALTER TABLE public.%I ENABLE ROW LEVEL SECURITY', t);
            EXECUTE format('DROP POLICY IF EXISTS %I ON public.%I', 'deny_all_' || t, t);
            EXECUTE format(
                'CREATE POLICY %I ON public.%I AS RESTRICTIVE FOR ALL TO anon, authenticated USING (false) WITH CHECK (false)',
                'deny_all_' || t, t);
            -- The exporter is not the owner, so RLS applies to it: it needs its own permissive policy.
            EXECUTE format('DROP POLICY IF EXISTS %I ON public.%I', 'audit_exporter_all_' || t, t);
            EXECUTE format('CREATE POLICY %I ON public.%I FOR ALL TO audit_exporter USING (true) WITH CHECK (true)',
                           'audit_exporter_all_' || t, t);
            EXECUTE format('REVOKE ALL ON TABLE public.%I FROM PUBLIC, anon, authenticated', t);
            -- service_role has BYPASSRLS, so only a REVOKE keeps it out (absent on plain Postgres).
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
                EXECUTE format('REVOKE ALL ON TABLE public.%I FROM service_role', t);
            END IF;
        END LOOP;

        -- Monthly partitions that already exist (e.g. from an earlier apply) get the same lockdown.
        FOR t IN
            SELECT c.relname FROM pg_inherits i JOIN pg_class c ON c.oid = i.inhrelid
             WHERE i.inhparent = 'public.audit_export_logs'::regclass AND c.relname ~ '^audit_export_logs_[0-9]{6}$'
        LOOP
            PERFORM public.audit_export_ensure_partition(to_date(right(t, 6), 'YYYYMM'));
        END LOOP;

        FOREACH v_seq IN ARRAY ARRAY['public.audit_export_logs_id_seq',
                                     pg_get_serial_sequence('public.audit_outbox', 'id'),
                                     pg_get_serial_sequence('public.audit_export_batches', 'id')]
        LOOP
            EXECUTE format('REVOKE ALL ON SEQUENCE %s FROM PUBLIC, anon, authenticated', v_seq);
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
                EXECUTE format('REVOKE ALL ON SEQUENCE %s FROM service_role', v_seq);
            END IF;
            EXECUTE format('GRANT USAGE, SELECT ON SEQUENCE %s TO audit_exporter', v_seq);
        END LOOP;
    END
    $$;

    -- Supabase grants EXECUTE on new public functions directly to anon/authenticated/service_role,
    -- so REVOKE FROM PUBLIC alone is a no-op there (checklist §6). Only the exporter may call these.
    DO $$
    DECLARE
        f      text;
        v_role text;
    BEGIN
        FOREACH f IN ARRAY ARRAY['public.audit_export_ensure_partition(date)',
                                 'public.audit_export_maintain_partitions(integer, integer)',
                                 'public.audit_export_apply_retention(integer, boolean)',
                                 'public.audit_export_install_triggers(boolean)',
                                 'public.audit_export_auth_users(uuid[])',
                                 'public.audit_export_auth_sessions(uuid[])',
                                 'public.audit_export_auth_identities(uuid[])',
                                 'public.audit_export_auth_audit_log(timestamptz, uuid, timestamptz, integer)',
                                 'public.audit_outbox_enqueue()']
        LOOP
            EXECUTE format('REVOKE ALL ON FUNCTION %s FROM PUBLIC', f);
            FOREACH v_role IN ARRAY ARRAY['anon', 'authenticated', 'service_role'] LOOP
                IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = v_role) THEN
                    EXECUTE format('REVOKE ALL ON FUNCTION %s FROM %I', f, v_role);
                END IF;
            END LOOP;
            IF f <> 'public.audit_outbox_enqueue()' THEN
                EXECUTE format('GRANT EXECUTE ON FUNCTION %s TO audit_exporter', f);
            END IF;
        END LOOP;
    END
    $$;

    -- ============================================================================
    -- audit_exporter grants
    -- ============================================================================

    GRANT USAGE ON SCHEMA public TO audit_exporter;
    GRANT SELECT, UPDATE, DELETE ON public.audit_outbox TO audit_exporter;
    GRANT SELECT, INSERT ON public.audit_outbox_dead TO audit_exporter;
    GRANT SELECT, INSERT, UPDATE, DELETE ON public.audit_export_checkpoints, public.audit_export_logs,
        public.audit_export_batches, public.audit_export_routes TO audit_exporter;

    -- Enrichment / backfill lookups on public tables: column-level SELECT on the columns that exist
    -- here. auth.* goes through the audit_export_auth_* functions above instead.
    DO $$
    DECLARE
        r       record;
        v_cols  text;
    BEGIN
        FOR r IN
            SELECT * FROM (VALUES
                ('public', 'profiles',          ARRAY['id', 'email']),
                ('public', 'subscription',      ARRAY['id', 'org_id', 'is_org', 'consumer_id']),
                ('public', 'api_keys',          ARRAY['id', 'consumer_id', 'name', 'created_at']),
                ('public', 'project_api_keys',  ARRAY['id', 'consumer_id', 'name', 'user_id', 'org_id', 'project_name', 'created_at']),
                ('public', 'redteam_v2',        ARRAY['job_id', 'id', 'org_id', 'project_name', 'run_name', 'created_by',
                                                      'actioner_email', 'status', 'is_deleted', 'created_at', 'started_at',
                                                      'ended_at', 'user_metadata'])
            ) AS t(sch, tbl, cols)
        LOOP
            CONTINUE WHEN to_regclass(format('%I.%I', r.sch, r.tbl)) IS NULL;
            SELECT string_agg(quote_ident(a.attname), ', ' ORDER BY a.attnum) INTO v_cols
              FROM pg_attribute a
             WHERE a.attrelid = format('%I.%I', r.sch, r.tbl)::regclass
               AND a.attnum > 0 AND NOT a.attisdropped AND a.attname = ANY (r.cols);
            CONTINUE WHEN v_cols IS NULL;
            BEGIN
                EXECUTE format('GRANT SELECT (%s) ON %I.%I TO audit_exporter', v_cols, r.sch, r.tbl);
            EXCEPTION WHEN insufficient_privilege THEN
                RAISE WARNING 'audit_exporter: cannot grant SELECT on %.%: %', r.sch, r.tbl, SQLERRM;
            END;
            -- Lookup tables run RLS deny-all (011): without its own policy the exporter reads zero rows.
            IF (SELECT relrowsecurity FROM pg_class WHERE oid = format('%I.%I', r.sch, r.tbl)::regclass) THEN
                BEGIN
                    -- Only when missing: CREATE POLICY takes ACCESS EXCLUSIVE on a hot table.
                    IF NOT EXISTS (SELECT 1 FROM pg_policy WHERE polrelid = format('%I.%I', r.sch, r.tbl)::regclass
                                                             AND polname = 'audit_exporter_read') THEN
                        EXECUTE format('CREATE POLICY audit_exporter_read ON %I.%I FOR SELECT TO audit_exporter USING (true)',
                                       r.sch, r.tbl);
                    END IF;
                EXCEPTION WHEN insufficient_privilege THEN
                    RAISE WARNING 'audit_exporter: RLS is on for %.% and no policy could be added, reads return no rows: %',
                        r.sch, r.tbl, SQLERRM;
                END;
            END IF;
        END LOOP;
    END
    $$;

    --
    -- Verify the schema changes
    --

    DO $$
    DECLARE
        t        text;
        f        text;
        v_role   text;
        v_part   text := 'audit_export_logs_' || to_char(now() AT TIME ZONE 'UTC', 'YYYYMM');
    BEGIN
        IF to_regclass('public.audit_export_destinations') IS NOT NULL THEN
            RAISE EXCEPTION 'FAILED: public.audit_export_destinations exists: an older draft of this migration was applied here, drop its tables first';
        END IF;

        FOREACH t IN ARRAY ARRAY['audit_outbox', 'audit_outbox_dead', 'audit_export_checkpoints', 'audit_export_logs',
                                 'audit_export_logs_default', 'audit_export_batches', 'audit_export_routes', v_part]
        LOOP
            IF to_regclass('public.' || t) IS NULL THEN
                RAISE EXCEPTION 'FAILED: public.% was not created', t;
            END IF;
            IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid = ('public.' || t)::regclass) THEN
                RAISE EXCEPTION 'FAILED: RLS not enabled on public.%', t;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_policy
                            WHERE polrelid = ('public.' || t)::regclass AND polname = 'deny_all_' || t) THEN
                RAISE EXCEPTION 'FAILED: deny-all policy missing on public.%', t;
            END IF;
        END LOOP;

        -- Every audit table, partition and sequence: no API role holds anything (service_role would bypass RLS).
        FOR t IN
            SELECT c.relname FROM pg_class c
             WHERE c.relnamespace = 'public'::regnamespace AND c.relkind IN ('r', 'p', 'S')
               AND (c.relname LIKE 'audit_export%' OR c.relname LIKE 'audit_outbox%')
        LOOP
            FOREACH v_role IN ARRAY ARRAY['anon', 'authenticated', 'service_role'] LOOP
                CONTINUE WHEN NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = v_role);
                IF (SELECT relkind FROM pg_class WHERE oid = to_regclass('public.' || t)) = 'S' THEN
                    IF has_sequence_privilege(v_role, 'public.' || t, 'USAGE, SELECT, UPDATE') THEN
                        RAISE EXCEPTION 'FAILED: % still has a privilege on sequence public.%', v_role, t;
                    END IF;
                ELSIF has_table_privilege(v_role, 'public.' || t, 'SELECT, INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER') THEN
                    RAISE EXCEPTION 'FAILED: % still has a privilege on public.%', v_role, t;
                END IF;
            END LOOP;
        END LOOP;

        -- Catches a stale table shape left by an older draft (CREATE TABLE IF NOT EXISTS would keep it).
        IF NOT EXISTS (SELECT 1 FROM information_schema.columns
                        WHERE table_schema = 'public' AND table_name = 'audit_export_logs' AND column_name = 'owner_user_id')
           OR NOT EXISTS (SELECT 1 FROM information_schema.columns
                        WHERE table_schema = 'public' AND table_name = 'audit_export_batches' AND column_name = 'client_id')
           OR NOT EXISTS (SELECT 1 FROM information_schema.columns
                        WHERE table_schema = 'public' AND table_name = 'audit_export_checkpoints' AND column_name = 'client_id')
           OR EXISTS (SELECT 1 FROM information_schema.columns
                        WHERE table_schema = 'public' AND table_name = 'audit_export_logs' AND column_name = 'org_id'
                          AND is_nullable = 'NO') THEN
            RAISE EXCEPTION 'FAILED: audit export tables have a stale shape';
        END IF;

        IF NOT EXISTS (SELECT 1 FROM pg_partitioned_table pt
                         JOIN pg_inherits i ON i.inhparent = pt.partrelid
                        WHERE pt.partrelid = 'public.audit_export_logs'::regclass
                          AND pt.partdefid = i.inhrelid
                          AND i.inhrelid = 'public.audit_export_logs_default'::regclass) THEN
            RAISE EXCEPTION 'FAILED: audit_export_logs_default is not the DEFAULT partition';
        END IF;

        IF to_regclass('public.redteam_v2') IS NOT NULL AND NOT EXISTS (
            SELECT 1 FROM pg_trigger WHERE tgrelid = to_regclass('public.redteam_v2') AND tgname = 'audit_outbox_redteam_v2' AND tgenabled <> 'D'
        ) THEN
            RAISE EXCEPTION 'FAILED: trigger audit_outbox_redteam_v2 missing';
        END IF;
        IF to_regclass('public.audit_logs') IS NOT NULL AND NOT EXISTS (
            SELECT 1 FROM pg_trigger WHERE tgrelid = to_regclass('public.audit_logs') AND tgname = 'audit_outbox_audit_logs' AND tgenabled <> 'D'
        ) THEN
            RAISE EXCEPTION 'FAILED: trigger audit_outbox_audit_logs missing';
        END IF;
        IF to_regclass('auth.audit_log_entries') IS NOT NULL AND NOT EXISTS (
            SELECT 1 FROM pg_trigger WHERE tgrelid = to_regclass('auth.audit_log_entries')
                                       AND tgname = 'audit_outbox_auth_audit_log_entries' AND tgenabled <> 'D'
        ) THEN
            RAISE EXCEPTION 'FAILED: trigger audit_outbox_auth_audit_log_entries missing';
        END IF;

        FOREACH f IN ARRAY ARRAY['public.audit_export_ensure_partition(date)',
                                 'public.audit_export_maintain_partitions(integer, integer)',
                                 'public.audit_export_apply_retention(integer, boolean)',
                                 'public.audit_export_install_triggers(boolean)',
                                 'public.audit_export_auth_users(uuid[])',
                                 'public.audit_export_auth_sessions(uuid[])',
                                 'public.audit_export_auth_identities(uuid[])',
                                 'public.audit_export_auth_audit_log(timestamptz, uuid, timestamptz, integer)',
                                 'public.audit_outbox_enqueue()']
        LOOP
            IF EXISTS (SELECT 1 FROM pg_proc p, aclexplode(coalesce(p.proacl, acldefault('f', p.proowner))) a
                        WHERE p.oid = f::regprocedure AND a.grantee = 0) THEN
                RAISE EXCEPTION 'FAILED: PUBLIC can execute %', f;
            END IF;
            FOREACH v_role IN ARRAY ARRAY['anon', 'authenticated', 'service_role'] LOOP
                IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = v_role) AND has_function_privilege(v_role, f, 'EXECUTE') THEN
                    RAISE EXCEPTION 'FAILED: % can execute %', v_role, f;
                END IF;
            END LOOP;
            IF f <> 'public.audit_outbox_enqueue()' AND NOT has_function_privilege('audit_exporter', f, 'EXECUTE') THEN
                RAISE EXCEPTION 'FAILED: audit_exporter cannot execute %', f;
            END IF;
        END LOOP;

        IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'audit_exporter'
                    AND (rolsuper OR rolbypassrls OR rolcreaterole OR rolcreatedb OR NOT rolcanlogin)) THEN
            RAISE EXCEPTION 'FAILED: audit_exporter is not a plain least-privilege login role';
        END IF;
        -- One privilege per call: a comma list is true when ANY of them is held.
        IF EXISTS (SELECT 1 FROM (VALUES
                       ('public.audit_outbox', 'SELECT'), ('public.audit_outbox', 'UPDATE'), ('public.audit_outbox', 'DELETE'),
                       ('public.audit_outbox_dead', 'SELECT'), ('public.audit_outbox_dead', 'INSERT'),
                       ('public.audit_export_logs', 'SELECT'), ('public.audit_export_logs', 'INSERT'),
                       ('public.audit_export_routes', 'SELECT'), ('public.audit_export_routes', 'INSERT'),
                       ('public.audit_export_routes', 'UPDATE'),
                       ('public.audit_export_batches', 'SELECT'), ('public.audit_export_batches', 'INSERT'),
                       ('public.audit_export_batches', 'UPDATE'),
                       ('public.audit_export_checkpoints', 'SELECT'), ('public.audit_export_checkpoints', 'INSERT'),
                       ('public.audit_export_checkpoints', 'UPDATE')) AS g(tbl, priv)
                    WHERE NOT has_table_privilege('audit_exporter', g.tbl, g.priv))
           OR has_table_privilege('audit_exporter', 'public.audit_outbox', 'INSERT') THEN
            RAISE EXCEPTION 'FAILED: audit_exporter grants on the export tables are wrong';
        END IF;

        FOREACH t IN ARRAY ARRAY['public.profiles', 'public.subscription', 'public.api_keys',
                                 'public.project_api_keys', 'public.redteam_v2']
        LOOP
            CONTINUE WHEN to_regclass(t) IS NULL;
            IF NOT has_any_column_privilege('audit_exporter', t, 'SELECT') THEN
                RAISE EXCEPTION 'FAILED: audit_exporter has no SELECT on %', t;
            END IF;
            IF (SELECT relrowsecurity FROM pg_class WHERE oid = to_regclass(t))
               AND NOT EXISTS (SELECT 1 FROM pg_policy WHERE polrelid = to_regclass(t) AND polname = 'audit_exporter_read') THEN
                RAISE EXCEPTION 'FAILED: RLS on % has no audit_exporter_read policy', t;
            END IF;
        END LOOP;
        IF to_regclass('public.profiles') IS NOT NULL AND has_table_privilege('audit_exporter', 'public.profiles', 'SELECT') THEN
            RAISE EXCEPTION 'FAILED: audit_exporter has table-wide SELECT on public.profiles';
        END IF;

        RAISE NOTICE 'SUCCESS: audit export tables, partitions, triggers, exporter role and lockdown in place';
    END $$;

    COMMIT;

  057-audit-export-projects-read.sql: |
    --
    -- Migration: 042_audit_export_projects_read
    -- Description: Lets the audit exporter verify the projects its customer clients are pinned to
    --              (code/audit-exporter, `scope: project` clients; docs/claude/audit-log-export.md).
    --                * column-level SELECT on public.projects(id, name, project_id) for the
    --                  audit_exporter role, nothing else on the table (no config, description,
    --                  credit or usage columns, no writes);
    --                * an audit_exporter_read RLS policy, because projects runs RLS deny-all and
    --                  the role does not bypass RLS (the 041 lookup-table pattern).
    --              Every run the exporter checks that each pinned project_id still carries the
    --              pinned name in the pinned org; a rename, a delete or a reused name stops that
    --              client (fail closed) until its config is fixed.
    --              lock_timeout is 5s: CREATE POLICY takes ACCESS EXCLUSIVE on projects; on a lock
    --              timeout just re-run it (it is re-runnable).
    --              Test harness: scripts/manage/test-audit-export-041/run.sh (applies 041 then 042).
    --              Requires: key 056 (role audit_exporter).
    --              Identical for dev and prod (only the psql host/path below differ).
    --

    BEGIN;

    SET LOCAL lock_timeout = '5s';

    DO $$
    DECLARE
        v_cols text;
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'audit_exporter') THEN
            RAISE EXCEPTION 'role audit_exporter does not exist: apply migration 041 first';
        END IF;
        IF to_regclass('public.projects') IS NULL THEN
            RAISE NOTICE 'public.projects does not exist here: nothing to grant';
            RETURN;
        END IF;

        SELECT string_agg(quote_ident(a.attname), ', ' ORDER BY a.attname) INTO v_cols
          FROM pg_attribute a
         WHERE a.attrelid = 'public.projects'::regclass
           AND a.attnum > 0 AND NOT a.attisdropped AND a.attname IN ('id', 'name', 'project_id');
        IF v_cols IS DISTINCT FROM 'id, name, project_id' THEN
            RAISE EXCEPTION 'public.projects lacks one of id, name, project_id (found: %)', v_cols;
        END IF;
        -- No exception handler: without this grant every project client stops, so fail the migration loudly.
        EXECUTE format('GRANT SELECT (%s) ON public.projects TO audit_exporter', v_cols);

        IF (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.projects'::regclass)
           AND NOT EXISTS (SELECT 1 FROM pg_policy WHERE polrelid = 'public.projects'::regclass
                                                     AND polname = 'audit_exporter_read') THEN
            -- Only when missing: CREATE POLICY takes ACCESS EXCLUSIVE on a hot table.
            CREATE POLICY audit_exporter_read ON public.projects FOR SELECT TO audit_exporter USING (true);
        END IF;
    END
    $$;

    --
    -- Verify the schema changes
    --

    DO $$
    DECLARE
        v_col text;
    BEGIN
        IF to_regclass('public.projects') IS NULL THEN
            RAISE NOTICE 'SUCCESS: public.projects absent, nothing to verify';
            RETURN;
        END IF;
        FOREACH v_col IN ARRAY ARRAY['id', 'name', 'project_id'] LOOP
            IF NOT has_column_privilege('audit_exporter', 'public.projects', v_col, 'SELECT') THEN
                RAISE EXCEPTION 'FAILED: audit_exporter cannot SELECT public.projects.%', v_col;
            END IF;
        END LOOP;
        -- One privilege per call: a comma list is true when ANY of them is held.
        IF has_table_privilege('audit_exporter', 'public.projects', 'SELECT')
           OR has_table_privilege('audit_exporter', 'public.projects', 'INSERT')
           OR has_table_privilege('audit_exporter', 'public.projects', 'UPDATE')
           OR has_table_privilege('audit_exporter', 'public.projects', 'DELETE') THEN
            RAISE EXCEPTION 'FAILED: audit_exporter holds a table-wide privilege on public.projects';
        END IF;
        SELECT a.attname INTO v_col
          FROM pg_attribute a
         WHERE a.attrelid = 'public.projects'::regclass AND a.attnum > 0 AND NOT a.attisdropped
           AND a.attname NOT IN ('id', 'name', 'project_id')
           AND has_column_privilege('audit_exporter', 'public.projects', a.attname, 'SELECT')
         LIMIT 1;
        IF v_col IS NOT NULL THEN
            RAISE EXCEPTION 'FAILED: audit_exporter can SELECT public.projects.%, only id, name, project_id are allowed', v_col;
        END IF;
        IF (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.projects'::regclass)
           AND NOT EXISTS (SELECT 1 FROM pg_policy WHERE polrelid = 'public.projects'::regclass
                                                     AND polname = 'audit_exporter_read') THEN
            RAISE EXCEPTION 'FAILED: RLS on public.projects has no audit_exporter_read policy';
        END IF;
        RAISE NOTICE 'SUCCESS: audit_exporter reads public.projects(id, name, project_id) and nothing else';
    END $$;

    COMMIT;

kind: ConfigMap
metadata:
  name: supabase-migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,post-upgrade
    "helm.sh/hook-weight": "1"
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
