apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cluster-openfga
  annotations:
    {{- include "platform.hookAnnotations" (dict "root" $ "hook" "post-install" "weight" "20") | nindent 4 }}
    # keep: helm uninstall leaves this data cluster in place.
    "helm.sh/resource-policy": keep
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  imageName: {{ .Values.global.registry }}/{{ .Values.openfga.repository }}:{{ .Values.openfga.tag }}
  {{- with .Values.global.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 2 }}
  {{- end }}
  postgresGID: 26
  postgresUID: 26
  superuserSecret:
    name: postgres-superuser-secret
  bootstrap:
    initdb:
      secret:
        name: openfga-env-secret
      database: openfga
      owner: openfga
      encoding: UTF8
      localeCType: C
      localeCollate: C
      postInitApplicationSQLRefs: 
        secretRefs:
            - name: openfga-env-secret
              key: test-query.sql
  enableSuperuserAccess: true
  instances: 2
  storage:
     size: 15Gi
  {{- with .Values.openfga.backup }}
  backup:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.openfga.plugins }}
  plugins:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
