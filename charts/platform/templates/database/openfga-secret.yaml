{{- if .Values.secrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: openfga-env-secret
  annotations:
    {{- include "platform.hookAnnotations" (dict "root" $ "hook" "post-install, post-upgrade" "weight" "2") | nindent 4 }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{- range $key, $val := .Values.secrets.openfga }}
  {{- if ne $key "enabled" }}
  {{ $key }}: {{ $val | default "" | toString | quote }}  {{- end }}
  {{- end }}
{{- end }}
