{{- if and .Values.externalSecret.enabled .Values.externalSecret.secrets }}
{{- range .Values.externalSecret.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name | quote }}
  namespace: {{ .namespace | default "enkryptai-stack" | quote }}
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-5"   
    "helm.sh/hook-delete-policy": "before-hook-creation"
spec:
  refreshInterval: {{ .refreshInterval | default "15m" | quote }}
  secretStoreRef:
    name: {{ $.Values.externalSecret.clusterSecretStore.name | quote }}
    kind: ClusterSecretStore

  target:
    name: {{ .target.name | quote }}
    creationPolicy: {{ .target.creationPolicy | default "Owner" }}
    deletionPolicy: {{ .target.deletionPolicy | default "Retain" }}

  {{- with .data }}
  data:
    {{- range . }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ .remoteRef.key | quote }}
        {{- if .remoteRef.property }}
        property: {{ .remoteRef.property | quote }}
        {{- end }}
        {{- if .remoteRef.version }}
        version: {{ .remoteRef.version | quote }}
        {{- end }}
    {{- end }}
  {{- end }}

  {{- with .dataFrom }}
  dataFrom:
    {{- range . }}
    - extract:
        key: {{ .extract.key | quote }}
        {{- if .extract.version }}
        version: {{ .extract.version | quote }}
        {{- end }}
    {{- end }}
  {{- end }}

{{- end }}
{{- end }}