{{- if .Values.externalSecret.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.externalSecret.serviceAccount.name }}
  namespace: enkryptai-stack
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.externalSecret.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}