{{- if .Values.externalSecret.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-external-secrets
  {{- with .Values.externalSecret.waitJob.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  template:
    spec:
      restartPolicy: Never

      containers:
        - name: wait
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              WEBHOOK_HOST="{{ .Release.Name }}-external-secrets-webhook.{{ .Release.Namespace }}.svc"

              echo "Waiting for webhook: ${WEBHOOK_HOST}"

              until nc -z ${WEBHOOK_HOST} 443; do
                echo "Webhook not ready..."
                sleep 5
              done

              echo "Webhook ready."
{{- end }}