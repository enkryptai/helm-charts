apiVersion: opensearch.opster.io/v1
kind: OpenSearchISMPolicy
metadata:
  name: rollbar-policy
  annotations:
    helm.sh/hook-weight: "18"
    helm.sh/hook: "post-install,post-upgrade"
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}

spec:
  opensearchCluster:
    name: {{ .Values.clustername }}

  description: "ISM policy equivalent to ES ILM"

  defaultState: hot

  ismTemplate:
    indexPatterns:
      - otel-*
      - admin
      - guardrails
      - ai-proxy
      - leaderboard
      - red_teaming
      - .ds-*
    priority: 999

  states:
    - name: hot
      actions:
        - rollover:
            minIndexAge: "1d"
            minSize: "50gb"

        - replicaCount:
            numberOfReplicas: 1

      transitions:
        - stateName: warm
          conditions:
            minIndexAge: "15d"

    - name: warm
      actions:
        - readOnly: {}

        - forceMerge:
            maxNumSegments: 1

        - replicaCount:
            numberOfReplicas: 0

      transitions:
        - stateName: delete
          conditions:
            minIndexAge: "{{ .Values.opensearch.ism.retentionDays }}d"

    - name: delete
      actions:
        - delete: {}

      transitions: []