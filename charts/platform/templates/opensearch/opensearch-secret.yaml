{{- if .Values.secrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: opensearch-cred
  annotations:
    {{- include "platform.hookAnnotations" (dict "root" $ "hook" "post-install, post-upgrade" "weight" "2") | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $val := .Values.secrets.opensearch }}
  {{- if ne $key "enabled" }}
  {{ $key }}: {{ $val | default "" | toString | quote }}
  {{- end }}
  {{- end }}
{{- end }}
