apiVersion: opensearch.opster.io/v1
kind: OpensearchUserRoleBinding
metadata:
  name: all-access
  annotations:
    {{- include "platform.hookAnnotations" (dict "root" $ "hook" "post-install" "weight" "18") | nindent 4 }}
spec:
  opensearchCluster:
    name: {{ .Values.clustername }}
  roles:
    - all_access
  backendRoles:
    - admin

---
apiVersion: opensearch.opster.io/v1
kind: OpensearchUserRoleBinding
metadata:
  name: own-index
  annotations:
    {{- include "platform.hookAnnotations" (dict "root" $ "hook" "post-install" "weight" "18") | nindent 4 }}
spec:
  opensearchCluster:
    name: {{ .Values.clustername }}
  roles:
    - own_index
  users:
    - "*"

