apiVersion: opensearch.opster.io/v1
kind: OpenSearchISMPolicy
metadata:
  name: rollover-policy
  annotations:
    helm.sh/hook-weight: "17"
    helm.sh/hook: "post-install,post-upgrade"
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}

spec:
  opensearchCluster:
    name: {{ .Values.clustername }}

  # The id the index templates point at (opendistro.index_state_management.policy_id).
  policyId: rollover_policy

  description: "ISM policy equivalent to ES ILM"

  defaultState: hot

  # Auto-attach to the data streams and the otel logs index. Priority 1000 (not 999) so an upgrade
  # still works on a cluster where the retired rollbar-policy (priority 999, same patterns) exists:
  # ISM rejects two policies with overlapping patterns at the same priority.
  ismTemplate:
    indexPatterns:
      - otel-*
      - admin
      - guardrails
      - ai-proxy
      - leaderboard
      - red_teaming
      - .ds-*
    priority: 1000

  states:
    - name: hot
      actions:
        - rollover:
            minIndexAge: "1d"
            minPrimaryShardSize: "10gb"

      transitions:
        - stateName: warm
          conditions:
            minIndexAge: "15d"

    - name: warm
      actions:
        - readOnly: {}

      transitions:
        - stateName: delete
          conditions:
            minIndexAge: "30d"

    - name: delete
      actions:
        - delete: {}

      transitions: []
