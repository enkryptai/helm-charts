apiVersion: opensearch.opster.io/v1
kind: OpensearchIndexTemplate
metadata:
  name: mcp-scanner-index-template
  annotations:
    {{- include "platform.hookAnnotations" (dict "root" $ "hook" "post-install, post-upgrade" "weight" "18") | nindent 4 }}
spec:
  name: mcp-scanner-index-template
  opensearchCluster:
    name: {{ .Values.clustername }}
  indexPatterns:
    - "mcp-scanner"
  dataStream: {}
  template:
    settings:
      number_of_shards: 1
      number_of_replicas: 0
      opendistro.index_state_management.policy_id: rollover_policy
      plugins.index_state_management.rollover_alias: rollover_policy
      mapping.total_fields.limit: '2000'
    mappings:
      dynamic: 'false'
      properties:
        '@timestamp':
          type: date
        started_at:
          type: long
        correlation_id:
          type: text
          fields:
            keyword:
              type: keyword
              ignore_above: 256
        route:
          properties:
            name:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
            paths:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
        latencies:
          properties:
            kong:
              type: long
            proxy:
              type: long
            request:
              type: long
        client_ip:
          type: text
          fields:
            keyword:
              type: keyword
              ignore_above: 256
        upstream_uri:
          type: text
          fields:
            keyword:
              type: keyword
              ignore_above: 256
        authenticated_entity:
          properties:
            id:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
        consumer:
          properties:
            created_at:
              type: long
            custom_id:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
            id:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
            updated_at:
              type: long
            username:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
            org_id:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
            project_name:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
        request:
          properties:
            id:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
            method:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
            ngx_req_id:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
            uri:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
            url:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
            scan_type:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
            is_private:
              type: boolean
            is_official:
              type: boolean
            registry_name:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
            endpoint_url:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
            auth_type:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
            repo_name:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
            job_status:
              type: text
              fields:
                keyword:
                  type: keyword
                  ignore_above: 256
            headers:
              properties:
                x-enkrypt-job-id:
                  type: text
                  fields:
                    keyword:
                      type: keyword
                      ignore_above: 256
                x-enkrypt-source-url:
                  type: text
                  fields:
                    keyword:
                      type: keyword
                      ignore_above: 256
                x-enkrypt-source-version:
                  type: text
                  fields:
                    keyword:
                      type: keyword
                      ignore_above: 256
        response:
          properties:
            status:
              type: long
