apiVersion: opensearch.opster.io/v1
kind: OpensearchIndexTemplate
metadata:
  annotations:
    helm.sh/hook: post-install, post-upgrade
    helm.sh/hook-weight: "18"
  name: red-teaming-template
  namespace: enkryptai-stack
spec:
  indexPatterns:
  - red_teaming*
  name: red_teaming_template
