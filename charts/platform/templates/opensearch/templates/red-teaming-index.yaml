          path_match: response.body.summary.categories.*.asr
          mapping:
            type: float
            ignore_malformed: true
      - rtv2_summary_category_dicts:
          path_match: response.body.summary.categories.*.*
          match_mapping_type: object
          mapping:
            type: flat_object
      properties:
        '@timestamp':
          type: date
        started_at:
          type: long
        correlation_id:
          type: text
          fields:
            keyword:
              type: keyword
              ignore_above: 256
