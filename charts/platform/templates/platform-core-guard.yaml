{{- /*
Upgrade guard. If this release still owns platform-core (a 1.2.x install, or
1.3.x with platform-core.enabled: true) and is upgraded with
platform-core.enabled: false, Helm would delete the operators and their CRDs,
and the OpenSearch cluster with them. Stop before that happens.
lookup returns nothing under helm template and client-side dry runs, so the
guard only acts against a live cluster.
*/ -}}
{{- if not (index .Values "platform-core" "enabled") }}
{{- $crd := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "opensearchclusters.opensearch.opster.io" }}
{{- $owner := dig "metadata" "annotations" "meta.helm.sh/release-name" "" $crd }}
{{- $ownerNs := dig "metadata" "annotations" "meta.helm.sh/release-namespace" "" $crd }}
{{- if and (eq $owner .Release.Name) (eq $ownerNs .Release.Namespace) }}
{{- fail (printf "release %q still owns platform-core. Set platform-core.enabled: true to keep the bundled layout (see RELEASENOTES 1.3.0); upgrading with false would delete the operators and their CRDs." .Release.Name) }}
{{- end }}
{{- end }}
