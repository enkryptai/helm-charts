          name: postgres-superuser-secret
          namespace: enkryptai-stack
        refreshInterval: 5h
        dataFrom:
          - extract:
              key: enkryptai-postgres-superuser-secret

      - name: s3-cred
        target:
          name: s3-cred
          namespace: enkryptai-stack
        refreshInterval: 5h
        dataFrom:
          - extract:
              key: enkryptai-s3-cred

      - name: superuser-secret
        target:
          name: superuser-secret
          namespace: enkryptai-stack
        refreshInterval: 5h
        dataFrom:
          - extract:
              key: enkryptai-superuser-secret 
