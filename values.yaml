  externalSecret:
    enabled: true
    namespaceOverride: enkryptai-stack
    waitJob:
      annotations:
        # helm.sh/hook: post-install,post-upgrade
        helm.sh/hook-weight: "-12"
        helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    # annotations: 
    #   # "helm.sh/hook": post-install,post-upgrade
    #   # "helm.sh/hook-weight": "-5"
    clusterSecretStore:
      enabled: true        
      name: "cluster-secret-store"
      provider: azure
      annotations: 
        "helm.sh/hook": post-install,post-upgrade
        "helm.sh/hook-weight": "-10"
      azure:
        vaultUrl: "<vault_url>"
        tenantId: "<tenet_id>"
        authType: WorkloadIdentity
        auth:
          workloadIdentity:
            serviceAccountRef:
              name: platform-external-secrets
              namespace: enkryptai-stack

    serviceAccount:
      create: false
      name: platform-external-secrets
      annotations:
        azure.workload.identity/client-id: "a32e0a2e-6c3c-4fea-8715-db47833022ec"
        "helm.sh/hook": pre-install,pre-upgrade
        "helm.sh/hook-weight": "-11"
    secrets:
      - name: onprem
        target:
          name: onprem
          namespace: enkryptai-stack
        refreshInterval: 5h
        dataFrom:
          - extract:
              key: enkryptai-onprem
      - name: openfga-env-secret
        target:
          name: openfga-env-secret
          namespace: enkryptai-stack
        refreshInterval: 5h
        dataFrom:
          - extract:
              key: enkryptai-openfga-env-secret

      - name: opensearch-cred
        target:
          name: opensearch-cred
          namespace: enkryptai-stack
        refreshInterval: 5h
        dataFrom:
          - extract:
              key: enkryptai-opensearch-cred

      # - name: opensearch-securityconfig
